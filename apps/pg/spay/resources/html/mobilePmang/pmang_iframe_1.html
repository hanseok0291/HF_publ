<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta charset="utf-8">
	<title>헥토파이낸셜 지불서비스</title>
	<link rel="stylesheet" type="text/css" href="https://pay.pmang.com/Crusader/css/pmang_new.css">
	<link rel="stylesheet" type="text/css" href="https://pay.pmang.com/Crusader/css/pmang_payment.css">
</head>

<body class="body_pay" oncontextmenu="return false" onselectstart="return false" ondragstart="return false"
	marginwidth="0" marginheight="0">
	<img src="https://pay.pmang.com/Crusader/image/box_type01_top.gif" border="0" style="margin-top:5px;"><br>
	<div class="pay_box_type01">
		<table cellpadding="0" cellspacing="0" border="0" width="100%" class="fixed" style="display:block;">
			<input type="hidden" name="hidagreeurl" value="">
			<colgroup>
				<col width="15" valign="top" style="padding-top:1px;">
				<col width="105">
				<col width="*">
			</colgroup>
			<tbody>
				<tr valign="top" style="padding-bottom:4px;">
					<td><img src="https://pay.pmang.com/Crusader/image/ico_box_arw_orange.gif" border="0"></td>
					<td><b class="black">휴대폰 정보</b></td>
					<td class="gray_01"></td>
				</tr>
				<tr>
					<td colspan="3" height="1" background="https://pay.pmang.com/Crusader/image/bg_dotline.gif"></td>
				</tr>
				<tr>
					<td colspan="3" height="2"></td>
				</tr>
				<tr style="padding-top:5px;">
					<td></td>
					<td class="black">휴대폰번호</td>
					<td class="gray_01">
						<div style="float:left; padding-top:1px;">

							<select name="selCarrier" style="width:85px;">
								<option value="SKT"> SKT </option>
								<option value="KTF"> KT </option>
								<option value="LGT"> LG U+ </option>
								<option value="CJH"> 헬로모바일</option>
								<option value="SKL"> SK7mobile </option>
								<option value="KCT"> KCT </option>
								<option value="KTFR">KT 알뜰폰</option>
								<option value="LGTR">LG U+알뜰폰</option>
							</select>

						</div>
						<div style="float:left; padding:6 5 0 5;">-</div>
						<div style="float:left; padding-top:1px;">
							<select style="width:50;" title="통신사 선택 번호" name="phoneNo1">
								<!--  name='hp_pay_info1' -->
								<option value="010" selected="">010</option>
								<option value="011">011</option>
								<option value="016">016</option>
								<option value="017">017</option>
								<option value="018">018</option>
								<option value="019">019</option>
							</select>
						</div>
						<div style="float:left; padding:6 5 0 5;">
							-
						</div>
						<div style="float:left;">
							<input style="width:45px;" title="휴대폰 번호 앞자리" class="input_payment numberOnly" pattern="[0-9]*"
								name="phoneNo2" maxlength="4" value="">
						</div>
						<div style="float:left; padding:6 5 0 5;">
							-
						</div>
						<div style="float:left;">
							<input style="width:45px;" title="휴대폰 번호 뒷자리" class="input_payment numberOnly" pattern="[0-9]*"
								name="phoneNo3" maxlength="4" value="">
						</div>
					</td>
				</tr>

				<tr style="padding-top:5px;" class="inputSocialTypeB socialNoView">
					<td></td>
					<td class="black">주민번호앞7자리</td>
					<td class="gray_01">
						<div style="float:left;">
							<input type="tel" pattern="[0-9]*" name="perNo1" class="input_payment numberOnly" style="width:55px;"
								maxlength="6" value="">
						</div>
						<div style="float:left; padding:6 5 0 5;">
							-
						</div>
						<div style="float:left;">
							<input type="tel" pattern="[0-9]*" name="perNo2" class="input_payment numberOnly" style="width:20px;"
								maxlength="1" value=""> ******
						</div>
					</td>
				</tr>

				<tr style="padding-top:10px;">
					<td></td>
					<td></td>
					<td class="orange"><img src="https://pay.pmang.com/Crusader/image/ico_rbox_notice.gif" style="display:none;">
						&nbsp;<span><span></span></span>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<img src="https://pay.pmang.com/Crusader/image/box_type01_bottom.gif" border="0"><br>
	<div class="check_all">
		<label class="li1"><input type="checkbox" name="agreelist" id="all-agree" tabindex="0">
			<strong>전체약관동의</strong></label>
		<label class="li2"><em>ㄴ</em><input type="checkbox" name="agreelist" id="agree01" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다."> <a
				href="javascript:void(window.open('./terms1.html', 'terms','width=470, height=750'))">통신과금서비스 이용약관</a>에
			동의합니다.</label>
		<label class="li3"><em>ㄴ</em><input type="checkbox" name="agreelist" id="agree02" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다."> <a
				href="javascript:void(window.open('./terms2.html', 'terms','width=470, height=750'))">개인(신용)정보 수집 및 이용</a>에
			동의합니다.</label>
		<label class="li4"><em>ㄴ</em><input type="checkbox" name="agreelist" id="agree03" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다."> <a
				href="javascript:void(window.open('./terms3.html', 'terms','width=470, height=750'))">개인(신용)정보 제3자 제공 및 위탁</a>에
			동의합니다.</label>
	</div>

	<div align="center" style="margin-top:10px;display:block;">
		<!-- 충전 -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_charge.gif" border="0" style="cursor:hand;">
		<!-- 취소  -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_cancel.gif" border="0" style="cursor:hand;"
			onclick="pay_close();">
	</div>

</body>

</html>
