<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker landing">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div id="landingCon" class="container">
          <div class="titleWrap">
            <p class="topText">2023년 내 예상 종합 소득세</p>
            <h2 class="mainTitle">
              환급? 납부? <br>
              <strong>간편하게 계산해드려요.</strong>
            </h2>
            <dl class="textWrap">
              <dt>종합 소득세 신고란?</dt>
              <dd>
                종합 소득세(종소세)는 개인이 지난 1년동안 <br>
                경제활동으로 얻은 소득에 대해 납부하는 세금으로<span class="cutText">...</span><br>
                모든 과세 대상 소득이 계산에 포함돼요.<br>
                전년도 종소세의 신고 · 납부 기간은 다음 연도<br>
                5월 1일 ~ 5월 31일이에요.<br>
                소속이 없어 연말정산이 불가능한 프리랜서는 <br>
                종소세 신고 대상이며, 미처 연말정산을 하지 못한 <br>
                분들도 이때 신고하면 돼요.
              </dd>
            </dl>
            <button type="button" class="detailBtn">자세히 보기</button>
          </div>
          <figure class="visualImg"></figure>

          <div class="botBtnWrap">
            <button type="button" class="bot-btn">
              <a href="calculator2.html"><b>예상 종합 소득세</b> 계산하기</a>
            </button>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->


    <script>
      $(".detailBtn").on("click", function(){
        var $this = $(this);
        if($this.text() === "자세히 보기"){
          $this.text("접기");
          $(".cutText").hide();
          $("#landingCon").addClass("open");
        } else {
          $(".cutText").show();
          $this.text("자세히 보기");
          $("#landingCon").removeClass("open");
        }
      });
    </script>
  </body>
</html>
