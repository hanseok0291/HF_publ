<!doctype html>
<html lang="ko">
<head>
<title>세틀뱅크 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- favicon -->
<link rel="shortcut icon" type="image/x-icon" href="../../../settlebank/img/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="57x57" href="../../../settlebank/img/favicon/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="../../../settlebank/img/favicon/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="../../../settlebank/img/favicon/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="../../../settlebank/img/favicon/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="../../../settlebank/img/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../../settlebank/img/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../../settlebank/img/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../../settlebank/img/favicon/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../../settlebank/img/favicon/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../../settlebank/img/favicon/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../../settlebank/img/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../../settlebank/img/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../../settlebank/img/favicon/favicon-16x16.png">
<link rel="manifest" href="../../../settlebank/img/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../../settlebank/img/favicon/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
<!-- //favicon -->

<link rel="stylesheet" href="../../../settlebank/css/owl.carousel.min.css"> <!-- 슬라이드 스타일 -->
<link rel="stylesheet" href="../../../settlebank/css/common.css"> <!-- 공통 스타일 -->
<script src="../../../settlebank/js/jquery-1.8.3.min.js"></script> <!-- jquery -->
<script src="../../../settlebank/js/owl.carousel.min.js"></script> <!-- 슬라이드 스크립트 -->
<script src="../../../settlebank/js/design.js" defer="defer"></script> <!-- 공통 레이아웃, 동작 스크립트 -->
<script src="../../../settlebank/js/commonutil.js"></script> <!-- 공통 모달 외 스크립트 -->
<script src="../../../settlebank/js/commonumsg.js"></script> <!-- 공통 모달 메시지 -->
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../../settlebank/img/logo-spay.svg" alt="S'pay"></span></h1>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				content
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary">확인</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<p id="confirmContents"></p>
			</div>
			<div class="modal-footer type2">
				<button type="button" id="confirmCancel" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(document).ready(function(){
		$(".loading").removeClass("hidden");
	});
</script>
</body>
</html>
