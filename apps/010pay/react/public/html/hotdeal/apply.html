<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>핫딜</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">

	<!-- styles -->
	<link rel="stylesheet" href="../../../styles/globals.css?ver=1">
	<link rel="stylesheet" href="../../../styles/hotdeal/Common.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Layout.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Apply.module.css">
	<!-- //styles -->

	<!-- script -->
	<script src="../../js/common/jquery-1.8.3.min.js"></script>
	<!-- //script -->
</head>

<body>
	<!-- wrap -->
	<div class="wrap">
		<!-- header -->
		<div class="pageHeader subHeader">
			<div class="container">
				<button type="button" class="btnIcon btnBack">뒤로 가기</button>
				<h1 class="pageTitle">핫딜 응모</h1>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div class="applyContent">
			<!-- topBar -->
			<div class="applyTopBar">입력하신 정보를 <strong class="highlight">다시 한번 꼭 확인해 주세요<i class="italic">!</i></strong></div>
			<!-- //topBar -->

			<!-- form -->
			<form autocomplete="off">
				<!-- container -->
				<div class="container">
					<!-- 정보 입력 -->
					<div class="formType">
						<div class="formGroup">
							<p><label for="custAddress" class="label">배송 주소</label>
								<input type="text" name="custAddress" id="custAddress" maxlength="20" placeholder="건물, 지번 또는 도로명 검색">
								<input type="text" name="custAddress" id="custAddressInput" maxlength="20" placeholder="상세 주소 입력"></p>
							<p class="textError">정확한 배송 주소를 입력해 주세요.</p>
						</div>
						<div class="formGroup">
							<p><label for="custTel" class="label">휴대폰 번호</label>
								<input type="tel" name="custTel" id="custTel" maxlength="11" placeholder="휴대폰 번호 입력"></p>
							<p class="textError">정확한 휴대폰 번호를 입력해 주세요.</p>
						</div>
						<div class="formGroup">
							<p><label for="custEmail" class="label">이메일</label>
								<input type="email" name="custEmail" id="custEmail" maxlength="20" placeholder="이메일 주소 입력"></p>
							<p class="textError">정확한 이메일 주소를 입력해 주세요.</p>
						</div>
					</div>
					<!-- //정보 입력 -->

					<!-- 약관 동의 -->
					<div class="termsAgree">
						<div class="agreeAll">
							<span class="checkbox parents">
								<input type="checkbox" name="agreeAll" id="agreeAll_01">
								<label for="agreeAll_01">전체 동의</label>
							</span>
						</div>
						<ul class="agreeList">
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree_01" id="agree_01_01">
									<label for="agree_01_01">(필수) 핫딜 서비스 이용약관</label>
									<button type="button" class="btnIcon agreeBtn">보기 <i class="icon iconArrowRight"></i></button>
								</span>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree_01" id="agree_01_02">
									<label for="agree_01_02">(필수) 개인정보 수집·이용 동의</label>
									<button type="button" class="btnIcon agreeBtn"><span class="srOnly">보기</span> <i class="icon iconArrowRight"></i></button>
								</span>
							</li>
						</ul>
					</div>
					<!-- //약관 동의 -->
				</div>
				<!-- container -->

				<!-- bottom button area(common) -->
				<div class="btnBox btnDetail bgGradientGray">
					<div class="container">
						<button type="button" class="btn" disabled>응모하기</button>
					</div>
				</div>
				<!-- //bottom button area(common) -->
			</form>
			<!-- //form -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</body>
</html>
