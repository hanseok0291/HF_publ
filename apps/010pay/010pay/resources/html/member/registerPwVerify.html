<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name"><a href="#"><span class="my-logo"><img src="../../images/logo-myaccount.png" class="logo" alt="내통장결제"></span></a></h1>
				<h2 class="page-title hidden">비밀번호 설정 확인</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p><strong>비밀번호 설정 확인</strong></p>
				</div>
				<!-- //headline -->

				<!-- 비밀번호 입력 -->
				<div class="section">
					<div class="input-mark">
						<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
					</div>
					<span class="input input-help hidden" id="pwdSpan">
						<input type="password" name="newPwd" id="newPwd" style="ime-mode:disabled;" npkencrypt="on" data-keypad-type="nusssm" data-keypad-theme="settle_keypad" data-keypad-next="__hide__" class="input-text" maxlength="6" size="24" autofocus placeholder="숫자 6자리">
					</span>
				</div>
				<!-- //비밀번호 입력 -->

				<!-- 안내 -->
				<div class="section keypad-top-area">
					<div class="container">
						<p class="info text-light">동일하거나 연속된 숫자 3자리, 생년월일, 휴대폰번호 뒷자리 불가</p>
					</div>
				</div>
				<!-- //안내 -->
			</div>
			<!-- //container -->

			<!-- keypad sample -->
			<div class="nppfs-keypad-div">
				<div class="kpd-wrap kpd-image"><img src="../../images/sample/keypad-sample.png" alt="보안키패드 샘플"></div>
			</div>
			<!-- //keypad sample -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
