<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헥토파이낸셜 지불서비스</title>
<style type="text/css">
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { background-color: #fff; font-family: 'Malgun Gothic', Dotum, 'Apple SD Gothic Neo', sans-serif; font-size: 16px; line-height: 1.5; letter-spacing: -0.03em;
	word-break: keep-all;  color: #2b2b2b; text-align: center; }
body, p, h1, h2, h3 { margin: 0; padding: 0; }
.wrap { position: relative; margin: auto; padding: 15px 20px 20px; width: 100%; min-width: 320px; max-width: 700px; min-height: 100%; }
h1 { font-size: 16px; font-weight: 400; line-height: 60px; }
h2 { margin: 20px 0 40px; font-size: 20px; }
h3 { margin: 60px 0 30px; font-size: 15px; color: #faa61a; }
.icon { margin: 40px auto; padding: 22px 0 0; width: 100px; height: 100px; border-radius: 50%; background: #eee;

</style>
</head>

<body>
<!-- header -->
<header><h1 class="page-title">오류</h1></header>
<!-- //header -->

<!-- main content -->
<main>
	<h2>요청하신 페이지를<br>
		찾을 수 없습니다.</h2>
	<p class="icon">!</p>
	<p class="word-break">서비스 이용에 불편을 드려 죄송합니다.<br>
		잠시 후 다시 이용해 주세요.</p>
</main>
<!-- //main content -->
</body>
</html>
