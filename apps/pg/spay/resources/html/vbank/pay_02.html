						<li class="item-more hidden"><button type="button" class="btn"><span class="name">신협</span> <span class="logo"><img src="../../images/logo/bank/048.png" alt="신협"></span></button></li>
						<li class="item-more hidden"><button type="button" class="btn"><span class="name">BOA</span> <span class="logo"><img src="../../images/logo/bank/060.png" alt="BOA"></span></button></li>
						<li class="item-more hidden"><button type="button" class="btn"><span class="name">하나</span> <span class="logo"><img src="../../images/logo/bank/081.png" alt="하나"></span></button></li>

			</div>

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(document).ready(function(){
		// 푸터 고정 토글
		function fixedFooter(){
			// 짧은 화면 푸터 고정
			var winHeight = $(window).innerHeight();
			var mainHeight = $("#content").height() + $("#header").innerHeight() + $("#footer").innerHeight();
			var gap = winHeight - mainHeight; // 콘텐츠가 짧은 경우
			if(gap > 0) {
				$("#footer").addClass("fixed");
			} else {
				$("#footer").removeClass("fixed");
			}

			// 푸터 고정 시 하단 여백 확보
			var fixFoot = $("#footer.fixed");
			if(fixFoot.length > 0){
				var fixFootHeight = $(fixFoot).innerHeight();
				$("#content").css("padding-bottom", fixFootHeight);
			} else {
				$("#content").css("padding-bottom", 0);
			}
		}

		// 은행 목록 더보기
		$(".select-bank .btn-more").click(function(){
			$(this).addClass("hidden");
			$(".item-more").removeClass("hidden");
			fixedFooter();
		});

		// 은행 선택
		$(".select-bank .bank-list:not(.pay) .btn").click(function(){
			$(".select-bank").addClass("hidden");
			$(".selected-bank").removeClass("hidden");
			$(".selected-bank .logo").html($(this).find(".logo").html());
			fixedFooter();
		});

		// 은행 재선택
		$(".selected-bank .btn-reselect").click(function(){
			$(".select-bank").removeClass("hidden");
			$(".selected-bank").addClass("hidden");
			fixedFooter();
		});

		// 현금영수증 소득증빙용/지출증빙용 선택 시 하위 select 노출/미노출
		$("[name='rcptRegGb']").click(function(){
			if($("#rcptRegGb_01").is(":checked")){
				$("#rcptIdGb_01").removeClass("hidden");
				$("#rcptIdGb_02").addClass("hidden");
			} else {
				$("#rcptIdGb_01").addClass("hidden");
				$("#rcptIdGb_02").removeClass("hidden");
			}
		});
	});
</script>
