<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>헥토 파이낸셜 공지 및 장애 안내</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    </head>

    <body style="margin: 0; padding: 0">
        <!-- email template -->
        <div style="max-width: 760px; margin: 0 auto">
            <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                bgcolor="#ffffff"
                style="
                    width: 100%;
                    margin: 0 auto;
                    border-collapse: collapse;
                    -webkit-text-size-adjust: 100%;
                    font-family: 맑은 고딕, Malgun Gothic, 돋움, Dotum, Apple SD Gothic Neo, Sans-serif;
                    letter-spacing: -0.03em;
                    text-align: left;
                "
            >
                <tbody>
                    <!-- header -->
                    <tr>
                        <td valign="top" style="padding: 30px 25px; border-bottom: 2px solid #ff6114">
                            <img src="../../images/logo-hectofinancial-renew.png" width="135" height="20" alt="헥토 파이낸셜" style="display: block; border: 0; margin: 0 auto" />
                        </td>
                    </tr>
                    <!-- //header -->

                    <!-- main content -->
                    <tr>
                        <td valign="top" style="padding: 0 23px 0 23px">
                            <table
                                width="100%"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                style="width: 100%; border-collapse: collapse; font-family: 맑은 고딕, Malgun Gothic, 돋움, Dotum, Apple SD Gothic Neo, Sans-serif; letter-spacing: -0.03em"
                            >
                                <tbody>
                                    <tr>
                                        <td
                                            style="
                                                padding: 50px 0 30px;
                                                font-family: Pretendard;
                                                font-size: 20px;
                                                font-weight: 700;
                                                line-height: 23.87px;
                                                text-align: left;
                                                color: #222;
                                                word-break: keep-all;
                                                text-align: center;
                                            "
                                        >
                                            <strong>이메일 인증 코드 안내</strong>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 0; font-family: Pretendard; font-size: 15px; font-weight: 400; line-height: 27px; text-align: center">
                                            안녕하세요. <br />
                                            로그인 인증을 위한 인증 코드 안내 메일입니다. <br />
                                            전자계약 로그인 페이지에서 아래의 인증코드를 입력해주세요.
                                        </td>
                                    </tr>
                                    <tr style="text-align: center">
                                        <td
                                            style="
                                                text-align: center;
                                                color: #222;
                                                text-decoration: none;
                                                padding: 0;
                                                width: 251px;
                                                height: 69px;
                                                font-family: Pretendard;
                                                font-size: 24px;
                                                font-weight: 700;
                                                line-height: 69px;
                                                text-align: left;
                                                text-align: center;
                                                background: #f5f5f7;
                                                border-radius: 5px;
                                                display: inline-block;
                                                vertical-align: middle;
                                                margin: 30px auto 0;
                                            "
                                        >
                                            AQDPGLZMD
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    <!-- //main content -->

                    <!-- footer -->
                    <tr>
                        <td
                            bgcolor="#f4f4f4"
                            style="
                                padding: 34px 23px 33px 23px;
                                font-size: 14px;
                                color: #333;
                                line-height: 20px;
                                margin-top: 50px;
                                text-align: center;
                                display: inline-block;
                                width: 100%;
                                border-radius: 10px;
                            "
                        >
                            인증코드는 10분 동안 유효합니다.
                            <br />
                            본 메일은 발신 전용 메일이므로 회신을 통한 문의는 처리되지 않습니다. 문의 사항은 고객센터로 문의해주세요.
                        </td>
                    </tr>
                    <!-- //footer -->
                </tbody>
            </table>
        </div>
        <!-- //email template -->
    </body>
</html>
