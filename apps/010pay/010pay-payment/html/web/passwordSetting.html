<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/password.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/commonutil.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <div class="step1">
        <!-- header -->
        <div id="header">
          <div class="container">
            <div class="header-box">
              <h2 class="page-title">
                <img class="rrpay-logo" src="../../images/web/round_pay_logo.svg" alt="RROUND PAY">
              </h2>
              <button type="button" class="btn-close">
                <i class="icon-close"></i>
              </button>
            </div>
          </div>
        </div>
        <!-- //header -->

        <!-- content -->
        <div id="content">
          <!-- container -->
          <div class="container password-container">
            <!-- headline -->
            <div class="headline pt-0">
              <p>
                새 비밀번호를 설정해 주세요 <br>
                설정 후 휴대폰 번호로 로그인할 수 있어요
              </p>
            </div>
            <!-- //headline -->

            <!-- section -->
            <div class="form-type-wrap">
              <ul class="form-type">
                <!-- 에러일 경우 input-container에 label-error 클래스 추가 -->
                <li class="name-wrap">
                  <div class="input-container password label-n">
                    <input
                      type="password"
                      class="custom-input"
                      placeholder=" "
                      id="password"
                    />
                    <label for="password" class="floating-label"
                      >비밀번호</label
                    >
                    <button
                      type="button"
                      class="icon icon-del js-text-del"
                    ></button>
                    <button
                      type="button"
                      class="icon icon-eye icon-eye-on"
                    ></button>
                  </div>
                </li>
                <li class="name-wrap">
                  <div class="input-container password label-n">
                    <input
                      type="password"
                      class="custom-input"
                      placeholder=" "
                      id="password-check"
                    />
                    <label for="password-check" class="floating-label"
                      >비밀번호 확인</label
                    >
                    <button
                      type="button"
                      class="icon icon-del js-text-del"
                    ></button>
                    <button
                      type="button"
                      class="icon icon-eye icon-eye-on"
                    ></button>
                  </div>
                  <span class="helper-text">8~20자, 영문 + 숫자 + 특수문자 조합</span>
                </li>
              </ul>
            </div>
            <!-- //section -->
          </div>
          <!-- //container -->

          <!-- bottom area -->
          <div class="bottom-area">
            <!-- container -->
            <div class="container">
              <button
                type="button"
                id="agree-show"
                class="btn"
                disabled
              >
                완료
              </button>
            </div>
            <!-- //container -->
          </div>
          <!-- //bottom area -->
        </div>
        <!-- //content -->
      </div>
    </div>
    <!-- //wrap -->

    <script>
      $(function () {
        // 비밀번호 정규식: 8~20자, 영문 + 숫자 + 특수문자 조합
        const passwordRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,20}$/;
        
        const $password = $('#password');
        const $passwordCheck = $('#password-check');
        const $passwordContainer = $password.closest('.input-container');
        const $passwordCheckContainer = $passwordCheck.closest('.input-container');
        const $passwordLabel = $passwordContainer.find('.floating-label');
        const $passwordCheckLabel = $passwordCheckContainer.find('.floating-label');
        const $nextBtn = $('#agree-show');
        
        // 원래 label 텍스트 저장
        const originalPasswordLabel = $passwordLabel.text();
        const originalPasswordCheckLabel = $passwordCheckLabel.text();
        
        let isPasswordValid = false;
        let isPasswordMatch = false;
        
        // 검증 상태만 업데이트 (오류 표시 없음)
        function checkValidation() {
          const passwordValue = $password.val();
          const passwordCheckValue = $passwordCheck.val();
          
          // 비밀번호 형식 검증
          isPasswordValid = passwordValue.length > 0 && passwordRegex.test(passwordValue);
          
          // 비밀번호 확인 검증
          isPasswordMatch = passwordCheckValue.length > 0 && 
                           passwordValue === passwordCheckValue && 
                           isPasswordValid;
          
          // 버튼 활성화/비활성화
          updateButtonState();
        }
        
        // 비밀번호 검증 함수 (오류 표시 포함)
        function validatePassword() {
          const passwordValue = $password.val();
          const passwordCheckValue = $passwordCheck.val();
          
          // 비밀번호 형식 검증
          if (passwordValue.length > 0) {
            if (passwordRegex.test(passwordValue)) {
              $passwordContainer.removeClass('label-error');
              $passwordLabel.text(originalPasswordLabel);
              isPasswordValid = true;
            } else {
              $passwordContainer.addClass('label-error');
              $passwordLabel.text('8~20자, 영문 + 숫자 + 특수문자 조합');
              isPasswordValid = false;
            }
          } else {
            $passwordContainer.removeClass('label-error');
            $passwordLabel.text(originalPasswordLabel);
            isPasswordValid = false;
          }
          
          // 비밀번호 확인 검증
          if (passwordCheckValue.length > 0) {
            if (passwordValue === passwordCheckValue && isPasswordValid) {
              $passwordCheckContainer.removeClass('label-error');
              $passwordCheckLabel.text(originalPasswordCheckLabel);
              isPasswordMatch = true;
            } else {
              $passwordCheckContainer.addClass('label-error');
              if (passwordValue !== passwordCheckValue) {
                $passwordCheckLabel.text('비밀번호가 일치하지 않습니다');
              } else if (!isPasswordValid) {
                $passwordCheckLabel.text('8~20자, 영문 + 숫자 + 특수문자 조합');
              }
              isPasswordMatch = false;
            }
          } else {
            $passwordCheckContainer.removeClass('label-error');
            $passwordCheckLabel.text(originalPasswordCheckLabel);
            isPasswordMatch = false;
          }
          
          // 버튼 활성화/비활성화
          updateButtonState();
        }
        
        // 버튼 상태 업데이트
        function updateButtonState() {
          // 비밀번호가 유효하고 일치하는지 확인
          const isPasswordOK = isPasswordValid && isPasswordMatch;
          
          if (isPasswordOK) {
            $nextBtn.prop('disabled', false);
          } else {
            $nextBtn.prop('disabled', true);
          }
        }
        
        // 비밀번호 입력 시 버튼 상태만 업데이트 (오류 표시 없음)
        $password.on('input', function() {
          checkValidation();
        });
        
        // 비밀번호 확인 입력 시 버튼 상태만 업데이트 (오류 표시 없음)
        $passwordCheck.on('input', function() {
          checkValidation();
        });
        
        // 포커스 아웃 시 검증 및 오류 표시
        $password.on('blur', function() {
          validatePassword();
        });
        
        $passwordCheck.on('blur', function() {
          validatePassword();
        });
        
        // Tab 키 눌렀을 때 비밀번호 확인 필드로 포커스 이동
        $password.on('keydown', function(e) {
          if (e.keyCode === 9 || e.which === 9) { // Tab 키
            e.preventDefault();
            $passwordCheck.focus();
          }
        });
        
        // 초기 버튼 상태 확인
        updateButtonState();
      });
    </script>
  </body>
</html>
