<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/cardRegister.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title">카드 등록</h2>
            <button
              type="button"
              class="btn-close js-change-btn"
              data-title="카드 등록을 중단하면 결제 시 <br /> 포인트 적립 혜택을 받을 수 없어요!"
              data-message="이대로 취소할까요?"
              data-cancel="취소하기"
              data-confirm="계속하기"
              data-show-cancel="true"
            >
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container select-card-container">
          <h4 class="title-text">카드사를 선택해 주세요</h4>
          <ul class="card-list">
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-1.png" alt="" />
              </div>
              <p class="card-name">신한카드</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-2.png" alt="" />
              </div>
              <p class="card-name">삼성</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-3.png" alt="" />
              </div>
              <p class="card-name">현대</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-4.png" alt="" />
              </div>
              <p class="card-name">롯데</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-5.png" alt="" />
              </div>
              <p class="card-name">우리</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-6.png" alt="" />
              </div>
              <p class="card-name">하나</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-7.png" alt="" />
              </div>
              <p class="card-name">비씨</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-8.png" alt="" />
              </div>
              <p class="card-name">국민</p>
            </li>
            <li class="card-item">
              <div class="img-wrap">
                <img src="../../../images/payment/samlple/card-9.png" alt="" />
              </div>
              <p class="card-name">농협</p>
            </li>
          </ul>
          <ul class="note-wrap">
            <li>
              카드에 BC마크가 있거나 제휴사(수협, 광주 전북은행 등)에서
              발급했다면 BC카드를 선택해 주세요.
            </li>
            <li>
              카카오페이, 케이뱅크는 카드에 표기된 카드사를 선택해 주세요.
            </li>
            <li>토스뱅크 카드는 하나카드를 선택하여 등록해 주세요.</li>
            <li>씨티독자카드는 등록할 수 없어요.</li>
          </ul>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {
      $('.card-item').click(function () {
        $(this).siblings().removeClass('active');
        $(this).addClass('active');
      });
    });
  </script>
</html>
