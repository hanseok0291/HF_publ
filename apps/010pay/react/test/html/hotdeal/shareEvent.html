<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>핫딜</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">

	<!-- styles -->
	<link rel="stylesheet" href="../../../styles/globals.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Common.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Layout.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/ShareEvent.module.css">
	<!-- //styles -->

	<!-- script -->
	<script src="../../js/common/jquery-1.8.3.min.js"></script>
	<!-- //script -->
</head>

<body>
	<!-- wrap -->
	<div class="wrap">
		<!-- header -->
		<div class="pageHeader subHeader">
			<div class="container">
				<button type="button" class="btnIcon btnBack">뒤로 가기</button>
				<h1 class="pageTitle">내 당첨 확률</h1>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div class="shareEventContent">
			<!-- container -->
			<div class="container">
				<!-- event detail box -->
				<div class="eventBox">
					<div class="content">
						<div class="productWrap">
							<p class="productImg"><img src="../../images/hotdeal/sample/product-00.png" alt="상품 이미지"></p>
							<p class="productName">AirPods 3세대 AirPods 3세대 AirPods 3세대 AirPods 3세대 AirPods 3세대</p>
						</div>
						<div class="winningWrap">
							<span>나의 <strong>현재 당첨 확률</strong></span>
							<span><strong class="highlight result">1배</strong></span>
						</div>
					</div>
				</div>
				<!-- //event detail box -->

				<!-- event info box -->
				<div class="eventInfoBox">
					<div class="content">
						<p class="infoTitle">친구가 공유 링크를 통해<br>010PAY 앱 로그인 시</p>
						<strong>당첨 확률이 <span class="highlight">2배</span>로 UP</strong>
					</div>
				</div>
				<!-- //event info box -->
			</div>
			<!-- //container -->

			<!-- bottom button area(common) -->
			<div class="btnBox btnDetail bgGradientGray">
				<div class="container">
					<p><button type="button" class="btn">링크 공유하기</p>
				</div>
			</div>
			<!-- //bottom button area(common) -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</body>
</html>
