<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
    <script src="../../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container">
          <div class="complete-text gray fail">
            <p class="title">
              출금이 안됐어요
              <span class="sub-title">에러케이스를 기재해주세요.</span>
            </p>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">확인</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
      <!-- //content -->
    </div>
    <!-- //wrap -->
    
    <!-- 안내 팝업 -->
    <div id="modal-withdrawalt-info" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">대기 머니 출금 안내</p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="note-wrap">
                <li>
                  현재 보유 중인 대기 머니 전액 출금만 가능합니다.
                </li>
                <li>
                  은행 점검 시간에는 출금이 제한될 수 있습니다<br>
                  (평균 23시 50분 ~ 00시 10분)</li>
              </ul>
              <div class="info-wrap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //안내 팝업 -->
  </body>
  <script>
    $(document).ready(function () {
      // 로티 완료
      let svgContainer = document.querySelector(".lottie-check");

      let animItem = bodymovin.loadAnimation({
        wrapper: svgContainer,
        animType: "svg",
        loop: false,
        path: "https://ux.sbsvc.online/010pay/010pay-payment/images/lottie/check.json",
      });

      // 확인용 모달 노출
      modalOpenSlide('modal-withdrawalt-info')
    });
  </script>
</html>
