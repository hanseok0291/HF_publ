<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p><strong>출금계좌</strong>를<br> 등록해 주세요</p>
				</div>
				<!-- //headline -->

				<!-- 계좌 등록 -->
				<div class="section">
					<ul class="form-type account-register">
						<li>
							<span class="input input-box inline">
								<label class="label">은행선택</label>
								<button type="button" class="select btn-account bank-select">목록에서 선택</button>
							</span>
						</li>
						<li>
							<span class="input input-box inline">
								<label class="label">계좌번호</label>
								<input type="tel" name="accNo" id="accNo" maxlength="16" placeholder="- 없이 입력">
							</span>
						</li>
					</ul>
				</div>
				<!-- //계좌 등록 -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- button area -->
					<div class="btn-area">
						<!-- button area -->
						<div class="btn-area">
							<button type="button" id="send" class="btn btn-submit" disabled>다음</button>
						</div>
						<!-- //button area -->
					</div>
					<!-- //button area -->
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->
