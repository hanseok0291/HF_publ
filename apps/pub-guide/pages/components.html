<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컴포넌트 | 디자인 시스템</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="guide-header">
    <a href="../index.html" class="guide-back">← 디자인 시스템 가이드</a>
    <h1 class="page-title">컴포넌트</h1>
  </header>
  <main class="guide-main">
    <section class="section" id="icons">
      <h2 class="section__title">아이콘</h2>
      <div class="component-preview">
        <p class="component-desc">아이콘 세트 및 사용 예시 영역</p>
        <div class="icon-showcase"></div>
      </div>
    </section>
    <section class="section" id="buttons">
      <h2 class="section__title">버튼</h2>
      <div class="component-preview">
        <p class="component-desc">Primary, Secondary, Ghost 등 버튼 변형</p>
        <div class="button-showcase">
          <button type="button" class="btn btn-primary">Primary</button>
          <button type="button" class="btn btn-secondary">Secondary</button>
          <button type="button" class="btn btn-ghost">Ghost</button>
        </div>
      </div>
    </section>
    <section class="section" id="popup">
      <h2 class="section__title">팝업</h2>
      <div class="component-preview">
        <p class="component-desc">모달/팝업 컴포넌트 예시</p>
        <button type="button" class="btn btn-primary" data-popup-trigger="demo-popup">팝업 열기</button>
        <div id="demo-popup" class="popup" aria-hidden="true">
          <div class="popup__backdrop"></div>
          <div class="popup__box">
            <h3 class="popup__title">팝업 제목</h3>
            <p class="popup__body">팝업 내용이 여기에 표시됩니다.</p>
            <div class="popup__actions">
              <button type="button" class="btn btn-secondary popup-close">취소</button>
              <button type="button" class="btn btn-primary popup-close">확인</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="section" id="etc">
      <h2 class="section__title">기타 컴포넌트</h2>
      <div class="component-preview">
        <p class="component-desc">입력 필드, 카드, 배지 등 추가 컴포넌트 영역</p>
      </div>
    </section>
  </main>
  <footer class="guide-footer">
    <p>Design System Guide — Components</p>
  </footer>
  <script src="../js/main.js"></script>
</body>
</html>
