<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<style>
*, *:after, *:before { margin: 0; -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-text-size-adjust: none; text-size-adjust: none;
	-webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 0; font-family: 'Malgun Gothic', Dotum, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; line-height: 1.4; letter-spacing: -0.03em; color: #575757; word-break: keep-all; }
img { max-width: 100%; vertical-align: top; }
.container { margin-left: auto; margin-right: auto; padding-left: 24px; padding-right: 24px; width: 100%; max-width: 420px; }
#wrap { position: relative; width: 100%; height: 100%; min-width: 320px; }
#header { padding: 17px 0; background-color: #fff; font-size: 0; }
#header .brand-name { font-size: 14px; font-weight: bold; color: #151515; letter-spacing: -0.05em; }
#header .brand-name span { margin-right:3px; font-size: 15px; color: #ff7d00; }
.headline { padding-top: 40px; font-size: 25px; color: #151515; line-height: 1.3; letter-spacing: -0.09em; }
.headline .small { margin-top: 6px; font-size: 14px; color: #575757; letter-spacing: -0.06em; }
.pay-fail { margin: 80px 0 50px; text-align: center; }
.pay-fail img { width: 74px; }
.info-center { margin-top: 15px; }
.info-center strong { font-size: 15px; color: #151515; }
.ic_set {position: relative; width:100%; height:74px; margin:0 auto 10px; overflow: hidden; color:#fff; }
.ic_set .txt {position: relative; display:inline-block; width:74px; height:74px; margin:0 auto; padding: 12px 0 0; font-size:50px; font-family: arial; color:#fff; line-height: 1; background:#ff3701; border-radius:45px;-moz-border-radius:45px; -webkit-border-radius:45px; }

</style>
</head>

<body>
<!-- wrap -->
<div id="wrap">
	<!-- header -->
	<div id="header">
		<div class="container">
			<h1 class="brand-name">내통장결제</h1>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="content">
		<!-- container -->
		<div class="container">
			<!-- headline -->
			<div class="headline">
				<p><strong>시스템 점검 중</strong></p>
				<p class="small">더 좋은 서비스를 위한 시스템 점검 중입니다.</p>
			</div>
			<!-- //headline -->

			<!-- 안내 -->
			<div class="section pay-fail">
				<p class="ic_set"><span class="txt">!</span></p>
				<p class="info-center"><strong>작업시간</strong><br>
					05.09 23:50 ~ 05.10 00:30</p>
			</div>
			<!-- //안내 -->
		</div>
		<!-- //container -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->
</body>
</html>
