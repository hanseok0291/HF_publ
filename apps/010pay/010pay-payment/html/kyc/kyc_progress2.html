<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/pay/charge.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button
              type="button"
              class="btn-close js-change-btn"
              data-title="고객확인이<br>아직 완료되지 않았어요"
              data-message="처음부터 다시 시도해 주세요."
              data-cancel="닫기"
              data-confirm="재입력하기"
            >
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container kyc banner-full-container">
          <div class="complete-text">
            <p>
              다음 화면으로 이동해<br />
              고객확인을 완료해 주세요
            </p>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">확인</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
      <!-- //content -->
      <!-- common prompt -->
      <div id="commonPrompt" class="modal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-body">
              <h3 id="promptTitle"></h3>
              <p id="promptContents"></p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                id="promptNo"
                onclick="modalCloseAlert();"
                class="btn btn-cancel"
              >
                취소
              </button>
              <button
                type="button"
                id="promptOk"
                onclick="modalCloseAlert();"
                class="btn btn-confirm"
              >
                확인
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- //common prompt -->
    </div>
    <!-- //wrap -->
  </body>
  <script>
  </script>
</html>
