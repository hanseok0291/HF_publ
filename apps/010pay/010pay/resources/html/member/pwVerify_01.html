<!DOCTYPE html>
<html lang="ko">
<head>
	<title>화면 예시</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />

	<meta name="title" content="" />
	<meta name="description" content=""/>
	<meta name="keywords" content=""/>

	<link rel="stylesheet" href="../../css/jquery-ui.css">
	<link rel="stylesheet" href="../../css/owl.carousel.min.css">
	<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
	<!--[if lt IE 9]>
	<script type="text/javascript" src="../../js/html5shiv.js"></script>
	<script type="text/javascript" src="../../js/respond.min.js"></script>
	<![endif]-->
	<script src="../../js/jquery-1.8.3.min.js"></script>
	<script src="../../js/jquery.placeholder.min.js"></script>
	<script src="../../js/jquery-ui.js"></script>
	<script src="../../js/jquery.ui.touch-punch.min.js"></script>
	<script src="../../js/owl.carousel.min.js"></script>
	<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
	<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
	<script src="../../js/commonutil.js?ezauthver=5.0"></script>

	<link rel="stylesheet" href="../../css/common_one.css">
	<link rel="stylesheet" href="../../css/layout_one.css">
	<!-- <link rel="stylesheet" href="../../css/queries_one.css"> -->
</head>
<body>
	<div class="layout-payment" style="background-color:#dbdce3"><!-- style은 화면 영역 확인을 위해 임시로 넣어둔 것이니 무시하세요.-->
		<div class="wrap">
			<div style="text-align: center; padding: 20px">
				<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name"><a href="#"><span class="my-logo"><img src="../../images/logo-myaccount.png" class="logo" alt="내통장결제"></span></a></h1>
				<h2 class="page-title hidden">비밃번호 입력</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p><strong>비밀번호 입력</strong></p>
				</div>
				<!-- //headline -->

				<!-- 비밀번호 입력 -->
				<div class="section">
					<div class="input-mark">
						<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
					</div>
					<span class="input input-help hidden" id="pwdSpan">
						<input type="password" name="pw" id="pw" maxlength="6" autofocus placeholder="숫자 6자리">
					</span>
				</div>
				<!-- //비밀번호 입력 -->

				<!-- link -->
				<div class="section mgt20 text-center">
					<button type="button" id="forgetPassword" class="text-link">비밀번호를 잊어버리셨나요?</button>
				</div>
				<!-- //link -->
			</div>
			<!-- //container -->

			<!-- keypad sample -->
			<div class="nppfs-keypad-div">
				<div class="kpd-wrap kpd-image"><img src="../../images/sample/keypad-sample.png" alt="보안키패드 샘플"></div>
			</div>
			<!-- //keypad sample -->
		</div>
		<!-- //content -->
			</div>
		</div>
	</div>
</body>
</html>
