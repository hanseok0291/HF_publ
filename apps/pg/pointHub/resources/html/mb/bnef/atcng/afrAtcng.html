<dd>
	<div class="txt_date"> ${rootMap.userInfo.clipCustName} 님의 자동이체 신청일 : ${rootMap.atcng.response.data.result[0].aply_dt} </div>
	<div class="cont_dv2">
		<div class="tit">신청 상품</div>
		<div class="selbx">
			<button class="popup-open" disabled="disabled">
				<span class="type" id="afrAtcng_deviceName">
				     ${rootMap.atcng.response.data.result[0].title}
					 <%-- ${fn:split(rootMap.atcng.response.data.result[0].title,' ')[0]} --%>
				</span>
				<span class="num fontRoboto" id="afrAtcng_userCtn">
					 <%-- ${fn:split(rootMap.atcng.response.data.result[0].title,' ')[1]} --%>
				</span>
				<span class="bg_icon"></span>
			</button>
		</div>
	</div>
	<div class="cont_dv2">
		<div class="tit">신청 금액</div>
		<div class="cont_dv">
			<div class="tit">K포인트(매월)</div>
			<div class="txt_point has_input">
				<fmt:formatNumber type="number" var="afr_atcng_amt" maxFractionDigits="3" value="${rootMap.atcng.response.data.result[0].atcng_amt}"/>
				<input type="text" placeholder="금액 입력" id="afrAtcngPayCoin" value="${afr_atcng_amt} P" disabled="disabled">
				<button class="bg_icon btn_del">입력취소</button>
			</div>
		</div>
	</div>
	<div class="cont_dv2">
		<div class="tit">자동납부일</div>
		<label class="label1">
			<input type="checkbox" class="checkbox_s1" disabled="disabled" checked="checked">
			<span><strong>매월 9~18일 사이</strong> 자동 납부됩니다.</span>
		</label>
	</div>
	<div class="txt_noti2">자동이체 신청 내역은 익월부터 적용됩니다.</div>
	<div class="btn_mod_wrap">
		<button onclick="javascript:fn.coin.moveAfrAtcngPage();"> 자동납부 내역 변경 <span class="bg_icon"></span></button>
	</div>
	<div class="btn_termination_wrap">
		<button class="popup-open2">자동납부 해지</button>
	</div>
	<form id="atcngInfoForm">
		<input type="hidden" name="pay_amt" 		id="afr_atcng_pay_amt"         value="${rootMap.atcng.response.data.result[0].atcng_amt}">
		<input type="hidden" name="bill_user_key"   id="afr_atcng_biller_user_key" value="${rootMap.atcng.response.data.result[0].biller_user_key}">
		<input type="hidden" name="bill_titl" 		id="afr_atcng_title"           value="${rootMap.atcng.response.data.result[0].title}">
		<input type="hidden" name="atcng_stat_nm" 	id="afr_atcng_stat_nm"         value="${rootMap.atcng.response.data.result[0].atcng_stat_nm}">
		<input type="hidden" name="aply_dt" 	    id="afr_atcng_aply_dt"         value="${rootMap.atcng.response.data.result[0].aply_dt}">

		<input type="hidden" name="cust_name" 		id="afr_atcng_cust_name"       value='<c:out value="${rootMap.userInfo.clipCustName}"/>'>
		<input type="hidden" name="phCustId" 		id="afr_atcng_phCustId"        value='<c:out value="${rootMap.userInfo.phCustId}"/>'>
		<input type="hidden" name="cust_id" 		id="afr_atcng_cust_id"         value='<c:out value="${rootMap.userInfo.cust_id}"/>'>
		<input type="hidden" name="gaid" 	     	id="afr_atcng_gaid"            value='<c:out value="${rootMap.userInfo.gaid}"/>'>
		<input type="hidden" name="appver" 			id="afr_atcng_app_ver"         value='<c:out value="${rootMap.userInfo.appver}"/>'>
		<input type="hidden" name="os" 				id="afr_atcng_os_type"         value='<c:out value="${rootMap.userInfo.os}"/>'>
		<input type="hidden" name="ctn" 		 	id="afr_atcng_ctn"         	   value='<c:out value="${rootMap.userInfo.ctn}"/>'>
	</form>
</dd>
