<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=6.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>
<style>
#content { position: relative; }
</style>
<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="facebook-passbook iframe facebook-new">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name small-x">
					<a href="#">
						<span class="my-logo"><img src="../../images/custom/meta/logo.png" class="logo" alt="010내통장결제"></span> <!-- 기본 로고 -->
					</a>
				</h1>
				<h2 class="page-title hidden">회원 확인</h2>
				<button type="button" id="closeWindowMeta" class="btn-close2"></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<div class="container">
				<div class="headline top">
					<p class="title">
						Facebook에서<br>
						<b>138,000원</b>을 결제합니다.
					</p>
					<p class="sub-title">facebook ads</p>
				</div>
			</div>

			<!-- container -->
			<div class="white slide">
					<!-- view1 -->
					<div class="view view1">
						<!-- headline -->
						<div class="headline">
							<p class="title">
								<b>내 번호로 결제 시작</b><br>
							</p>
							<!-- <p class="sub-title">
								첫 결제 <span>2,000원 즉시 할인!</span>
							</p> -->
						</div>
						<!-- //headline -->
						<div class="login-form-wrap exStyle">
							<div class="number-wrap">
								<input id="phone_input1" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="010" value="010" class="input-box" maxlength="3" oninput="maxLengthCheck(this)"/>
								<input id="phone_input2" type="number" inputmode="numeric" pattern="[0-9]*" class="input-box" maxlength="4" oninput="maxLengthCheck(this)"/>
								<input id="phone_input3" type="number" inputmode="numeric" pattern="[0-9]*" class="input-box" maxlength="4" oninput="maxLengthCheck(this)"/>
							</div>
							<div class="check-type-wrap">
								<div class="check-type">
									<span class="checkbox square">
										<input
											type="checkbox"
											name="checkbox_agree"
											id="checkbox_agree"
											checked
										/>
										<label for="checkbox_agree">번호 기억하기</label>
									</span>
								</div>
							</div>
							<div class="container">
							<button type="button" id="send" class="btn btn-next" disabled>
								다음
							</button>
							</div>
						</div>
						<div class="bot-area">
							<div class="link-wrap">
								<a href="#">신규 회원 가입</a>
								<a href="#">휴대폰 번호 변경</a>
							</div>
						</div>
					</div>
					<!-- //view1 -->
					<!-- view2 -->
					<div class="view view2" style="display: none">
						<!-- container -->
							<!-- headline -->
							<div class="headline">
								<p class="title"><strong>비밀번호 입력</strong></p>
								<p class="sub-title">개인정보 변경을 위해<br>
									등록하신 비밀번호를 입력해주세요.</p>
							</div>
							<!-- //headline -->

							<!-- 비밀번호 입력 -->
							<div class="section">
								<div class="input-mark">
									<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
								</div>
								<span class="input input-help hidden" id="pwdSpan">
									<input type="password" name="pw" id="pw" maxlength="6" autofocus placeholder="숫자 6자리">
								</span>
							</div>
							<!-- //비밀번호 입력 -->

							<!-- link -->
							<div class="section mgt20 text-center">
								<button type="button" id="forgetPassword" class="text-link">비밀번호를 잊어버리셨나요?</button>
							</div>
							<!-- //link -->
						<!-- //container -->
						<div class="link-wrap">
							<a href="#">등록 계좌 관리</a>
							<a href="#">현금영수증 발급 번호 변경</a>
						</div>

						<!-- keypad sample -->
						<div class="nppfs-keypad-div">
							<div class="kpd-wrap kpd-image"><img src="../../images/sample/keypad-sample1.png" alt="보안키패드 샘플"></div>
						</div>
						<!-- //keypad sample -->
					</div>
					<!-- //view2 -->
				
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-meta">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<div id="commonAlert2" class="modal modal-meta">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle">비밀번호 5회 오류로<br>사용이 정지되었습니다.</h3>
				<p id="alertContents">
					<p class="main-text sub-title">비밀번호 재설정 후 이용이 가능하며,<br>재설정은 본인인증이 필요합니다.</p>
				</p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">비밀번호 재설정</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-meta">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">닫기</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
	// 번호 입력 자리수 체크
	function maxLengthCheck(object){
		if (object.value.length > object.maxLength){
			//object.maxLength : 매게변수 오브젝트의 maxlength 속성 값입니다.
			object.value = object.value.slice(0, object.maxLength);
		}
	}
	
	$(document).ready(function(){
		// 휴면 회원 팝업
		// $.alertMessage('', '<p class="main-text">회원님은 장기간 미 이용으로 인해 <br><strong>휴면 회원</strong>으로 전환되어<br>개인정보가 분리 보관된 상태입니다.</p><p class="small-text sub-title">휴면 해제를 위해 본인인증 페이지로 이동합니다.</p>', $('#commonAlert'));
		// 계좌 미존재 팝업
		// $.alertMessage('등록된 계좌가 없습니다.', '<p class="small-text sub-title">계좌 등록 페이지로 이동합니다.</p>', $('#commonAlert'));
		// // PIN 미존재 팝업
		// $.alertMessage('비밀번호 등록이 필요한 회원입니다.<p class="small-text">(최초 1회)</p>', '<span class="small-text sub-title">비밀번호 등록 화면으로 이동합니다.</span>', $('#commonAlert'));
		// // 비밀번호 오류 팝업
		// $.alertMessage('결제 비밀번호 N회 오류', '<p class="main-text sub-title">5회 오류 시 이용이 제한됩니다.</p>', $('#commonAlert'));
		// // 비밀번호 5회 오류 팝업
		// $.alertMessage('비밀번호 5회 오류로<br>사용이 정지되었습니다.', '<p class="main-text sub-title">비밀번호 재설정 후 이용이 가능하며,<br>재설정은 본인인증이 필요합니다.</p>', $('#commonAlert2'));
			// 결제 팝업
		// $.alertMessage('Facebook에서 <br>138,000원이 결제됩니다.', '<p class="main-text sub-title">동의하시면 결제하기 버튼을 눌러주세요.</p>', $('#commonAlert'));
			// 프로모션 진행중 결제 팝업
		// $.alertMessage('Facebook에서 <br>138,000원이 결제됩니다.', '<p class="small-text color-text-black">첫 결제 <strong class="color-text-orange">2,000원 즉시 할인 적용!</strong></p><p class="main-text sub-title">동의하시면 결제하기 버튼을 눌러주세요.</p>', $('#commonAlert'));
	
		// 폼 입력 시 확인 버튼 활성
		$("input").keyup(function(){
			if ($("#phone_input1").val().length >= 3) {
				if ($("#phone_input2").val().length >= 4) {
					$('#phone_input3').focus();
					if ($("#phone_input3").val().length >= 4) {
					$("#send").attr("disabled",false);
					} else {
						$("#send").attr("disabled", true);
					}
				}
			}
			// 폼 입력 시 확인 버튼 활성
	
			// 다음 버튼 클릭시 슬라이드
			$(".btn-next").click(function () {
				var view2Height = $('#wrap').height() - 204;
				var view2HeightHalf = view2Height / 2 + 50;
				var view2HeightHalf2 = view2HeightHalf / 2 * -1;
				$('.view2 .headline').css("padding-top", view2HeightHalf);
				$('.view2 .headline').css("margin-top", view2HeightHalf2);
	
				// $('.slide').addClass('up');
				setTimeout(() => {
					// $('.view1').hide();
					// $('.view2').show();
					// PIN 미존재 팝업
					$.alertMessage('비밀번호 등록이 필요한 회원입니다.<p class="small-text">(최초 1회)</p>', '<span class="small-text sub-title">비밀번호 등록 화면으로 이동합니다.</span>', $('#commonAlert'));
				}, 300);
			})
			// 다음 버튼 클릭시 슬라이드
	
			// 비밀번호 입력 하단 버튼 간격
			var keypadHeight = $('.nppfs-keypad-div').height();
			// $('.view2 .link-wrap').css("padding-bottom", keypadHeight);
			$( window ).resize(function() {
				var view2Height = $('#wrap').height();
				var view2HeightHalf = view2Height / 2;
				var view2HeightHalf2 = view2HeightHalf / 2 * -1;
				$('.view2 .headline').css("padding-top", view2HeightHalf);
				$('.view2 .headline').css("margin-top", view2HeightHalf2);
				
				//창크기 변화 감지
				var keypadHeight = $('.nppfs-keypad-div').height();
				$('.view2 .link-wrap').css("margin-top", 'auto');
				$('.view2 .link-wrap').css("padding-bottom", keypadHeight + 10);
			});
			// 비밀번호 입력 하단 버튼 간격
		});
	
		// 닫기버튼
		$("#closeWindowMeta").click(function () {
			$.promptMessage("", "결제가 완료되지 않은 상태로 종료됩니다.", $('#commonPrompt'), $('#promptOk'), "modalClose()");
		});
	})
	
	$(function(){
		$("input").each(function(){
			$(this).bind("focus", function(){
				$(".bottom-area").css("position", "absolute");
				$(".bottom-area").css("bottom", "0");
			});
			$(this).bind("blur",function(){
				$(".bottom-area").css("position", "absolute");
				$(".bottom-area").css("bottom", "0");
			});
		});
	});
</script>
</body>
</html>
