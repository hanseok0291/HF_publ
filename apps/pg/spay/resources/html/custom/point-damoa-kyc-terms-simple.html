<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>포인트다모아 약관동의</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />
        <!-- //favicon -->

        <link rel="stylesheet" href="../../css/point_damoa.css" />
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/commonutil.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap" class="wrap point-damoa iframe">
            <header>
                <div class="container">
                    <div class="titleWrap">
                        <h2 class="title-main textLeft">포인트다모아 약관동의</h2>
                        <button type="button" id="closeWindow" class="btn-close" aria-label="창 닫기">
                            <i class="icon-times">창 닫기</i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="container">
                    <!-- 약관 동의 섹션 -->
                    <div class="container-wrap box-shadow order-wrap">
                        <div class="">
                            <!-- 약관 리스트 (아코디언 없음) -->
                            <ul class="accordion-list no-accordion">
                                <li>
                                    <div class="list-header">
                                        <span class="subject">
                                            <div class="check-box check-all w-full">
                                                <input type="checkbox" id="check-all" name="check-all" title="본인은 주식회사 케이티가 다음의 목적을 위하여 해당 정보를 제공함에 동의합니다." />
                                                <label for="check-all">본인은 주식회사 케이티가 다음의 목적을 위하여 해당 정보를 제공함에 동의합니다.</label>
                                            </div>
                                            <span class="btn-right">
                                                <a href="javascript:;" class="btn-view" data-term="term2">
                                                    <i class="icon-arrow-left"></i>
                                                </a>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="list-body" style="display: block;">
                                        <div class="">
                                            <ul class="list-sub">
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk1" class="checkSelect" name="chk1" value="Y" title="포인트다모아(포인트허브) 약관 (필수)" />
                                                        <label for="chk1">포인트다모아(포인트허브) 약관 (필수)</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term1">
                                                            <i class="icon-arrow-left"></i>
                                                        </a>
                                                    </span>
                                                </li>
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk2" class="checkSelect" name="chk2" value="Y" title="포인트다모아 개인정보 처리 방침 (필수)" />
                                                        <label for="chk2">포인트다모아 개인정보 처리 방침 (필수)</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term2">
                                                            <i class="icon-arrow-left"></i>
                                                        </a>
                                                    </span>
                                                </li>
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk3" class="checkSelect" name="chk3" value="Y" title="개인정보 수집/이용 동의 (필수)" />
                                                        <label for="chk3">개인정보 수집/이용 동의 (필수)</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term3">
                                                            <i class="icon-arrow-left"></i>
                                                        </a>
                                                    </span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                            <!-- //약관 리스트 -->
                        </div>
                    </div>
                    <!-- //약관 동의 섹션 -->
                </div>
            </div>
            <!-- //content -->
            
            <div class="btnWrap">
                <button type="button" class="btn btnNext" id="btnNext" disabled>확인</button>
            </div>
        </div>
        <!-- //wrap -->

        <script>
            $(document).ready(function () {
                // 전체약관동의 체크박스
                const allAgreeCheckbox = document.getElementById("check-all");
                // 나머지 체크박스들
                const otherCheckboxes = document.querySelectorAll(".checkSelect");
                // 확인 버튼
                const nextButton = document.getElementById("btnNext");

                // 필수 약관 모두 체크되었는지 확인
                function checkAllRequiredTerms() {
                    return Array.from(otherCheckboxes).every((cb) => cb.checked);
                }

                // 확인 버튼 활성화/비활성화
                function updateNextButton() {
                    const allChecked = checkAllRequiredTerms();
                    nextButton.disabled = !allChecked;
                }

                // 전체약관동의 체크박스 변경 이벤트
                allAgreeCheckbox.addEventListener("change", function () {
                    otherCheckboxes.forEach(function (checkbox) {
                        checkbox.checked = allAgreeCheckbox.checked;
                    });
                    updateNextButton();
                });

                // 개별 체크박스 변경 이벤트
                otherCheckboxes.forEach(function (checkbox) {
                    checkbox.addEventListener("change", function () {
                        // 모든 개별 약관이 체크되면 전체약관동의도 체크
                        if (checkAllRequiredTerms()) {
                            allAgreeCheckbox.checked = true;
                        } else {
                            allAgreeCheckbox.checked = false;
                        }
                        updateNextButton();
                    });
                });

                // 보기 버튼 클릭 이벤트
                document.querySelectorAll(".btn-view").forEach(function (btn) {
                    btn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const termId = this.getAttribute("data-term");
                        // 약관 상세보기 처리 (필요시 모달 또는 새 창 열기)
                        console.log(termId + " 약관 상세보기");
                    });
                });

                // 확인 버튼 클릭 이벤트
                nextButton.addEventListener("click", function () {
                    if (!this.disabled) {
                        // 약관 동의 완료 처리
                        const terms = {
                            checkAll: allAgreeCheckbox.checked,
                            chk1: document.getElementById("chk1").checked,
                            chk2: document.getElementById("chk2").checked,
                            chk3: document.getElementById("chk3").checked,
                        };
                        console.log("약관 동의 완료:", terms);
                        
                        // 부모 창에 약관 동의 완료 메시지 전송
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage(
                                {
                                    type: "kycTermsAgree",
                                    data: terms
                                },
                                "*"
                            );
                        }
                    }
                });

                // 닫기 버튼
                $("#closeWindow").on("click", function () {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage("closeKycTermsSimple", "*");
                    } else {
                        if (confirm("종료하시겠습니까?")) {
                            window.close();
                        }
                    }
                });

                // 초기 상태 설정
                updateNextButton();
            });
        </script>
    </body>
</html>
