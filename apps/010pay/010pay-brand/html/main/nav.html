    <script>
    var moAppDownbtn = $("#moAppDownbtn").offset().top;
    $(window).on("scroll",function(){
      var $scroll = $(window).scrollTop();
      var $topConPos = $(".top-visual").scrollTop() + $(".top-visual").height() / 2;
      var winWidth = $(window).width() > 767 ? 240 : 60;
      var radius = winWidth - $scroll / $topConPos * 100 * (winWidth / 100);
      if(radius < 0){
        $(".top-visual .container").css({"border-bottom-left-radius": 0, "border-bottom-right-radius": 0} );
      } else {
        $(".top-visual .container").css({"border-bottom-left-radius": radius, "border-bottom-right-radius": radius} );
      }
      if($scroll > moAppDownbtn){
        $("#moAppDownbtn").addClass("fixed");
      } else {
        $("#moAppDownbtn").removeClass("fixed");
      }
    });
    var secondSlide = new Swiper(".second-slide", {
        speed: 800,
        autoplay: {
          delay: 3400,
          disableOnInteraction: false,
        },
        loop: true,
        slidesPerView: 1,
        pagination: {
          el: ".second-pagination",
          clickable: true
        },
        breakpoints: {
          767: {
            direction: 'vertical',
          }
        }
      });

      secondSlide.on('slideChange', function () {
        $(".second-section").addClass("on");
        $(".second-section .textBox .textWrap").removeClass ("active");
        $(".second-section .textBox .textWrap").eq(secondSlide.realIndex).addClass ("active");
      });

      secondSlide.autoplay.stop();
      var second_state = false;
      $(window).on("scroll load", function(){
        if($(".second-section").hasClass("animation") && !second_state){
          setTimeout(function(){
            secondSlide.autoplay.start();
          }, 100);
          second_state = true;
        }
      });

      $(".add-ani").each(function(i, e){
        var $delay = $(e).attr("delay");
        $(e).css("transition-delay", $delay+"s");
      });
      

      // 바디 스크롤 제거/해제
      var scrollHeight = 0;
      function scrollOff() {
        scrollHeight = $(document).scrollTop();
        $("body").addClass("modal-open");
        $(".content_wrap").css("position", "fixed");
        $(".content_wrap").css("top", -scrollHeight);
      }
      function scrollOn() {
        $("body").removeClass("modal-open");
        $(".content_wrap").css("top", 0);
        $(".content_wrap").css("position", "relative");
        $(document).scrollTop(scrollHeight);
      }

      // 레이어 팝업(모달) 열기
      function modalOpen(obj) {
        var temp = $("#" + obj);
        temp.fadeIn(100).addClass("open");
        scrollOff(); // 바디 스크롤 제거

        // 슬라이드 모달 닫기
        function modalOut() {
          temp.fadeOut(300).removeClass("open");

          // 이중 모달이 아닌 경우
          if (!$(temp).hasClass("depth2")) {
            scrollOn(); // 바디 스크롤 제거 해제
          }
        }

        // 팝업 내 닫기 버튼 클릭 시 팝업 닫기
        $(temp)
          .find(".modal-close")
          .click(function () {
            modalOut();
          });
      }
    </script>
