<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>헥토파이낸셜 지불서비스</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />
        <!-- //favicon -->

        <link rel="stylesheet" href="../../css/slick.min.css" />
        <link rel="stylesheet" href="../../css/kyc.css" />
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/slick.min.js"></script>
        <script src="../../js/kyc.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap" class="wrap kyc sole">
            <header>
                <div class="container">
                    <div class="titleWrap">
                        <h1 class="logo"></h1>
                        <span class="text">가맹점 서비스 계약</span>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="container">
                    <h2 class="title textLeft">서비스 신청서</h2>

                    <div class="stepWrap">
                        <div class="step step-active" data-step="1">
                            <div class="step-number">1</div>
                        </div>
                        <div class="step line" data-step="2">
                            <div class="step-number">2</div>
                        </div>
                        <div class="step line" data-step="3">
                            <div class="step-number">3</div>
                        </div>
                        <div class="step" data-step="4">
                            <div class="step-number">4</div>
                        </div>
                    </div>

                    <div class="guideWrap">
                        <p class="title">기본 정보 등록</p>
                        <ul class="guideList">
                            <li>사업자 정보 필수 값을 입력해주세요.</li>
                            <li>VAN서비스(가상계좌 중계, 펌뱅킹)의 경우 ‘공통’만 기재하세요.</li>
                        </ul>
                    </div>

                    <div class="formWrap">
                        <!--  -->
                        <div class="formContainer">
                            <!-- 사업자 구분 -->
                            <div class="formGroup">
                                <label for="businessNumber">사업자 구분</label>
                                <div>
                                    <div class="colWrap">
                                        <div class="checkBox">
                                            <input type="radio" id="listingInfo1" class="checkSelect" name="listingInformation" />
                                            <label for="listingInfo1">개인사업자</label>
                                        </div>
                                        <div class="checkBox">
                                            <input type="radio" id="listingInfo2" class="checkSelect" name="listingInformation" />
                                            <label for="listingInfo2">법인사업자(비영리 단체 포함)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 상호명(국문) -->
                            <div class="formGroup">
                                <label for="businessNameKr">상호명(국문)</label>
                                <input type="text" id="businessNameKr" name="businessNameKr" placeholder="헥토" readonly />
                            </div>

                            <!-- 상호명(영문) -->
                            <div class="formGroup">
                                <label for="businessNameEn">상호명(영문)</label>
                                <input type="text" id="businessNameEn" name="businessNameEn" placeholder="상호명(영문)" />
                            </div>

                            <!-- 사업자등록번호 -->
                            <div class="formGroup">
                                <label for="businessNumber">사업자등록번호</label>
                                <input type="text" id="businessNumber" name="businessNumber" placeholder="123-45-67899" readonly />
                            </div>

                            <!-- 설립일 -->
                            <div class="formGroup">
                                <label for="establishmentDate">설립일</label>
                                <input type="date" id="establishmentDate" name="establishmentDate" placeholder="YYYY-MM-DD" />
                            </div>

                            <!-- 업종 -->
                            <div class="formGroup">
                                <label for="businessType">업종</label>
                                <div class="sideBtnWrap">
                                    <div class="selectBox">
                                        <button class="label">업종</button>
                                        <ul class="optionList">
                                            <li class="optionItem">업종 1</li>
                                            <li class="optionItem">업종 2</li>
                                        </ul>
                                    </div>
                                    <div class="sideBtnBox">
                                        <button type="button">업종 추가</button>
                                    </div>
                                </div>
                            </div>

                            <div class="formGroup">
                                <label for="businessType"></label>
                                <div class="selectBox">
                                    <button class="label">업종</button>
                                    <ul class="optionList">
                                        <li class="optionItem">업종 1</li>
                                        <li class="optionItem">업종 2</li>
                                    </ul>
                                </div>
                            </div>

                            <!-- 업태 -->
                            <div class="formGroup">
                                <label for="businesstype">업태</label>
                                <input type="text" id="businesstype" name="businesstype" placeholder="업태 직접 입력" />
                            </div>

                            <!-- 사업장 주소 국가 -->
                            <div class="formGroup">
                                <label for="country">사업장 주소 국가</label>
                                <div class="selectBox">
                                    <button class="label">사업장 주소 국가</button>
                                    <ul class="optionList">
                                        <li class="optionItem">한국</li>
                                        <li class="optionItem">기타</li>
                                    </ul>
                                </div>
                            </div>

                            <!-- 사업장 주소 -->
                            <div class="formGroup">
                                <label for="postalCode">사업장 주소</label>
                                <div class="postalContainer">
                                    <input type="text" id="postalCode" name="postalCode" placeholder="우편번호" />
                                    <button type="button">우편번호 검색</button>
                                </div>
                            </div>

                            <div class="formGroup">
                                <label for="address"></label>
                                <input type="text" id="address" name="address" placeholder="상세주소" />
                            </div>

                            <div class="formGroup">
                                <label for="address2"></label>
                                <input type="text" id="address2" name="address2" placeholder="상세주소 2" />
                            </div>

                            <!-- 이메일 -->
                            <div class="formGroup">
                                <label for="email">이메일</label>
                                <input type="text" id="email" name="email" placeholder="이메일 직접 입력" />
                            </div>

                            <!-- (대표)유선번호 -->
                            <div class="formGroup">
                                <label for="landline">(대표)유선번호</label>
                                <input type="text" id="landline" name="landline" placeholder="고객센터 번호 필수 기재" />
                            </div>
                        </div>
                        <!--  -->
                    </div>

                    <div class="btnWrap">
                        <button type="button" class="btn btnPrev">이전</button>
                        <button type="button" class="btn btnNext" disabled>다음</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //wrap -->
        <script></script>
    </body>
</html>
