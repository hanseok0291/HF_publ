<script src="../../js/bootstrap.min.js"></script>

</head>

<body>

<!-- wrap -->
<div id="wrap" class="wrap new register-account-fig-4339">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">결제 수단 등록</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main>
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<h2 class="headline"><strong>계좌 정보 입력 후<br>
					출금 동의를 진행해 주세요.</strong></h2>
				<!-- //headline -->

				<!-- section -->
				<section>
					<h3 class="hidden">정보 입력</h3>
					<!-- form area (피그마 4339:1407 — 은행행·입력·토스 알약 버튼 순, gap 20px) -->
					<div class="form-area register-account-entry">
						<div class="form-group bank-area register-account-bank-id">
							<span class="logo"><img src="../../images/logo/bank/v2/logo_092.png" alt="토스뱅크"></span>
							<span class="name">토스뱅크</span>
						</div>
						<div class="form-group bank-area">
							<input type="text" id="inputAccountName" class="form-control" placeholder="이름" aria-label="이름">
							<div class="text-error"></div>
						</div>
						<div class="form-group bank-area">
							<input type="tel" id="inputAccountNumber" class="form-control" maxlength="16" placeholder="계좌번호 입력" aria-label="계좌번호" inputmode="numeric">
							<div class="text-error"></div>
						</div>
						<!-- tossbank easy register pill -->
						<div class="register-account-toss-pill-wrap">
							<a href="registerAccount_toss.html" class="register-account-toss-pill" role="button">토스뱅크 간편 등록하기</a>
						</div>
						<!-- //tossbank easy register pill -->
					</div>
					<!-- //form area -->
				</section>
				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->

		<!-- footer -->
		<footer>
			<!-- container -->
			<div class="container">
				<button type="button" id="submit" class="btn btn-lg btn-primary new shadow" disabled>확인</button>
			</div>
			<!-- //container -->
		</footer>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title">알림</h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title">안내</h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(function () {
		var $submit = $('#submit');
		var $inputs = $('#inputAccountName, #inputAccountNumber');

		/** 이름·계좌번호 모두 입력 시 확인 버튼 활성화 */
		function updateSubmitEnabled() {
			var allFilled = true;
			$inputs.each(function () {
				if (!$(this).val().trim()) {
					allFilled = false;
					return false;
				}
			});
			$submit.prop('disabled', !allFilled);
		}

		$inputs.on('input change blur', updateSubmitEnabled);
		updateSubmitEnabled();
	});
</script></body>
</html>
