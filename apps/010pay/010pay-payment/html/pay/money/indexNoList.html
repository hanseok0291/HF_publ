<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/transactionHistory.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-17] renewal-v2 적용 — 머니 상세 (내역 없음) -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <a href="#" class="btn-right-menu right-0">관리</a>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container money-v2 transaction-history-container">
          <!-- sec-balance -->
          <div class="sec-balance">
            <div class="sec-summary">
              <div class="account-row">
                <span class="account-label">머니</span>
              </div>
              <button
                type="button"
                class="summary-amount"
                onclick="modalOpenSlide('modal-money-info')"
              >
                0원
              </button>
            </div>

            <div class="sec-action">
              <div class="money-action-btns">
                <button type="button" class="btn-charge">충전</button>
              </div>

              <ul class="notice-banner-list">
                <li class="notice-banner-item">
                  <i class="icon-notice-moneybag" aria-hidden="true"></i>
                  <p class="notice-text">출금해야 할 대기 머니가 있어요.</p>
                  <button type="button" class="notice-go">
                    <i class="icon-arrow-right size-16" aria-hidden="true"></i>
                  </button>
                </li>
                <li class="notice-banner-item">
                  <i class="icon-notice-people" aria-hidden="true"></i>
                  <p class="notice-text">고객확인 정보 추가 입력이 필요해요.</p>
                  <button type="button" class="notice-go">
                    <i class="icon-arrow-right size-16" aria-hidden="true"></i>
                  </button>
                </li>
              </ul>

              <button type="button" class="money-promo-banner">
                <img src="../../../images/common/renewal-v2/banner-test.png" alt="배너">
              </button>
            </div>
          </div>
          <!-- //sec-balance -->

          <div class="divide-line" aria-hidden="true"></div>

          <!-- sec-history -->
          <div class="sec-history">
            <div class="month-wrap">
              <button
                type="button"
                class="prev-btn icon-arrow-left size-16 disabled"
              >
                이전
              </button>
              <button
                type="button"
                class="month-text"
                onclick="modalOpenSlide('modal-period')"
              >
                <span class="year-text">24년</span>
                <span class="month-num">12월</span>
                <i class="icon-arrow-down size-12" aria-hidden="true"></i>
              </button>
              <button type="button" class="next-btn icon-arrow-right size-16">
                다음
              </button>
            </div>

            <div class="trade-tab-wrap">
              <ul class="tab-list">
                <li>
                  <button type="button" class="active">전체</button>
                </li>
                <li>
                  <button type="button">충전</button>
                </li>
                <li>
                  <button type="button">사용</button>
                </li>
                <li>
                  <button type="button">출금</button>
                </li>
                <li>
                  <button type="button">소멸</button>
                </li>
              </ul>
            </div>

            <div class="empty-list">
              <i class="icon-empty-list" aria-hidden="true"></i>
              <p class="empty-case-text">이용 내역이 없어요!</p>
              <div class="add-view-btn-wrap">
                <button type="button" class="add-view-btn">
                  더보기
                  <i class="icon-arrow-down size-16" aria-hidden="true"></i>
                </button>
              </div>
              <div class="add-view-btn-wrap">
                <button type="button" class="add-view-btn">
                  11월 내역 보기
                </button>
              </div>
            </div>
          </div>
          <!-- //sec-history -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //[2026-06-17] renewal-v2 적용 — 머니 상세 (내역 없음) -->
    <!-- //wrap -->

    <!-- 보유 머니 바텀 시트 팝업 -->
    <div id="modal-money-info" class="modal modal-slide type-title money-info">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head round-btn">
            <button type="button" class="btn btn-close js-modal-close"></button>
          </div>
          <div class="modal-body">
            <dl class="bold-text-wrap">
              <dt><b>보유 머니</b></dt>
              <dd><b>0원</b></dd>
            </dl>
            <dl>
              <dt>일반 머니</dt>
              <dd>0원</dd>
            </dl>
            <dl>
              <dt>휴대폰 충전 머니</dt>
              <dd>0원</dd>
            </dl>
            <dl class="bold-text-wrap">
              <dt><b>포인트</b></dt>
              <dd><b>0원</b></dd>
            </dl>
          </div>
        </div>
      </div>
    </div>
    <!-- //보유 머니 바텀 시트 팝업 -->

    <!-- 충전하기 유도 모달 팝업 -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <p id="alertContents">
              전용통장으로 머니 관리하고 <br />이자받으세요!
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              충전하기
            </button>
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              자세히 보기
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //충전하기 유도 모달 팝업 -->

    <!-- 기간 팝업 -->
    <div
      id="modal-period"
      class="modal modal-slide type-title modal-period not-dim-close"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head round-btn">
            <button type="button" class="btn btn-close js-modal-close"></button>
          </div>
          <div class="modal-body">
            <div class="year-wrap">
              <button
                type="button"
                class="prev-btn icon-arrow-left size-20 disabled"
              >
                이전
              </button>
              <span class="year-text">2024년</span>
              <button type="button" class="next-btn icon-arrow-right size-20">
                다음
              </button>
            </div>
            <ul class="month-list-wrap">
              <li>
                <button type="button" class="active">1월</button>
              </li>
              <li>
                <button type="button">2월</button>
              </li>
              <li>
                <button type="button">3월</button>
              </li>
              <li>
                <button type="button" disabled>4월</button>
              </li>
              <li>
                <button type="button" disabled>5월</button>
              </li>
              <li>
                <button type="button" disabled>6월</button>
              </li>
              <li>
                <button type="button" disabled>7월</button>
              </li>
              <li>
                <button type="button" disabled>8월</button>
              </li>
              <li>
                <button type="button" disabled>9월</button>
              </li>
              <li>
                <button type="button" disabled>10월</button>
              </li>
              <li>
                <button type="button" disabled>11월</button>
              </li>
              <li>
                <button type="button" disabled>12월</button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- //기간 팝업 -->
  </body>
  <script>
    $(function () {
      $(window).on("scroll", function () {
        var scrollTop = $(window).scrollTop();
        var tab = $(".trade-tab-wrap");
        var tradeTabOffset = tab.hasClass("fixed")
          ? tab.data("originalOffset")
          : tab.offset().top;

        if (typeof tab.data("originalOffset") === "undefined") {
          tab.data("originalOffset", tradeTabOffset);
        }

        if (scrollTop >= tradeTabOffset - 64) {
          tab.addClass("fixed");
        } else {
          tab.removeClass("fixed");
        }
      });

      $(".tab-list button").on("click", function () {
        $(this).closest(".tab-list").find("button").removeClass("active");
        $(this).addClass("active");
      });
    });
  </script>
</html>
