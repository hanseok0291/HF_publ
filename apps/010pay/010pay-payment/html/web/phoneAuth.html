<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/join.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/commonutil.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <div class="step2">
        <!-- header -->
        <div id="header">
          <div class="container">
            <div class="header-box">
              <h2 class="page-title">
                <img class="rrpay-logo" src="../../images/web/round_pay_logo.svg" alt="RROUND PAY">
              </h2>
              <button type="button" class="btn-close">
                <i class="icon-close"></i>
              </button>
            </div>
          </div>
        </div>
        <!-- //header -->

        <!-- content -->
        <div id="content">
          <!-- container -->
          <div class="container">
            <!-- headline -->
            <div class="headline pt-0">
              <p>인증번호를 입력해 주세요</p>
            </div>
            <!-- //headline -->

            <!-- section -->
            <div class="section">
              <div class="phoneNumberWrap">
                <div class="agency">SKT</div>
                <div class="number">010-1234-5678</div>
              </div>
              <ul class="form-type">
                <!-- 에러일 경우 input-container에 label-error 클래스 추가 -->
                <li>
                  <div class="input-container label-n type-timer">
                    <input type="tel" class="custom-input" id="text3" maxlength="6" pattern="[0-9]*" placeholder=" ">
                    <label for="text3" class="floating-label">6자리 숫자 입력</label>
                    <button type="button" class="icon icon-del js-text-del"></button>
                    <div class="type-timer-box">
                        <span class="time">2:28</span>
                        <button type="button" class="btn btn-small btn-send js-btn-re">재발송</button>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
            <!-- //section -->
          </div>
          <!-- //container -->

          <!-- bottom area -->
          <div class="bottom-area">
            <!-- container -->
            <div class="container">
              <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
              <button
                type="button"
                id="nextBtn"
                class="btn"
                onclick="location.href='join_step3.html'"
              >
                다음
              </button>
            </div>
            <!-- //container -->
          </div>
          <!-- //bottom area -->
        </div>
        <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">
              인증 번호가 일치하지 않습니다.<br>확인 후 다시 입력해 주세요.
            </p>
            <!-- <p id="alertContents">
              입력시간을 초과하였습니다.<br>[재발송]을 눌러 다시 진행해 주세요.
            </p> -->
            <!-- <p id="alertContents">
              인증 번호를 재발송하였습니다.
            </p> -->
          </div>
          <div class="modal-footer">
            <!-- <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              취소
            </button> -->
            <!-- <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              다시하기
            </button> -->
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
            <!-- <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              문의하기
            </button> -->
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->
  </body>
</html>
