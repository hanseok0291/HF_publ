<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헥토파이낸셜 지불서비스</title>
<style type="text/css">
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { background-color: #fff; font-family: 'Malgun Gothic', Dotum, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; line-height: 1.5; color: #444; letter-spacing: -0.03em; word-break: keep-all; }
body, p, h1, h2, h3 { margin: 0; padding: 0; }
.wrap-error { padding: 15px 20px 20px; text-align: center; }
#content { position: relative; margin-top: 60px; }
h1 { font-family: 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif; font-size: 20px; color: #faa61a; }
h2 { margin: 10px 0 0; font-size: 25px; color: #222; }
h3 { margin: 60px 0 30px; font-size: 15px; color: #faa61a; }
.icon { position: relative; padding: 9px 0 0; width: 60px; height: 60px; margin: 0 auto; border: 2px solid #222; border-radius: 50%; background: #fff;
	-webkit-box-shadow: 0 5px 5px rgba(0, 0, 0, 0.1); -moz-box-shadow: 0 5px 5px rgba(0, 0, 0, 0.1); box-shadow: 0 5px 5px rgba(0, 0, 0, 0.1);
	font-family: 궁서, Gungsuh, Helvetica, Arial, sans-serif; font-size: 40px; color:#222; line-height: 1; }
.card { margin-top: 30px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
.card-body { padding: 20px; font-size: 15px; line-height: 1.8; }
.card-footer { padding: 16px 20px; background-color: #f8f9fa; }
.info { position: relative; padding-left: 1em; font-size: 12px; color: #9a9a9a; text-align: left; }
.info:before { content: ''; display: block; position: absolute; top: .577em; left: .154em; width: .231em; height: .231em; background-color: #9a9a9a; font-size: inherit; }
.nowrap { white-space: nowrap; }
.text-primary { color: #faa61a; }
.text-danger { color: #f43542; }
.text-secondary { color: #45a3e3; }
</style>
</head>

<body>
<!-- wrap -->
<div class="wrap-error">
	<!-- header -->
	<div id="header">
		<h1>S'pay</h1>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="content">
		<!-- headline -->
		<div class="headline">
			<p class="icon">!</p>
			<h2>시스템 오류</h2>
		</div>
		<!-- //headline -->

		<!-- seection -->
		<div class="section">
			<h3 class="text-danger">요청하신 페이지를 찾을 수 없습니다.</h3>
			<p>서비스 이용에 불편을 드려 죄송합니다.<br>
				잠시 후 다시 이용해 주세요.</p>
		</div>
		<!-- //seection -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->
</body>
</html>
