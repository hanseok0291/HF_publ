<script>
	$(document).ready(function(){
		setInterval(function(){
			btnCheck();
		}, 500);
		
		//숫자 체크
		$('[data-type="number"]').keyup(function(){
			if (this.value != this.value.replace(/[^0-9]/g, '')){
				$(this).val($(this).val().replace(/[^0-9]/g, ''));
			}
			btnCheck();
		});

		time("start");
		$("#phoneAuthNo").attr("pattern", "[0-9]*");
		$("#phoneAuthNo").attr("inputmode", "numeric");
		$(".prev").click(function(){
			$("#_method").val("authView");
			$("#frm").attr('action', '' + URL_PATH).submit();
		});

		if ($("#phoneAuthNo").val().length > 0){
			$("#phoneAuthNo").val("");
			$("#phoneAuthNo").attr("disabled", true);
			btnCheck();
		}

		if ($("#tid").val().length < 1){
			$("#phoneAuthNo").attr("disabled", true);
		}

		$("#confirmCancel").click(function(){
			agreeCancel();
		});

		$("#confirmOk").click(function(){
			if ($(this).hasClass('off')) return false;
			if ($("#phoneAuthNo").val() == ''){
				alert("인증번호를 입력해주세요.");
				return;
			}
			
			$.ajax({
				type: "post",
				url: "" + URL_PATH + "?_method=MbAuthNoCheck_rep",
				dataType: "json",
				data: {
					phoneAuthNo: $("#phoneAuthNo").val(),
					tid: $("#tid").val(),
					mobileCo: 'SKT'
				},
				success: function(data){
					if (data.code == "0000"){
						$("#phoneAuthNo").val();
						$("#_method").val("input");
						$("#frm").attr('action', '' + URL_PATH).submit();
					} else if (data.code == "9999"){
						alert(data.msg + "\n다시 입력해 주세요", function(){
							$("#phoneAuthNo").val("");
							btnCheck();
						});
					} else if (data.code == "session"){
						$("#_method").val("goErrorPage");
						$("#frm").attr('action', '' + URL_PATH).submit();
					} else {
						alert("인증번호가 일치하지 않습니다.\n다시 입력해 주세요", function(){
							$("#phoneAuthNo").val("");
							btnCheck();
						});
					}
				},
				error: function(e){
					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
				}
			});
		});

		function btnCheck(){
			var $btn = $("#confirmOk");
			if ($("#phoneAuthNo").val().length == 6){
				$btn.removeClass("off");
				$btn.addClass("on");
				$btn.attr('disabled', false);
			} else {
				$btn.removeClass("on");
				$btn.addClass("off");
				$btn.attr('disabled', true);
			}
		}
	});

	var timeStart = function(min, sec){
		interval = setInterval(function(){
			if (sec < 0){
				--min;
				sec = 59;
			}
			if (sec < 10)
				sec = "0" + sec;
			$(".time").text(min + ":" + sec);
			if (min == 0 && sec == 0){
				clearInterval(interval);
				$("#phoneAuthNo").val("");
				$("#phoneAuthNo").attr("disabled", "disabled");
				alert("인증번호 입력시간이 초과되었습니다.\n인증번호를 다시 요청합니다.", function(){
					time("stop");
					var $btn = $("#confirmOk");
					$btn.removeClass("on");
					$btn.addClass("off");
					$btn.attr('disabled', true);
					doRefleshConfirm();
				});
				return;
			}
			--sec;
		}, 1000);
	}
	var min = 2;
	var sec = 00;
	var time = function(data){
		if (data == "stop"){
			clearInterval(interval);
		} else {
			timeStart(min, sec);
		}
	}

	function refleshConfirm(){
		confirm('인증번호를 재전송하시겠습니까?', function(){
			doRefleshConfirm();
		});
	}

	function doRefleshConfirm(){
		$("#phoneAuthNo").val("");
		var $btn = $("#confirmOk");
		$btn.removeClass("on");
		$btn.addClass("off");
		$btn.attr('disabled', true);
		time("stop");
		$.ajax({
			type: "post",
			url: "" + URL_PATH + "?_method=authCheck_rep",
			dataType: "json",
			data: {
				tid: '201907301525212019073065561605',
				mobileCo: 'SKT',
				payGb: $("#payGb").val(),
				authType: 'sms',
				PCustId: $("#PCustId").val(),
				PMid: $("#PMid").val()
			},
			success: function(data){
				if (data.code == "0000"){
					time("start");
					$("#tid").val(data.msg);
					$("input[id=phoneAuthNo]").attr("disabled", false);
				} else if (data.code == "session"){
					$("#_method").val("goErrorPage");
					$("#frm").attr('action', '' + URL_PATH).submit();
				} else {
					alert(data.msg);
				}
			},
			error: function(e){
				alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
			}
		});
	}

	function agreeCancelConfirm(){
		confirm("인증을 취소하시겠습니까?", function(){
			$("#_method").val("payCancel");
			$("#frm").attr('action', '' + URL_PATH).submit();
		});
	}
</script>

<script>
	$(document).ajaxStart(function(){
		openLoading();
	});
	$(document).ajaxComplete(function(){
		closeLoading();
	});
	function openLoading(){
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
		ver = getInternetVersion("MSIE");
		if (ver < "10"){ // ie10 이하
		$('.ly_loading').addClass('ie9_after');
		}
		}
		layer_open('ly_loading');
	}
	function closeLoading(){
		layer_close();
	}
</script>
