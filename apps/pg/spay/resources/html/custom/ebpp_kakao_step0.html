        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />

        <![endif]-->
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/jquery.placeholder.min.js"></script>
        <script src="../../js/owl.carousel.min.js"></script>

        <script src="../../js/slick.min.js"></script>

        <script src="../../js/commonutil_ebpp.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap" class="wrap">
            <!-- form -->
            <form class="wrap" autocomplete="off">
                <!-- header -->
                <div id="header">
                    <div class="container">
                        <h1 class="brand-name">
                            <span class="my-logo">
                                <img src="../../images/logo-hecto.svg" alt="헥토파이낸셜" />
                            </span>
                        </h1>
                    </div>
                </div>
                <!-- //header -->

                <!-- content -->
                <div id="content">
                    <!-- container -->
                    <div class="container">
                        <h2 class="page-title">인증을 진행해주세요.</h2>

                        <p class="page-sub-title">
                            입력하신 휴대폰 번호로 인증요청 메세지를 발송하였습니다.<br />
                            카카오톡 앱에서 인증을 진행해주세요.
                        </p>

                        <!-- 인증 안내 -->
                        <div class="order-noti mt-30 list">
                            <ul>
                                <li>1. 카카오톡 앱에서 인증요청 메세지 확인</li>
                                <li>2. 인증 진행 (비밀번호, 생체인식 등)</li>
                                <li>3. 인증 완료 후 하단의 '인증완료' 버튼 클릭</li>
                            </ul>
                        </div>
                        <!-- //인증 안내 -->
                    </div>
                    <!-- //container -->
                </div>
                <!-- //content -->

                <!-- footer -->
                <div id="footer">
                    <!-- container -->
                    <div class="container">
                        <button type="button" id="send" class="btn btn-xl btn-primary">인증완료</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //footer -->
            </form>
            <!-- //form -->
        </div>
        <!-- //wrap -->

        <!-- modal - common alert -->
        <div id="commonAlert" class="modal" tabindex="-1" role="dialog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="alertTitle"></h3>
                        <div id="alertContents"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn arrow-toggle" data-dismiss="modal">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //modal - common alert -->

        <!-- modal - common confirm -->
        <div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="confirmTitle"></h3>
                        <div id="confirmContents"></div>
                    </div>
                    <div class="modal-footer type2">
                        <button type="button" class="btn" data-dismiss="modal">취소</button>
                        <button type="button" id="confirmOk" class="btn" data-dismiss="modal">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //modal - common confirm -->

        <!-- loading -->
        <div class="loading hidden">로딩 중</div>
        <!-- //loading -->

        <script>
            $(document).ready(function () {
                var $sendButton = $('#send');

                // 인증완료 버튼 클릭 이벤트
                $sendButton.on('click', function () {
                    // 인증 완료 처리 로직
                    // 예: 다음 단계로 이동하거나 인증 상태 확인
                });
            });
        </script>
    </body>
</html>
