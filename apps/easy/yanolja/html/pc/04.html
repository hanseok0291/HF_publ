<script src="../../resources/js/design.js" defer="defer"></script>

<title>간편결제</title>
<style type="text/css">
	.input_mark { position: relative; display: block; background-color: transparent; border: 0; z-index: 1; }
	.input_mark, .input_mark input { height: 58px; }
	.input_mark .mark i { display: inline-block; vertical-align: middle; width: 34px; height: 34px; margin-left: 10px; background-image: url(../../resources/css/common/images/common2.png); background-position: -113px -101px; }
	.input_mark .mark i.on { background-position: -156px -101px; }
	.pwset_area .input, .pwset_area .input_mark { margin: 35px 0 50px; }
	input.password { background:transparent ; z-index:-1; position:absolute; left:0px; border: 0px; visibility: hidden; }
</style>
</head>
<body>

<header id="header">
	<h1>주문/결제하기</h1>
	<button type="button" class="btn_cls"><i class="ico_com ico_cls">창닫기</i></button>
</header>

<div id="ct">
	<section class="pw_set step1">
		<h2>기존 비밀번호</h2>
		<p class="txt">등록하신 비밀번호를 입력해주세요.</p>
		<span class="input_mark" data-passwd="payPwd">
			<input type="password" readonly="readonly" class="tc password nppfs-npv ls focus" style="height: 70px; background-color: rgb(255, 204, 0); color: rgb(0, 0, 0);" npkencrypt="on" data-keypad-type="num" data-keypad-theme="default" maxlength="6" name="payPwd" id="payPwd" size="6" value="" nppfs-keypad-uuid="nppfs-keypad-payPwd" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_aa22a1a38fbb" nppfs-readonly="true">
			<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
			<p class="error fc_reg" style="margin-top: 15px;"></p>
		</span>
	</section>
	<section class="pw_set step2" style="display: none;">
		<h2>비밀번호 설정</h2>
		<p class="txt">결제 시 필요한 비밀번호 입니다.</p>
		<span class="input_mark" data-passwd="newPwd">
			<input type="password" readonly="readonly" class="tc password nppfs-npv ls" style="height: 70px;" npkencrypt="on" data-keypad-type="num" data-keypad-theme="default" maxlength="6" name="newPwd" id="newPwd" size="6" value="" nppfs-keypad-uuid="nppfs-keypad-newPwd" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_cf60b7e94f68">
			<span class="mark"><i id="pwd_01"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
			<p class="error fc_reg" style="margin-top: 15px;"></p>
		</span>
	</section>
	<section class="pw_set step3" style="display: none;">
		<h2>비밀번호 재설정</h2>
		<p class="txt">다시 한번 입력해주세요.</p>
		<span class="input_mark" data-passwd="newPwdConfirm">
			<input type="password" readonly="readonly" class="tc password nppfs-npv ls" style="height: 70px;" npkencrypt="on" data-keypad-type="num" data-keypad-theme="default" maxlength="6" name="newPwdConfirm" id="newPwdConfirm" size="6" value="" nppfs-keypad-uuid="nppfs-keypad-newPwdConfirm" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_a8071b508c6e">
			<span class="mark"><i id="pwd_01"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
			<p class="error fc_reg" style="margin-top: 15px;"></p>
		</span>
	</section>

	<div id="temp"></div>
</div>
<!-- //content -->

</body>
</html>
