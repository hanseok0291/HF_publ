<!DOCTYPE html>
<html lang="ko">

<head>
  <title>RROUND</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no, address=no, email=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <link rel="stylesheet" href="../../../css/jquery-ui.css" />
  <link rel="stylesheet" href="../../../css/common_renewal.css" />
  <!-- [2026-06-17] renewal-v2 stylesheet -->
  <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
  <!-- //[2026-06-17] renewal-v2 stylesheet -->
  <link rel="stylesheet" href="../../../css/pay/cardRegister.css" />
  <link rel="stylesheet" href="../../../css/web/layout.css" />
  <script src="../../../js/jquery.3.4.1.min.js"></script>
  <script src="../../../js/jquery-ui.js"></script>
  <script src="../../../js/design_renewal.js" defer="defer"></script>
  <script src="../../../js/checkbox_renewal.js"></script>
</head>

<body>
  <!-- wrap -->
  <!-- [2026-06-17] renewal-v2 적용 -->
  <div id="wrap" class="renewal-v2">
    <!-- header -->
    <div id="header">
      <div class="container">
        <div class="header-box">
          <button type="button" class="btn-back js-change-btn left-0">
            <i class="icon-back"></i>
          </button>
          <h2 class="page-title">카드 등록</h2>
        </div>
      </div>
    </div>
    <!-- //header -->

    <!-- content -->
    <div id="content">
      <!-- container -->
      <div class="container register-card-container">
        <ul class="form-type card-reg">
          <li>
            <div class="field-label-row">
              <label class="label" for="card1">카드번호</label>
              <span class="issuer-chip">
                <span class="issuer-logo">
                  <img src="../../../images/payment/samlple/card-1.png" alt="" id="cardLogo" />
                </span>
                <span class="issuer-name">신한</span>
              </span>
            </div>
            <div class="input-container type-line">
              <div class="card-number-wrap">
                <div class="col-box">
                  <input type="tel" class="custom-input" id="card1" maxlength="4" placeholder="0000" />
                  <span class="card-dash" aria-hidden="true"></span>
                  <input type="tel" class="custom-input" id="card2" maxlength="4" placeholder="0000" />
                  <span class="card-dash" aria-hidden="true"></span>
                  <input type="password" class="custom-input" id="card3" maxlength="4" placeholder="0000" />
                  <span class="card-dash" aria-hidden="true"></span>
                  <input type="password" class="custom-input" id="card4" maxlength="4" placeholder="0000" />
                </div>
              </div>
            </div>
            <span class="helper-text">이미 등록된 카드예요</span>
            <!-- <span class="helper-text">카드번호를 확인해 주세요</span> -->
          </li>
          <li>
            <label class="label" for="expiry">유효기간</label>
            <div class="input-container type-line">
              <input type="password" id="expiry" placeholder="MM/YY" class="custom-input" maxlength="4" />
              <button type="button" class="icon icon-del js-text-del"></button>
            </div>
            <span class="helper-text">유효기간을 확인해 주세요</span>
          </li>
          <li>
            <label class="label" for="text_05">CVC</label>
            <div class="input-container type-line">
              <input type="password" class="custom-input" placeholder="3자리 숫자" id="text_05" maxlength="3" />
              <button type="button" class="icon icon-del js-text-del"></button>
            </div>
            <span class="helper-text">CVC 번호를 확인해 주세요</span>
          </li>
          <li>
            <label class="label" for="text_06">비밀번호</label>
            <div class="input-container type-line">
              <input type="password" class="custom-input" placeholder="앞 2자리 숫자" id="text_06" maxlength="2" />
              <!-- <input type="password" class="custom-input" placeholder="4자리 숫자" id="text_06" maxlength="4" /> -->
              <button type="button" class="icon icon-del js-text-del"></button>
            </div>
            <span class="helper-text">비밀번호를 확인해 주세요</span>
          </li>
        </ul>
        <!-- bottom area -->
        <div class="bottom-area">
          <!-- container -->
          <div class="container">
            <!-- <button id="send" class="btn" onclick="window.location.href='./registerCard_step3.html'">확인</button> -->
            <button id="send" class="btn" onclick="modalOpenSlide('modal-select-title2')">
              확인
            </button>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //container -->
    </div>
    <!-- //content -->
  </div>
  <!-- //[2026-06-17] renewal-v2 적용 -->
  <!-- //wrap -->

  <!-- common alert -->
  <div id="commonAlert" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <h3 id="alertTitle">카드사 점검 시간이에요</h3>
          <p id="alertContents">잠시후 다시 시도해 주세요</p>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="modalCloseAlert();" class="btn btn-confirm">
            확인
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- //common alert -->

  <!-- common alert -->
  <div id="commonAlert" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <h3 id="alertTitle">본인 명의의 카드만 등록할 수 있어요</h3>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="modalCloseAlert();" class="btn btn-confirm">
            확인
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- //common alert -->

  <!-- common alert -->
  <div id="commonAlert" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <h3 id="alertTitle">변경 시 입력한 내용이 모두 사라져요</h3>
          <p id="alertContents">그래도 변경할까요?</p>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="modalCloseAlert();" class="btn btn-cancel">
            취소
          </button>
          <button type="button" onclick="modalCloseAlert();" class="btn btn-confirm">
            확인
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- //common alert -->

  <!-- common alert -->
  <div id="commonAlert" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <h3 id="alertTitle">등록이 완료되지 않았어요</h3>
          <p id="alertContents">카드 등록을 중단하시겠어요?</p>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="modalCloseAlert();" class="btn btn-cancel">
            중단하기
          </button>
          <button type="button" onclick="modalCloseAlert();" class="btn btn-confirm">
            계속하기
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- //common alert -->

  <!-- 카드 등록 약관 동의 -->
  <div id="modal-agree-terms" class="modal modal-slide modal-agree type-title type2">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-head">
          <p class="modal-head-title">카드등록을 위해 약관 동의가 필요해요</p>
          <button type="button" class="btn btn-close js-modal-close">
            <i class="icon-close"></i>
          </button>
        </div>
        <div class="modal-body">
          <!-- 전체 동의 체크박스 -->
          <div class="check-all-box container terms-list-box">
            <!-- 체크, 접힌상태면 open 클래스 제거 -->
            <div class="check-all top open">
              <span class="checkbox">
                <input type="checkbox" name="checkbox_all2" id="checkbox_all2" />
                <label for="checkbox_all2">약관 전체 동의</label>
              </span>
              <!-- 체크, 접힌상태면 open 클래스 제거 -->
              <button type="button" class="btn-toggle open"></button>
            </div>
          </div>
          <!-- 전체 동의 체크박스 -->
          <div class="container">
            <div class="terms-wrap">
              <ul class="terms-list terms-block-list">
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input type="checkbox" id="checkbox_group3_1" />
                      <label for="checkbox_group3_1">(필수) 개인정보 수집·이용 동의
                        <button type="button" class="arrow-right js-open-terms" onclick="modalOpen('noticeDetail')"
                          data-toggle="modal" data-target="#noticeDetail"></button></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input type="checkbox" id="checkbox_group3_2" />
                      <label for="checkbox_group3_2">(필수) 개인정보 제3자 제공 동의
                        <button type="button" class="arrow-right js-open-terms" onclick="modalOpen('noticeDetail')"
                          data-toggle="modal" data-target="#noticeDetail"></button></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input type="checkbox" id="checkbox_group3_3" />
                      <label for="checkbox_group3_3">(필수) 개인정보 제3자 제공 동의(카드사)
                        <button type="button" class="arrow-right js-open-terms" onclick="modalOpen('noticeDetail')"
                          data-toggle="modal" data-target="#noticeDetail"></button></label>
                    </span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <!-- 동의하기 버튼 -->
          <div class="modal-footer">
            <button type="button" id="btn-agree1" class="btn-confirm disabled js-modal-close" disabled>
              동의하고 계속하기
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- //카드 등록 약관 동의 -->
</body>
<script>
  $(document).ready(function () {
    modalOpenSlide("modal-agree-terms");
    // input-container에 label-error 또는 text-error가 있을 때 input 클릭 처리
    $(".input-container.label-error, .input-container.text-error").each(
      function () {
        var $container = $(this);
        var $inputs = $container.find("input.custom-input");

        // 각 input에 focus 이벤트 추가
        $inputs.on("focus", function () {
          var $input = $(this);
          var $parentContainer = $input.closest(".input-container");

          // 에러 클래스가 있으면 처리
          if (
            $parentContainer.hasClass("label-error") ||
            $parentContainer.hasClass("text-error")
          ) {
            // 클릭한 input의 value 초기화
            $input.val("");

            // 에러 클래스 제거
            $parentContainer.removeClass("label-error text-error");
          }
        });
      }
    );

    // 모든 input 클릭 시 해당 위치로 스크롤 이동
    $(".card-reg input").on("click", function () {
      this.scrollIntoView({ block: "center" });
    });
  });
</script>

</html>
