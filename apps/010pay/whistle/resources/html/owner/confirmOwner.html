<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p class="medium">아래 계좌로 1원을 보냈습니다</p>
					<p><strong>입금자명을 입력</strong>하세요</p>
				</div>
				<!-- //headline -->

				<!-- 거래내역 예시 -->
				<div class="section account-auth">
					<div class="account-box">
						<span class="account-number">
							<span class="logo"><img src="../../images/bank/logo_090.png" alt="카카오뱅크"></span>
							<span class="name">카카오뱅크</span>
							<span class="number">1234</span>
						</span>
					</div>
					<div class="account-box detail">
						<div class="left">
							<p class="label">입금자명</p>
							<p class="value text-error">
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
							</p>
						</div>
						<div class="right">
							<p class="label">입금금액</p>
							<p class="value">1<span>원</span></p>
						</div>
					</div>
				</div>
				<!-- //거래내역 예시 -->

				<!-- 정보 입력 -->
				<div class="section">
					<div class="input input-box">
						<label for="" class="label">입금자명</label>
						<input type="text" placeholder="입금자명 4자리 입력">
					</div>
				</div>
				<!-- //정보 입력 -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- button area -->
					<div class="btn-area">
						<button type="button" id="send" class="btn btn-submit" disabled>확인</button>
					</div>
					<!-- //button area -->
				</div>
				<!-- container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<div id="promptContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<!-- default script -->
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</body>
</html>
