<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>내통장결제</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/owl.carousel.min.css" />
    <link rel="stylesheet" href="../../css/common.css?ezauthver=5.5" />
    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/jquery.ui.touch-punch.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
    <script src="../../js/commonmsg.js?ezauthver=5.0"></script>
    <script src="../../js/commonutil.js?ezauthver=5.0"></script>
  </head>
  <body>
    <!-- form -->
    <form class="main_form" action="javascript: void(0);" autocomplete="off">
      <!-- wrap -->
      <div id="wrap" class="wrap">
        <!-- header -->
        <div id="header">
          <div class="container">
            <button type="button" id="btnBack" class="btn-back hidden">
              <i class="icon-angle-left">뒤로가기</i>
            </button>
            <h1 class="brand-name">
              <a href="#"
                ><span class="my-logo"
                  ><img
                    src="../../images/logo-myaccount.png"
                    class="logo"
                    alt="내통장결제" /></span
              ></a>
            </h1>
            <h2 class="page-title hidden">결제</h2>
            <button type="button" id="closeWindow" class="btn-close">
              <i class="icon-times">창닫기</i>
            </button>
          </div>
        </div>
        <!-- //header -->

        <!-- content -->
        <div id="content" class="exStyle newType loading">
          <!-- container -->
          <div class="container">
            <!--  -->
            <div class="loading-container">
              <!-- 로딩 스피너 -->
              <div class="loading-spinner"></div>

              <!-- 안내 텍스트 -->
              <div class="loading-text ">
                화면을 벗어나면
                <strong>
                  결제 실패 <br />
                  또는 중복 결제</strong
                >가 발생할 수 있습니다.
              </div>
              <br />
              <div class="loading-text">안전한 결제를 위해</div>
              <div class="loading-text"><strong>최대 30초 이상 소요</strong>될 수 있으니</div>
              <div class="loading-text">잠시만 기다려 주십시오.</div>
            </div>
            <!--  -->
          </div>
          <!-- //container -->
        </div>
        <!-- //content -->
      </div>
      <!-- //wrap -->
    </form>
    <!-- //form -->

    <script>
      $(document).ready(function () {});
    </script>
  </body>
</html>
