<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/plcc/terms.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/checkbox_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="terms-wrap">
      <div id="modal-terms-check" class="modal modal-slide type-title not-dim-close modal-terms-check type5">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-head">
              <p class="modal-head-title">
                카드 발급을 위해 약관에 동의해 주세요 
              </p>
              <button type="button" class="btn btn-close">
                <i class="icon-close"></i>
              </button>
            </div>
            <div class="modal-body">
              <!-- 첫 번째 약관 그룹 -->
              <div data-group="all">
                <div class="terms-wrap container mb16" data-group="group1_1">
                  <div class="check-all">
                    <span class="checkbox">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_all"
                        data-group="group1_1"
                        checked
                      />
                      <label for="checkbox1_group1_all">
                        RROUND PAY 서비스 이용약관
                      </label>
                    </span>
                    <!-- 체크, 접힌 상태면 open 클래스 제거 -->
                    <button
                      type="button"
                      class="btn-toggle"
                      data-group="group1_1"
                    ></button>
                  </div>
                  <ul class="terms-list terms-block-list" data-group="group1_1">
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group1_1"
                            data-group="checkbox1_group1"
                            checked
                          />
                          <label for="checkbox1_group1_1">
                            라운드 페이 서비스 이용약관
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group1_2"
                            data-group="checkbox1_group1"
                            checked
                          />
                          <label for="checkbox1_group1_2">
                            라운드 페이 머니 · 포인트 이용약관
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group1_3"
                            data-group="checkbox1_group1"
                            checked
                          />
                          <label for="checkbox1_group1_3">
                            전자금융거래 이용약관
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group1_4"
                            data-group="checkbox1_group1"
                            checked
                          />
                          <label for="checkbox1_group1_4">
                            전자금융거래 이용약관
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                    <!-- 비회원 약관 -->
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group1_5"
                            data-group="checkbox1_group1"
                            checked
                          />
                          <label for="checkbox1_group1_5">
                            개인정보 제3자 제공 및 위탁 동의
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                  </ul>
                </div>
                <div class="terms-wrap container mb16" data-group="group1_2">
                  <div class="check-all">
                    <span class="checkbox">
                      <input
                        type="checkbox"
                        id="checkbox1_group2_all"
                        data-group="group1_2"
                        checked
                      />
                      <label for="checkbox1_group2_all">
                        카드 발급 이용약관
                      </label>
                    </span>
                    <!-- 체크, 접힌 상태면 open 클래스 제거 -->
                    <button
                      type="button"
                      class="btn-toggle"
                      data-group="group1_2"
                    ></button>
                  </div>
                  <ul class="terms-list terms-block-list" data-group="group1_2">
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group2_1"
                            data-group="checkbox1_group2"
                            checked
                          />
                          <label for="checkbox1_group2_1">
                            롯데카드 개인정보 제 3자 제공 동의
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                    <li>
                      <div class="checkbox-block-group">
                        <span class="checkbox child">
                          <input
                            type="checkbox"
                            id="checkbox1_group2_2"
                            data-group="checkbox1_group2"
                            checked
                          />
                          <label for="checkbox1_group2_2">
                            RROUND PAY 개인정보 제 3자 제공 동의
                            <button
                              type="button"
                              class="arrow-right js-open-terms"
                              onclick="modalOpen('noticeDetail')"
                              data-toggle="modal"
                              data-target="#noticeDetail"
                            ></button>
                          </label>
                        </span>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" id="btn-agree4" class="btn-confirm" disabled>
                동의하고 계속하기
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //wrap -->
  </body>
</html>
