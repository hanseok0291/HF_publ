<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <title>헥토파이낸셜</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/card_guide.css" />
    <script src="../js/jquery-1.8.3.min.js"></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/aml.js" defer></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="card-guide">
      <!-- header -->
      <header class="header">
        <div class="container">
          <button type="button" class="btn-close btn" aria-label="닫기"></button>
        </div>
      </header>
      <!-- //header -->

      <!-- section -->
      <section>
        <!-- container -->
        <div id="content" class="container">
          <div class="tit-wrap">
            <!-- tit -->
            <h1 class="tit">
              홍길동님,<br />
              이제 카드를 만들어보세요
            </h1>
            <!-- //tit -->
            <p class="desc">
              <strong>선불 서비스 가입</strong>이 끝났어요.<br />
              카드 만들고 30% 소득공제 혜택을 받아보세요.
            </p>
          </div>

          <!-- card-visual -->
          <figure class="card-visual">
            <img src="../images/bithumb/card-front-master.png" alt="헥토파이낸셜 선불 카드" />
          </figure>
          <!-- //card-visual -->
        </div>
        <!-- //container -->

        <!-- footer -->
        <div id="footer">
          <div class="btn-wrap">
            <button type="button" class="btn btn-default">카드 만들기</button>
          </div>
          <div class="sub-action">
            <button type="button" class="btn-skip">다음에 하기</button>
          </div>
        </div>
        <!-- //footer -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->
  </body>
</html>
