<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">휘슬 상품권</h2>
            <button
              type="button"
              class="right-0"
              onclick="modalOpenSlide('modal-whistlegift-info')"
            >
              <i class="icon-info-circle"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container transform-container">
          <div class="transform-wrap">
            <p>전환 가능 금액</p>
            <p class="bold-text">100,000원</p>
          </div>
        </div>
        <!-- container -->
        <div class="container charge-container">
          <div class="input-wrap">
            <div class="input-container label-n charge-input">
              <input
                type="tel"
                class="custom-input"
                placeholder=" "
                id="chargeAmount"
              />
              <label for="chargeAmount" class="floating-label"
                >전환 금액</label
              >
              <div class="fake-label">
                <p class="number"></p>
                <span class="unit">원</span>
              </div>
              <button type="button" class="icon icon-del js-text-del"></button>
            </div>
            <p class="charge-info-text">머니 충전 예정 금액: 0원 (수수료 5% 차감)</p>
          </div>
          <div class="charge-money-wrap">
            <dl>
              <dt>충전 후 보유 머니<i class="icon-money"></i></dt>
              <dd>100,000원</dd>
            </dl>
          </div>
        </div>
        <!-- //container -->
        <!-- bottom area -->
        <div class="bottom-area">
          <!-- container -->
          <div class="container">
            <button type="button" class="btn" disabled>전환하기</button>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <!-- 휘슬 상품권 머니 전환 안내 팝업 -->
    <div id="modal-whistlegift-info" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">휘슬 상품권 머니 전환 안내</p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="note-wrap">
                <li>
                  최소 충전 금액은 1,000원 입니다.
                </li>
                <li>
                  머니 전환 시, 휘슬이 부과하는 5%의 사용수수료를 차감한 금액만 전환됩니다.
                </li>
                <li>
                  충전 한도는 1회 50만원, 일 100만원, 월 최대 200만원까지 전환할 수 있습니다.
                </li>
                <li>전환 완료 시 취소할 수 없으며 전환된 PAY 머니의 이용정책을 따릅니다.</li>
              </ul>
              <div class="info-wrap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //휘슬 상품권 머니 전환 안내 팝업 -->

  </body>
  <script>
    var input_value = 0;
    var transform_min = 1000; // 최소 전환 한도
    $(".charge-input input").on("input", function () {
      var $this = $(this);
      var $this_wrap = $this.closest(".charge-input");
      var $label = $this_wrap.find(".floating-label");
      var maxlength = 15; // 최대 입력 길이

      // 현재 입력된 값 가져오기 (숫자만 허용)
      var input_value = $this.val().replace(/[^0-9]/g, ""); // 숫자만 남기기

      // 입력 값이 최대 길이를 초과하면 잘라냄
      if (input_value.length > maxlength) {
        input_value = input_value.substring(0, maxlength); // 잘라냄
      }

      // 쉼표 추가 (금액 형식으로 변환)
      var formatted_value = input_value.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

      $this.val(formatted_value); // 형식화된 값으로 업데이트

      // 에러 클래스 초기화
      $this_wrap.removeClass("error");
      $this_wrap.find(".fake-label .number").text(formatted_value);

      if (input_value > 0) {
        $this_wrap.find(".fake-label .unit").show();
      } else {
        $this_wrap.find(".fake-label .unit").hide();
      }

      if (input_value < transform_min) {
        $this_wrap.addClass("error");
        $label.text("최소 1천원 이상 전환 가능해요");
      } else if (input_value >= 0) {
        // 정상 입력
        $label.text("전환 금액");
      }

      if (!input_value) {
        input_value = 0;
      }
    });

    $(".charge-input input").on("focus", function () {
      var $this = $(this);
      var $this_wrap = $this.closest(".charge-input");
      var $label = $this_wrap.find(".floating-label");
      var input_value = $this.val(); // 입력된 값 확인

      if (input_value.length === 0) {
        // 입력값이 없으면 "전환 금액"으로 설정
        $label.text("전환 금액");
      }
      // 입력값이 있는 경우 기존 상태 유지 (아무 작업도 하지 않음)
    });

    $(".charge-input input").on("blur", function () {
      var $this = $(this);
      var $label = $this.closest(".charge-input").find(".floating-label");
      var input_value = $this.val(); // 입력된 값 확인

      if (input_value.length === 0) {
        // 입력값이 없으면 "전환 금액"로 설정
        $label.text("전환 금액");
      }
    });

    $(".charge-input .js-text-del").on("mousedown", function () {
      var $this = $(this);
      var $this_wrap = $this.closest(".charge-input");
      var $label = $this.closest(".charge-input").find(".floating-label");
      input_value = 0;
      $(".fake-label .number").text(input_value);
      $this_wrap.removeClass("error");
      $(".fake-label .unit").hide();
      $label.text("전환 금액");
    });

  </script>
</html>
