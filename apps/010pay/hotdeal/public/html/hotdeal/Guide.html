<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>핫딜</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

	<!-- styles -->
	<link rel="stylesheet" href="../../../styles/hotdeal/slick.min.css">
	<link rel="stylesheet" href="../../../styles/globals.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Common.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Layout.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Guide.module.css">
	<!-- //styles -->

	<!-- script -->
	<script src="../../js/hotdeal/jquery-1.8.3.min.js"></script>
	<script src="../../js/hotdeal/slick.min.js"></script>
	<!-- //script -->
</head>

<body>
	<!-- wrap -->
	<div class="wrap">
		<!-- header -->
		<div class="pageHeader subHeader">
			<div class="container">
				<button type="button" class="btnIcon btnBack">뒤로 가기</button>
				<h1 class="pageTitle">핫딜 안내</h1>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div class="guideContent">
			<!-- guideSlideBox -->
			<div class="guideSlideBox">
				<div class="guideSlide">
					<div class="container guideSlideBox">
						<div class="guideTitBox">
							<h2 class="guideTitle"><img src="../../images/hotdeal/logo-010pay-color.svg" class="imgLogo" alt="010PAY"> <strong class="highlight">핫딜</strong>?</h2>
							<p class="guideTxt">010PAY를 이용해주시는 회원님께<br>
								감사의 마음으로 준비한 혜택입니다</p>
						</div>
						<div class="guideImg gift"></div>
					</div>
					<div class="container guideSlideBox">
						<div class="guideTitBox">
							<h2 class="guideTitle">한 달에 <strong class="highlight">두 번</strong><i class="italic">!</i></h2>
							<p class="guideTxt">2주, 4주 째 화요일 핫딜이 열려요<br>
								일정 기간동안 핫딜에 참여할 수 있어요</p>
						</div>
						<div class="guideImg time"></div>
					</div>
					<div class="container guideSlideBox">
						<div class="guideTitBox">
							<h2 class="guideTitle">엄선된 상품을 <strong class="highlight">0원</strong>에</h2>
							<p class="guideTxt">트렌드, 품질 모두 고려하여 고급 상품만을 엄선합니다<br>
								가격은 진짜 0원이에요<i class="italic">!</i></p>
						</div>
						<div class="guideImg zero"></div>
					</div>
					<div class="container guideSlideBox">
						<div class="guideTitBox">
							<h2 class="guideTitle"><strong class="highlight">응모 조건</strong> 없이</h2>
							<p class="guideTxt">010PAY 회원이면 누구나 응모할 수 있고<br>
								준비된 수량만큼 당첨자를 랜덤 추첨합니다</p>
						</div>
						<div class="guideImg free"></div>
					</div>
				</div>
			</div>
			<!-- //guideSlideBox -->

			<!-- guideList -->
			<ul class="container guideList">
				<li><a href="#"><span class="dt">핫딜 자주 묻는 질문</span></a></li>
				<li><a href="tel:16005220"><span class="dt">핫딜 문의</span> <span class="dd tel">1600-5220</span></a>
				</li>
			</ul>
			<!-- //guideList -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->

	<script>
		$('.guideSlide').slick({
			dots: true,
			infinite: true,
			arrows: false,
			autoplay: true,
			autoplaySpeed: 2000
		});
	</script>
</body>
</html>
