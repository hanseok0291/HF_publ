<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title">생체정보 등록</h2>
                        <button type="button" class="btn-close js-change-btn" data-message="창을 닫으시면 결제가 취소됩니다.<br>종료하시겠습니까?" data-cancel="취소" data-confirm="확인">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!--  -->
                <div id="passwordSet" class="">
                    <div class="password-wrap">
                        <div>
                            <div class="content-wrap">
                                <div class="bio-reg-wrap">
                                    <i class="icon-face"></i>
                                    <p class="bio-reg-text">생체정보를 등록 완료!</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- //container -->

                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <a href="#" class="btn">주문화면으로 돌아가기</a>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->
    </body>
</html>
