<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- css -->
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">

<!-- javascript -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
</head>

<body>
<!-- IE 브라우저 지원 안내 -->
<!--[if lte IE 10]>
<div class="info-ie-update">
	<div class="container">
		<h2>브라우저를 업데이트해 주세요.</h2>
		<p>안전한 결제 환경을 위해 크롬, 엣지 또는<br> Internet Explorer 10 이상을 이용해 주세요.</p>
		<p class="btn-area">
			<a href="http://www.google.com/chrome" target="_blank" class="btn">크롬 설치</a>
			<a href="http://windows.microsoft.com/ko-kr/internet-explorer/download-ie" target="_blank" class="btn">엣지 설치 / IE 업데이트</a>
		</p>
	</div>
</div>
<![endif]-->
<!-- //IE 브라우저 지원 안내 -->

<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">본인 인증</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main>
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<h2 class="headline"><strong>전송받은 인증번호를<br>
					입력해 주세요.</strong></h2>
				<!-- //headline -->

				<!-- section -->
				<section>
					<h3 class="hidden">정보 입력</h3>
					<!-- form area -->
					<div class="form-area">
						<div class="form-group">
							<label class="form-label">인증번호</label>
							<span class="time">
								<input type="tel" class="form-control" maxlength="6" placeholder="인증번호 6자리 입력">
								<span class="timer"><i class="icon icon-clock"></i> 02:59</span>
							</span>
							<div class="text-error"></div>
						</div>
					</div>
					<!-- //form area -->
					<p class="text-center mgt30"><button type="button" class="btn">인증번호 재전송</button></p>
				</section>
				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->

		<!-- footer -->
		<footer>
			<!-- container -->
			<div class="container">
				<button type="button" id="submit" class="btn btn-lg btn-primary shadow" disabled>다음</button>
			</div>
			<!-- //container -->
		</footer>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title">알림</h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title">안내</h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
$(document).ready(function(){
	// PASS 선택 시 캡챠 미노출
	function captchaYn(){
		var $checkItem = $('.check-slider > input[type="radio"]').eq(0);
		if($checkItem.is(':checked')){
			$('#captcha').show();
		} else {
			$('#captcha').hide();
		}
	}
	captchaYn();
	$('.check-slider').click(function(){
		captchaYn();
	});
});
</script>
</body>
</html>
