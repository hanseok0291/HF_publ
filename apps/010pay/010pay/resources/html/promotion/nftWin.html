<body>
<!-- wrap -->
<div id="wrap" class="wrap-v2">
	<!-- content -->
	<div id="content" class="content-promotion promotion-nft win animation-section">
		<!-- section - visual -->
		<div class="section section0 section-visual">
			<div class="section-content">
				<div class="promotion-img bg ani-slide-1"><img src="../../images/promotion/nft/win-visual-bg.png" alt="한정판 NFT 지급 이벤트"></div>
				<h1 class="promotion-img title ani-slide-2"><img src="../../images/promotion/nft/win-visual-title.png" alt="축하합니다! 나만의 NFT 토끼 당첨되셨어요!"></h1>
				<p class="promotion-img nft"><img src="../../images/promotion/nft/win-visual-nft.png" class="ani-slide-3" alt="삐삐"></p>
				<p class="promotion-img bubble ani-fade-5"><img src="../../images/promotion/nft/win-visual-bubble.png" class="animation-bounce" alt="만나서 반가워 삐!"></p>
			</div>
		</div>
		<!-- //section - visual -->

		<!-- section - info -->
		<div class="section last section-info">
			<div class="container">
				<h2 class="section-title ani-slide-5"><span class="gradient">NFT 수령 안내</span></h2>
				<div class="section-content">
					<ul>
						<li class="ani-slide-6">
							<strong class="num">1</strong>
							<span class="text-lg">토끼 NFT 수령을 위해 먼저<br>
								<strong>카이카스 지갑을 준비</strong>해 주세요.</span><br>
							<span class="text-sm">* 카이카스 지갑 주소 미보유 시 NFT 수령 불가</span><br>
							<a href="https://youtu.be/--FtsEWrNLA" target="_blank" class="btn-mov">지갑 생성법 알아보기</a>
						</li>
						<li class="ani-slide-7">
							<strong class="num">2</strong>
							<span class="text-lg">아래의 버튼을 눌러<br>
								<strong>카이카스 지갑 주소를 입력</strong>해 주세요.</span><br>
							<span class="text-sm">* 당첨일로부터 30일 내<br>
								지갑 주소 미입력 시 당첨 취소</span>
						</li>
						<li class="ani-slide-8">
							<strong class="num">3</strong>
							<span class="text-lg">한정판 NFT 토끼는 입력하신<br>
								지갑 주소로 <strong>입력일 기준 그 다음 주<br>
									금요일에 지급</strong>됩니다.</span><br>
							<span class="text-sm">(단, 지급일이 휴일인 경우 익영업일 지급)</span>
						</li>
					</ul>
				</div>
			</div>
		</div>
		<!-- //section - info -->

		<!-- footer button area -->
		<div class="footer-btn">
			<div class="container">
				<button type="button" class="btn">카이카스 지갑 주소 입력하기 <i class="icon-arrow"></i></button>
			</div>
		</div>

	</div>

</div>
<!-- //wrap -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
$(document).ready(function(){
	var winHeight = $(window).height();
	var scrollTop = $(window).scrollTop();

	// 섹션 활성 - 애니메이션 시작
	function sectionActive(){
		// section active
		$(".section").each(function(){
			var sectionTop = $(this).offset().top;
			if (scrollTop > sectionTop - winHeight + winHeight/3) {
				$(this).addClass("active");
			}
		});
	}

	function sectionAni(){
		// 로드 시(스크롤 전) 섹션 active
		sectionActive();

		$(window).scroll(function(){
			winHeight = $(window).height();
			scrollTop = $(this).scrollTop();

			// 스크롤 최하단일 경우 하단 버튼 배경 제거
			var scrollMax = $("#content").innerHeight() - $(window).innerHeight() - 100;
			if (scrollTop > scrollMax) {
				$(".footer-btn").addClass("bottom");
			} else {
				$(".footer-btn").removeClass("bottom");
			}

			sectionActive();
		});
	}

	sectionAni(); // 섹션 애니메이션

	$(window).resize(function(){
		sectionAni(); // 섹션 애니메이션
	});
});
</script>
</body>
</html>
