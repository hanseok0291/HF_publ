<!DOCTYPE html>
<html lang="ko" class="wf-notosans-n4-active wf-active" style="font-size: 73.24%;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/site.css">
<script src="../js/jquery-1.8.3.min.js"></script>
<script src="../js/webfont.js"></script>
<script src="../js/design.js" defer="defer"></script>

<title>간편결제</title>

</head>
<body>

<header id="header">
	 
       		
	  	
	  		<h1>신규/추가 등록</h1>
	  		
	  
</header>

<div id="ct">	
	<fieldset class="form_type mt0">
		<legend>인증번호 입력폼</legend>
		<ul>
			<li class="cau">문자로 받은 인증번호를 입력해주세요.</li>
			<li class="numskip">
				<span class="input"><input type="tel" data-type="number" name="phoneAuthNo" id="phoneAuthNo" placeholder="인증번호(숫자6자리)" maxlength="6" pattern="[0-9]*" inputmode="numeric"></span>
				<b class="time">3:00</b>
				<button type="button" onclick="refleshConfirm();" class="btn_renum" id="reScCheck">인증번호재전송</button>
			</li>
		</ul>
	</fieldset>
	<ul class="btn_area2 v1">
		<li class="bt1"><button type="button" onclick="" class="btn_xr btn_type2">취소</button></li>
		<li class="bt2"><button type="button" id="confirmOk" name="confirmOk" class="btn_xr btn_type off">확인</button></li>
	</ul>
</div>
<!-- //content -->
</form>


<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>


</body></html>
