<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/pay/charge.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-close js-change-btn">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container kyc">
          <div class="complete-text">
            <i class="lottie-check"></i>
            <p>
              고객님의 정보 확인이<br />
              완료되었어요!
            </p>
            <p class="small-text">
              이제 라운드 페이를 더 다양하게<br />
              이용할 수 있어요
            </p>
          </div>
          <div class="gray-box">
            <ul class="label-list">
              <li>라운드 페이 머니 200만원 보유 가능</li>
              <li>라운드 페이 머니 자유롭게 출금 가능</li>
            </ul>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">확인</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
      <!-- //content -->
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {
      // 로티 완료
      let svgContainer = document.querySelector(".lottie-check");

      let animItem = bodymovin.loadAnimation({
        wrapper: svgContainer,
        animType: "svg",
        loop: false,
        path: "https://ux.sbsvc.online/010pay/010pay-payment/images/lottie/check.json",
      });
    });
  </script>
</html>
