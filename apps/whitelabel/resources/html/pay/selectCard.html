<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- css -->
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">

<!-- javascript -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
</head>

<body>
<!-- IE 브라우저 지원 안내 -->
<!--[if lte IE 10]>
<div class="info-ie-update">
	<div class="container">
		<h2>브라우저를 업데이트해 주세요.</h2>
		<p>안전한 결제 환경을 위해 크롬, 엣지 또는<br> Internet Explorer 10 이상을 이용해 주세요.</p>
		<p class="btn-area">
			<a href="http://www.google.com/chrome" target="_blank" class="btn">크롬 설치</a>
			<a href="http://windows.microsoft.com/ko-kr/internet-explorer/download-ie" target="_blank" class="btn">엣지 설치 / IE 업데이트</a>
		</p>
	</div>
</div>
<![endif]-->
<!-- //IE 브라우저 지원 안내 -->

<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">결제 수단 등록</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main class="no-footer">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<h2 class="headline"><strong>카드 등록을 위해 카드사를 선택해 주세요.</strong></h2>
				<!-- //headline -->

				<!-- section -->
				<section>
					<h3 class="hidden">은행 선택</h3>
					<!-- bank list -->
					<ul class="bank-list bank-list-new">
						<li>
							<button type="button" name="01" disabled> <!-- 등록된 은행 [disabled] -->
								<span class="logo"><img src="../../images/logo/card/logo_01.png" alt="신한카드"></span>
								<span class="name">신한카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="02">
								<span class="logo"><img src="../../images/logo/card/logo_02.png" alt="삼성카드"></span>
								<span class="name">삼성카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="03">
								<span class="logo"><img src="../../images/logo/card/logo_03.png" alt="현대카드"></span>
								<span class="name">현대카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="04">
								<span class="logo"><img src="../../images/logo/card/logo_04.png" alt="롯데카드"></span>
								<span class="name">롯데카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="05">
								<span class="logo"><img src="../../images/logo/card/logo_05.png" alt="우리카드"></span>
								<span class="name">우리카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="06">
								<span class="logo"><img src="../../images/logo/card/logo_06.png" alt="하나카드"></span>
								<span class="name">하나카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="07">
								<span class="logo"><img src="../../images/logo/card/logo_07.png" alt="BC카드"></span>
								<span class="name">BC카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="08">
								<span class="logo"><img src="../../images/logo/card/logo_08.png" alt="국민카드"></span>
								<span class="name">국민카드</span>
							</button>
						</li>
						<li>
							<button type="button" name="09">
								<span class="logo"><img src="../../images/logo/card/logo_09.png" alt="NH농협"></span>
								<span class="name">NH농협</span>
							</button>
						</li>
					</ul>
					<!-- //bank list -->
					 <div class="notice-wrap">
						<p class="notice-title">찾으시는 카드사가 없나요? </p>
						<ul class="notice-list">
							<li>
								<span class="notice-text">BC 브랜드 카드 : 카드에 BC마크가 있거나 제휴사(수협, 광주, 전북은행 등)에서 발급했다면 ‘비씨카드’를 선택해주세요. </span>
							</li>
							<li>
								<span class="notice-text">토스뱅크 카드: 토스뱅크 카드는 ‘하나카드’를 선택하여 등록해주세요.</span>
							</li>
							<li>
								<span class="notice-text">국민/농협카드: 서비스 지원 예정입니다. 불편을 끼쳐드려 죄송합니다.</span>
							</li>
						</ul>
					 </div>
				</section>
				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title">알림</h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title">안내</h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	// active bank button
	$('.bank-list button').click(function(){
		$('.bank-list button').removeClass('active');
		$(this).addClass('active');
	})
</script>
</body>
</html>
