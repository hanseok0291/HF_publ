<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>핫딜</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

	<!-- styles -->
	<link rel="stylesheet" href="../../../styles/globals.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Common.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Layout.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/ShareEvent.module.css">
	<!-- //styles -->

	<!-- script -->
	<script src="../../js/hotdeal/jquery-1.8.3.min.js"></script>
	<!-- //script -->
</head>

<body>
	<!-- wrap -->

	<div class="wrap">
		<!-- header -->
		<div class="pageHeader subHeader">
			<div class="container">
				<button type="button" class="btnIcon btnBack">뒤로 가기</button>
				<h1 class="pageTitle">내 당첨확률</h1>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div class="shareEventContent">
			<!-- container -->
			<div class="container">
				<!-- event headline -->
				<div class="eventHeadline">
					<p class="productImg"><img src="../../images/hotdeal/sample/product-00.png" alt="상품 이미지"></p>
					<p class="productName">AirPods 3세대 AirPods 3세대 AirPods 3세대 AirPods 3세대 AirPods 3세대</p>
					<h2 class="eventTitle">핫딜 공유하고 당첨확률 올려보세요</h2>
				</div>
				<!-- //event headline -->

				<!-- event detail box -->
				<div class="eventBox">
					<div class="content">
						<!-- 공유 전 -->
						<p><span class="name">안은지</span>님,<br>
							지금 핫딜 공유하고<br>
							<strong class="highlight">당첨확률 2배</strong> 만드세요<i class="italic">!</i></p>
						<!-- 공유 전 -->

						<!-- 공유 후 -->
						<p><span class="name">안은지</span>님의 <strong>당첨확률</strong><br>
							<strong class="highlight result">2배</strong></p>
						<!-- 공유 후 -->
					</div>
				</div>
				<!-- //event detail box -->
			</div>
			<!-- //container -->

			<!-- bottom button area(common) -->
			<div class="btnBox btnDetail bgGradientGray">
				<div class="container">
					<p>친구가 내 공유 링크를 누르면 <strong class="textBlack">핫딜 당첨확률이 UP</strong></p>
					<p><button type="button" class="btn">공유하고 당첨확률 <span class="textLight">2배</span> 만들기</button></p>
				</div>
			</div>
			<!-- //bottom button area(common) -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</body>
</html>
