<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing | 디자인 시스템</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/spacing.css">
</head>
<body>
  <header class="guide-header">
    <a href="../index.html" class="guide-back">← 디자인 시스템 가이드</a>
    <h1 class="page-title">Spacing</h1>
  </header>
  <main class="guide-main">
    <div class="spacing-preview">
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-02);height:var(--space-02)"></span>
        <span class="spacing-preview__value">2</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-04);height:var(--space-04)"></span>
        <span class="spacing-preview__value">4</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-08);height:var(--space-08)"></span>
        <span class="spacing-preview__value">8</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-12);height:var(--space-12)"></span>
        <span class="spacing-preview__value">12</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-16);height:var(--space-16)"></span>
        <span class="spacing-preview__value">16</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-20);height:var(--space-20)"></span>
        <span class="spacing-preview__value">20</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-24);height:var(--space-24)"></span>
        <span class="spacing-preview__value">24</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-32);height:var(--space-32)"></span>
        <span class="spacing-preview__value">32</span>
      </div>
      <div class="spacing-preview__item">
        <span class="spacing-preview__box" style="width:var(--space-40);height:var(--space-40)"></span>
        <span class="spacing-preview__value">40</span>
      </div>
    </div>

    <div class="spacing-table-wrap">
      <table class="spacing-table">
        <thead>
          <tr>
            <th class="spacing-table__th spacing-table__th--token">Token</th>
            <th class="spacing-table__th spacing-table__th--value">Value</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-02</span></td><td class="spacing-table__cell">2px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-04</span></td><td class="spacing-table__cell">4px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-08</span></td><td class="spacing-table__cell">8px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-12</span></td><td class="spacing-table__cell">12px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-16</span></td><td class="spacing-table__cell">16px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-20</span></td><td class="spacing-table__cell">20px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-24</span></td><td class="spacing-table__cell">24px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-32</span></td><td class="spacing-table__cell">32px</td></tr>
          <tr><td class="spacing-table__cell"><span class="token-badge">--space-40</span></td><td class="spacing-table__cell">40px</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <footer class="guide-footer">
    <p>Design System Guide — Spacing</p>
  </footer>
</body>
</html>
