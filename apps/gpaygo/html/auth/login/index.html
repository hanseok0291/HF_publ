<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/auth/login.css">
</head>
<body>
  <!-- 로그인 페이지 컨테이너 -->
  <div class="login-page">
    <!-- 로그인 컨텐츠 영역 (PC에서는 왼쪽) -->
    <div class="login-content-area">
      <!-- 상단 탭 메뉴 (모바일만) -->
      <div class="login-tabs">
        <button class="login-tab-item" type="button">수거업체</button>
        <button class="login-tab-item active" type="button">판매소</button>
      </div>

      <!-- 로고 영역 (모바일만) -->
      <div class="login-logo-area">
        <img src="../../../images/logo.svg" alt="로고" class="login-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div class="login-logo-placeholder" style="display: none;">LOGO</div>
      </div>

    <!-- 로그인 폼 카드 -->
    <div class="login-card">
      <div class="login-card-header">
        <p class="login-subtitle">대형 폐기물 스티커 종량제 봉투</p>
        <h1 class="login-title">판매소 ADMIN</h1>
      </div>

      <form id="loginForm" class="login-form" action="#" method="post">
        <!-- 아이디 입력 -->
        <div class="login-input-group">
          <label for="userId" class="login-label">아이디</label>
          <input 
            type="text" 
            id="userId" 
            name="userId" 
            class="textfield" 
            placeholder="아이디를 입력하세요"
            value="hecto@hecto.co.kr"
            required
            autocomplete="username"
          >
        </div>

        <!-- 비밀번호 입력 -->
        <div class="login-input-group">
          <label for="password" class="login-label">비밀번호</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="textfield" 
            placeholder="비밀번호를 입력하세요"
            value="******"
            required
            autocomplete="current-password"
          >
        </div>

        <!-- 체크박스 영역 -->
        <div class="login-checkbox-group">
          <label class="login-checkbox-item">
            <input type="checkbox" id="saveAccount" name="saveAccount" class="login-checkbox" checked>
            <span class="login-checkbox-text">계정 정보 저장</span>
          </label>
          <label class="login-checkbox-item">
            <input type="checkbox" id="autoLogin" name="autoLogin" class="login-checkbox" checked>
            <span class="login-checkbox-text">자동 로그인</span>
          </label>
        </div>
      </form>

      <!-- 에러 알럿 -->
      <div class="login-alert" role="alert" aria-live="assertive">
        <span class="login-alert-icon" aria-hidden="true">!</span>
        <div class="login-alert-text">
          <p>등록된 계정이 없어요.</p>
          <p>시스템 관리자에게 문의해 주세요.</p>
        </div>
      </div>

      <!-- 하단 고정 버튼 영역 -->
      <div class="login-sticky-footer">
        <button type="submit" form="loginForm" class="btn btn-primary btn-sticky" disabled aria-disabled="true">
          로그인
        </button>
        <a href="#" class="login-find-link">계정 정보 찾기</a>
      </div>
    </div>
    </div>

    <!-- PC 버전 오른쪽 이미지 영역 -->
    <div class="login-image-area">
      <img src="../../../images/logo-white.svg" alt="로고" class="login-image-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="login-image-placeholder" style="display: none;">LOGO</div>
    </div>
  </div>
</body>
</html>
