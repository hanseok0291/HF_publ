<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../ktmembership/css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../ktmembership/js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
<!-- wrap -->
<div id="wrap" class="version-v3">
	<!-- header-v3 (로고 중앙 · 뒤로) -->
	<div id="header" class="header-v3">
		<div class="container">
			<div class="page-title">
				<h2 class="title">
					<img src="../../ktmembership/images/logo.svg" class="header-brand-v3__logo" width="73" height="24"
						alt="내통장결제"></h2>
			</div>
			<button type="button" id="closeWindow" class="btn-close btn-close-v3"><i
					class="icon icon-close-v3">창닫기</i></button>
		</div>
	</div>
	<!-- //header-v3 -->

	<!-- content -->
	<div id="content" class="pay-success kt-ui">
		<!-- container -->
		<div class="container">
			<!-- 페이지 타이틀 (헤더 → 본문 상단) -->
			<div class="page-head">
				<h2 class="page-head__title">계좌 연결 안내</h2>
			</div>
			<!-- //페이지 타이틀 -->

			<!-- headline -->
			<div class="headline"><strong>홍길동</strong> 고객님은<br> 내통장결제 기존 고객입니다.</div>
			<!-- //headline -->

			<!-- 계좌 -->
			<div class="section">
				<!-- 계좌 있는 경우 -->
				<div class="well account-box">
					<div class="pop-account">내통장결제 주계좌</div>
					<div class="logo"><img src="../../ktmembership/images/bank/fullname_004.png" alt="국민은행"></div>
					<div class="number">123********001</div>
				</div>
				<!-- //계좌 있는 경우 -->

				<!-- 계좌 없는 경우 -->
				<div class="well account-box">
					<button class="btn btn-nobg "><i class="icon-plus sr-only">+</i> 결제계좌 등록하기</button>
				</div>
				<!-- //계좌 없는 경우 -->
			</div>
			<!-- //계좌 -->

			<!-- 안내 -->
			<div class="section">
				<p class="info">내통장결제 서비스에 등록된 모든 계좌는 KT멤버십에서 이용이 가능합니다.</p>
			</div>
			<!-- //안내 -->

			<!-- submit button -->
			<div class="submit-btn fixed">
				<button type="button" id="send" class="btn on">확인</button>
			</div>
			<!-- //submit button -->
		</div>
		<!-- //container -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩 중</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onClick="modalClose();" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onClick="modalClose();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
