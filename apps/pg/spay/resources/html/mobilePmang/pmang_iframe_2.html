<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8">
	<title>헥토파이낸셜 지불서비스</title>
	<link rel="stylesheet" type="text/css" href="https://pay.pmang.com/Crusader/css/pmang_new.css">
	<link rel="stylesheet" type="text/css" href="https://pay.pmang.com/Crusader/css/pmang_payment.css">
	<link rel="stylesheet" type="text/css" href="../../css/pmang_new.css">
	<link rel="stylesheet" type="text/css" href="../../css/pmang_payment.css">
</head>

<body class="body_pay" oncontextmenu="return false" onselectstart="return false" ondragstart="return false"
	marginwidth="0" marginheight="0">
	<img src="../../images/box_type01_top.gif" border="0" style="margin-top:5px;vertical-align: bottom;"><br>
	<!-- <img src="https://pay.pmang.com/Crusader/image/box_type01_top.gif" border="0" style="margin-top:5px;vertical-align: bottom;"><br> -->
	<div class="pay_box_type01">
		<table cellpadding="0" cellspacing="0" border="0" width="100%" class="fixed" style="display:block;">
			<input type="hidden" name="hidagreeurl" value="">
			<colgroup>
				<col width="15" valign="top" style="padding-top:1px;">
				<col width="105">
				<col width="*">
			</colgroup>
			<tbody>
				<tr valign="top" style="padding-bottom:4px;">
					<td><img src="https://pay.pmang.com/Crusader/image/ico_box_arw_orange.gif" border="0"></td>
					<td><b class="black">휴대폰 정보</b></td>
					<td class="gray_01"></td>
				</tr>
				<tr>
					<td colspan="3" height="1" background="https://pay.pmang.com/Crusader/image/bg_dotline.gif"></td>
				</tr>
				<tr>
					<td colspan="3" height="2"></td>
				</tr>
				<tr style="padding-top:5px;">
					<td></td>
					<td class="black">휴대폰번호</td>
					<td class="gray_01">
						<strong>01012341234</strong>
					</td>
				</tr>

				<tr class="hide" data-show-acsflag="Y">
					<td></td>
					<td class="black" colspan="2">
						<p class="tip-txt" style="padding: 3px 0 7px 0;font-size: 11px;color: #a4a3a4;letter-spacing: -0.04em">- 안전한
							결제를 위해 위 번호로 인증 번호 안내 전화가 발신됩니다.</p>
					</td>
				</tr>

				<tr style="padding-top :10px;" class="hide" data-show-acsflag="Y">
					<td></td>
					<td class="black">
						<span class="approve_span">인증번호</span>
						<span class="approve_span" style="display:none;">ARS 인증성공</span>
						<span class="approve_span" style="display:none;color:red;">ARS 인증실패</span>
					</td>
					<td class="gray_01">
						<span class="approve_number" style="color:red;font-size:15px;"></span>
					</td>
				</tr>

				<tr class="hide" data-show-acsflag="Y">
					<td></td>
					<td class="black" colspan="2">
						<p class="caution-txt" style="padding: 3px 0 7px 0;font-size: 11px;color: red;letter-spacing: -0.04em">-
							고객님께 걸려온 ARS인증 전화를 받은 후 인증 번호를 눌러주시기 바랍니다.</p>
					</td>
				</tr>

				<tr>
					<td></td>
					<td class="black" colspan="2" style="padding-top:10px;">
						<input type="checkbox" class="frm-chk st01" name="agPro" required="required"
							data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다.">
						<label for="agPro" class="other-line" tabindex="0">결제 내용을 확인하였습니다.</label>
						<p style="padding-left:30px; padding-right:10px; margin:0px;">
							- 결제 요금은 다음달 휴대폰 요금에 합산 청구되며, 미납시 가산금이 부과될 수 있습니다. <a
								href="javascript:void(window.open('./terms1.html', 'terms','width=470, height=750'))">약관참조</a><br>
							- 휴대폰 소액결제 현금화는 정보통신망법 제 72조에 의해 3년 이하의 징역 또는 3천만원 이하의 벌금형에 처해 질 수 있습니다.
						</p>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<img src="../../images/box_type01_bottom.gif" border="0" style="vertical-align: top;"><br>
	<!-- <img src="https://pay.pmang.com/Crusader/image/box_type01_bottom.gif" border="0" style="vertical-align: top;"><br> -->

	<div align="center" style="margin-top:10px;display:block;">
		<!-- 충전 -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_charge.gif" border="0" style="cursor:hand;">
		<!-- 취소  -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_cancel.gif" border="0" style="cursor:hand;"
			onclick="pay_close();">
	</div>

</body>

</html>
