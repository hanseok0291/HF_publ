<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <link rel="stylesheet" href="../../css/web/kyc.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="flex-container">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="flex-container">
        <!-- container -->
        <div class="container kyc-container">
          <h4 class="title-text">
            안전한 서비스 이용을 위해 고객확인을 <br />
            먼저 진행해 주세요
          </h4>
          <p class="gray-box">
            라운드 페이에서는 자금 세탁 등으로부터 <br />계좌를 보호하기 위해
            고객님의 정보와 <br />실제 계좌 소유 여부를 확인하고 있습니다.
          </p>
          <div class="qr-box">
            <img src="../../images/web/kyc/qr-img.png" alt="QR" class="qr-img">
            <img src="../../images/web/kyc/icon-rrpay-logo.svg" alt="RROUND PAY" class="rrpay-logo">
          </div>
          <div class="bottom-area">
            <button type="button" class="btn">고객확인 완료</button>
            <button type="button" class="btn tertiary">다른 결제수단 선택</button>
          </div>
        </div>
        <!-- //container -->
      </div>
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {});
  </script>
</html>
