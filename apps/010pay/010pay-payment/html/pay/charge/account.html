<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css?v=2606191" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-23] renewal-v2 적용 — 계좌 머니 충전 (Figma 충전_디폴트 · keypad) -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">계좌 머니 충전</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container charge-account-v2-scroll-fill">
          <div class="charge-container charge-account-v2">
            <div class="charge-account-v2-body">
              <button
                type="button"
                class="charge-account-select"
                onclick="modalOpenSlide('modal-select-account')"
              >
                <span class="charge-account-logo">
                  <img src="../../../images/bank/bank_new/logo-bank-shinhan.png" alt="" />
                </span>
                <span class="charge-account-text">
                  <strong>신한 123 계좌</strong>에서
                </span>
                <i class="icon-arrow-down size-16" aria-hidden="true"></i>
              </button>

              <div class="charge-amount-section">
                <div class="input-wrap charge-input-wrap">
                  <div class="input-container label-n charge-input">
                    <input
                      type="tel"
                      class="custom-input"
                      placeholder=" "
                      id="chargeAmount"
                      autocomplete="off"
                      readonly
                    />
                    <label for="chargeAmount" class="floating-label"
                      >얼마를 충전할까요?</label
                    >
                    <div class="fake-label">
                      <p class="number"></p>
                      <span class="unit">만원</span>
                    </div>
                    <button type="button" class="icon icon-del js-text-del"></button>
                  </div>
                </div>
                <div class="charge-balance-row">
                  <span class="label">현재 보유 머니</span>
                  <span class="value">80,000원</span>
                </div>
                <div class="charge-limit-hint">
                  <p class="charge-limit-text">
                    최대 충전 가능 금액은
                    <button
                      type="button"
                      class="charge-limit-link js-charge-limit-fill"
                      data-amount="192"
                    >
                      192만원
                    </button>
                    이에요
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- bottom area — Figma: chip → keypad → CTA -->
        <div class="bottom-area charge-account-v2-foot">
          <!-- container -->
          <div class="container charge-foot-stack">
            <div class="add-money-btn-wrap">
              <button type="button" data-money="1">1만원</button>
              <button type="button" data-money="5">5만원</button>
              <button type="button" data-money="10">10만원</button>
              <button type="button" data-money="100">100만원</button>
            </div>
            <!-- keypad -->
            <div class="keypad-slot">
              <div class="keypad-amount" role="group" aria-label="숫자 키패드">
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="1">1</button>
                  <button type="button" class="keypad-key" data-value="2">2</button>
                  <button type="button" class="keypad-key" data-value="3">3</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="4">4</button>
                  <button type="button" class="keypad-key" data-value="5">5</button>
                  <button type="button" class="keypad-key" data-value="6">6</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="7">7</button>
                  <button type="button" class="keypad-key" data-value="8">8</button>
                  <button type="button" class="keypad-key" data-value="9">9</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="00">00</button>
                  <button type="button" class="keypad-key" data-value="0">0</button>
                  <button
                    type="button"
                    class="keypad-key keypad-delete"
                    data-action="delete"
                    aria-label="삭제"
                  >
                    <img
                      src="../../../images/pay/charge/ico-keypad-delete.svg"
                      alt=""
                      width="24"
                      height="24"
                    />
                  </button>
                </div>
              </div>
            </div>
            <!-- //keypad -->
            <div class="charge-foot-cta">
              <button
                type="button"
                class="btn btn-charge-submit"
                disabled
              >
                충전하기
              </button>
            </div>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //content -->
    </div>
    <!-- //[2026-06-23] renewal-v2 적용 — 계좌 머니 충전 (Figma 충전_디폴트 · keypad) -->
    <!-- //wrap -->

    <!-- 계좌 선택하기 팝업 -->
    <div id="modal-select-account" class="modal modal-slide type-select type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">계좌 선택하기</p>
            <button type="button" class="btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="btn-list account-list">
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img src="../../../images/bank/bank_new/logo-bank-toss.png" alt="" />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                    <p class="icon-star"></p>
                  </button>
                </li>
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img src="../../../images/bank/bank_new/logo-bank-hana.png" alt="" />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                  </button>
                </li>
                <li class="btn-wrap">
                  <button type="button" class="btn btn-add">계좌 추가하기</button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //계좌 선택하기 팝업 -->
  </body>
  <script>
    /* 계좌 머니 충전 — RenewalAmountPage 공통 초기화 (design_renewal.js defer 이후) */
    $(function () {
      RenewalAmountPage.init({
        input: "#chargeAmount",
        unit: "manwon",
        available: 200,
        maxBalanceWon: 2000000,
        maxDigits: 3,
        balanceRow: ".charge-balance-row",
        balanceWon: 80000,
        balanceLabels: {
          empty: "현재 보유 머니",
          filled: "충전 후 머니",
        },
        submitBtn: ".btn-charge-submit",
        limitLink: ".js-charge-limit-fill",
        labels: {
          empty: "얼마를 충전할까요?",
          filled: "충전 금액",
        },
        chips: ".add-money-btn-wrap button",
      });
    });
  </script>
</html>
