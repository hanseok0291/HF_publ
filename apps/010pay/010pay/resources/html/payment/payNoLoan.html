<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name"><a href="#"><span class="my-logo"><img src="../../images/logo-myaccount.png" class="logo" alt="내통장결제"></span></a></h1>
				<h2 class="page-title hidden">결제</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p class="info-error"><i class="icon icon-question-circle"></i> 본 결제는 대출 머니 사용이 불가합니다.</p>
					<p>바이오일레븐에서<br>
						<strong class="text-primary"><span class="price">2,000,000</span>원</strong>을 결제합니다.</p>
					<p class="small">드시모네 유산균 외 2건</p>
				</div>
				<!-- //headline -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container pay-wrap">
					<!-- 정보 입력 -->
					<div class="section pay-sec">
						<dl class="position-relative">
							<dt>사용 가능 머니 <button type="button" class="btn btn-nobg btn-refresh"><i class="icon icon-refresh sr-only">새로고침</i></button></dt>
							<dd><span>1,890,689</span>원</dd>
						</dl>
						<div class="bg-gray">
							<ul class="form-type">
								<li class="with-input">
									<label class="label">사용 머니</label>
									<div class="form-desc">
										<div class="position-relative">
											<input type="tel" class="input-text-lg input-box text-primary">
											<span class="form-control-clear hidden"><i class="icon-times-circle sr-only">삭제</i></span>
										</div>
										<span class="checkbox square white">
											<input type="checkbox" name="checkbox_account" id="checkbox_account">
											<label for="checkbox_account">보유 머니 전액 사용</label>
										</span>
									</div>
								</li>
								<li>
									<label class="label">결제 금액</label>
									<div class="form-desc">
										<!-- 등록된 계좌 있는 경우 -->
										<button type="button" id="account" class="select info-chg"><img src="../../images/bank/logo_089.png" alt="케이뱅크"> <em>123</em></button>
										<em class="text-primary"><i>0</i>원</em>
										<div class="info-sm"><i class="icon icon-reply"></i> 연결된 계좌에서 충전 후 바로 결제됩니다.</div>
										<!-- //등록된 계좌 있는 경우 -->

										<!-- 등록된 계좌 없는 경우 -->
										<button type="button" class="account-submit"><i></i>계좌등록</button>
										<!-- //등록된 계좌 없는 경우 -->
									</div>
								</li>
							</ul>
						</div>
						<ul class="check-type">
							<li>
								<span class="checkbox square">
									<input type="checkbox" name="checkbox-receipt" id="checkbox-receipt" checked>
									<label for="checkbox-receipt">현금영수증</label>
								</span>
								<span class="receipt">
									<i>010****1234</i>
									<button type="button" id="receipt" class="text-link info-chg">변경</button>
								</span>
							</li>
							<li>
								<span class="checkbox square">
									<input type="checkbox" name="checkbox_agree" id="checkbox_agree" checked>
									<label for="checkbox_agree">결제 조건 확인 및 결제 정보 제공 동의합니다.</label>
								</span>
							</li>
						</ul>
					</div>
					<!-- //정보 입력 -->

					<button type="button" id="send" class="btn" disabled>결제하기</button>
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

						<li>
							<button type="button" class="btn">
								<span class="account-number"><img src="../../images/bank/logo_004.png" alt="국민"> 국민 <em class="number"><i>****</i>123</em></span>

							</button>
						</li>
						<li>
							<button type="button" class="btn">

								<span class="check-primary"><span>머니 충전</span> <i class="icon-check primary"></i></span>
							</button>
						</li>
						<li>
							<button type="button" class="btn">
								<span class="account-number"><img src="../../images/bank/logo_004.png" alt="국민"> 국민 <em class="number"><i>****</i>123</em></span>
								<span class="check-primary"><span>머니 충전</span> <i class="icon-check primary"></i></span>
							</button>
						</li>
					</ul>
				</div>
				<div class="container mgt20">
					<button type="button" class="btn btn-outline"><i class="icon icon-plus"></i> <span>계좌 추가</span></button>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- 현금영수증 발급정보 -->
<div id="modal-receipt" class="modal modal-slide modal-info">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body my-info">
				<button type="button" class="btn btn-close">취소</button>
				<div class="chg-info">
					<h4>현금영수증 발급정보를 입력하세요.</h4>
					<ul class="checkbox-group checked-one">
						<li>
							<span class="checkbox">

								<label for="checkbox_01_01">개인소득공제(휴대폰)</label>
							</span>
						</li>
						<li>
							<span class="checkbox">

							</span>
						</li>
						<li>

							</span>
						</li>
						<li>
							<span class="checkbox">

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>

	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
