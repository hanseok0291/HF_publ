<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/pay/transactionHistory.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="flex-container">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title"></h2>
            <button
              type="button"
              class="btn-close js-change-btn"
              data-title="라운드 페이 서비스를<br />해지하시겠습니까?"
              data-message="라운드 페이의 혜택이 모두 사라져요!"
              data-cancel="취소"
              data-confirm="해지하기"
            >
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="flex-container flex-1">
        <!--  -->
        <div id="passwordSet" class="">
          <div class="password-wrap">
            <div>
              <div class="content-wrap">
                <h3 class="title">비밀번호를 입력해 주세요</h3>

                <div class="input-mark">
                  <span class="mark"
                    ><i id="pwd_01" class="on"></i><i id="pwd_02" class="on"></i
                    ><i id="pwd_03" class="on"></i><i id="pwd_04"></i
                    ><i id="pwd_05"></i><i id="pwd_06"></i
                  ></span>
                </div>

                <!-- <p class="noti-text">동일/연속된 숫자, 생년월일, 휴대폰 번호는 사용할 수 없어요.</p> -->
              </div>
            </div>
          </div>
        </div>
        <!-- //container -->
        <!--  -->
      </div>
      <!-- //content -->
    </div>

    <div class="mark-box">
      <div class="">
        <span class="checkbox bio">
          <input type="checkbox" name="bio_chk" id="bio_chk" />
          <label for="bio_chk">생체 인증 사용</label>
        </span>
      </div>
      <img src="../../../images/common/security_keypad.png" alt="" />
    </div>
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->
  </body>
  <script></script>
</html>
