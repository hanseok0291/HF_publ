<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=6.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>
<style>
#content { position: relative; }
</style>
<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="facebook-passbook">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name small-x">
					<a href="#">
						<span class="my-logo"><img src="../../images/logo-myaccount-black.png" class="logo" alt="010내통장결제"></span> <!-- 기본 로고 -->
					</a>
				</h1>
				<h2 class="page-title hidden">회원 확인</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p>
						로그인은 <b>휴대폰 번호</b>로<br>
						결제는 <b>등록 계좌</b>에서!
					</p>
					
				</div>
				<!-- //headline -->
				<div class="login-form-wrap exStyle">
					<input id="phone_input" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="휴대폰 번호 입력" class="input-box" />
					<button type="button" id="send" class="btn btn-next" disabled>
						다음
					</button>
					<div class="bot-area">
						<div class="check-type">
							<span class="checkbox square">
								<input
									type="checkbox"
									name="checkbox_agree"
									id="checkbox_agree"
									checked
								/>
								<label for="checkbox_agree">내 번호 기억하기</label>
							</span>
						</div>
						<div class="link-wrap">
							<a href="#">휴대폰 번호 변경</a>
							<a href="#">회원 가입</a>
						</div>
					</div>
				</div>
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
$(document).ready(function(){
	// 폼 입력 시 확인 버튼 활성
	$("input").keyup(function(){
		if ($("#phone_input").val().length >= 11) {
			$("#send").attr("disabled",false);
		} else {
			$("#send").attr("disabled", true);
		}
	});
})

$(function(){
	$("input").each(function(){
		$(this).bind("focus", function(){
			$(".bottom-area").css("position", "absolute");
			$(".bottom-area").css("bottom", "0");
		});
		$(this).bind("blur",function(){
			$(".bottom-area").css("position", "absolute");
			$(".bottom-area").css("bottom", "0");
		});
	});
});
</script>
</body>
</html>
