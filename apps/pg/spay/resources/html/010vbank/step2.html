</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/010vbank/logo.png" class="logo" alt="010가상계좌"></span></h1>
				<button type="button" id="closeWindow" class="btn-close hidden"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p class="small"><span class="text-error">10월 28일 18시 21분까지</span></p>
					<p><strong>입금</strong>하셔야<br>
						<strong>결제가 완료</strong>됩니다 <i class="italic">!</i></p>
				</div>
				<!-- //headline -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- 입금 계좌 안내 -->
					<div class="box-top-info"><img src="../../images/010vbank/info-puppy.png?ver=1.1" alt="모든 은행해서 입금 가능해"></div>
					<!-- //입금 계좌 안내 -->

					<!-- 계좌 정보 -->
					<div class="section account-box">
						<div class="box vbank">
							<div class="label">입금계좌 <button type="button" id="resetAcnt" class="btn btn-outline btn-xxs">변경</button></div>
							<div class="value">
								<button type="button" id="copyNumber" class="account">
									<span class="logo"><img src="../../images/010vbank/bank/logo_089.svg" alt="케이뱅크"></span>
									<span class="number">010-1234-5678</span>
								</button>
								<ul class="info-account">
									<li>케이뱅크</li>
									<li>예금주 : 010_홍길동</li>
								</ul>
							</div>
						</div>
						<div class="box detail">
							<div class="label">입금금액</div>
							<div class="value"><span class="price">18,500</span>원</div>
						</div>
					</div>
					<!-- //계좌 정보 -->

					<!-- 현금영수증 설정 -->
					<div class="check-type">
						<span class="checkbox square">
							<input type="checkbox" name="checkbox-receipt" id="checkbox-receipt" checked>
							<label for="checkbox-receipt">현금영수증 <small class="text-body">휴대폰 번호로 자동 설정</small></label>
						</span>
						<button type="button" class="text-link" onclick="modalOpenSlide('modalReceipt');">변경</button>
					</div>
					<!-- //현금영수증 설정 -->

					<!-- 말풍선 + 버튼 -->
					<div class="position-relative text-center mgt20">
						<button type="button" id="sendPop" class="pop-ad red">
							<div class="ad"><span class="blinking"><em class="text-error"><i>18,500</i>원 입금</em>해야 진짜 완료!!</span></div>
						</button>
						<button type="button" id="send" class="btn">주문하기</button>
					</div>
					<!-- //말풍선 + 버튼 -->
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- 현금영수증 발급정보 -->
<div id="modalReceipt" class="modal modal-slide modal-info" onclick="$(this).off();">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container chg-info">
					<h4>현금영수증 발급정보를 입력하세요.</h4>
					<ul class="checkbox-group">
						<li>
							<span class="checkbox">
								<input type="radio" name="receipt" id="receipt_01" checked>
								<label for="receipt_01">개인소득공제(휴대폰)</label>
							</span>
						</li>
						<li>
							<span class="checkbox">
								<input type="radio" name="receipt" id="receipt_02">
								<label for="receipt_02">개인소득공제(현금영수증카드)</label>
							</span>
						</li>
						<li>
							<span class="checkbox">
								<input type="radio" name="receipt" id="receipt_03">
								<label for="receipt_03">지출증빙(사업자용)</label>
							</span>
						</li>
						<li>
							<span class="checkbox">
								<input type="radio" name="receipt" id="receipt_04">
								<label for="receipt_04">지출증빙(현금영수증카드)</label>
							</span>
						</li>
					</ul>
					<ul class="form-type">
						<li>
							<div class="position-relative">
								<input type="tel" placeholder="010 1234 5678" class="input-text-lg" value="01012345678">
								<span class="form-control-clear"><i class="icon-times-circle sr-only">삭제</i></span>
							</div>
							<div class="text-error"><i class="icon icon-error"></i> 오류 메시지</div>
							<div class="text-info info">현금영수증은 등록한 정보 기준으로 자동 발행됩니다.</div>
						</li>
					</ul>
				</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-cancel">취소</button>
				<button type="button" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //현금영수증 발급정보 -->

<!-- 동일 금액 주문 안내 -->
<div id="infoSame" class="modal modal-puppy">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3>앗! <strong>같은 금액의 주문 건</strong>이 있어요!</h3>
				<p><strong class="text-error">한 건의 금액만 입금</strong>하시면<br> <strong class="text-error">먼저 주문한 건부터 결제</strong>가 완료됩니다.</p>
				<p class="small">결제 순서 변경은 고객센터 <span class="text-dark">1600-5220</span>으로 연락주세요.</p>
				<p class="btn-area"><button type="button" onclick="modalClose();" class="btn btn-sm btn-nobg"><span class="underline text-dark">네, 확인했어요.</span></button></p>
			</div>
		</div>
	</div>
</div>
<!-- //동일 금액 주문 안내 -->

<!-- 입금 계좌 생성 완료 안내 -->
<div id="toastSuccess" class="modal modal-toast">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3><strong>입금 계좌 생성 완료</strong></h3>
				<p><strong class="text-error">입금</strong>하셔야 <strong class="text-error">결제가 완료</strong>됩니다.</p>
			</div>
		</div>
	</div>
</div>
<!-- //입금 계좌 생성 완료 안내 -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
$(document).ready(function(){
	// 계좌번호 복사 완료 모달
	$("#copyNumber").click(function(){
		$.alertMessage("계좌번호 복사", "010 가상계좌번호가 복사되었습니다.", $("#commonAlert"));
	});

	// 동일 금액 주문 안내 모달
	// modalOpen('infoSame');

	// 입금 계좌 생성 완료 토스트
	// modalOpen('toastSuccess');

});
</script>
</body>
