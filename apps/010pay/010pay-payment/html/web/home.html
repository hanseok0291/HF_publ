<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <link rel="stylesheet" href="../../css/web/home.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="flex-container">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="left-0 text-btn">
              로그아웃
            </button>
            <h2 class="page-title">
              <img class="rrpay-logo" src="../../images/web/round_pay_logo.svg" alt="RROUND PAY">
            </h2>
            <!-- <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button> -->
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="flex-container">
        <!-- container -->
        <div class="container home-container">
          <div class="contents-wrap">
            <p class="head-text">더 나은 일상을 위한 간편결제</p>
            <div class="text-wrap">
              <div class="white-box">
                <p class="title-text">QR찍고 라운드를 만나보세요</p>
                <p class="sub-text">
                  자세한 정보는 라운드앱 페이 탭에서 <br>
                  확인할 수 있어요
                </p>
                <div class="qr-img-wrap">
                  <img class="qr-img" src="../../images/web/account/rround-qr-img.png" alt="RROUND PAY QR">
                </div>
              </div>
              <span class="visual-img visual-img-1"></span>
              <span class="visual-img visual-img-2"></span>
              <span class="visual-img visual-img-3"></span>
            </div>
          </div> 
        </div>
        <!-- //container -->
        <div class="button-wrap">
          <button type="button" class="btn">
            라운드 시작하기
          </button>
          <button type="button" class="btn btn-logout">
            내 정보
          </button>
        </div>
      </div>
    </div>
    <!-- //wrap -->

    <!-- 로그아웃 확인 팝업 -->
    <div id="cancel-modal" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="modal-title">
              일정 시간동안 사용이 없어 <br>
              자동으로 로그아웃 됐어요
            </h3>
            <p class="highlight-text">다시 로그인해 주세요.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="cancel-modal-ok"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //로그아웃 확인 팝업 -->
  </body>
  <script>
    $(document).ready(function () {

    });
  </script>
</html>
