		<script type="text/javascript">
			/*
			 * 보안키패드 최대 값이 입력시 자동으로 닫기위하여 Input Tag에 아래 속성 필요
			 * data-keypad-next="__hide__"
			 */

			var nextPwdTimer = null;				//두번째 보안키패드 출력을 위한 Timer
			var nextPwdPopupInterval = 200; 		//두번째 보안키패드 출력 Timer 시간 200ms
			var pwdMaxLength = 6;					//보안키패드 문자열 길이

			/* 보안 키패드 class
			 * 키패드 창이 출력되면 active는 true, hide는 false 상태가 되면
			 * 키패드 창이 닫히면 (Hide) 되면 active는  false, hide는 true 상태로 변경
			 */
			var secuKeyPad = function(name) {
				this.name = name;		//키패드의 Input Tag Name
				this.active = false;	//키패드의 Popup 상태를 나타내는 속성
				this.hide = false;		//키패드의 Hide 상태를 나타내는 속성
				this.digitCnt = 0;		//입력된 문자열의 길이 속성

				/* 입력 문자길이 얻오오는 함수 */
				this.getDigitCnt = function () {
					return digitCnt;
				};

				/* 입력 문자길이 설정 input name 으로 설정 */
				this.setDigitCnt = function () {
					var elemName = "input[name='" + this.name + "']";
					var digit = new String ( $(elemName).val() );
					digitCnt = digit.length;
					return;
				};

				/* 입력 문자길이 초기화 */
				this.clearDigitCnt = function() {
					digitCnt = 0;
					return;
				};
			};

			var firstKey = new secuKeyPad("payPwd");

			/* 보안 키패드 창이 나타날때 이벤트 처리 */
			jQuery(document).on("nppfs-npv-after-show", function(event) {

				/* 첫번째 창이 나타나면 이전 속성 값을 Clear */
				if ( event.name == firstKey.name )
				{
					firstKey.active = true;
					firstKey.hide = false;
					firstKey.clearDigitCnt();
				}
			});

			jQuery(document).on("nppfs-npv-after-hide", function(event) {

				/* 첫번째 보안 키패드는 이미 hide 된 후 다른 elem나 배경을 선택해도 hide 이벤트가 오는것을 방지 */
				if ( event.name == firstKey.name && firstKey.active == true )
				{
					/* 첫번째 보안 키패드의 문자열 길이는 설정 */
					firstKey.setDigitCnt();

					if ( firstKey.getDigitCnt() == pwdMaxLength ){

						if($("#payPwd").val().length != 6){
							alert("비밀번호는 숫자 6자리입니다.");
							return false;
						}

						var formData = $("#frm").serialize();
						$.ajax({
							type: "post",
							url: "/ajax/std/pay/verifyPw",
							dataType : "json",
							data: formData,
							success:function(data){

								var statCd = data.outStatCd;
								var rsltCd = data.outRsltCd;
								var rsltMsg = data.outRsltMsg;
								var payPinUUID = data.payPinUUID;

								//핀번호 검증 성공
								if(statCd == "0021"){

									$(".error").hide();
									$("#payPinUUID").val(payPinUUID);
									payment();

								} else if(rsltCd == "session") {
									$(".error").hide();
									npVCtrl.resetKeypad("payPwd");
									$("#frm").attr('action','/ui/view/legacy/error/session').submit();

								} else {
									var errCnt = data.pwErrCnt;
									$("#errCountMsg").text("비밀번호 입력 오류 (" + errCnt + "/5)");

									if(errCnt >= 5){


											alert("비밀번호 5회 입력에 실패하여\n서비스 이용이 제한되었습니다.\n비밀번호 초기화해주세요.", function(){
												$("#way").val("P");
												$("#frm").attr('action','/ui/view/legacy/initterms').submit();
											});

									} else if(errCnt < 5) {
										//비밀번호 오류 5회 이하
										//DIV enable
										removeImg();
										$(".error").show();
										$(".error").text("비밀번호를 잘못입력 하였습니다.(" + data.pwErrCnt + "/5)");

										npVCtrl.resetKeypad("payPwd");
										$("input[name='" + firstKey.name + "']").focus();

										return false;
									} else {
										alert(rsltMsg, function(){
											removeImg();
										});
									}

								}
							},
							error:function(e){
								alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.", function(){
									removeImg();
									npVCtrl.resetKeypad("payPwd");
								});
								return false;
							}
						});

					}

					/* 보안 키패드 hide시 상태 변경, hide 이벤트가 중복해서 오더라도 처리하지 않도록 설정  */
					firstKey.active = false;
					firstKey.hide = true;
				}
			});

			$(document).ready(function(){

				//keypad set
				// uV.dV.zo = "/pluginfree/jsp/nppfs.keypad.jsp";  // 마우스입력기 페이지
		 		// npPfsStartup(document.frm, false, false, false, true, "npkencrypt", "on");

				$(".input_mark").click(function(){

					var tmp = $(this).attr("data-passwd");
					$("#"+tmp).focus();
					npVCtrl.resetKeypad(tmp);

					$("input[name=payPwd]").each(function(){

						$(this).parent().find('i').each(function(idx){
								$(this).removeClass("on");
						});
					});
				});

				$("input[name=payPwd]").keyup(function(){

					var len = $(this).val().length;

					$(this).parent().find('i').each(function(idx){
						if(len > idx){
							$(this).addClass("on");
						}else{
							$(this).removeClass("on");
						}
					});
				});

				if ($("#mchtId").val().indexOf('ebcard') >= 0) {
					$(".error").show();
					$(".error").text("모바일캐시비 결제비밀번호가 아닌 간편계좌 등록 시 설정하신 비밀번호를 입력해주시기 바랍니다.");
				}
			});

			function removeImg(){
				$("input[name=payPwd]").each(function(){

					$(this).parent().find('i').each(function(idx){
							$(this).removeClass("on");
					});
				});
			}

			$(window).load(function(){

			function payment(){

				//현금영수증 여부
				var isCashTax = $("#tax").is(':checked');
				if (isCashTax) {

			}

			function findPwdConfirm(type){

				if(type == "pwd"){

			}

			function agreeCancelConfirm(){
				confirm("결제를 취소하시겠습니까?", function(){
					$("#way").val("P");
					$("#frm").attr('action','/ui/view/legacy/pay/cancel').submit();
				});
			}
		</script>
