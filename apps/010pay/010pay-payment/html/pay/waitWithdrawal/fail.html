<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
    <script src="../../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-17] renewal-v2 적용 — 출금 실패 -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container banner-full-container">
          <div class="complete-text gray fail">
            <p class="title">
              출금을 실패했어요
              <span class="sub-title">에러케이스를 기재해주세요.</span>
            </p>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">확인</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
      <!-- //content -->
    </div>
    <!-- //[2026-06-17] renewal-v2 적용 — 출금 실패 -->
    <!-- //wrap -->
    
    <!-- 안내 팝업 -->
    <div id="modal-withdrawalt-info" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">대기 머니 출금 안내</p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="note-wrap">
                <li>
                  현재 보유 중인 대기 머니 전액 출금만 가능합니다.
                </li>
                <li>
                  은행 점검 시간에는 출금이 제한될 수 있습니다<br>
                  (평균 23시 50분 ~ 00시 10분)</li>
              </ul>
              <div class="info-wrap"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn js-modal-close">확인</button>
          </div>
        </div>
      </div>
    </div>
    <!-- //안내 팝업 -->

    <!-- 중앙 얼럿 (고객확인) -->
    <div id="commonExecute" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="executeTitle" class="modal-title"></h3>
            <div id="executeContents" class="highlight-text"></div>
          </div>
          <div class="modal-footer">
            <button type="button" id="executeOk" onclick="modalCloseAlert();" class="btn btn-confirm"></button>
            <button type="button" id="executeNo" onclick="modalCloseAlert();" class="btn btn-cancel"></button>
            <button type="button" id="executeNoShow" onclick="modalCloseAlert();" class="btn btn-noShow" style="display: none;"></button>
          </div>
        </div>
      </div>
    </div>
    <!-- //중앙 얼럿 (고객확인) -->
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 출금 고객확인 안내
      showAlertModal({
        title: "출금을 위해 고객확인을<br >먼저 진행해 주세요",
        message:
          "<div class='execute-wrap'>" +
          "자금 세탁 등으로부터 계좌를 보호하기 위해<br>" +
          "고객님의 정보 실제 계좌 소유 여부를<br>" +
          "확인하고 있습니다." +
          "</div>" +
          "<p class='execute-text-wrap'>페이 설정 &gt; 고객정보확인(KYC)을 통해<br>" +
          "고객확인을 진행할 수 있어요.</p>",
        confirmText: "확인",
        showCancel: false,
        vertical: false,
      });
    });
  </script>
</html>
