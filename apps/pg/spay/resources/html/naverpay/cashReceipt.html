<!DOCTYPE html>
<html lang="ko">
<head>
<title>네이버페이</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- favicon -->
<link rel="shortcut icon" type="image/x-icon" href="../../images/naverpay/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="57x57" href="../../images/naverpay/favicon/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="../../images/naverpay/favicon/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="../../images/naverpay/favicon/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="../../images/naverpay/favicon/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="../../images/naverpay/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../images/naverpay/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../images/naverpay/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../images/naverpay/favicon/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../images/naverpay/favicon/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192"  href="../../images/naverpay/favicon/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/naverpay/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../images/naverpay/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/naverpay/favicon/favicon-16x16.png">
<link rel="manifest" href="../../images/naverpay/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../images/naverpay/favicon/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
<!-- //favicon -->

<link rel="stylesheet" href="../../css/naverpay.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="logo"><img src="../../images/naverpay/logo-npay.png" alt="네이버페이"></h1>
				<h2 class="page-title">결제</h2>
				<button type="button" id="closeWindow" class="btn-close">화면 닫기</button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- 주문 정보 -->
			<div class="section order-info">
				<div class="container">
					<h3 class="sr-only">주문 정보</h3>
					<ul>
						<li>
							<span class="title">결제 상품</span>
							<span class="value">[주식회사 투스라이프] 투네이션캐시 투네이션캐시 투네이션캐시 투네이션캐시 투네이션캐시 투네이션캐시 투네이션캐시</span>
						</li>
						<li>
							<span class="title">결제 금액</span>
							<span class="value price">35,000원</span>
						</li>
					</ul>
				</div>
			</div>
			<!-- //주문 정보 -->

			<!-- 결제 방식 -->
			<div class="section pay-type">
				<div class="container">
					<h3 class="title">결제 방식</h3>
					<p><span class="label active">포인트 결제</span></p>
				</div>
			</div>
			<!-- //결제 방식 -->

			<!-- 현금영수증 정보 -->
			<div class="section cashreceipt">
				<div class="container">
					<ul class="form-type">
						<li class="title">
							<div class="checkbox">
								<input type="checkbox" name="rcptYn" id="rcptYn">
								<label for="rcptYn">현금영수증 발행</label>
							</div>
						</li>
						<li>
							<div class="checkbox-inline-group">
								<span class="checkbox circle">
									<input type="radio" name="cashRcptPrposDivCd" id="cashRcptPrposDivCd_0" value="0" checked>
									<label for="cashRcptPrposDivCd_0">개인소득공제용</label>
								</span>
								<span class="checkbox circle">
									<input type="radio" name="cashRcptPrposDivCd" id="cashRcptPrposDivCd_1" value="1">
									<label for="cashRcptPrposDivCd_1">사업자증빙용</label>
								</span>
							</div>
						</li>
						<li>
							<select name="csrcRegNoDivCd_0" id="csrcRegNoDivCd_0" class="select">
								<option value="4">휴대폰번호</option>
								<option value="1">카드번호</option>
							</select>
							<select name="csrcRegNoDivCd_1" id="csrcRegNoDivCd_1" class="select hidden">
								<option value="3">사업자등록번호</option>
								<option value="1">카드번호</option>
							</select>
						</li>
						<li><input type="tel" name="csrcRegNo" id="csrcRegNo" maxlength="16" placeholder="휴대폰번호 입력" data-validator="현금영수증 발행 번호|text|return $('#rcptYn').prop('checked')"></li>
					</ul>

					<h3 class="title">주의사항</h3>
					<ul class="info-list">
						<li>현금영수증 발급이 가능합니다. (적립성 포인트 제외)</li>
						<li>결제 금액과 현금영수증 발행 금액이 상이할 수 있습니다. (환금성 상품, 적립성 포인트 사용 등)</li>
					</ul>
				</div>
			</div>
			<!-- //현금영수증 정보 -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<button type="button" id="submit" class="btn">다음</button>
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<script>
// 모바일 / PC UI
var filter = "win16|win32|win64|mac|macintel"; if ( navigator.platform ) {
	if (filter.indexOf(navigator.platform.toLowerCase()) < 0) {
		// mobile
		$('#wrap').removeClass('ui-pc');
	} else {
		// pc
		$('#wrap').addClass('ui-pc');
	}
}

// 현금영수증 발행 폼 세팅
var $input = $("#csrcRegNo");
function setForm() {
	// 용도 선택 -> select 토글
	var $select = $("select:not(.hidden)");
	if($("#cashRcptPrposDivCd_0").is(":checked")){
		$("#csrcRegNoDivCd_0").removeClass("hidden");
		$("#csrcRegNoDivCd_1").addClass("hidden");
		var $select = $("#csrcRegNoDivCd_0");
	} else {
		$("#csrcRegNoDivCd_0").addClass("hidden");
		$("#csrcRegNoDivCd_1").removeClass("hidden");
		var $select = $("#csrcRegNoDivCd_1");
	}
	console.log($select.attr("id"));
	var optionText = $select.find("option:selected").text() + " 입력"
	$input.attr("placeholder", optionText);
}

$(document).ready(function(){
	// IE9 이하 jquery.placeholder.js 적용
	$("input").placeholder();

	setForm();
	$("input[type='checkbox'], input[type='radio'], select").on("change click", function(){
		setForm();
	});
});
</script>
</body>
</html>
