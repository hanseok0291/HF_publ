      flex-direction: row;

      justify-content: center;
      flex-shrink: 0;
      height: 56px;
      padding: 0 var(--space-16);
      background: var(--color-background-01);
    }

    .test5-header__title {

      font-weight: 700;

      flex-direction: row;
      align-items: center;

    .test5-header__left > .test5-icon-btn + .test5-icon-btn {
      margin-left: var(--space-16);
    }

    .test5-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .test5-icon-btn:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
      border-radius: var(--radius-08);
    }

    .test5-icon-btn img {
      width: 24px;
      height: 24px;
      display: block;
      object-fit: contain;
    }

    .test5-header__check-wrap {
      position: absolute;
      right: var(--space-16);
      top: 50%;
      transform: translateY(-50%);
    }

    .test5-circle-check {
      position: relative;
      width: 24px;
      height: 24px;
    }

    .test5-circle-check img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 본문: 카드 간 16px — gap 금지 */
    .test5-main {
      flex: 1 1 auto;
      padding: var(--space-16) var(--space-16) var(--space-40);
    }

    .test5-main > .test5-card + .test5-stack {
      margin-top: var(--space-16);
    }

    .test5-stack > .test5-card--reward + .test5-notice {
      margin-top: var(--space-32);
    }

    /* 공통 카드 프레임: 343 · radius 16 · bg-02 */
    .test5-card {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 343px;
      margin-left: auto;
      margin-right: auto;
      border-radius: var(--radius-16);
      background: var(--color-background-02);
    }

    .test5-card--summary {
      min-height: 391px;
      padding: var(--space-20);
    }

    .test5-card--reward {
      min-height: 219px;
      overflow: hidden;
    }

    .test5-card__head {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .test5-card__head-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
    }

    /* Chips_basic / Sub */
    .test5-chip {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 56px;
      height: 36px;
      padding: 0 var(--space-12);
      border: 1px solid var(--color-line-03);
      border-radius: var(--radius-24);
      background: var(--color-background-01);
      cursor: pointer;
      font-family: inherit;
    }

    .test5-chip:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    .test5-chip__label {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      text-align: center;
    }

    .test5-chip__chev {
      width: 16px;
      height: 16px;
      margin-left: var(--space-04);
      display: block;
      object-fit: contain;
    }

    /* 드롭다운 레이어(시안: 열린 상태) */
    .test5-dropdown {
      position: absolute;
      z-index: 3;
      right: var(--space-20);
      top: 48px;
      width: 128px;
      padding: var(--space-04) 0;
      border-radius: var(--radius-12);
      background: var(--color-background-01);
      box-shadow: 0 0 8px rgba(21, 21, 21, 0.2);
    }

    .test5-dropdown--reward {
      top: 52px;
      right: var(--space-20);
    }

    .test5-dropdown__item {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      min-height: 40px;
      padding: var(--space-08) var(--space-16);
      border: 0;
      background: transparent;
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }

    .test5-dropdown__item--bold {
      font-weight: 700;
    }

    .test5-dropdown__item:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: -2px;
    }

    /* 차트 영역 */
    .test5-chart {
      margin-top: var(--space-20);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .test5-chart__inner {
      position: relative;
      width: 500px;
      height: 221px;
    }

    .test5-chart__plot {
      position: absolute;
      left: 0;
      top: 0;
      width: 500px;
      height: 204px;
      padding-top: var(--space-08);
    }

    .test5-chart__hline {
      position: absolute;
      left: 0;
      width: 500px;
      height: 0;
      border: 0;
      border-top: 1px dashed var(--color-line-03);
      margin: 0;
      padding: 0;
    }

    .test5-chart__hline--avg {
      top: 107px;
      border-top-color: var(--color-status-danger);
    }

    .test5-chart__hline--sub {
      top: 180px;
    }

    .test5-bars {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
    }

    .test5-bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 56px;
    }

    .test5-bar-group + .test5-bar-group {
      margin-left: var(--space-08);
    }

    .test5-tooltip {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .test5-tooltip__bubble {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px var(--space-08);
      border-radius: var(--radius-16);
    }

    .test5-tooltip__bubble--danger {
      background: var(--color-status-danger);
    }

    .test5-tooltip__bubble--dark {
      background: var(--color-icon-02);
    }

    .test5-tooltip__bubble--lime {
      background: var(--test5-bar-lime);
    }

    .test5-tooltip__text {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .test5-tooltip__bubble--danger .test5-tooltip__text,
    .test5-tooltip__bubble--dark .test5-tooltip__text {
      color: var(--color-text-01);
    }

    .test5-tooltip__bubble--lime .test5-tooltip__text {
      color: var(--color-text-03);
    }

    .test5-tooltip__pointer {
      width: 6px;
      height: 6px;
      margin-top: 0;
      display: block;
    }

    .test5-tooltip + .test5-bar-pill {
      margin-top: var(--space-04);
    }

    .test5-bar-pill {
      border-radius: var(--radius-24) var(--radius-24) 0 0;
    }

    .test5-bar-pill--kb {
      width: 40px;
      height: 133px;
      background: var(--test5-bar-kb);
    }

    .test5-bar-pill--sm {
      width: 32px;
      background: var(--test5-bar-lime);
    }

    .test5-bar-pill--h77 {
      height: 77px;
    }

    .test5-bar-pill--h115 {
      height: 115px;
    }

    .test5-bar-pill--h34 {
      width: 33px;
      height: 34px;
    }

    .test5-bar-pill + .test5-bar-caption {
      margin-top: var(--space-08);
    }

    .test5-bar-caption {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-04);
      text-align: center;
      white-space: nowrap;
    }

    .test5-bar-caption--medium {
      font-weight: 500;
    }

    /* 범례 행 */
    .test5-legend {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-16);
    }

    .test5-legend__left {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .test5-legend__dash {
      width: 16px;
      height: 8px;
      flex-shrink: 0;
    }

    .test5-legend__dash img {
      display: block;
      width: 16px;
      height: auto;
    }

    .test5-legend__left .test5-legend__text {
      margin-left: var(--space-08);
    }

    .test5-legend__text {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-04);
      white-space: nowrap;
    }

    /* 하단 그라데이션 배너 */
    .test5-banner {
      margin-top: var(--space-16);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      min-height: 41px;
      margin-left: calc(-1 * var(--space-20));
      margin-right: calc(-1 * var(--space-20));
      margin-bottom: calc(-1 * var(--space-20));
      padding: 9px 17px;
      border-radius: 0 0 var(--radius-16) var(--radius-16);
      background: linear-gradient(90deg, var(--test5-gradient-from), var(--test5-gradient-to));
    }

    .test5-banner__text {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-01);
      text-align: center;
      word-break: keep-all;
    }

    .test5-banner__text strong {
      font-weight: 700;
    }

    /* 리워드 카드 */
    .test5-card--reward .test5-card__head {
      padding: 18px var(--space-20) 0;
    }

    .test5-card--reward .test5-card__head-title {
      line-height: 1.6;
      max-width: 223px;
    }

    .test5-card--reward .test5-chip {
      position: absolute;
      top: 13px;
      right: var(--space-20);
    }

    .test5-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 177px;
      padding: var(--space-12) var(--space-16) var(--space-24);
    }

    .test5-empty__img {
      width: 64px;
      height: 64px;
      object-fit: cover;
    }

    .test5-empty__text {
      margin: var(--space-08) 0 0;
      max-width: 220px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      text-align: center;
      word-break: keep-all;
    }

    /* 유의사항 */
    .test5-notice {
      width: 100%;
      max-width: 343px;
      margin-left: auto;
      margin-right: auto;
    }

    .test5-notice__title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
    }

    .test5-notice__list {
      margin: var(--space-08) 0 0;
      padding: 0;
      list-style: none;
    }

    .test5-notice__item {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }

    .test5-notice__item + .test5-notice__item {
      margin-top: var(--space-08);
    }

    .test5-notice__bullet {
      flex-shrink: 0;
      width: 4px;
      height: 17px;
      margin-top: 2px;
    }

    .test5-notice__bullet img {
      display: block;
      width: 4px;
      height: 17px;
    }

    .test5-notice__body {
      flex: 1 1 0;
      min-width: 0;
      margin-left: var(--space-08);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-04);
      word-break: keep-all;
    }

    .test5-notice__link {
      text-decoration: underline;
      text-decoration-skip-ink: none;
      color: inherit;
    }

    .test5-notice__link:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
      border-radius: var(--radius-04);
    }
  </style>
</head>
