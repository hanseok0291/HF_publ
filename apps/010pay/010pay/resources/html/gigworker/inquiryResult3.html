<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />
    <link rel="stylesheet" href="../../css/gigworker_check.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker checkTax">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
					<div class="pdLR22">
						<div class="titleWrap small">
							<h3 class="mainTitle normal">
								<p class="">박혜빈님은 <b>세무사의 도움</b>이</p>
								필요할 것 같아요!
							</h3>
							<p class="subText">010PAY 제휴 세무사를 안내해 드릴게요.<br>전문적인 신고를 도와드릴 거예요.</p>
						</div>
					</div>
					
          <figure class="visualImg"></figure>

          <div class="noteWrap">
            <p class="title">안내사항</p>
            <ul class="note">
              <li>010PAY 인증 세무사에게 자세한 검토를 받아보세요.</li>
              <li>010PAY는 일절 중개 수수료를 취하지 않습니다.</li>
            </ul>
          </div>

					<div class="pdLR22">
						<div class="botBtnWrap">
							<!-- 버튼 비활성화 시 disable 클래스 -->
							<button type="button" class="bot-btn" onclick="modalOpenSlide('modalSlideType1')">전문 세무사에게 상담받기</button>
						</div>
					</div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- 230403 추가 -->
    <div id="commonAlert" class="modal" style="display: none;">
      <div class="modal-dialog" style="margin-top: -95px;">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">
              종합 소득세 신고를 도와드릴 <br>
              전문 세무사 상담을 신청할까요?
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="modalClose();" class="btn btn-confirm">취소</button>
            <button type="button" onclick="modalClose();" class="btn btn-confirm">신청하기</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      modalOpenSlide('modalSlideType1');
    </script>
  </body>
</html>
