<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고객확인제도</title>
    <link rel="stylesheet" href="../../resources/css/common_renewal.css" />
    <script src="../../resources/js/jquery.3.4.1.min.js"></script>
    <script src="../../resources/js/jquery.placeholder.min.js"></script>
    <script src="../../resources/js/jquery-ui.js"></script>
    <script src="../../resources/js/design_renewal.js" defer="defer"></script>
    <script src="../../resources/js/commonmsg.js"></script>
    <script src="../../resources/js/commonutil.js"></script>
    <script src="../../resources/js/owl.carousel.min.js"></script>
    <script src="../../resources/js/kyc.js"></script>
  </head>
  <body>
    <div class="">
      <div class="">
        <p>고객확인제도 정책에 따라 의무적으로 개인정보를 확인하고 있습니다.</p>
        <div class="tooptip-box">
          <button type="button">툴팁</button>
        </div>
      </div>
      <div class="cust-info">
        <dl>
          <dt>이름</dt>
          <dd>김헥토</dd>
        </dl>
        <dl>
          <dt>성별</dt>
          <dd>여자</dd>
        </dl>
        <dl>
          <dt>생년월일</dt>
          <dd>2000.01.01</dd>
        </dl>
        <dl>
          <dt>휴대폰 번호</dt>
          <dd>
            <div class="">SKT 알뜰폰</div>
            010-3333-4451
          </dd>
        </dl>
      </div>
      <div class="form-wrap">
        <div>
          <h4>영문명</h4>
          <div class="input-box">
            <input
              type="text"
              class="custom-input"
              placeholder="성(HONG)"
              id="firstName"
            />
            <div id="firstNameError" class="error-message"></div>
          </div>
          <div class="input-box">
            <input
              type="text"
              class="custom-input"
              placeholder="이름(GILDONG)"
              id="lastName"
            />
            <div id="lastNameError" class="error-message"></div>
          </div>
          <div id="globalError" class="error-message"></div>
          <p>여권에 가입된 정보와 동일하게 입력해 주세요.</p>
        </div>
        <div>
          <h4>집주소</h4>
          <input
            type="text"
            class="custom-input"
            placeholder="건물 지번 또는 도로명 검색"
            id=""
          />
          <input
            type="text"
            class="custom-input"
            placeholder="상세주소 입력"
            id=""
          />
        </div>
        <div>
          <h4>직업</h4>
          <div class="select-box">
            <button id="select-job" class="label select-modal">
              직업 선택
            </button>
          </div>
        </div>
        <div>
          <h4>직장명</h4>
          <input
            type="text"
            class="custom-input"
            placeholder="직장명 입력"
            id=""
          />
        </div>
        <div>
          <h4>직장주소</h4>
          <input
            type="text"
            class="custom-input"
            placeholder="건물 지번 또는 도로명 검색"
            id=""
          />
          <input
            type="text"
            class="custom-input"
            placeholder="상세주소 입력"
            id=""
          />
        </div>
        <div>
          <h4>거래 목적</h4>
          <div class="select-box">
            <button class="label" onclick="modalOpenSlide('modal-select-bank')">
              은행
            </button>
          </div>
        </div>
        <div>
          <h4>자금 원천</h4>
          <div class="select-box">
            <button
              class="label select-modal"
              onclick="modalOpenSlide('modal-select-bank')"
            >
              은행
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- select modal bank -->
    <div id="modal-select-job" class="modal modal-slide type-select type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">직업 선택</p>
            <button type="button" class="btn btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <!-- 전체 동의 체크박스 -->
            <div class="container">
              <ul class="btn-list">
                <li>
                  <button type="button" class="btn">
                    <em>select option 1</em>
                    <span class="check-primary"
                      ><span>선택 텍스트</span>
                      <i class="icon-check primary"></i
                    ></span>
                  </button>
                </li>
                <li>
                  <button type="button" class="btn">
                    <em>select option 2</em>
                    <span class="check-primary"
                      ><span>선택 텍스트</span>
                      <i class="icon-check primary"></i
                    ></span>
                  </button>
                </li>
                <li>
                  <button type="button" class="btn">
                    <em>select option 3</em>
                    <span class="check-primary"
                      ><span>선택 텍스트</span>
                      <i class="icon-check primary"></i
                    ></span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //select modal list -->
  </body>
  <script>
    $(".modal-slide.type-select li").on("click", function () {
      $(this).closest("ul").find("li").removeClass("checked");
      $(this).addClass("checked");
      $(this).closest(".modal-slide").find(".btn-close").click();
    });
  </script>
</html>
