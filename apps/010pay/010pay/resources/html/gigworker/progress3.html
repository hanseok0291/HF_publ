<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker detailCondition">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <!-- <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button> -->
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap">
            <h3 class="mainTitle normal">
              <b>환급 신청을 취소</b>할게요.
            </h3>
            <p class="subText">수수료 결제 금액도 함께 취소돼요.</p>
          </div>

          <div class="detailTaxWrap">
            <div class="detailBox white">
              <p>결제 취소 정보</p>
              <dl>
                <dt>취소 유형</dt>
                <dd>전체 취소</dd>
                <dt class="normal">취소 금액</dt>
                <dd>53,000원</dd>
              </dl>
            </div>
          </div>

          <div class="noteWrap">
            <p class="title">안내사항</p>
            <ul class="note">
              <li>결제 취소 완료 후 일정 시간이 경과했을 경우 예상 환급액 조회 과정을 다시 진행 하실 수 있습니다.</li>
              <li>종합소득세 신고자료 정정을 위한결제  취소를 원하는 고객님께서는 택스비 고객센터 0000-0000으로 연락 바랍니다.</li>
              <li>결제와 관련된 문의사항은 010PAY 고객센터 1600-5220 <br> (평일 09:00 ~ 18:00)으로 연락 바랍니다.</li>
            </ul>
          </div>

          <div class="join-agree">
            <span class="checkbox square2 blank">
              <input type="checkbox" name="agreeTerms" id="agreeTerms1">
              <label for="agreeTerms1">위 내용을 확인하였으며, 이에 동의합니다.</label>
            </span>
          </div>

          <div class="botBtnWrap">
            <!-- 버튼 비활성화 시 disable 클래스 -->
            <button type="button" class="bot-btn disable" onclick="modalOpenSlide('modalSlideType1')">결제 취소하기</button>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->
    
    <script>
      $(".join-agree input").change(function(){
        if($(this).is(":checked")){
          $(".bot-btn").removeClass("disable");
        } else {
          $(".bot-btn").addClass("disable");
        }
      });
    </script>
  </body>
</html>
