<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Expires" content="-1">
<!--<meta name="viewport">-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta charset="utf-8">

<!-- impayDesign -->

<link href="css/common.css?v=1" rel="stylesheet" type="text/css">
<link href="./css/font_sb.css?v=1" rel="stylesheet" type="text/css">
<link rel="shortcut icon" type="image/x-icon" href="./images/IMPayFavicon.ico">

<!-- impayDesign -->

<link href="./impay_css/common.css?ver=202008241647" rel="stylesheet" type="text/css">
<title>imPAY</title>
</head>
<body class="default">
<div id="includehtml">
<div id="openAgreePayment"></div>
<!-- 2018-03-07 msuk SKT 휴대폰결제이용동의 절차 간소화 추가 레이어 제어 -->
<div id="pageview">
	<div class="wrap">
		<div id="header" class="header-grp">
			<h1>IMPAY</h1>
			<h2 class="payletter">페이레터</h2>
			<div class="simple-pay-history">
				<dl>
					<dt>제품명</dt>
					<dd>테스트상품</dd>
				</dl>
				<dl>
					<dt>결제금액</dt>
					<dd><strong>10</strong> <span>원</span></dd>
				</dl>
				<dl>
					<dt>결제일자</dt>
					<dd>2020.08.24</dd>
				</dl>
			</div>
		</div>
		<div id="content" class="content-grp">
			<div class="frm-grp">
				<div class="key-txt-box">
					<dl>
						<dt>휴대폰번호</dt>
						<dd><strong>010 1234 1234</strong></dd>
					</dl>
				</div>
				<div class="frm-box">
					<div class="row-wrap">
						<div class="row"> <span class="field">
							<label for="oneTimePassword" style="display: block;">인증번호 입력</label>
							<input type="tel" id="oneTimePassword" maxlength="6" class="inp-st numberOnly" autocomplete="off">
							</span> </div>
					</div>
					<div class="row-wrap">
						<p class="caution-txt">3분내 입력해 주세요 <strong id="remainTime">02:52</strong></p>
						<div class="btn-row">
							<button class="ins-btn" id="reSendBtn">인증번호 재요청</button>
						</div>
					</div>
				</div>
				<div class="frm-box solo-st02">
					<div class="row"> <span class="field">
						<label for="carryPin">휴대폰 결제 비밀번호(숫자6자리) 입력</label>
						<input type="tel" id="carryPin" maxlength="6" class="inp-st numberOnly" autocomplete="off" style="-webkit-text-security: disc;">
						</span> </div>
					<div class="row"> <span class="field">
						<label for="safePin">안심결제 비밀번호 입력</label>
						<input type="tel" id="safePin" maxlength="4" class="inp-st numberOnly" autocomplete="off" style="-webkit-text-security: disc;">
						</span> </div>
				</div>
				<ul class="rdo-chk-list f-sizeup">
					<!-- by hhno : LG 마케팅 플래그 삭제 처리

            <li>
                <input type="checkbox" class="frm-chk st01" id="lgPro" name="lgPro" />
                <label for="lgPro" tabindex="0">LG U+ 프로모션 참여 동의(선택)</label>
                <a href="javascript:;" class="linker" data-value="agreementType5" style="height: 30px;"></a>
            </li>
             -->
					<li>
						<input type="checkbox" class="frm-chk st01" id="agPro" name="agPro">
						<label for="agPro" class="other-line" tabindex="0">결제 내용을 확인하였습니다.<a href="javascript:;" class="tip-help">관련 도움말 보기</a></label>
						<div class="tip-help-box"> <strong>LGU+ 월 이용 한도액</strong><br>
							최대 50만원이며, 한도 관련 상세 내용은 U+고객센터 앱 또는 U+소액결제 앱(안드로이드)에서 확인 가능<br>
						</div>
						<p class="sub-txt"> 결제 요금은 다음달 휴대폰 요금에 합산 청구되며, 미납시 가산금이 부과될 수 있습니다. <a href="javascript:;" class="linker" data-value="agreementType1">약관참조</a> </p>
					</li>
				</ul>
			</div>
			<!--// form group -->
		</div>
		<div id="footer" class="footer-grp">
			<div class="main-footer">
				<div class="btn-grp">
					<div class="btn-row"> <span class="btn-cell fixed-width"><a href="javascript:;" id="btnCancel">취소</a></span> <span class="btn-cell"><a href="javascript:;" id="btnOk" class="point">결제하기</a></span> </div>
				</div>
			</div>
		</div>
	</div>
</div>
<div id="ads"></div>

<!--// loading -->

<!--// loading -->
</body>
</html>
