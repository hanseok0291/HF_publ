<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/setting.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="is-terms-page">
        <!-- container -->
        <div class="container setting-container">
          <!-- headline -->
          <div class="headline">
            <p>
              페이 약관 및 개인정보 처리 동의
            </p>
          </div>
          <!-- //headline -->

          <ul class="setting-list border-bottom">
            <li>
              <div class="btn-text-box">
                <p class="setting-name">라운드 페이 필수 동의 항목</p>
              </div>
              <a href="#">
                <i class="icon-arrow-right medium"></i>
              </a>
            </li>
          </ul>
          <ul class="setting-list">
            <li>
              <div class="btn-text-box">
                <p class="setting-name">정기결제 서비스</p>
              </div>
              <a href="#">
                <i class="icon-arrow-right medium"></i>
              </a>
            </li>
            <li>
              <div class="btn-text-box">
                <p class="setting-name">휘슬상품권 전환 서비스</p>
              </div>
              <a href="#">
                <i class="icon-arrow-right medium"></i>
              </a>
            </li>
          </ul>
        </div>
        <!-- //container -->

        <!-- bottom area -->
        <div class="bottom-area fixed">
          <!-- container -->
          <div class="container">
            <button
              id="send"
              class="btn"
              disabled
            >
            서비스 해지하기
            </button>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- loading -->
    <div class="modal modal-loading">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="loading">
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
          </div>
          <span class="sr-only">로딩 중</span>
        </div>
      </div>
    </div>
    <!-- //loading -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

  </body>
</html>
