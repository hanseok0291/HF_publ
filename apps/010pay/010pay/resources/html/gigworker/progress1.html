<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/gigworker.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker complete">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <h2>진행 현황</h2>
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap">
            <h3 class="mainTitle normal">
              종합 소득세 <br>
              <b>환급 신청이 완료</b> 되었어요.
            </h3>
            <p class="subText">환급액은 언제 입금되나요?</p>
          </div>

          <figure class="visualImg"></figure>

          <div class="detailTaxWrap">
            <div class="detailBox">
              <div class="topWrap">
                <span>예상 환급액</span>
                <b>568,248원</b>
              </div>
              <dl>
                <dt>환급 연도</dt>
                <dd>2020년, 2022년</dd>
                <dt>신청 수수료</dt>
                <dd>53,000원</dd>
                <dt class="normal">신청 일자</dt>
                <dd class="normal">2023년 5월 14일</dd>
              </dl>
            </div>
          </div>

          <div class="botBtnWrap">
            <!-- 버튼 비활성화 시 disable 클래스 -->
            <button type="button" class="bot-btn">확인</button>
            <button type="button" class="text-btn"><span class="mainColor">전문 세무사</span><span>의 도움도 필요해요</span> <i class="arrow-right"></i></button>
          </div>
        </div>
        </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->
    
    <script>
    </script>
  </body>
</html>
