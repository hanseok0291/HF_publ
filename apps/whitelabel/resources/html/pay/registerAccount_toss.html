</head>

<body>

<!-- wrap -->
<div id="wrap" class="wrap new register-account-toss-page">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">결제 수단 등록</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main>
			<!-- container -->
			<div class="container">
				<!-- headline (피그마: 토스 앱 강조 + 본문) -->
				<h2 class="headline register-account-toss-headline"><strong><span class="register-account-toss-accent">토스 앱</span>에서<br>
					계좌 선택 및 인증해주세요.</strong></h2>
				<!-- //headline -->

				<!-- section -->
				<section>
					<h3 class="hidden">토스 연동</h3>
					<!-- register account toss -->
					<div class="register-account-toss-stack">
						<div class="register-account-toss-hero">
							<div class="register-account-toss-logo-wrap">
								<!-- 시안 이미지 Export 시 이 경로로 교체 가능 -->
								<img class="register-account-toss-logo" src="../../images/logo/bank/v2/logo_092.png" width="56" height="52" alt="토스">
							</div>
							<a class="register-account-toss-app-btn" href="#" aria-label="토스 앱으로 이동">토스 앱으로 이동하기</a>
						</div>
						<p class="register-account-toss-direct-wrap">
							<a class="register-account-toss-direct" href="registerAccount.html">직접 입력하시겠습니까?</a>
						</p>
					</div>
					<!-- //register account toss -->

				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->

		<!-- footer -->
		<footer>
			<!-- container -->
			<div class="container">
				<p class="register-account-toss-footer-hint">인증이 완료되면 “인증완료”를 눌러주세요.</p>

<!-- modal - common -->
<div id="commonAlert" class="modal fade common new" tabindex="-1" role="dialog" aria-label="알림" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title"></h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common new" tabindex="-1" role="dialog" aria-label="창 닫기 확인" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title"></h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary new" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(function () {
		var $authBtn = $('#btnAuthDone');
		var $appBtn = $('.register-account-toss-app-btn');
		var appMoveTimer = null;
		var DELAY_MS = 3000;

		// 토스 인증 API 응답 모의: 실연동 시 제거·fetch 등으로 교체 (true=인증 성공, false=미인증 안내)
		var MOCK_TOSS_AUTH_OK = false;

		/** [앱으로 이동하기] 클릭마다 3초 대기 타이머만 리셋. 대기 중에는 인증완료 버튼 비활성 유지 */
		function scheduleAuthButtonEnable() {
			if (appMoveTimer) {
				clearTimeout(appMoveTimer);
				appMoveTimer = null;
			}
			$authBtn.prop('disabled', true);
			appMoveTimer = setTimeout(function () {
				appMoveTimer = null;
				$authBtn.prop('disabled', false);
			}, DELAY_MS);
		}

		$appBtn.on('click', function (e) {
			e.preventDefault();
			scheduleAuthButtonEnable();
			// 실서비스: 토스 앱 딥링크 등
		});

		$authBtn.on('click', function () {
			if ($(this).prop('disabled')) {
				return;
			}
			verifyTossAuthAndHandle();
		});

		/** 인증완료 클릭 → 토스 인증 결과 API(모의). 미인증 시 안내 문구, 성공 시 등록완료 안내 */
		function verifyTossAuthAndHandle() {
			// 실연동: $.ajax/fetch 후 응답 분기
			var authenticated = MOCK_TOSS_AUTH_OK;

			$('#alertTitle').text('');
			if (!authenticated) {
				$('#alertContents').html('인증이 완료되지 않았습니다.<br>다시 시도하시겠습니까?');
				$('#commonAlert').modal('show');
				return;
			}
			$('#alertContents').text('등록이 완료되었습니다.');
			$('#commonAlert').modal('show');
		}
	});
</script></body>
</html>
