<body>
<!-- wrap -->
<div id="wrap" class="wrap en">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">back</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">notice</i></button>
				<button type="button" id="closeWindowEn" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">close</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content" class="giftcard-pay">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">Credit Card</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">Test goods</p>
					<p class="prd-price"><strong class="price text-primary">$<em class="value">1.52</em>USD</strong> </p>
					<p class="prd-period">Payment Date : 2023-01-12</p>
				</div>
				<!-- //주문정보 -->

				<!-- 정보 입력 -->
				<div class="section">
					<ul class="form-type">
						<li>
							<div class="input input-credit">
								<div class="input-wrap">
									<input type="tel" class="input" maxlength="4" id="cardNum1" placeholder="CardNumber">
									<span class="dash">-</span>
									<input type="tel" class="input" maxlength="4" id="cardNum2">
									<span class="dash dash2">-</span>
									<input type="password" class="input" maxlength="4" id="cardNum3">
									<span class="dash dash3">-</span>
									<input type="password" class="input" maxlength="4" id="cardNum4">
								</div>
								<!-- <div class="text-placeholder">Card Number</div> -->
								<div class="card-brand">
									<img src="../../../images/custom/logo/visa.png" alt="" class="visa">
									<img src="../../../images/custom/logo/mclogo-for-footer.svg" alt="" class="master">
									<img src="../../../images/custom/logo/jcb_emblem_logo.svg" alt="" class="jcb">
								</div>
							</div>
							<div class="text-error"></div>
						</li>
						<li>
							<div class="pull-type2">
								<select class="pull-left">
									<option value="">Expiration(MM)</option>
									<option value="">01</option>
								</select>
								<select class="pull-right">
									<option value="">Expiration(YY)</option>
									<option value="">20</option>
								</select>
							</div>
							<div class="text-error"></div>
						</li>
					</ul>
				</div>
				<!-- //정보 입력 -->

				<!-- 결제 정보 메일 -->
				<div class="section">
					<div class="form-type">
						<div class="checkbox square">
							<input type="checkbox" name="emailSend" id="emailSend">
							<label for="emailSend">Receive payment information (optional)</label>
						</div>
						<input type="text" name="email" id="email" placeholder="Email Address">
						<div class="text-error"></div>
					</div>
				</div>
				<!-- //결제 정보 메일 -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary" disabled>Pay Now</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 공지사항 상세 -->
<div id="noticeDetail" class="modal modal-full" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- 게시판 상세 -->
					<div class="board-detail">
						<h3 class="subject">notice title</h3>
						<div class="content">
							notice detail
						</div>
					</div>
					<!-- //게시판 상세 -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">Agree</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 공지사항 상세 -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">Agree</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">No</button>
				<button type="button" id="confirmOk" class="btn">Yes</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">loading</div>
<!-- //loading -->

<script>
	$(document).ready(function() {
		// 신용카드 번호 구분 기호(-) 활성
		var $creditInput = $(".input-credit .input");
		var $creditWrap = $(".input-credit");
		var $cardWrap = $(".card-brand");

		var changeChk1 = 0;
		var changeChk2 = 0;
		var changeChk3 = 0;
		$('#cardNum1').on('click keyup', function() {
			var charLimit = $(this).attr("maxlength");
			if(changeChk1 == 0) {
				if (this.value.length == 4) {
					changeChk1 = 1;
					$('#cardNum2').focus();
					var cardBrandCheck = document.getElementById('cardNum1');
					if (cardBrandCheck.value.length == '4') {
						if (cardBrandCheck.value >= 4000 && cardBrandCheck.value < 5000) {
							$('.card-brand img').hide();
							$('.visa').show();
						} else if (cardBrandCheck.value >= 5100 && cardBrandCheck.value < 5599) {
							$('.card-brand img').hide();
							$('.master').show();
						} else if (cardBrandCheck.value >= 2221 && cardBrandCheck.value < 2721) {
							$('.card-brand img').hide();
							$('.master').show();
						} else if (cardBrandCheck.value == 3528 || cardBrandCheck.value == 3589) {
							$('.card-brand img').hide();
							$('.jcb').show();
						} else {
							$('.card-brand img').hide();
						}
					} 
				}
				return true;
			} else if (changeChk1 == 1) {
				if (this.value.length == 4) {
					$('.card-brand img').hide();
					changeChk1 = 0;
				}
				return false;
			}
		});
		$('#cardNum2').on('click keyup', function() {
			var charLimit = $(this).attr("maxlength");
			if(changeChk2 == 0) {
				if (this.value.length == 4) {
					changeChk2 = 1;
					$('#cardNum3').focus();
				}
				return true;
			} else if (changeChk2 == 1) {
				if (this.value.length == 4) {
					changeChk2 = 0;
				}
				return false;
			}
		});
		$('#cardNum3').on('click keyup', function() {
			var charLimit = $(this).attr("maxlength");
			if(changeChk3 == 0) {
				if (this.value.length == 4) {
					changeChk3 = 1;
					$('#cardNum4').focus();
				}
				return true;
			} else if (changeChk3 == 1) {
				if (this.value.length == 4) {
					changeChk3 = 0;
				}
				return false;
			}
		});

		// 입력 값 상태별 UI
		$creditInput.on('click keyup', function() {
			// 입력 글자 수 체크
			var valTotal = 0;
			for (var i=0; i<4; i++) {
				valTotal += $creditInput.eq(i).val().length;
			}			

			// 입력 값 유무
			if (valTotal == 0) {
				$creditInput.eq(0).focus(); // 클릭 시 첫번째 input 포커스
				$creditWrap.removeClass("fill").addClass("focus"); // 입력 값 없는 경우 UI
				$cardWrap.hide(); // 입력 값 없는 경우 카드CI 비노출
			} else if (valTotal == 4) {
				// 카드 브랜드 체크
				var cardBrandCheck = document.getElementById('cardNum1');
				if (cardBrandCheck.value.length == '4') {
					if (cardBrandCheck.value >= 4000 && cardBrandCheck.value < 5000) {
						$('.card-brand img').hide();
						$('.visa').show();
					} else if (cardBrandCheck.value >= 5100 && cardBrandCheck.value < 5599) {
						$('.card-brand img').hide();
						$('.master').show();
					} else if (cardBrandCheck.value >= 2221 && cardBrandCheck.value < 2721) {
						$('.card-brand img').hide();
						$('.master').show();
					} else if (cardBrandCheck.value == 3528 || cardBrandCheck.value == 3589) {
						$('.card-brand img').hide();
						$('.jcb').show();
					} else {
						$('.card-brand img').hide();
					}
				} 
			} else {
				$cardWrap.show();
				$creditWrap.addClass("fill"); // 입력 값 있는 경우 UI
			}
		});

		var varUA = navigator.userAgent.toLowerCase(); //userAgent 값 얻기
 	
		if (varUA.match('android') != null) { 
			$('.en.wrap').addClass('aos');
			// alert('접속기기가 안드로이드입니다.');//안드로이드 일 경우 실행문구
		} else if (varUA.indexOf("iphone")>-1||varUA.indexOf("ipad")>-1||varUA.indexOf("ipod")>-1) { 
			// alert('접속기기가 iOS입니다.');//iOS 일 경우 실행문구
			$('.en.wrap').addClass('ios');
		} else {
			// alert('접속기기가 안드로이드나 iOS가 아닙니다.');//나머지 일 경우 실행문구
		}
	})
</script>
</body>
</html>
