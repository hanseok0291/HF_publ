<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <!-- [2026-06-17] renewal-v2 stylesheet -->
        <link rel="stylesheet" href="../../css/common_renewal_v2.css" />
        <!-- //[2026-06-17] renewal-v2 stylesheet -->
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <!-- [2026-06-23] renewal-v2 적용 — PIN 설정 (Figma pin · 가입 완료) -->
        <div id="wrap" class="renewal-v2">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title"></h2>
                        <button
                            type="button"
                            class="btn-close js-change-btn"
                            data-title="비밀번호를 설정하면<br>더 빠르고 안전하게 이용할 수 있어요."
                            data-message="다음에 하시겠어요?"
                            data-cancel="다음에"
                            data-confirm="설정하기"
                        >
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!--  -->
                <div id="passwordSet" class="">
                    <div class="password-wrap">
                        <div>
                            <div class="content-wrap">
                                <p class="password-set-subtitle">가입이 완료됐어요</p>
                                <h3 class="title">
                                    간편하고 안전한 이용을 위해<br />
                                    비밀번호를 설정해주세요.
                                </h3>

                                <!-- <p class="noti-text">동일/연속된 숫자, 생년월일, 휴대폰 번호는 사용할 수 없어요.</p> -->

                                <div class="input-mark">
                                    <span class="mark"
                                        ><i id="pwd_01"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i
                                    ></span>
                                </div>

                                <div class="mark-box">
                                    <img src="../../images/common/security_keypad.png" alt="" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- //container -->
                <!--  -->
            </div>
            <!-- //content -->
        </div>
        <!-- //[2026-06-23] renewal-v2 적용 — PIN 설정 (Figma pin · 가입 완료) -->
        <!-- //wrap -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->

        <script>
            /* setTimeout(function () {
                window.location.href = "./registerAccount_step4.html";
            }, 3000); */
        </script>
    </body>
</html>
