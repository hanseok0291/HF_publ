<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />
    <link rel="stylesheet" href="../../css/slick.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <!-- 230310 검토 -->
  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker acceptAgree">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <!-- <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button> -->
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap">
            <h3 class="mainTitle normal"> 
              이제 마지막으로 <br>
              <b>수임동의</b>가 필요해요.
            </h3>
          </div>

          <div class="noteWrap">
            <p class="title">수임동의란?</p>
            <ul class="note">
              <li>홈택스상에 내 세무 신고를 대리할 전문 세무사를 등록하는 데
                동의함을 말해요. 서비스 이용을 위해선 필요한 단계예요.</li>
              <li>신고 완료 후엔 언제든 010PAY 앱에서 수임동의를 <br>
                해지할 수 있어요.</li>
            </ul>
          </div>
          
          <div class="botBtnWrap">
            <!-- 버튼 비활성화 시 disable 클래스 -->
            <button type="button" class="bot-btn">동의해요</button>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <div id="commonAlert" class="modal" style="display: none;">
      <div class="modal-dialog" style="margin-top: -95px;">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">
              다른 서비스를 통해 <br>
              조회 및 신고하신 적이 있나요? <br>
              현재 홈택스상에 등록된 세무 대리인이 <br>
              있습니다. 계속하려면 기존 세무 대리인 <br>
              해임이 필요합니다.
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="modalClose();" class="btn btn-confirm">취소</button>
            <button type="button" onclick="modalClose();" class="btn btn-confirm">해임하기</button>
          </div>
        </div>
      </div>
    </div>


    <script>

    </script>
  </body>
</html>
