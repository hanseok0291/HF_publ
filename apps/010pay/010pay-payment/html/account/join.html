<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>내통장결제</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../resources/css/jquery-ui.css" />
        <link rel="stylesheet" href="../../resources/css/common_renewal.css" />
        <link rel="stylesheet" href="../../resources/css/join.css" />
        <!--[if lt IE 9]>
            <script type="text/javascript" src="../../js/html5shiv.js"></script>
            <script type="text/javascript" src="../../js/respond.min.js"></script>
        <![endif]-->
        <script src="../../resources/js/jquery.3.4.1.min.js"></script>
        <script src="../../resources/js/jquery.placeholder.min.js"></script>
        <script src="../../resources/js/jquery-ui.js"></script>
        <script src="../../resources/js/design_renewal.js" defer="defer"></script>
        <script src="../../resources/js/commonmsg.js"></script>
        <script src="../../resources/js/commonutil.js"></script>
        <script src="../../resources/js/owl.carousel.min.js"></script>
    </head>
    <body>
        <!-- wrap -->
        <div id="wrap">
            <div class="step1">
                <!-- header -->
                <div id="header">
                    <div class="container">
                        <button type="button" class="btn-close">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
                <!-- //header -->

                <!-- content -->
                <div id="content">
                    <!-- container -->
                    <div class="container">
                        <!-- headline -->
                        <div class="headline">
                            <p>휴대폰 번호를 입력해 주세요</p>
                        </div>
                        <!-- //headline -->

                        <!-- section -->
                        <div class="section">
                            <ul class="form-type">
                                <li>
                                    <div class="input-container label-n">
                                        <input type="text" class="custom-input" placeholder=" " id="accountNumber" />
                                        <label for="accountNumber" class="floating-label">휴대폰 번호</label>
                                        <button type="button" class="icon icon-del js-text-del"></button>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <!-- //section -->
                    </div>
                    <!-- //container -->

                    <!-- bottom area -->
                    <div class="bottom-area">
                        <!-- container -->
                        <div class="container">
                            <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
                            <button type="button" id="send" class="btn" disabled>다음</button>
                        </div>
                        <!-- //container -->
                    </div>
                    <!-- //bottom area -->
                </div>
                <!-- //content -->
            </div>

            <div class="step2">
                <!-- header -->
                <div id="header">
                    <div class="container">
                        <button type="button" class="btn-close">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
                <!-- //header -->

                <!-- content -->
                <div id="content">
                    <!-- container -->
                    <div class="container">
                        <!-- headline -->
                        <div class="headline">
                            <p>주민등록번호를 알려주세요</p>
                        </div>
                        <!-- //headline -->

                        <!-- section -->
                        <div class="section">
                            <ul class="form-type">
                                <li>
                                    <div class="input-container label-n">
                                        <input type="text" class="custom-input" placeholder=" " id="accountNumber" />
                                        <label for="accountNumber" class="floating-label">휴대폰 번호</label>
                                        <button type="button" class="icon icon-del js-text-del"></button>
                                    </div>
                                </li>
                                <li>
                                    <div class="select-box">
                                        <button class="label" onclick="modalOpenSlide('modal-select-phone-info')">통신사</button>
                                        <span class="floating-label">통신사</span>
                                    </div>
                                </li>
                                <li>
                                    <div class="input-container label-n id-number">
                                        <div>
                                            <input type="text" class="custom-input" placeholder="" id="accountNumber3" maxlength="6" />
                                            <label for="accountNumber3" class="floating-label first">생년월일</label>
                                        </div>
                                        <em class="dash">-</em>
                                        <div>
                                            <input type="text" class="custom-input" placeholder="0" id="accountNumber4" maxlength="1" />
                                            <!-- <label for="accountNumber4" class="floating-label"></label> -->
                                            <span class="id-mark">
                                                <i></i>
                                                <i></i>
                                                <i></i>
                                                <i></i>
                                                <i></i>
                                                <i></i>
                                            </span>
                                        </div>
                                        <button type="button" class="icon icon-del js-text-del"></button>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <!-- //section -->
                    </div>
                    <!-- //container -->

                    <!-- content -->
                    <div id="content">
                        <!-- container -->
                        <div class="container">
                            <!-- headline -->
                            <div class="headline">
                                <p>휴대폰 번호를 입력해 주세요</p>
                            </div>
                            <!-- //headline -->

                            <!-- section -->
                            <div class="section">
                                <ul class="form-type">
                                    <li>
                                        <div class="input-container label-n">
                                            <input type="text" class="custom-input" placeholder=" " id="accountNumber" />
                                            <label for="accountNumber" class="floating-label">휴대폰 번호</label>
                                            <button type="button" class="icon icon-del js-text-del"></button>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <!-- //section -->
                        </div>
                        <!-- //container -->

                        <!-- bottom area -->
                        <div class="bottom-area">
                            <!-- container -->
                            <div class="container">
                                <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
                                <button type="button" id="send" class="btn">다음</button>
                            </div>
                            <!-- //container -->
                        </div>
                        <!-- //bottom area -->
                    </div>
                    <!-- //content -->
                </div>
            </div>
            <!-- //wrap -->

            <!-- loading -->
            <div class="modal modal-loading">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="loading">
                            <span class="loading-bar"></span>
                            <span class="loading-bar"></span>
                            <span class="loading-bar"></span>
                        </div>
                        <span class="sr-only">로딩 중</span>
                    </div>
                </div>
            </div>
            <!-- //loading -->

            <!-- common alert -->
            <div id="commonAlert" class="modal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-body">
                            <h3 id="alertTitle"></h3>
                            <p id="alertContents"></p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //common alert -->

            <!-- common prompt -->
            <div id="commonPrompt" class="modal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-body">
                            <h3 id="promptTitle"></h3>
                            <p id="promptContents"></p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
                            <button type="button" id="promptOk" class="btn btn-confirm">확인</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //common prompt -->
            <!-- select modal bank -->
            <div id="modal-select-phone-info" class="modal modal-slide type-select type-title">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-head">
                            <p class="modal-head-title">통신사 선택</p>
                            <button type="button" class="btn btn-close">
                                <i class="icon-close"></i>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="container">
                                <ul class="btn-list">
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">SKT</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">KT</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">LG U+</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">SKT 알뜰폰</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">KT 알뜰폰</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                    <li class="option-item">
                                        <button type="button" class="btn">
                                            <em class="label">LG U+ 알뜰폰</em>
                                            <i class="icon-check-on"></i>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- //select modal list -->
    </body>
</html>
