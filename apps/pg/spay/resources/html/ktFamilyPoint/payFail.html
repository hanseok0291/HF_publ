<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/ktFamilyPoint/logo.png" alt="KT 패밀리포인트"></span></h1>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content" class="pay-fail">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<h2>결제 실패</h2>
				</div>
				<!-- //headline -->

				<!-- seection -->
				<div class="section">
					<h3 class="text-danger">결제 실패되었습니다.</h3>
					<p class="word-break">사용자가 거래를 취소하였습니다.<br>
						[실패코드 : 0031]</p>
				</div>
				<!-- //seection -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary">닫기</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->
