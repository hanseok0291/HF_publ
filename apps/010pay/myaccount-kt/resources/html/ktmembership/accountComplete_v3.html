<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../ktmembership/css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../ktmembership/js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
	<div id="wrap" class="version-v3">
		<!-- header-v3 (로고 중앙 · 뒤로 — v2와 동일하게 닫기 없음) -->
		<div id="header" class="header-v3">
			<div class="container">
				<div class="page-title">
					<h2 class="title">
						<img src="../../ktmembership/images/logo.svg" class="header-brand-v3__logo" width="73" height="24"
							alt="내통장결제"></h2>
				</div>
				<button type="button" id="closeWindow" class="btn-close btn-close-v3"><i
						class="icon icon-close-v3">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

	<!-- content -->
	<div id="content" class="pay-success kt-ui">
		<!-- container -->
		<div class="container">
			<!-- 페이지 타이틀·스텝 (헤더 → 본문 상단) -->
			<div class="page-head">
				<h2 class="page-head__title">계좌 등록 완료</h2>
				<ul class="top-step">
					<li>1</li>
					<li>2</li>
					<li>3</li>
					<li>4</li>
					<li class="active">5</li>
				</ul>
			</div>
			<!-- //페이지 타이틀·스텝 -->

			<!-- 계좌 -->
			<div class="section">
				<div class="well account-box">
					<div class="logo"><img src="../../ktmembership/images/bank/fullname_089.png?ver=1.1" alt="케이뱅크"></div>
					<div class="number">123********001</div>
				</div>
			</div>
			<!-- //계좌 -->

			<!-- headline -->
			<div class="headline type2">고객님의 계좌가<br> 안전하게 등록되었습니다.</div>
			<!-- //headline -->

			<!-- submit button -->
			<div class="submit-btn fixed">
				<button type="button" id="send" class="btn on">확인</button>
			</div>
			<!-- //submit button -->
		</div>
		<!-- //container -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩 중</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onClick="modalClose();" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onClick="modalClose();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
