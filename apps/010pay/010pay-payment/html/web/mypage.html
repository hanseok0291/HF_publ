<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/mypage.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/commonutil.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title">
              <img
                class="rrpay-logo"
                src="../../images/web/round_pay_logo.svg"
                alt="RROUND PAY"
              />
            </h2>
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container mypage-container">
          <dl>
            <dt>이름</dt>
            <dd>김라운</dd>
          </dl>
          <dl>
            <dt>휴대폰 번호</dt>
            <dd>010-1234-5678</dd>
          </dl>
          <div class="btn-wrap">
            <button type="button" class="btn tertiary">
              본인인증 후 회원정보 변경
            </button>
          </div>
          <dl>
            <dt>비밀번호</dt>
            <dd>
              <button type="button" class="btn tertiary small">변경하기</button>
            </dd>
          </dl>
          <dl>
            <dt>
              이메일 수신 설정
              <!-- <span class="email-status">ON</span> -->
              <span class="email-status off">OFF</span>
            </dt>
            <dd>
              hecto@hecto.co.kr
              <button type="button" class="icon-arrow-right"></button>
            </dd>
          </dl>
          <dl>
            <dt>탈퇴하기</dt>
            <dd><button type="button" class="icon-arrow-right"></button></dd>
          </dl>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <script>
      $(function () {});
    </script>
  </body>
</html>
