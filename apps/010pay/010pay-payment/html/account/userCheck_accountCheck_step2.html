<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/join.css" />
    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/commonutil.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <div class="step2">
        <!-- header -->
        <div id="header">
          <div class="container">
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
        <!-- //header -->

        <!-- content -->
        <div id="content">
          <!-- container -->
          <div class="container">
            <!-- headline -->
            <div class="headline">
              <p>입금된 1원의 입금자명을 <br>입력해 주세요</p>
            </div>
            <!-- //headline -->

            <!-- section -->
            <div class="section">
              <div class="account-wrap">
                <div class="account-box">
                  <img src="../../images/payment/bank/sm.png" alt="새마을금고">
                  <p class="bank-text">
                    새마을금고 <br>
                    9003229878782
                  </p>
                </div>
                <button type="button" class="change-btn">변경<i class="icon-arrow-right medium"></i></button>
              </div>
              <ul class="form-type">
                <li class="">
                  <div class="input-container label-n">
                      <input type="number" class="custom-input" placeholder=" " id="accountNumber" />
                      <label for="accountNumber" class="floating-label">입금자명</label>
                      <button type="button" class="icon icon-del js-text-del"></button>
                  </div>
                  <p class="input-info-text">입금자명에 OOOO을 입력해주세요.</p>
                </li>
              </ul>
            </div>
            <!-- //section -->
          </div>
          <!-- //container -->

          <!-- bottom area -->
          <div class="bottom-area">
            <!-- container -->
            <div class="container">
              <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
              <button
                type="button"
                id="nextBtn"
                class="btn"
              >
                다음
              </button>
            </div>
            <!-- //container -->
          </div>
          <!-- //bottom area -->
        </div>
        <!-- //content -->
      </div>
    </div>
    <!-- //wrap -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">
              입금자명을 다시 확인해주세요.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->
  </body>
</html>
