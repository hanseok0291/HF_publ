    <script>
        $(document).ready(function () {
            // option-list 내의 모든 li 요소에 클릭 이벤트 리스너 추가
            $(".option-list li").click(function () {
                // 모든 li에서 select 클래스 제거
                $(".option-list li").removeClass("select");

                // 클릭한 li에만 select 클래스 추가
                $(this).addClass("select");
            });

            // id가 modal-select-bank인 모달 내의 option-item 클릭 이벤트 추가
            $("#modal-select-bank .option-item").on("click", function () {
                // id가 accountNumber인 요소로 포커스 이동
                $("#accountNumber").focus();
            });

            modalOpenSlide("modal-select-bank");
        });
    </script>
