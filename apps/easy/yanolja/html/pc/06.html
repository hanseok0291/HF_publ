<!DOCTYPE html>
<html lang="ko">
<head>

<title>간편결제</title>
<style type="text/css">
	.input_mark {position:relative; display:block; background-color : transparent; border:0; z-index:1}
	.input_mark .mark i { display: inline-block; vertical-align: middle; width: 34px; height: 34px; margin-left: 10px; background-image: url(../../resources/images/common2.png); background-position: -113px -101px; }
	.input_mark .mark i.on { background-position: -156px -101px; }
	.pwset_area .input, .pwset_area .input_mark {margin: 3.5rem 0 5rem}
	input.password {background:transparent; z-index:-1; position:absolute; left:0px; border:0px; visibility:hidden}
</style>
</head>

<body>
	<header id="header">
		<h1>결제진행</h1>
		<button type="button" class="btn_cls"><i class="ico_com ico_cls">창닫기</i></button>
	</header>

	<div id="ct">
		<div class="bank_slide">
			<button type="button" onclick="findPwdConfirm();" class="btn_bankadm">계좌/비밀번호 관리<i class="ico_com ico_set"></i></button>
			<div class="swiper-container">
				<ul class="swiper-wrapper">
					<li class="swiper-slide">
						<span class="ticket">
							<span class="flex">
								<img src="../../resources/images/bank/fullname_04.png" alt="KEB하나은행">
								<strong class="num">110*********758</strong>
							</span>
						</span>
					</li>
				</ul>
			</div>
		</div>
		<!-- //계좌(slide) -->
		<div class="ars_form mty">
			<p class="pay"><span>결제금액</span> <strong><b class="fc_reg">1,000</b>원</strong></p>
			<div class="pw_bg">
                <section class="firstPw">
                    <span class="input_mark pay_input" data-passwd="payPwd">
                    	<input type="password" readonly="readonly" class="tc password nppfs-npv ls focus" style="height: 7rem; background-color: rgb(255, 204, 0); color: rgb(0, 0, 0);" npkencrypt="on" data-keypad-type="num" data-keypad-theme="default" maxlength="6" name="payPwd" id="payPwd" data-keypad-next="__hide__" size="6" value="" data-keypad-type-y="bottom" nppfs-keypad-uuid="nppfs-keypad-payPwd" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_8d4a2a9a1d42" nppfs-readonly="true">
						<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
                    </span>
                </section>
				<p class="txt_cm_cau">결제 비밀번호 6자리 입력</p>
			</div>
			<p class="error fc_reg tc"></p>

			<ul class="brb0">
				<li class="tax">
					<span class="control">
						<span class="checkbox ty">
							<input type="checkbox" name="tax" id="tax" checked="checked"><label for="tax" class="on">현금영수증 : <span id="csrcRegNo_text">01035075520</span></label>
						</span>
						<button type="button" class="btn_taxchg">변경</button>
					</span>
					<!-- 개인소득공제용 -->
					<div class="skipbx" style="margin-bottom: 5px;">
						<select id="issPurpsDivCd" name="issPurpsDivCd">
							<option value="0" selected="">개인소득공제용</option>
							<option value="1">지출증빙용</option>
						</select>
						<div id="tax0" class="row taxbx" style="display: block;">
							<span class="input"><span class="checkbox ty3"><input type="radio" name="private" id="private1" checked="">
									<label for="private1" class="on"></label></span>
								<input data-type="tax_text" data-isspurpsdivcd="0" data-csrcregnodivcd="4" type="tel" name="tax0_1" id="tax0_1" placeholder="휴대폰번호(-없이 입력)" maxlength="11" value="01035075520">
								<button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button>
							</span>
							<span class="input"><span class="checkbox ty3"><input type="radio" name="private" id="private2">
									<label for="private2" class=""></label></span>
								<input data-type="tax_text" data-isspurpsdivcd="0" data-csrcregnodivcd="1" type="tel" name="tax0_2" id="tax0_2" placeholder="현금영수증 카드번호 입력" maxlength="" value="">
								<button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button>
							</span>
						</div>
						<div id="tax1" class="row taxbx" style="display: none;">
							<span class="input"><span class="checkbox ty3"><input type="radio" name="report" id="report1">
									<label for="report1" class=""></label></span>
								<input data-type="tax_text" data-isspurpsdivcd="1" data-csrcregnodivcd="3" type="tel" name="tax1_1" id="tax1_1" placeholder="사업자번호 입력(-없이 입력)" maxlength="10" value="">
								<button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button>
							</span>
							<span class="input"><span class="checkbox ty3"><input type="radio" name="report" id="report2">
									<label for="report2" class=""></label></span>
								<input data-type="tax_text" data-isspurpsdivcd="1" data-csrcregnodivcd="1" type="tel" name="tax1_2" id="tax1_2" placeholder="현금영수증 카드번호 입력" maxlength="" value="">
								<button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button>
							</span>
						</div>
						<div class="btn_save"><button type="button" onclick="cashReg();" class="btn_x btn_type2">저장</button></div>
					</div>
					<!-- //개인소득공제용 -->
				</li>
			</ul>
			<script type="text/javascript">
				$('[data-type="tax_text"]').keyup(function() {

					$(this).val($(this).val().replace(/[^0-9]/g, ""));

					var $selectObj = $(this);

					$('[data-type="tax_text"]').each(function() {
						if ($selectObj.attr("id") == $(this).attr("id")) {
							$(this).parent().find('input[type=radio]').attr("checked", true);
							$(this).parent().find('label').addClass('on');
						} else {
							$(this).parent().find('input[type=radio]').attr("checked", false);
							$(this).parent().find('label').removeClass('on');
							$(this).val("");
						}
					});
				});

				function cashReg() {
					var _issPurpsDivCd;
					var _csrcRegNo;
					var _csrcRegNoDivCd;

					$('input[data-type=tax_text]').each(function() {
						if ($(this).val()) {
							_issPurpsDivCd = $(this).attr('data-issPurpsDivCd');
							_csrcRegNo = $(this).val();
							_csrcRegNoDivCd = $(this).attr('data-csrcRegNoDivCd');
							return;
						}
					});

					//현금영수증 저장
					$.ajax({
						type: "post",
						url: "/ajax/std/csrc/reg",
						dataType: "json",
						data: {
							issPurpsDivCd: _issPurpsDivCd,
							csrcRegNoDivCd: _csrcRegNoDivCd,
							csrcRegNo: _csrcRegNo
						},
						success: function(data) {

							var statCd = data.outStatCd;
							var rsltCd = data.outRsltCd;
							var rsltMsg = data.outRsltMsg;

							if (statCd == "0021") {
								if (!_csrcRegNo) {
									$("#csrcRegNo_text").text("없음");
									$("#tax").attr("checked", false);
									$('label[for=tax]').removeClass('on');
								} else {
									$("#csrcRegNo_text").text(_csrcRegNo);
									$("#tax").attr("checked", true);
									$('label[for=tax]').addClass('on');
								}
							} else if (rsltCd == "session") {
								$("#frm").attr('action', '/ui/view/legacy/error/session').submit();
							} else {
								alert(rsltMsg);
							}
						},
						error: function(e) {
							npVCtrl.resetKeypad("payPwd");
							alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
							return false;
						}
					});
				}

				// 현금영수증 컨트롤
				$(function() {
					var btn = $('.btn_taxchg');
					var save = $('.btn_save button');
					var pw = $('.pw input');
					btn.on('click', function() {
						//보안키패드 숨김
						npVCtrl.hideKeypad("payPwd");
						$('.skipbx').show();
					});
					save.on('click', function() {
						$('.skipbx').removeAttr('style');
					});
					pw.on('focus', function() {
						$('.skipbx').removeAttr('style');
					});

					$("select").change(function() {
						var str = "";
						$("select option:selected").each(function() {
							str += $(this).index();
						});
						$('.row').hide();
						$('#tax' + str).show();
						$('[data-type="tax_text"]').each(function() {
							if ($(this).val()) {
								$(this).focus();
							}
						});
					});

					var csrcRegNo = '01035075520';

					if (!csrcRegNo) {
						$("#csrcRegNo_text").text("없음");
						$("#tax").attr("checked", false);
						$("#tax").parent().find('label').removeClass('on');
					} else {
						var cashReceiptCheckedYn = 'true';
						if (cashReceiptCheckedYn == 'true') {
							$("#tax").attr("checked", true);
							$("#tax").parent().find('label').addClass('on');
						} else {
							$("#tax").attr("checked", false);
							$("#tax").parent().find('label').removeClass('on');
						}
					}

					var str = "";
					$("select option:selected").each(function() {
						str += $(this).index();
					});
					$('.row').hide();
					$('#tax' + str).show();

					$('[data-type="tax_text"]').each(function() {
						if ($(this).val()) {
							$(this).focus();
						}
					});
					$("#tax").on('change', function() {
						if ($("#csrcRegNo_text").text() == "없음") {
							$("#tax").attr("checked", false);
							$("#tax").parent().find('label').removeClass('on');

							npVCtrl.hideKeypad("payPwd");
							$('.skipbx').show();
						}
					});
				});
			</script>
		</div>
		<div class="btn_cm_btm mty"><button type="button" onclick="findPwdConfirm('pwd');"><u>비밀번호 초기화</u></button></div>

	</div>
	<!-- //content -->

</body>

</html>
