
<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>010PAY</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<meta name="format-detection" content="telephone=no, address=no, email=no">
		
	<style>
		body { font-family: 'Pretendard', 'Malgun Gothic', 'Dotum', sans-serif; font-size: 14px; letter-spacing: -0.02em; }
		img { width: 100%; vertical-align: top; border: 0 none;}
		.bridgeImgWrap { width: 100%; margin: 0 auto; min-width: 280px; max-width: 700px; text-align: center; color: #151515; padding-top: 26.5%; }
		.bridgeImgWrap .imgBox { margin: 0 auto; max-width: 150px; border-radius: 75px; border: 1px solid #f1f1f1; overflow: hidden; }
		.bridgeImgWrap .infoBrand { font-size: 12px; line-height: 12px; margin-top: 15px; font-weight: 700; }
		.bridgeImgWrap .infoProduct { font-size: 14px; line-height: 14px; margin-top: 6px; }
		.bridgeImgWrap .infoText {font-size: 18px; line-height: 24px; margin-top: 25px; }
		.bridgeImgWrap .dotPulse { display: flex; justify-content: center; }
		.bridgeImgWrap .dot-pulse { margin-top: 26px; position: relative; display: flex; align-items: center; justify-content: center; }
		.bridgeImgWrap .bridgeLogo { position: fixed; left: 0; bottom: 37px; width: 100%; height: 13px; margin: 0 auto; text-align: center; }
		.bridgeImgWrap .bridgeLogo img { height: 100%; }
		.bridgeImgWrap .italic { font-style: italic; }
		.bridgeImgWrap .dot-pulse { position: relative; display: flex; align-items: center; justify-content: space-between; width: 28px; height: calc(28px * 0.27); }
		.bridgeImgWrap .dot-pulse__dot,
		.bridgeImgWrap .dot-pulse::before,
		.bridgeImgWrap .dot-pulse::after { content: ''; display: block; height: calc(28px * 0.18); width: calc(28px * 0.18); border-radius: 50%; background-color: #B8B8B8; transform: scale(0); }
		.bridgeImgWrap .dot-pulse::before { animation: pulse 1.5s ease-in-out infinite; }
		.bridgeImgWrap .dot-pulse__dot { animation: pulse 1.5s ease-in-out calc(1.5s * 0.125) infinite both; }
		.bridgeImgWrap .dot-pulse::after { animation: pulse 1.5s ease-in-out calc(1.5s * 0.25) infinite; } 
		@keyframes pulse {
			0%,
			100% { transform: scale(0); }
			50% { transform: scale(1.5); }
		}
</style>
</head>

<body>
	<div class="bridgeImgWrap">
		<p class="imgBox">
			<img src="https://tbezauth.settlebank.co.kr/theme/hotdeal/HD20220714000000000625_20220714094504024.png" alt="핫딜 TEST" />
		</p>
		<p class="infoBrand">투썸플레이스</p>
		<p class="infoProduct">오렌지에이드</p>
		<p class="infoText">
			해당 상품으로 이동 중입니다.
			<br />
			<strong>
				010PAY 앱에서만 확인 가능해요<i class="italic">!</i>
			</strong>
		</p>
		<div class="dotPulse">
			<div class="dot-pulse">
				<div class="dot-pulse__dot"></div>
			</div>
		</div>
		<p class="bridgeLogo">
			<img src="../../resource/images/logo-010pay-color.svg" alt="010PAY" />
		</p>
	</div>

</body>
</html>
