<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"

    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../../css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pedometer.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/swiper.js"></script>
    <script src="../../../js/lottie.min.js"></script>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back left-0">
              <i class="icon-back"></i>
            </button>
            <a href="../index/5_info.html" class="right-0">
              <i class="icon-info-circle"></i>
            </a>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="walk-bg">
          <span class="bg bg1"></span>
          <span class="bg bg2"></span>
          <!-- [2025.05.29] 변경 시작 -->
          <span class="bg bg3"></span>
          <!-- [2025.05.29] 변경 끝 -->
          <div class="walk-container">
            <!-- 헤더 -->
            <div class="walk-header">
              <!-- 권한 동의 시 -->
              <!-- <div class="walk-box">
                <div class="walk-distance"><strong>0</strong> km</div>
                <div class="walk-steps"><strong>0</strong> 걸음</div>
              </div> -->
              <!-- //권한 동의 시 -->
              <!-- 권한 미동의 시 -->
              <div class="permission-box">
                <div class="icon"></div>
                <span class="text"
                  >걸음 수 측정을 위해 권한에 동의해 주세요</span
                >
                <div class="arrow"></div>
              </div>
              <!-- //권한 미동의 시 -->
              <!-- 문구 모음 -->
              <div class="walk-message">😮 오늘 더 걸어볼까요?</div>
              <!-- <div class="walk-message">오늘, 어디까지 걸어볼까요?</div>
              <div class="walk-message">딱 5분 산책, 오늘도 같이 해볼까요?</div>
              <div class="walk-message">가까운 편의점까지 걸어볼까요?</div>
              <div class="walk-message">발걸음 하나가 하루를 바꿔요 🚶</div>
              <div class="walk-message">몸도 마음도 가볍게, 지금 한 걸음!</div>
              <div class="walk-message">엘리베이터 대신 계단? 오늘 도전!</div>
              <div class="walk-message">오늘 하루, 걷는 시간 10분 확보!</div>
              <div class="walk-message">걷는 만큼 생각도 맑아져요.</div>
              <div class="walk-message">몸이 움직이면, 마음도 따라 움직여요.</div> -->
              <!-- //문구 모음 -->
            </div>

            <!-- 걸음 경로 및 리워드 -->
            <div class="walk-map">
              <!-- [2025.05.29] 변경 시작 -->
              <img src="../../../images/pedometer/map2.png" alt="지도 배경" class="bg-image" />
              <!-- [2025.05.29] 변경 끝 -->
              <!-- base, receive, gift -->
              <ul class="walk-step-list">
                <!-- 걸음수 달성 후 -->
                <li class="step base" data-step="10" style="">
                  <div class="dot"></div>
                  <div class="lottie-pulse"></div>
                  <div class="label">10걸음</div>
                  <div class="label complete">
                    <button type="button">리워드 받기</button>
                  </div>
                </li>
                <!-- //걸음수 달성 후 -->
                <!-- 걸음수 달성 -->
                <li class="step base" data-step="4000" style="">
                  <div class="dot gift"></div>
                  <div class="lottie-pulse"></div>
                  <div class="label">4,000걸음</div>
                  <div class="label complete">
                    <button type="button">리워드 받기</button>
                  </div>
                </li>
                <!-- //걸음수 달성 -->
                <!-- 걸음수 달성 -->
                <li class="step base" data-step="6000" style="">
                  <div class="dot gift"></div>
                  <div class="lottie-pulse"></div>
                  <div class="label">6,000걸음</div>
                  <div class="label complete">
                    <button type="button">리워드 받기</button>
                  </div>
                </li>
                <!-- //걸음수 달성 -->
                <!-- 걸음수 달성 전 -->
                <li class="step base" data-step="9000" style="">
                  <div class="dot gift"></div>
                  <div class="lottie-pulse"></div>
                  <div class="label">9,000걸음</div>
                  <div class="label complete">
                    <button type="button">리워드 받기</button>
                  </div>
                </li>
                <!-- //걸음수 달성 전 -->
                <!-- 걸음수 달성 전 -->
                <li class="step base" data-step="10000" style="">
                  <div class="dot gift"></div>
                  <div class="lottie-pulse"></div>
                  <div class="label">10,000걸음</div>
                  <div class="label complete">
                    <button type="button">리워드 받기</button>
                  </div>
                </li>
                <!-- //걸음수 달성 전 -->
              </ul>
            </div>
          </div>
        </div>

        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle">😥 앗! 문제가 생겼어요</h3>
            <p id="promptContents">
              잠시 후 다시 시도해주세요.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-switch" class="modal modal-switch">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="modal-title">페이 포인트로 전환할게요</h3>
            <p class="modal-desc">전환한 후에는 취소가 어렵습니다.</p>

            <div class="conversion-box">
              <div class="from">
                <p class="label">캐시</p>
                <p class="amount">10,500C</p>
              </div>
              <span class="arrow"></span>
              <div class="to">
                <p class="label">라운드 페이 포인트</p>
                <p class="amount color-amount">10,500원</p>
              </div>
            </div>
            <p class="info-text">(교환 비율 1C=0.5원)</p>
          </div>
          <div class="modal-footer two-btns">
            <button
              type="button"
              class="btn btn-cancel"
              onclick="modalCloseAlert()"
            >
              취소
            </button>
            <button
              type="button"
              class="btn btn-confirm"
              onclick="modalCloseAlert()"
            >
              전환하기
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- [2025.05.23] 변경 시작 -->
    <!-- 보상 팝업 -->
    <div id="modal-terms-02" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="head-line" onclick="modalCloseSlide();"></div>
          <div class="modal-head center">
            <p class="modal-head-title">만보기 걸음 보상</p>
          </div>
          <div class="modal-body">
            <div class="container">
              <div class="reward-wrap">
                <i class="lottie-coin img-reward"></i>
                <p class="txt-reward">{{금액}}원을 획득 했습니다👏</p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id=""
              onclick="modalCloseSlide();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //보상 팝업 -->
    <!-- [2025.05.23] 변경 끝 -->

    <!-- [2025.07.03] 변경 시작 -->
    <!-- 광고 x 팝업 -->
    <div id="commonPrompt2" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle2">😥 앗! 광고가 없어요</h3>
            <p id="promptContents2">지금은 보여드릴 광고가 없어요.<br>
              다음에 다시 한 번 도전해 해주세요.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //광고 x 팝업 -->
    <!-- [2025.07.03] 변경 끝 -->
  </body>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pulseElements = document.querySelectorAll('.lottie-pulse');

      pulseElements.forEach((el) => {
        bodymovin.loadAnimation({
          container: el,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: 'https://ux.sbsvc.online/010pay/sup/pedometer/images/lottie/gift.json',
        });
      });
    });

    window.addEventListener('load', function () {
      // 에러 모달
      modalOpen('commonPrompt2');
      // modalOpenSlide('modal-terms-02');
    });
    
    /* Viewport height 보정 */
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }

    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
    window.addEventListener('load', setViewportHeight);
    document.addEventListener('DOMContentLoaded', setViewportHeight);

    setViewportHeight();
    
    // <!-- [2025.05.23] 변경 시작 -->
    $(document).ready(function () {
      // 로티 모달 내 코인
      let svgContainer = document.querySelector(".lottie-coin");

      let animItem = bodymovin.loadAnimation({
          wrapper: svgContainer,
          animType: "svg",
          loop: false,
          path: "https://ux.sbsvc.online/010pay/sup/pedometer/images/lottie/coin_default.json",
      });
    });
    // <!-- [2025.05.23] 변경 끝 -->
  </script>
</html>
