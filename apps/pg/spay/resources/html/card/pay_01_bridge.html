<body>
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- form -->
		<form class="wrap" autocomplete="off">

			<!-- content -->
			<!-- <div id="content"> -->
			<!-- retto-bridge -->
			<div class="retto-bridge">
				<div class="retto-bridge__top">
					<p class="retto-bridge__top--tit"></p>
					<p class="retto-bridge__top--info">
						결제할 때마다 <strong>최대 1억 당첨</strong> 가능한<br>
						<strong>리워드 로또</strong> 무료 증정
					</p>
					<p class="retto-bridge__top--visual"></p>
					<p class="bg bg1"></p>
					<p class="bg bg2"></p>
					<p class="bg bg3"></p>
				</div>

				<div class="retto-bridge__wrap">
					<div class="container retto-bridge__wrap__container">
						<span class="retto-bridge--ico"></span>
						<p class="retto-bridge--tit-sub">결제 <span class="retto-bridge__point">감사 리워드</span> 받기</p>
						<div class="retto-bridge__input-box">
							<input type="number" class="retto-bridge__input" maxlength="11" placeholder="휴대폰 번호 입력">
						</div>
						<div class="retto-bridge__info">
							<ul class="retto-bridge__list">
								<li>리워드 로또는 ㈜헥토파이낸셜에서 결제 고객을 대상으로
									진행하고 있는 리워드 서비스 입니다.</li>
								<li>결제 리워드는 휴대폰 번호를 입력한 결제 고객에 한하여
									지급 됩니다.</li>
							</ul>
						</div>
						<!-- 약관 동의 -->
						<div class="event-wrap__check-box card-check bridge">
							<div class="agree-terms">
								<p class="agree-all">
									<span class="checkbox dark">
										<input type="checkbox" name="agreeAll" id="agreeAll" class="card-check-input">
										<label for="agreeAll">약관 전체 동의</label>
									</span>
								</p>
								<ul class="terms-list mgt10">
									<li>
										<span class="checkbox child">
											<input type="checkbox" name="agree_01" id="agree_01_01">
											<label for="agree_01_01">결제 감사 리워드 지급을 위한 마케팅 정보 수신 동의(선택)</label>
										</span>
									</li>
									<li>
										<span class="checkbox child">
											<input type="checkbox" name="agree_01" id="agree_01_02">
											<label for="agree_01_02">결제 감사 리워드 지급을 위한 마케팅 목적 개인정보 수집 및 이용 동의 (선택)</label>
										</span>
									</li>
								</ul>
							</div>
						</div>
						<!-- //약관 동의 -->
						<button type="button" id="send" class="btn btn-xl-new btn-dark">결제하기</button>
					</div>

				</div>

			</div>
			<!-- //retto-bridge -->
			<!-- </div> -->
			<!-- //content -->

		</form>
		<!-- //form -->
	</div>
	<!-- //wrap -->

	<script>
	</script>
</body>
