  <script>
    $(".tab button").on("click", function () {
      var tab_index = $(this).index();
      $(this).closest(".tab").find("button").removeClass("active");
      $(this).addClass("active");
      $(".tab-contents > div").hide();
      $(".tab-contents > div").eq(tab_index).show();
    });

    JsBarcode("#barcode", "58978974456423335866", {
        format: "CODE128",
        width: 1,
        height: 80,
        displayValue: false,
    });

    $(".barcode-btn").on("click", function(){
      $(".barcode-wrap").addClass("scale");
    });
