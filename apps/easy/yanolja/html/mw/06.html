			<script type="text/javascript">
				$('[data-type="tax_text"]').keyup(function(){

					$(this).val($(this).val().replace(/[^0-9]/g,""));

					var $selectObj = $(this);

					$('[data-type="tax_text"]').each(function() {
						if ($selectObj.attr("id") == $(this).attr("id")) {
							$(this).parent().find('input[type=radio]').attr("checked", true);
							$(this).parent().find('label').addClass('on');
						} else {
							$(this).parent().find('input[type=radio]').attr("checked", false);
							$(this).parent().find('label').removeClass('on');
							$(this).val("");
						}
					});
				});

				function cashReg() {
					var _issPurpsDivCd;
					var _csrcRegNo;
					var _csrcRegNoDivCd;

					$('input[data-type=tax_text]').each(function(){
						if($(this).val()){
							_issPurpsDivCd = $(this).attr('data-issPurpsDivCd');
							_csrcRegNo = $(this).val();
							_csrcRegNoDivCd = $(this).attr('data-csrcRegNoDivCd');
							return;
						}
					});

					//현금영수증 저장
					$.ajax({
						type: "post",
						url: "/ajax/std/csrc/reg",
						dataType : "json",
						data: {
							issPurpsDivCd : _issPurpsDivCd
							,csrcRegNoDivCd : _csrcRegNoDivCd
							,csrcRegNo : _csrcRegNo
						},
						success:function(data){

							var statCd = data.outStatCd;
							var rsltCd = data.outRsltCd;
							var rsltMsg = data.outRsltMsg;

							if (statCd == "0021") {
								if (!_csrcRegNo) {
									$("#csrcRegNo_text").text("없음");
									$("#tax").attr("checked", false);
									$('label[for=tax]').removeClass('on');
								} else {
									$("#csrcRegNo_text").text(_csrcRegNo);
									$("#tax").attr("checked", true);
									$('label[for=tax]').addClass('on');
								}
							} else if (rsltCd =="session") {
								$("#frm").attr('action','/ui/view/legacy/error/session').submit();

							} else {
								alert(rsltMsg);
							}
						},
						error: function(e) {
							npVCtrl.resetKeypad("payPwd");
							alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
							return false;
						}
					});
				}

				// 현금영수증 컨트롤
				$(function(){
					var btn = $('.btn_taxchg');
					var save = $('.btn_save button');
					var pw = $('.pw input');
					btn.on('click', function(){
						//보안키패드 숨김
						npVCtrl.hideKeypad("payPwd");
						$('.skipbx').show();
					});
					save.on('click', function(){
						$('.skipbx').removeAttr('style');
					});
					pw.on('focus', function(){
						$('.skipbx').removeAttr('style');
					});

					$("select").change(function () {
						var str = "";
						$( "select option:selected" ).each(function() {
							str += $( this ).index();
						});
						$('.row').hide();
						$('#tax'+str).show();
						$('[data-type="tax_text"]').each(function(){
							if($(this).val()){
								$(this).focus();
							}
						});
					});

					var csrcRegNo = '01035075520';

					if(!csrcRegNo){
						$("#csrcRegNo_text").text("없음");
						$("#tax").attr("checked", false);
						$("#tax").parent().find('label').removeClass('on');
					}else{
						var cashReceiptCheckedYn = 'true';
															if(cashReceiptCheckedYn == 'true'){
							$("#tax").attr("checked", true);
							$("#tax").parent().find('label').addClass('on');
						}else{
							$("#tax").attr("checked", false);
							$("#tax").parent().find('label').removeClass('on');
						}
					}

					var str = "";
					$( "select option:selected" ).each(function() {
						str += $( this ).index();
					});
					$('.row').hide();
					$('#tax'+str).show();

					$('[data-type="tax_text"]').each(function(){
						if($(this).val()){
							$(this).focus();
						}
					});

					$("#tax").on('change', function(){
						if($("#csrcRegNo_text").text() == "없음"){
							$("#tax").attr("checked", false);
							$("#tax").parent().find('label').removeClass('on');

							npVCtrl.hideKeypad("payPwd");
							$('.skipbx').show();
						}
					});
				});
			</script>

	<script>
	// 현금영수증 컨트롤
	$(function(){

		btn.on('click', function(){
			$('.skipbx').show();
			$('.skipbx .input:first-child').addClass('focus');
			$('.skipbx .input:first-child input').focus();
		});
		save.on('click', function(){
			$('.skipbx').removeAttr('style');
		});
		pw.on('focus', function(){
			$('.skipbx').removeAttr('style');
		});
		$("select").change(function () {
			var str = "";
			$( "select option:selected" ).each(function() {
				str += $( this ).index();
			});
			$('.row').hide();
			$('#tax'+str).show();
			$('#tax'+str).show().find('.input:first-child input').focus();
		});
	});
	</script>
