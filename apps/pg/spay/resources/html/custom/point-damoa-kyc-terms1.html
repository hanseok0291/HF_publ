<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>헥토파이낸셜 이용약관</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />
        <!-- //favicon -->

        <link rel="stylesheet" href="../../css/point_damoa.css?ver=2602024" />
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/commonutil.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap" class="wrap point-damoa iframe">
            <header>
                <div class="container">
                    <div class="titleWrap">
                        <h2 class="title-main textLeft">헥토파이낸셜 이용약관</h2>
                        <button type="button" id="closeWindow" class="btn-close" aria-label="창 닫기">
                            <i class="icon-times">창 닫기</i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="container">

                    <!-- 약관 동의 섹션 -->
                    <div class="container-wrap box-shadow order-wrap">
                        <div>
                            <!-- accordion list -->
                            <ul class="accordion-list">
                                <li>
                                    <div class="list-header accordion-title">
                                        <span class="subject">
                                            <div class="check-box check-all w-full">
                                                <input type="checkbox" id="check-all" name="check-all" title="본인확인 이용 약관(필수)" />
                                                <label for="check-all">본인확인 이용 약관(필수)</label>
                                            </div>
                                        </span>
                                        <button type="button" class="accordion-btn" data-target="accordion-content">
                                            <span class="sr-only">약관 목록 펼치기/접기</span>
                                            <i class="icon-arrow-down"></i>
                                        </button>
                                    </div>
                                    <div class="list-body accordion-item" id="accordion-content">
                                        <div>
                                            <ul class="list-sub">
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk1" class="checkSelect" name="chk1" value="Y" title="(필수) 휴대폰 본인 확인 이용 약관" />
                                                        <label for="chk1">(필수) 휴대폰 본인 확인 이용 약관</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term1">보기</a>
                                                    </span>
                                                </li>
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk2" class="checkSelect" name="chk2" value="Y" title="(필수) 본인 인증 개인 정보 수집 이용" />
                                                        <label for="chk2">(필수) 본인 인증 개인 정보 수집 이용</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term2">보기</a>
                                                    </span>
                                                </li>
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk3" class="checkSelect" name="chk3" value="Y" title="(필수) 본인 인증 개인 정보 제공 위탁" />
                                                        <label for="chk3">(필수) 본인 인증 개인 정보 제공 위탁</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term3">보기</a>
                                                    </span>
                                                </li>
                                                <li class="list-item">
                                                    <div class="check-box">
                                                        <input type="checkbox" id="chk4" class="checkSelect" name="chk4" value="Y" title="(필수) 본인 인증 고유 식별 정보 처리" />
                                                        <label for="chk4">(필수) 본인 인증 고유 식별 정보 처리</label>
                                                    </div>
                                                    <span class="btn-right">
                                                        <a href="javascript:;" class="btn-view" data-term="term4">보기</a>
                                                    </span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                            <!-- //accordion list -->
                        </div>
                    </div>
                    <!-- //약관 동의 섹션 -->
                </div>
            </div>
            <!-- //content -->
            
            <div class="btnWrap">
                <button type="button" class="btn btnNext" id="btnNext" disabled>다음</button>
            </div>
        </div>
        <!-- //wrap -->

        <!-- 약관 상세보기 모달 -->
        <div id="termsDetailModal" class="modal modal-full" tabindex="0" aria-labelledby="termsTitle" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <header>
                        <div class="container">
                            <div class="titleWrap">
                                <h2 class="title-main textLeft" id="termsModalTitle">헥토파이낸셜 이용약관</h2>
                                <button type="button" id="closeTermsModal" class="btn-close" aria-label="창 닫기">
                                    <i class="icon-times">창 닫기</i>
                                </button>
                            </div>
                        </div>
                    </header>
                    <div class="modal-body">
                        <div class="container">
                            <!-- 약관 상세 -->
                            <div class="terms scroll" id="termsContent">
                                <!-- 약관 내용이 동적으로 삽입됩니다 -->
                            </div>
                            <!-- //약관 상세 -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btnNext btn-xl" id="confirmTermsModal">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //약관 상세보기 모달 -->

        <!-- confirm modal - 종료 확인 -->
        <div id="closeConfirmModal" class="modal" tabindex="-1" role="dialog" aria-labelledby="closeConfirmTitle" aria-modal="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <p>고객님의 포인트는 현금처럼<br aria-hidden="true" />바로 사용 가능합니다.</p>
                        <p>종료하시겠습니까?</p>
                    </div>
                    <div class="modal-footer type2">
                        <button type="button" class="btn btn-cancel" id="closeConfirmCancel">취소</button>
                        <button type="button" class="btn" id="closeConfirmOk">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //confirm modal -->

        <script>
            $(document).ready(function () {
                // 전체약관동의 체크박스
                const allAgreeCheckbox = document.getElementById("check-all");
                // 나머지 체크박스들
                const otherCheckboxes = document.querySelectorAll(".checkSelect");
                // 다음 버튼
                const nextButton = document.getElementById("btnNext");
                // 아코디언 버튼
                const accordionBtn = document.querySelector(".accordion-btn");
                // 아코디언 콘텐츠
                const accordionContent = document.getElementById("accordion-content");

                // 필수 약관 모두 체크되었는지 확인
                function checkAllRequiredTerms() {
                    return Array.from(otherCheckboxes).every((cb) => cb.checked);
                }

                // 다음 버튼 활성화/비활성화
                function updateNextButton() {
                    const allChecked = checkAllRequiredTerms();
                    nextButton.disabled = !allChecked;
                }

                // 전체약관동의 체크박스 변경 이벤트
                allAgreeCheckbox.addEventListener("change", function () {
                    otherCheckboxes.forEach(function (checkbox) {
                        checkbox.checked = allAgreeCheckbox.checked;
                    });
                    updateNextButton();
                });

                // 개별 체크박스 변경 이벤트
                otherCheckboxes.forEach(function (checkbox) {
                    checkbox.addEventListener("change", function () {
                        // 모든 개별 약관이 체크되면 전체약관동의도 체크
                        if (checkAllRequiredTerms()) {
                            allAgreeCheckbox.checked = true;
                        } else {
                            allAgreeCheckbox.checked = false;
                        }
                        updateNextButton();
                    });
                });

                // 아코디언 토글
                accordionBtn.addEventListener("click", function () {
                    const isActive = accordionContent.style.display === "block" || $(accordionContent).is(":visible");
                    if (isActive) {
                        $(accordionContent).slideUp(300);
                        $(accordionBtn).removeClass("active");
                        $(accordionBtn).find("i").removeClass("icon-arrow-up").addClass("icon-arrow-down");
                    } else {
                        $(accordionContent).slideDown(300);
                        $(accordionBtn).addClass("active");
                        $(accordionBtn).find("i").removeClass("icon-arrow-down").addClass("icon-arrow-up");
                    }
                });

                // 초기 상태: 아코디언 펼쳐진 상태
                $(accordionContent).show();
                $(accordionBtn).addClass("active");
                $(accordionBtn).find("i").removeClass("icon-arrow-down").addClass("icon-arrow-up");

                // 약관 내용 정의 (실제 약관 내용으로 교체 필요)
                const termsContent = {
                    term1: {
                        title: "(필수) 휴대폰 본인 확인 이용 약관",
                        content: "<h4>제1조 (목적)</h4><p>본 약관은 휴대폰 본인 확인 서비스에 관한 사항을 정함을 목적으로 합니다.</p><h4>제2조 (용어의 정의)</h4><p>본 약관에서 사용하는 용어의 정의는 다음과 같습니다.</p><p>1. '본인 확인'이란 이용자가 본인임을 확인하는 절차를 의미합니다.</p>"
                    },
                    term2: {
                        title: "(필수) 본인 인증 개인 정보 수집 이용",
                        content: "<h4>제1조 (목적)</h4><p>본 약관은 본인 인증을 위한 개인 정보 수집 및 이용에 관한 사항을 정함을 목적으로 합니다.</p><h4>제2조 (수집하는 개인 정보 항목)</h4><p>회사는 다음의 개인 정보를 수집합니다.</p><p>1. 이름, 생년월일, 성별</p><p>2. 휴대폰 번호</p>"
                    },
                    term3: {
                        title: "(필수) 본인 인증 개인 정보 제공 위탁",
                        content: "<h4>제1조 (목적)</h4><p>본 약관은 본인 인증을 위한 개인 정보 제공 및 위탁에 관한 사항을 정함을 목적으로 합니다.</p><h4>제2조 (개인 정보 제공)</h4><p>회사는 본인 인증을 위해 필요한 범위 내에서 개인 정보를 제공할 수 있습니다.</p>"
                    },
                    term4: {
                        title: "(필수) 본인 인증 고유 식별 정보 처리",
                        content: "<h4>제1조 (목적)</h4><p>본 약관은 본인 인증을 위한 고유 식별 정보 처리에 관한 사항을 정함을 목적으로 합니다.</p><h4>제2조 (고유 식별 정보)</h4><p>회사는 본인 인증을 위해 주민등록번호 등 고유 식별 정보를 처리할 수 있습니다.</p>"
                    }
                };

                // 약관 상세보기 모달 열기
                function openTermsModal(termId) {
                    const term = termsContent[termId];
                    if (!term) return;

                    const $modal = $("#termsDetailModal");
                    const $content = $("#termsContent");
                    const $title = $("#termsModalTitle");
                    
                    // 약관 제목 설정
                    $title.text(term.title);
                    
                    // 약관 내용 삽입
                    $content.html(term.content);
                    
                    // 모달 표시
                    $modal.fadeIn(300);
                }

                // 약관 상세보기 모달 닫기
                function closeTermsModal() {
                    $("#termsDetailModal").fadeOut(300);
                }

                // 보기 버튼 클릭 이벤트
                document.querySelectorAll(".btn-view").forEach(function (btn) {
                    btn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const termId = this.getAttribute("data-term");
                        openTermsModal(termId);
                    });
                });

                // 모달 닫기 버튼
                $("#closeTermsModal, #confirmTermsModal").on("click", function() {
                    closeTermsModal();
                });

                // 모달 오버레이 클릭 시 닫기
                $("#termsDetailModal").on("click", function(e) {
                    if ($(e.target).hasClass("modal")) {
                        closeTermsModal();
                    }
                });

                // 다음 버튼 클릭 이벤트
                nextButton.addEventListener("click", function () {
                    if (!this.disabled) {
                        // 약관 동의 완료 처리
                        const terms = {
                            checkAll: allAgreeCheckbox.checked,
                            chk1: document.getElementById("chk1").checked,
                            chk2: document.getElementById("chk2").checked,
                            chk3: document.getElementById("chk3").checked,
                            chk4: document.getElementById("chk4").checked,
                        };
                        console.log("약관 동의 완료:", terms);
                        // 실제 처리 로직 추가
                    }
                });

                // 뒤로가기 버튼
                $("#btnBack").on("click", function () {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.close();
                    }
                });

                // 닫기 버튼 클릭 이벤트 - 확인 모달 표시
                $("#closeWindow").on("click", function () {
                    $("#closeConfirmModal").fadeIn(300);
                    $("#closeConfirmModal").attr("tabindex", "0").focus();
                });

                // 확인 모달 취소 버튼
                $("#closeConfirmCancel").on("click", function () {
                    $("#closeConfirmModal").fadeOut(300);
                });

                // 확인 모달 확인 버튼
                $("#closeConfirmOk").on("click", function () {
                    $("#closeConfirmModal").fadeOut(300, function () {
                        window.close();
                    });
                });

                // 모달 외부 클릭 시 닫기
                $(document).on("click", "#closeConfirmModal", function(e) {
                    if ($(e.target).is("#closeConfirmModal")) {
                        $("#closeConfirmModal").fadeOut(300);
                    }
                });

                // 초기 상태 설정
                updateNextButton();
            });
        </script>
    </body>
</html>
