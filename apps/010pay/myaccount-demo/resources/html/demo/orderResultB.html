<!doctype html>
<html lang="ko">
<head>
<title>내통장결제 데모</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/demo.css">
</head>

<body class="demo">
<!-- form -->
<form class="main_form" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="order type-b">
		<!-- header -->
		<div id="header">
			<div class="container">
				<div class="page-title">
					<h1 class="title"><span class="text-primary">B몰</span> 주문완료</h1>
				</div>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- headline -->
			<div class="section headline">
				<div class="container">
					<p><span class="text-primary">주문이 정상적으로 완료</span><br>
					되었습니다.</p>
				</div>
			</div>
			<!-- //headline -->

			<!-- 주문정보 -->
			<div class="section order-info">
				<h2 class="section-title"><span class="container">주문정보</span></h2>
				<div class="section-content">
					<div class="container">
						<ul class="list">
							<li>
								<div class="dt">주문번호</div>
								<div class="dd">20190000-000000</div>
							</li>
							<li>
								<div class="dt">주문상품</div>
								<div class="dd">스페셜티 케냐 원두커피</div>
							</li>
						</ul>
					</div>
				</div>
			</div>
			<!-- //주문정보 -->

			<!-- 결제정보 -->
			<div class="section order-info">
				<h2 class="section-title"><span class="container">결제정보</span></h2>
				<div class="section-content">
					<div class="container">
						<ul class="list">
							<li>
								<div class="dt">결제수단</div>
								<div class="dd">B Mall Pay</div>
							</li>
							<li>
								<div class="dt">상품금액</div>
								<div class="dd">2,000원</div>
							</li>
							<li>
								<div class="dt">배송비</div>
								<div class="dd">0원</div>
							</li>
							<li>
								<div class="dt">할인</div>
								<div class="dd">(-) 0원</div>
							</li>
						</ul>
					</div>
					<div class="total">
						<div class="container">
							<div class="dt">최종 결제금액</div>
							<div class="dd text-primary">2,000원</div>
						</div>
					</div>
				</div>
			</div>
			<!-- //결제정보 -->

			<!-- submit button -->
			<div class="section submit-btn">
				<div class="container">
					<button type="button" id="send" class="btn on">확인</button>
				</div>
			</div>
			<!-- //submit button -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->
</body>
</html>
