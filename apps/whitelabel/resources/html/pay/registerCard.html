<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- css -->
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">

<!-- javascript -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
</head>

<body>
<!-- IE 브라우저 지원 안내 -->
<!--[if lte IE 10]>
<div class="info-ie-update">
	<div class="container">
		<h2>브라우저를 업데이트해 주세요.</h2>
		<p>안전한 결제 환경을 위해 크롬, 엣지 또는<br> Internet Explorer 10 이상을 이용해 주세요.</p>
		<p class="btn-area">
			<a href="http://www.google.com/chrome" target="_blank" class="btn">크롬 설치</a>
			<a href="http://windows.microsoft.com/ko-kr/internet-explorer/download-ie" target="_blank" class="btn">엣지 설치 / IE 업데이트</a>
		</p>
	</div>
</div>
<![endif]-->
<!-- //IE 브라우저 지원 안내 -->

<!-- wrap -->
<div id="wrap" class="wrap new">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">결제 수단 등록</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main>
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<h2 class="headline"><strong>카드 등록을 위해 <br>
				정보를 입력해주세요 </strong></h2>
				<!-- //headline -->

				<!-- section -->
				<section>

					<div id="passwordSection" class="form-group bank-area hidden">
						<input type="password" id="passNumber" class="form-control" maxlength="4" placeholder="비밀번호" />
						<div id="" class="card-name sub-text">카드 비밀번호 4자리</div>
					</div>

					<div id="cvcSection" class="form-group bank-area hidden">
						<input type="password" id="cvcNumber" class="form-control" maxlength="3" placeholder="CVC" />
						<div id="" class="card-name sub-text">카드 뒷면 3자리</div>
					</div>

					<div id="expirySection" class="form-group bank-area hidden">
						<input type="password" id="expiryDate" class="form-control" maxlength="4" placeholder="유효기간 (MMYY)" />
						<div id="" class="card-name sub-text">월/년 4자리</div>
					</div>

					<div class="form-group bank-area card-number" style="position: relative;">
						<div class="card-number-wrap" style="display: flex; gap: 0;">
							<input type="text" id="cardNumber1" class="form-control card-number-input text-black" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="카드번호" />
							<span class="dash hidden">-</span>
							<input type="text" id="cardNumber2" class="form-control card-number-input hidden" maxlength="4" inputmode="numeric" autocomplete="off" />
							<span class="dash hidden">-</span>
							<input type="password" id="cardNumber3" class="form-control card-number-input hidden" maxlength="4" inputmode="numeric" autocomplete="off" />
							<span class="dash hidden">-</span>
							<input type="password" id="cardNumber4" class="form-control card-number-input hidden" maxlength="4" inputmode="numeric" autocomplete="off" />
						</div>
					
						<div id="cardName" class="card-name hidden sub-text"></div>
						<div id="cardError" class="error sub-text red hidden">등록이 지원되지 않는 카드사입니다.<br>해당 카드사에 문의해주세요.</div>
					</div>

				</section>
				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->

		<!-- footer -->
		<footer>
			<!-- container -->
			<div class="container">
				<button type="button" id="submit" class="btn btn-lg btn-primary new shadow" disabled data-toggle="modal" data-target="#commonAlert">등록하기</button>
			</div>
			<!-- //container -->
		</footer>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common new" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title"></h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">카드 등록이 완료되었습니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common new" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title"></h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">취소하시겠습니까?</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary new"  data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
const submitBtn = document.getElementById("submit");
const expiryInput = document.getElementById("expiryDate");
const cvcInput = document.getElementById("cvcNumber");
const passInput = document.getElementById("passNumber");

const cardInputs = [
  document.getElementById("cardNumber1"),
  document.getElementById("cardNumber2"),
  document.getElementById("cardNumber3"),
  document.getElementById("cardNumber4"),
];
const dashElements = document.querySelectorAll(".dash");
const cardName = document.getElementById("cardName");
const cardError = document.getElementById("cardError");
const expirySection = document.getElementById("expirySection");
const cvcSection = document.getElementById("cvcSection");
const passwordSection = document.getElementById("passwordSection");

const binMap = {
  "1122": "롯데카드",
  "8234": "미지원카드",
  "1234": "미지원카드"
};

// 카드번호 전체 연결
function getFullCardNumber() {
  return cardInputs.map(input => input.value).join("");
}

// 카드번호 입력 처리 + 자동 포커스 + dash 표시 + BIN 검사
cardInputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 4);

    // 다음 칸으로 포커스 이동
    if (input.value.length === 4 && index < cardInputs.length - 1) {
      dashElements[index].classList.remove("hidden");
      cardInputs[index + 1].focus();
    }

    updateCardUI();
  });

  // 백스페이스로 지웠을 때 이전 input으로 포커스 이동
  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && input.value.length === 0 && index > 0) {
      cardInputs[index - 1].focus();
    }
  });
});

const cardNumber1 = document.getElementById("cardNumber1");
const cardNumber2 = document.getElementById("cardNumber2");
const cardNumber3 = document.getElementById("cardNumber3");
const cardNumber4 = document.getElementById("cardNumber4");

// 카드번호 첫 번째 input 감지
cardNumber1.addEventListener("input", () => {
  const value = cardNumber1.value.replace(/\D/g, "").slice(0, 4);
  cardNumber1.value = value;

  if (value.length === 4) {
    // 4자리 입력이 완료되면 나머지 input 표시
    cardNumber2.classList.remove("hidden");
    cardNumber3.classList.remove("hidden");
    cardNumber4.classList.remove("hidden");
		cardNumber2.focus();
  } else {
    // 4자리 미만이면 다시 숨김
    cardNumber2.classList.add("hidden");
    cardNumber3.classList.add("hidden");
    cardNumber4.classList.add("hidden");
  }
  updateCardUI(); // 카드 검증 및 UI 갱신 함수 호출
});

// 카드 UI 업데이트 (BIN 검사 및 섹션 표시)
function updateCardUI() {
  const fullCardNumber = getFullCardNumber();
	const firstInputVal = cardInputs[0].value.replace(/\D/g, "");
  const bin = firstInputVal.slice(0, 4);
  const isValid = binMap[bin] && binMap[bin] !== "미지원카드";

  // dash 표시
  dashElements.forEach((dash, idx) => {
    if (cardInputs[idx].value.length === 4) {
      dash.classList.remove("hidden");
    } else {
      dash.classList.add("hidden");
    }
  });

  // BIN 검사
  if (firstInputVal.length >= 4) {
    if (isValid) {
      cardName.textContent = binMap[bin];
      cardName.classList.remove("hidden");
      cardError.classList.add("hidden");
      const allFilled = cardInputs.every(input => input.value.length === 4);
			if (allFilled && expirySection.classList.contains("hidden")) {
				expirySection.classList.remove("hidden");
			}
    } else {
      cardError.classList.remove("hidden");
      cardName.classList.add("hidden");
      expirySection.classList.add("hidden");
      cvcSection.classList.add("hidden");
      passwordSection.classList.add("hidden");
    }
  }

  checkSubmitEnabled();
}

// 유효기간 입력
expiryInput.addEventListener("input", () => {
  expiryInput.value = expiryInput.value.replace(/\D/g, "").slice(0, 4);
  if (expiryInput.value.length === 4) {
    cvcSection.classList.remove("hidden");
  }
  checkSubmitEnabled();
});

// CVC 입력
cvcInput.addEventListener("input", () => {
  cvcInput.value = cvcInput.value.replace(/\D/g, "").slice(0, 3);
  if (cvcInput.value.length === 3) {
    passwordSection.classList.remove("hidden");
  }
  checkSubmitEnabled();
});

// 비밀번호 입력
passInput.addEventListener("input", () => {
  passInput.value = passInput.value.replace(/\D/g, "").slice(0, 4);
  checkSubmitEnabled();
});

// 모든 조건 충족 시 버튼 활성화
function checkSubmitEnabled() {
  const rawCardNumber = getFullCardNumber().replace(/\D/g, "");
  const cardHidden = cardError.classList.contains("hidden");
  const cardValid = rawCardNumber.length === 16 && cardHidden;

  const expiryValid = expiryInput.value.length === 4;
  const cvcValid = cvcInput.value.length === 3;
  const passValid = passInput.value.length >= 4;

  const enable = cardValid && expiryValid && cvcValid && passValid;

  submitBtn.disabled = !enable;
  submitBtn.classList.toggle("active", enable);
}

// 등록하기 클릭 시 알림 모달 열기
submitBtn.addEventListener("click", () => {
  modalOpen("commonAlert");
});

function updateCardPlaceholder() {
  const hasOtherInput =
    cardInputs[1].value.length > 0 ||
    cardInputs[2].value.length > 0 ||
    cardInputs[3].value.length > 0;

  if (hasOtherInput) {
    cardInputs[0].placeholder = "";
  } else {
    cardInputs[0].placeholder = "카드번호";
  }
}
cardInputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    updateCardUI();
    updateCardPlaceholder();
  });
});

</script>
</body>
</html>
