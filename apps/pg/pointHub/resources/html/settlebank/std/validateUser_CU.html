<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../../settlebank/img/logo-spay.svg" alt="S'pay"></span></h1>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">포인트다모아(클립) 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">드시모네 키즈 세트 afghjlmoprqyz 12345678901234567890</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">50,000</em>원</strong> 결제합니다.</p>
				</div>
				<!-- //주문정보 -->

				<!-- 약관 동의 -->
				<div class="section card card-check agree-terms">
					<div class="card-body">
						<p class="agree-all">
							<span class="checkbox dark">
								<input type="checkbox" name="agreeAll" id="agreeAll" class="card-check-input">
								<label for="agreeAll">포인트 사용 및 약관 전체 동의</label>
							</span>
						</p>
						<ul class="terms-list mgt10">
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree" id="agree_01" class="requiredY">
									<label for="agree_01"><span class="required">[필수]</span> CLiP 이용약관</label>
								</span>
								<a href="#" class="btn btn-icon alink" clsurl="http://testclip3api.clipwallet.co.kr/data/rcm/agree/page/doc_term_of_service.html" clstitl="CLiP 이용약관">보기 <i class="icon-angle-right-sm gray"></i></a>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree" id="agree_02" class="requiredY">
									<label for="agree_02"><span class="required">[필수]</span> 개인정보 수집·이용</label>
								</span>
								<a href="#" class="btn btn-icon alink" clsurl="https://img.clipwallet.co.kr/data/rcm/agree/page/doc_privacy_policy.html" clstitl="개인정보 수집·이용">보기 <i class="icon-angle-right-sm gray"></i></a>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree" id="agree_03" class="requiredY">
									<label for="agree_03"><span class="required">[필수]</span> 전자금융거래 이용약관</label>
								</span>
								<a href="#" class="btn btn-icon alink" clsurl="https://pg.settlebank.co.kr/jsp/common/provision/iprovision1.html" clstitl="전자금융거래 이용약관">보기 <i class="icon-angle-right-sm gray"></i></a>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree" id="agree_04" class="requiredY">
									<label for="agree_04"><span class="required">[필수]</span> 개인정보 제3자 제공 및 위탁 안내</label>
								</span>
								<a href="#" class="btn btn-icon alink" clsurl="../../../terms/privacy210525.html" clstitl="개인정보 제3자 제공 및 위탁 안내">보기 <i class="icon-angle-right-sm gray"></i></a>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree" id="agree_05" class="requiredN">
									<label for="agree_05"><span>[선택]</span> 이벤트/마케팅 활용 및 안내</label>

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<p id="confirmContents"></p>
			</div>

		</div>

<div class="loading hidden">로딩 중</div>

<script>
	$(document).ready(function(){
		// 하단 확인 버튼
		var btnSubmit = $("#send");

		// 약관 동의 - 전체 선택 체크박스 클릭
		$(".agree-terms .agree-all [type=checkbox]").click(function(){
			var child = $(this).parents(".agree-all").next(".terms-list").find("[type=checkbox]");
			// 전체 선택 체크박스가 체크된 경우
			if($(this).is(":checked")){
				$(child).prop("checked", true);
				btnSubmit.attr("disabled", false); // 확인 버튼 활성
			// 전체 선택 체크박스가 해제된 경우
			} else {
				$(child).prop("checked", false);
				btnSubmit.attr("disabled", true); // 확인 버튼 비활성
			}
		});

		// 약관 동의 - 하위 체크박스 클릭
		$(".terms-list [type=checkbox]").click(function(){
			var all = $(".agree-all [type=checkbox]"); // 전체 선택 체크박스
			var list = $(this).parents(".terms-list"); // 약관 목록

			// 약관 목록(필수 + 선택)
			var listCnt = list.find("[type=checkbox]").length; // 약관 목록 체크박스 수
			var listChkCnt = list.find("[type=checkbox]:checked").length; // 체크된 약관 목록 체크박스 수
			// 약관 체크박스가 모두 체크된 경우
			if(listChkCnt == listCnt){
				$(all).prop("checked", true);
			}
			// 약관 체크박스가 모두 체크되지 않은 경우
			else {
				$(all).prop("checked", false);
			}

			// 약관 목록(필수)
			var listReqCnt = list.find("[type=checkbox].requiredY").length; // 약관 목록 체크박스 수
			var listReqChkCnt = list.find("[type=checkbox].requiredY:checked").length; // 체크된 약관 목록 체크박스 수
			// 필수 약관 체크박스가 모두 체크된 경우
			if(listReqChkCnt == listReqCnt){
				btnSubmit.attr("disabled", false); // 확인 버튼 활성
			}
			// 필수 약관 체크박스가 모두 체크되지 않은 경우
			else {
				btnSubmit.attr("disabled", true); // 확인 버튼 비활성
			}
		});

		// card active
		$(".card-check [type=checkbox]").click(function(){
			var checkedInput = $(".card-check-input").is(":checked"); // prop('checked');
			if(checkedInput == true) {
				$(this).parents(".card-check").addClass("active");
			} else {
				$(this).parents(".card-check").removeClass("active");
			}
		});
	});

	//화면 가운데 팝업 표시 함수
	function popupCenter(url, title, w, h) {
		// Fixes dual-screen position                         Most browsers      Firefox
		var dualScreenLeft = window.screenLeft != undefined ? window.screenLeft : window.screenX;
		var dualScreenTop = window.screenTop != undefined ? window.screenTop : window.screenY;

		var width = window.innerWidth ? window.innerWidth : document.documentElement.clientWidth ? document.documentElement.clientWidth : screen.width;
		var height = window.innerHeight ? window.innerHeight : document.documentElement.clientHeight ? document.documentElement.clientHeight : screen.height;

		var left = ((width / 2) - (w / 2)) + dualScreenLeft;
		var top = ((height / 2) - (h / 2)) + dualScreenTop;
		var newWindow = window.open(url, title, 'scrollbars=yes, width=' + w + ', height=' + h + ', top=' + top + ', left=' + left);

		// Puts focus on the newWindow
		if (window.focus) {
			newWindow.focus();
		}
	}

	//약관 상세 클릭 이벤트
	$('.alink').click(function(){
		var clsUrl = $(this).attr('clsUrl');
		var clsTitl = $(this).attr('clsTitl');

		popupCenter(clsUrl, clsTitl, 640, 640);
	});
</script>
