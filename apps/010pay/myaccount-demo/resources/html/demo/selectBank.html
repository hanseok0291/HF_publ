<script>
$(document).ready(function(){
	//은행 목록 열기/닫기
	$("#radio_bank").click(function() {
		$(".bank-area").slideDown(200);
	});
	$("#radio_my, .bank-list button").click(function() {
		$(".bank-area").slideUp(200);
	});
	
	//팝오버
	$(".open-popover").click(function() {
		$(this).toggleClass("active")
	});
	$(".popover-header .btn-close").click(function() {
		$(this).parents(".popover").prev(".open-popover").removeClass("active");
	});
});
</script>
