<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>헥토파이낸셜</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/common.css" />
    <link rel="stylesheet" href="../../../css/card.css" />
    <script src="../../../js/jquery-1.8.3.min.js"></script>
    <script src="../../../js/common.js" defer></script>
    <script src="../../../js/aml.js" defer></script>
    <script src="../../../js/design_renewal.js" defer></script>
    <script src="../../../js/postcode.v2.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="card step card-status-step-04-addr">
      <!-- header -->
      <header class="header">
        <div class="container">
          <button type="button" class="btn-back btn"></button>
          <h1 class="brand-name">카드 신청</h1>
          <button type="button" class="btn-close btn"></button>
        </div>
      </header>
      <!-- //header -->
      <div class="step-bar">
        <div class="step-wrap">
          <span class="step step-04"></span>
        </div>
      </div>
      <!-- section -->
      <section>
        <div id="content">
          <div class="container">
            <div class="tit-wrap">
              <!-- tit -->
              <h2 class="tit">
                카드 배송지를 <br />
                입력해주세요.
              </h2>
              <!-- //tit -->
            </div>

            <div class="form-wrap">
              <div class="custom-input address">
                <input type="text" id="zipCode_01" placeholder="우편번호" />
                <label for="zipCode_01" class="custom-label">카드 배송지</label>
                <button
                  type="button"
                  class="btn btn-addr-search"
                  data-toggle="modal"
                  data-target="#modalAddr"
                  data-next="false"
                  onclick="setButtonClicked('zipCode_01')"
                >
                  주소 검색하기
                </button>
                <input type="text" id="zipCode_01_1" placeholder="주소" />
                <input type="text" id="zipCode_01_2" placeholder="주소" />
                <input
                  type="text"
                  id="zipCode_01_3"
                  placeholder="상세 주소 입력"
                />
              </div>
            </div>
          </div>
        </div>
        <!-- footer -->
        <div id="footer">
          <div class="btn-wrap">
            <button
              type="button"
              class="btn btn-default"
              onclick="location.href='step_04_pwd.html'"
            >
              다음
            </button>
          </div>
        </div>
        <!-- //footer -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="prompt-title"></h3>
            <p class="prompt-contents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              아니오
            </button>
            <button
              type="button"
              onclick="modalClose();"
              id="promptOk"
              class="btn btn-confirm"
            >
              예
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <!-- 주소검색 -->
    <div
      id="modalAddr"
      class="modal modal-full modal-addr"
      tabindex="-1"
      role="dialog"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <div class="container">
              <button
                type="button"
                onclick="modalClose();"
                class="btn-back btn"
              ></button>
              <h1 class="brand-name">
                <span class="my-logo"
                  ><img
                    src="../../../images/common/logo.svg"
                    alt="헥토파이낸셜"
                /></span>
              </h1>
              <button
                type="button"
                class="btn btn-close"
                data-dismiss="modal"
                data-target="#noticeDetail"
              ></button>
            </div>
          </div>
          <div class="modal-body">
            <p class="title">주소 검색하기</p>
            <div class="addr-wrap">
              <div class="addr-search">
                <input type="text" placeholder="도로명/건물명 검색" />
                <button type="button" class="btn-search"></button>
              </div>
              <div class="addr-body">
                <ul>
                  <li>
                    <span class="zipcode">06234</span>
                    <span class="address">서울특별시 강남구 테헤란로34길 6</span>
                  </li>
                  <li>
                    <span class="zipcode">06235</span>
                    <span class="address">서울특별시 강남구 테헤란로34길 8</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //주소검색 -->

    <script>
      $(".btn-close.btn").click(function () {
        $.promptMessage(
          "",
          "선불충전서비스를 이용하기 위해서는<br>본인확인이 필요합니다.<br><br><b>본인확인을 계속 하시겠습니까?</b>",
          $("#commonPrompt"),
        );
      });

      let buttonClicked = "";

      function setButtonClicked(buttonId) {
        buttonClicked = buttonId;
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".addr-body li").forEach(function (item) {
          item.addEventListener("click", function () {
            const zipCode = item.querySelector(".zipcode").innerText;
            const address = item.querySelector(".address").innerText;

            if (buttonClicked === "zipCode_01") {
              document.getElementById("zipCode_01").value = zipCode;
              document.getElementById("zipCode_01_1").value = address;
              document.getElementById("zipCode_01_3").focus();
            }

            modalClose();
          });
        });
      });
    </script>
  </body>
</html>
