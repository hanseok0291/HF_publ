</head>
<body>
	
<header id="header">
	<h1>비밀번호 변경</h1>
	<button type="button" class="btn_cls" onclick="cancelConfirm();"><i class="ico_com ico_cls">창닫기</i></button>
</header>
	<div id="ct">	
		<section class="pw_set step1">
			<h2>비밀번호</h2>
			<p class="txt">서비스를 해지 하시려면 비밀번호를 입력해주세요.</p>
			<span class="input_mark" data-passwd="payPwd">
				<input type="password" readonly="readonly" class="tc password nppfs-npv ls" style="height: 70px; background-color: rgb(255, 204, 0); color: rgb(0, 0, 0);" npkencrypt="on" data-keypad-type="num" data-keypad-theme="default" maxlength="6" name="payPwd" id="payPwd" size="6" value="" nppfs-keypad-uuid="nppfs-keypad-payPwd" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_678043eadea2" nppfs-readonly="true">
				<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
				<p class="error fc_reg" style="margin-top: 15px;"></p>
			</span>

		<div id="temp"></div>
	</div>
	<!-- //content -->

<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>

</body></html>
