<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND - 캐릭터 완성</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/dedicatedSavings/characterComplete.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="character-complete-wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title">내 캐릭터 만들기</h2>
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <!-- section -->
          <div class="section">
            <!-- Complete Section -->
            <div class="complete-section">
              <!-- Celebration Text -->
              <div class="celebration-text-area">
                <h1 class="celebration-title">
                  짠! 너무 귀여운<br />
                  내 캐릭터가 완성되었어요
                </h1>
                <p class="celebration-subtitle">이제 캐릭터 집을 만들까요?</p>
              </div>
              <!-- //Celebration Text -->

              <!-- Character Image -->
              <div class="character-image-area">
                <img
                  src="../../images/dedicatedSavings/character-complete.png"
                  alt="완성된 캐릭터"
                  class="character-image"
                  id="characterImage"
                />
              </div>
              <!-- //Character Image -->

              <!-- Create Again Button -->
              <div class="create-again-area">
                <button type="button" class="btn-create-again" id="createAgainBtn">
                  다시 만들기
                </button>
              </div>
              <!-- //Create Again Button -->
            </div>
            <!-- //Complete Section -->
          </div>
          <!-- //section -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->

      <!-- bottom area -->
      <div class="bottom-area">
        <div class="container">
          <div class="action-buttons">
            <button type="button" class="btn btn-secondary" id="shareBtn">
              공유하기
            </button>
            <button type="button" class="btn btn-primary" id="saveBtn">
              집만들기
            </button>
          </div>
        </div>
      </div>
      <!-- //bottom area -->
    </div>
    <!-- //wrap -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <script>
      // 다시 만들기 버튼 클릭 시 createCharacter.html로 이동
      const createAgainBtn = document.getElementById("createAgainBtn");
      createAgainBtn.addEventListener("click", function () {
        window.location.href = "createCharacter.html";
      });

      // 공유하기 버튼 클릭 이벤트 (나중에 구현)
      const shareBtn = document.getElementById("shareBtn");
      shareBtn.addEventListener("click", function () {
        // 공유 기능 구현 예정
        console.log("공유하기");
      });

      // 캐릭터 저장하기 버튼 클릭 이벤트 (나중에 구현)
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.addEventListener("click", function () {
        // 저장 기능 구현 예정
        console.log("캐릭터 저장하기");
      });
    </script>
  </body>
</html>
