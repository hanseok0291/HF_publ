<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/receipt.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title">영수증</h2>
            <button type="button" class="btn-close js-change-btn">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container receipt-container">
          <div class="receipt-wrap">
            <div class="logo-box">
              <img src="../../../images/payment/rround-receipt.svg" alt="RROUND">
            </div>
            <div class="receipt-box">
              <p class="price-text">결제 금액</p>
              <p class="amount-text">19,900원</p>
              <div class="border-box">
                <dl>
                  <dt>주문금액</dt>
                  <dd><b>19,293원</b></dd>
                </dl>
                <dl>
                  <dt>쇼핑지원금 사용</dt>
                  <dd><b>0원</b></dd>
                </dl>
                <dl>
                  <dt>머니 사용</dt>
                  <dd><b>0원</b></dd>
                </dl>
                <dl>
                  <dt>포인트 사용</dt>
                  <dd><b>0원</b></dd>
                </dl>
                <dl>
                  <dt>결제수단</dt>
                  <dd><b>신용카드</b></dd>
                </dl>
              </div>
              <div class="border-box">
                <dl>
                  <dt>주문번호</dt>
                  <dd>9200128</dd>
                </dl>
                <dl>
                  <dt>주문일자</dt>
                  <dd>2024.12.25</dd>
                </dl>
                <dl>
                  <dt>주문자</dt>
                  <dd>김라운</dd>
                </dl>
                <dl>
                  <dt>상품명</dt>
                  <dd>국내제작 뉴 웨이브 쇼파 거실 좌식 아크릴 </dd>
                </dl>
              </div>
            </div>
          </div>
          <ul class="note-wrap">
            <li>구매 영수증은 세금계산서 등 세무상 증빙서류로 활용할 수 없으며, <br> 거래내역 및 거래금액을 확인하는 용도로만 사용 가능합니다.</li>
            <li>할인 내역은 영수증 증빙 내역에 포함되지 않습니다.</li>
            <li>증빙내역이 정상적으로 발급되지 않은 경우 고객센터로 <br> 문의바랍니다.</li>
          </ul>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->
  </body>
</html>
