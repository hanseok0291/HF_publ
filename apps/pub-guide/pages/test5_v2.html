<body>
  <!-- [t5v2] Figma 테스트3 37:2655 — 00-core: iOS StatusBar 제외 · DS CSS 조합(35) -->
  <div class="t5v2-page">
    <!-- [header] NavigationTop Depth2 Sub default — 뒤로 1 + 타이틀 + 체크(온) -->
    <header class="nav-top">
      <button type="button" class="nav-top__icon-btn nav-top__icon-btn--leading" aria-label="뒤로 가기">

      <p class="nav-top__title typo-body1 typo-w-bold">현대카드 12월</p>

          <button type="button" class="t5v2-chip" aria-haspopup="listbox" aria-expanded="true" aria-label="조회 월 선택, 12월">

            <img class="t5v2-chip__chev" src="../assets/ftp-bundle/20420b00fbc6084d763246fedb8ee2c29df034d5.svg" width="16" height="16" alt="" aria-hidden="true">

        <div class="t5v2-dropdown" role="listbox" aria-label="월 선택">
          <button type="button" class="t5v2-dropdown__item t5v2-dropdown__item--bold typo-body2 typo-w-bold" role="option" aria-selected="true">12월</button>

          <button type="button" class="t5v2-dropdown__item typo-body2 typo-w-regular" role="option">10월</button>
        </div>

              <hr class="t5v2-chart__hline t5v2-chart__hline--avg">
              <hr class="t5v2-chart__hline t5v2-chart__hline--sub">
              <div class="t5v2-bars">
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">
                    <div class="t5v2-tooltip__bubble t5v2-tooltip__bubble--danger">
                      <p class="t5v2-tooltip__text typo-caption2 typo-w-bold">99만</p>
                    </div>
                    <img class="t5v2-tooltip__pointer" src="../assets/ftp-bundle/3d19217b9069aee512ae5c8b9474aa9b9f3e1f26.svg" width="6" height="6" alt="">

                  <div class="t5v2-bar-pill t5v2-bar-pill--kb"></div>

                </div>
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">

                  <div class="t5v2-bar-pill t5v2-bar-pill--sm t5v2-bar-pill--h77"></div>
                  <p class="t5v2-bar-caption typo-caption1 typo-w-regular">롯데카드</p>
                </div>
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">
                    <div class="t5v2-tooltip__bubble t5v2-tooltip__bubble--dark">
                      <p class="t5v2-tooltip__text typo-caption2 typo-w-bold">99만</p>

                    <img class="t5v2-tooltip__pointer" src="../assets/ftp-bundle/8ff44c25258225e4d9d55c3fabbc20cae1051b3f.svg" width="6" height="6" alt="">
                  </div>
                  <div class="t5v2-bar-pill t5v2-bar-pill--sm t5v2-bar-pill--h115"></div>
                  <p class="t5v2-bar-caption typo-caption1">삼성카드</p>
                </div>
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">
                    <div class="t5v2-tooltip__bubble t5v2-tooltip__bubble--dark">
                      <p class="t5v2-tooltip__text typo-caption2 typo-w-bold">99만</p>
                    </div>

                    </div>

                  <div class="t5v2-bar-pill t5v2-bar-pill--sm t5v2-bar-pill--h115"></div>
                  <p class="t5v2-bar-caption typo-caption1">하나카드</p>
                </div>
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">
                    <div class="t5v2-tooltip__bubble t5v2-tooltip__bubble--lime">
                      <p class="t5v2-tooltip__text typo-caption2 typo-w-bold">44만</p>
                    </div>
                    <img class="t5v2-tooltip__pointer" src="../assets/ftp-bundle/3556af38eb4d02241152cbbc8e1578350da80bb4.svg" width="6" height="6" alt="">
                  </div>
                  <div class="t5v2-bar-pill t5v2-bar-pill--sm t5v2-bar-pill--h115"></div>
                  <p class="t5v2-bar-caption typo-caption1">현대카드</p>
                </div>
                <div class="t5v2-bar-group">
                  <div class="t5v2-tooltip">

            <h2 id="t5v2-reward-title" class="t5v2-card__head-title typo-body1-reading typo-w-bold">최근 3개월 카드사별 리워드</h2>

            <button type="button" class="t5v2-dropdown__item t5v2-dropdown__item--bold typo-body2 typo-w-bold" role="option" aria-selected="true">현대</button>

            <button type="button" class="t5v2-dropdown__item typo-body2 typo-w-regular" role="option">신한카드</button>

          <div class="t5v2-empty">
            <img class="t5v2-empty__img" src="../assets/ftp-bundle/abe16d06f4feadec8d57f16989e74760730859d2.png" width="64" height="64" alt="" aria-hidden="true">
            <p class="t5v2-empty__text typo-body1-reading typo-w-regular">최근 3개월 동안<br>진행한 이벤트가 없어요.</p>
          </div>
        </section>
        <!-- //reward-card -->

        <!-- [notice] -->
        <section class="t5v2-notice" aria-labelledby="t5v2-notice-title">
          <h2 id="t5v2-notice-title" class="t5v2-notice__title typo-body1 typo-w-bold">유의사항</h2>
          <ul class="t5v2-notice__list">

              <span class="t5v2-notice__bullet" aria-hidden="true">

              <p class="t5v2-notice__body typo-body2 typo-w-regular">라운드 페이에서 진행하는</p>

            <li class="t5v2-notice__item">

                <img src="../assets/ftp-bundle/119075d1fa8f0de86a94bcc2d3f80895c39bb2b3.svg" width="4" height="17" alt="">
              </span>
              <p class="t5v2-notice__body typo-body2 typo-w-regular">해외 이용, 자동이체 신청 등을 제외한<br>이벤트 합산 금액이에요.</p>
            </li>
            <li class="t5v2-notice__item">
              <span class="t5v2-notice__bullet" aria-hidden="true">
                <img src="../assets/ftp-bundle/119075d1fa8f0de86a94bcc2d3f80895c39bb2b3.svg" width="4" height="17" alt="">
              </span>
              <p class="t5v2-notice__body typo-body2 typo-w-regular">카드사별 리워드 그래프는 <a href="#t5v2-graph-anchor" class="t5v2-notice__link">여기서</a> 확인해주세요.</p>
