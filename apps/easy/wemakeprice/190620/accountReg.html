<title>간편결제</title>
<link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Noto+Sans" media="all"><script>
var check = true;
var arscheck = true;

$(function(){	
	$('#doAuthAcctNmCheck').click(function(e){
		$("#POacctNo").val("");
		var obj = this;
		if(!$('.btn_xr.btn_type').hasClass('on')){
			$('#acctNo').focus();
			return false;
		}
		
		if(!$(this).hasClass('on')){
			$(this).addClass('on');
		}

		//계좌체크
		if($('#acctNo').val() == ''){
			alert("계좌번호를 입력해주세요.");
			$(this).removeClass('on');
			$('#acctNo').focus();
			return false;
		}
		
		if(check){
			//이중체크 방지
			check=false;
			
			$.ajax({
				type: "post",
				url: ""+URL_PATH+"?_method=authAcctNmCheck",
				dataType : "json",
				data: {POacctNo : $("#acctNo").val(), PTrNo : $("#PTrNo").val(), PBnkCd : $("#PBnkCd").val()},
				success:function(data){
					if(data.code == "0000"){
						$('#_method').val('doArsAuth');
						$("#form").attr('action',''+URL_PATH).submit();
						
					} else {
						
						check = true;
						$(obj).removeClass('on');
						$('#acctNo').val("");
						$('#acctNo').focus();
						//alert("예금주조회에 오류가 발생되었습니다.\n다시 시도 하십시요.");

						//return false;
						if(data.code == "1111"){ 
							$('#PRmesg1').val("세션 만료.");
							$('#_method').val('userCanc');
							$("#form").attr('action',''+URL_PATH).submit();
						}else{
							alert(data.msg);
						}
					}	
				},
				error:function(e){
					
					check = true;
					
					$(obj).removeClass('on');
					$('#acctNo').val();
					$('#acctNo').focus();
					
					return false;
				}
			});
		}
	});

	$('#doArsCancel').click(function(e){
		layer_close();
		check = true;

		if($("#acctNo").val()){
			$('.btn_xr.btn_type').addClass('on');
		}else{
			$('.btn_xr.btn_type').removeClass('on');
		}
	});
	
	$('#doArs').click(function(e){
			$('#_method').val('doArsAuth');
			$("#form").attr('action',''+URL_PATH).submit();
	});

	$("#acctNo").keyup(function(e){
		$(this).val($(this).val().replace(/[^0-9]/g,""));

		var acctLength = $(this).val().length;
		
		if(7 <= acctLength && acctLength <= 15){
			if(!$('.btn_xr.btn_type').hasClass('on')){
				$('.btn_xr.btn_type').addClass('on');
				$('.btn_xr.btn_type').attr('disabled', false);
			}
		}else{
			if($('.btn_xr.btn_type').hasClass('on')){
				$('.btn_xr.btn_type').removeClass('on');
				$('.btn_xr.btn_type').attr('disabled', true);
			}
		}
	});

	// 은행 선택 레이어 열기
	$('.select_bank .select').click(function(){
		$('.ly_bankList, .ly_bankList .bg').fadeIn(200);
		$('.ly_bankList .cont').animate({bottom: "0"},300);
	});
	
	// 은행 선택 레이어 닫기
	function closeBankLayer(){
		$('.ly_bankList, .ly_bankList .bg').fadeOut(200);
		$('.ly_bankList .cont').animate({bottom: "-40rem"},300);
	};
	$('.ly_bankList .bg').click(function(){
		closeBankLayer();
	});
	
	// 은행 버튼 클릭
	$('.bank_list li').click(function(e){
		e.preventDefault();

		if($(this).find('i').hasClass('ico_com')){
			alert("이미 등록된 은행입니다.");
		}else{
			closeBankLayer(); // 레이어 닫기
			if(check){

				//이중클릭 방지
				check = false;
				var bankCd = $(this).find('img').attr('id');
				var bankNm = $(this).find('img').attr('alt');
				$.ajax({
					type: "post",
					url: ""+URL_PATH+"?_method=checkBankTime",
					dataType : "json",
					data: {PBnkCd : bankCd, PMid : $("#PMid").val(), trGb : "NA"},
					success:function(data){
						if(data.stateCd == "0021"){

							$('#payGb').val('RE');
							$('#PCustId').val('4354DB78FB3C4D66BE7A2AC273534476');
							$('#PAmt').val('');
							$('#POid').val('');
							$('#PTrNo').val('SBank_FIRMwonder1t0020190605174033000371');
							$('#PMid').val('wonder1t');
							$('#PMchtParam').val('');
							$('#PCancUrl').val('http://192.168.0.43:9090/resultCanclPayment?_csrf=805cd983-7f19-4ac6-be40-c17ed93754be');
							$('#PNextUrl').val('http://192.168.0.43:9090/resultPayment?_csrf=805cd983-7f19-4ac6-be40-c17ed93754be');
							$('#PBnkCd').val(bankCd);
							$('#bnkNm').val(bankNm);
							$('#_method').val('inputAcctNo');
							$("#form").attr('action',''+URL_PATH).submit(); 

						}else{
							alert(data.errMsg);
							check = true;
						}
					},
					error:function(e){
						check = true;
					}
				});
			}
		}
	});
	
	// X 버튼 클릭
	$('.btn_cls').click(function(){
		confirm("간편결제 취소하시겠습니까?", function(){
			$('#payGb').val('RE');
			$('#PCustId').val('4354DB78FB3C4D66BE7A2AC273534476');
			$('#PAmt').val('');
			$('#POid').val('');
			$('#PStatus').val("0031");
			$('#PRmesg1').val(encodeURIComponent("사용자취소"));
			$('#PMchtParam').val('');
			$("#form").attr('action','http://192.168.0.43:9090/resultCanclPayment?_csrf=805cd983-7f19-4ac6-be40-c17ed93754be').submit();
		});
	});

	// 취소 버튼 클릭
	$("#cancle").click(function(){
		confirm("간편결제 취소하시겠습니까?", function(){
			$('#payGb').val('RE');
			$('#PCustId').val('4354DB78FB3C4D66BE7A2AC273534476');
			$('#PAmt').val('');
			$('#POid').val('');
			$('#PStatus').val("0031");
			$('#PRmesg1').val(encodeURIComponent("사용자취소"));
			$('#PMchtParam').val('');
			$("#form").attr('action','http://192.168.0.43:9090/resultCanclPayment?_csrf=805cd983-7f19-4ac6-be40-c17ed93754be').submit();
		});
	});
});
