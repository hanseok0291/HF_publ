	<style>
	#canvasContainer {
		background-image: url(/images/wheelBackground.png);
		background-repeat: no-repeat;   /* Ensure that background does not repeat */
		background-position: center;    /* Ensure image is centred */
		width: 400px;                   /* Width and height should at least be the same as the canvas */
		height: 400px;
	}
	#canvasContainer {
    position: relative;
    width: 300px;
}
 
#canvas {
    z-index: 1;
}
 
#prizePointer {
    position: absolute;
    left: 125px;
    top: 10px;
    z-index: 999;
}
	</style>
  <body>
    <!-- form -->
    <form class="main_form" action="javascript: void(0);" autocomplete="off">
      <!-- wrap -->
      <!-- <div id="wrap" class="wrap wrap-app no-header chulcheck chulcheck-may"> -->
			<!-- 출석완료시 complete 클래스 추가 -->
      <div id="wrap" class="wrap wrap-app no-header"> 
        <!-- content -->
        <div id="content">
          <!-- section - visual -->
          <div class="section section-visual">
            <div class="container">
              <div id="canvasContainer">
								    <canvas id="canvas" width="400" height="400">
								        Canvas not supported, please user another browser.
								    </canvas>
								</div>
            </div>
          </div>
          <!-- //section - visual -->

        </div>
        <!-- //content -->
      </div>
      <!-- //wrap -->
    </form>
    <!-- //form -->

		<script>
		// $(document).ready(function(){
		// 	modalOpenSlide('modalSlideType1')
		// })
		let handWheel = new Winwheel({
				'canvasId'    : 'canvas',
				'fillStyle'   : '#7de6ef',
				'outerRadius' : 150,
				'centerY'     : 230,
				'numSegments' : 10,
				'rotationAngle': -30,
				'segments'    :
				[
						{'fillStyle' : '#e7706f'}
				]
		});
		// Create image in memory.
		let handImage = new Image();
		
		// Set onload of the image to anonymous function to draw on the canvas once the image has loaded.
		handImage.onload = function()
		{
				let handCanvas = document.getElementById('canvas');
				let ctx = handCanvas.getContext('2d');
			
				if (ctx) {
						ctx.save();
						ctx.translate(200, 150);
						ctx.rotate(handWheel.degToRad(0));  // Here I just rotate the image a bit.
						ctx.translate(-200, -150);
						ctx.drawImage(handImage, 255, 110);   // Draw the image at the specified x and y.
						ctx.restore();
				}
		};
			
		// Set source of the image. Once loaded the onload callback above will be triggered.
		handImage.src = '../../images/icon-arrow-down.svg';
		</script>
  </body>
