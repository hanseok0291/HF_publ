<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- favicon -->
<link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png">
<link rel="manifest" href="../../images/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
<!-- //favicon -->

<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/slick.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">휴대폰 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">드시모네 키즈 세트 afghjlmoprqyz 12345678901234567890</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">287,000</em>원</strong> 결제합니다.</p>
					<div class="calc">
						<p class="total text-primary"><em>298,000</em>원</p>
						<p class="sub-area">
							<span class="sub"><span class="label">즉시할인</span> <em>-11,000</em>원</span>
						</p>
					</div>
					<p class="prd-period">제공일자 : 2021-01-01 (월 자동결제)</p>
				</div>
				<!-- //주문정보 -->

				<!-- 정보 입력 -->
				<div class="section">
					<h3 class="section-title">통신사 선택</h3>
					<ul class="check-group telecom-list">
						<li>
							<input type="radio" name="telecom" id="telecom_1" checked>
							<label for="telecom_1"><span class="logo"><img src="../../images/logo/telecom/skt.png" alt="SKT"></span> <span class="name">SKT</span></label>
							<span class="label label-event">할인</span>
						</li>
						<li>
							<input type="radio" name="telecom" id="telecom_2">
							<label for="telecom_2"> <span class="logo"><img src="../../images/logo/telecom/kt.png" alt="KT"></span> <span class="name">KT</span></label>
							<span class="label label-event">할인</span>
						</li>
						<li>
							<input type="radio" name="telecom" id="telecom_3">
							<label for="telecom_3"><span class="logo"><img src="../../images/logo/telecom/lg.png" alt="LG U+"></span> <span class="name">LG U+</span></label>
							<span class="label label-event">할인</span>
						</li>
						<li>
							<input type="radio" name="telecom" id="telecom_4">
							<label for="telecom_4"><span class="logo"><img src="../../images/logo/telecom/hello.png" alt="Hello mobile"></span> <span class="name">Hello mobile</span></label>
							<span class="label label-event">할인</span>
						</li>
						<li>
							<input type="radio" name="telecom" id="telecom_5">
							<label for="telecom_5"><span class="logo"><img src="../../images/logo/telecom/kct.png" alt="KCT"></span> <span class="name">KCT</span></label>
							<span class="label label-event">할인</span>
						</li>
						<li>
							<input type="radio" name="telecom" id="telecom_6">
							<label for="telecom_6"><span class="logo"><img src="../../images/logo/telecom/sk7.png" alt="SK 7mobile"></span> <span class="name">SK 7mobile</span></label>
							<span class="label label-event">할인</span>
						</li>
					</ul>
				</div>
				<!-- //정보 입력 -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<!-- 슬라이드 배너 -->
				<div class="slide-banner">
					<a href="#"><img src="../../images/banner/card/discount-06.png" alt="추가 할인받기 즉시할인 1,000원"></a>
					<a href="#"><img src="../../images/banner/card/discount-07.png" alt="1,000원 즉시할인받고 휴대폰번호 보호하기"></a>
				</div>
				<!-- //슬라이드 배너 -->

				<button type="button" id="send" class="btn btn-xl btn-primary">확인</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 공지사항 상세 -->
<div id="noticeDetail" class="modal modal-full" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- 게시판 상세 -->
					<div class="board-detail">
						<h3 class="subject">공지사항 제목</h3>
						<div class="content">
							공지사항 내용
						</div>
					</div>
					<!-- //게시판 상세 -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 공지사항 상세 -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(document).ready(function(){
		// 배너 슬라이드
		$(".slide-banner").slick({
			arrows: false,
			dots: true,
			autoplay: true,
			autoplaySpeed: 2000,
			pauseOnHover: false,
			pauseOnFocus: false
		});
	});
</script>
</body>
</html>
