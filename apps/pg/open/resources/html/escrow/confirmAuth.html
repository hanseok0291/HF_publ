<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- wrap -->
<div class="wrap-default">
	<!-- header -->
	<div id="header" class="container">
		<h1 class="logo"><img src="../../images/logo-spay-white.png" alt="S'pay"></h1>
	</div>
	<!-- //header -->

	<!-- main content -->
	<div id="main">
		<!-- headline -->
		<div class="headline container">
			<h2>에스크로 구매 결정</h2>
			<p>배송된 상품을 수령하셨나요?<br>
				주문하신 상품의<br>
				구매를 확정해주세요!</p>
		</div>
		<!-- //headline -->

		<!-- content box -->
		<div class="content-box container">
			<!-- form -->
			<form autocomplete="off">
				<!-- section -->
				<div class="section">
					<h3 class="section-title">에스크로 결제 정보 입력</h3>
					<div class="section-content">
						<ul class="form-type">
							<li>
								<input type="password" name="" id="" maxlength="20" placeholder="비밀번호 (4~20자리 영문, 숫자)">
								<div class="text-error"><!--4 ~ 20자리 영문 소문자, 숫자만 입력해 주세요.--></div>
								<div class="text-info">
									<p class="info">상품 구매 시, 결제창에서 등록한 비밀번호를 입력해 주세요.</p>
								</div>
							</li>
						</ul>
					</div>
				</div>
				<!-- //section -->

				<!-- bottom button -->
				<div class="section btn-area">
					<button type="submit" class="btn btn-lg btn-secondary">확인</button>
				</div>
				<!-- //bottom button -->
			</form>
			<!-- //form -->
		</div>
		<!-- //content box -->
	</div>
	<!-- //main content -->

	<!-- footer -->
	<div id="footer">
		<div class="container">
			<p>Copyright(c) Hecto Financial Co,. Ltd. All Rights Reserved.</p>
			<p class="mgt10"><strong class="text-primary">헥토파이낸셜 고객센터 1600-5220</strong></p>
		</div>
	</div>
	<!-- //footer -->
</div>
<!-- //wrap -->

<script src="../../js/jquery.placeholder.min.js"></script>
<script>
	$(document).ready(function(){
		// IE9 이하 jquery.placeholder.js 적용
		$("input, textarea").placeholder();
	})
</script>
</body>
</html>
