<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common/css/common.css?dummy=20191021154314516">
<link rel="stylesheet" href="../../css/common/css/site.css?dummy=20191021154314516">
<script src="../../css/common/js/jquery-1.8.3.min.js?dummy=20191021154314516"></script>
<script src="../../css/common/js/webfont.js?dummy=20191021154314516"></script>
<script src="../../css/common/js/design.js?dummy=20191021154314516" defer="defer"></script>
<script src="../../css/common/js/dialog.js?dummy=20191021154314516" defer="defer"></script>
<script src="../../js/gtag/sbgtag-1.0.js?dummy=20191021154314516" ></script> 
<script src="../../css/common/js/custom.js?dummy=20191021154314516" defer="defer"></script>
<title>간편결제</title>
</head>

<body>
<header id="header">
	<h1>신규/추가 등록</h1>
</header>

<div id="ct">
	<form name="frm" id="frm" method="post">
		<!-- 계좌번호 입력 -->
		<section class="section">
			<h2 class="section_title">계좌번호 입력</h2>
			<fieldset class="ars_form type2">
				<legend>계좌번호 입력폼</legend>
				<ul class="brb0">
					<li class="bank">
						<span class="stit">은행</span>
						<span class="img"><img src="../../css/common/images/bank_crop/fullname_02.png" alt="국민은행"></span>
					</li>
					<li class="master">
						<span class="stit">예금주</span>
						<strong>홍길동</strong>
					</li>
					<li class="num">
						<span class="stit">계좌번호</span>
						<span class="input">
							<input type="tel" name="POacctNo" id="POacctNo" placeholder="‘-’없이 입력" tabindex="1" maxlength="20">
						</span>
					</li>
				</ul>
			</fieldset>
			<ul class="info_list">
				<li>본인명의 계좌만 가능, 적금/가상/펀드/평생 계좌 불가</li>
			</ul>
		</section>
		<!-- //계좌번호 입력 -->

		<!-- 출금동의 선택 -->
		<section class="section">
			<h2 class="section_title">출금동의 선택</h2>
			<ul class="tab_type">
				<li style="background-color:#415564;"><button type="button" onclick="doAuthAction('ars');" class="active">ARS인증</button></li>
				<li><button type="button" onclick="doAuthAction('app');">전자서명</button></li>
			</ul>
			<div class="tab_cont" id="tab_cont_ars">
				<ul class="info_list">
					<li>휴대폰으로 ARS전화가 수신되며,<br>
						불러주는 인증번호 2자리를 입력해 주세요.</li>
				</ul>
			</div>
			<div class="tab_cont" id="tab_cont_app">
				<ul class="info_list">
					<li>금융결제원 '어카운트인포' 앱이 실행되며,<br>
						자동이체 출금에 동의해 주세요.</li>
				</ul>
			</div>
		</section>
		<!-- //출금동의 선택 -->

		<ul class="btn_area2 v1">
			<li class="bt1">
				<button type="button" id="cancle" name="cancle" onclick="agreeCancelConfirm();" class="btn_xr btn_type2">취소</button>
			</li>
			<li class="bt2">
				<button type="button" id="auth_req_ars" name="auth_req_ars" class="btn_xr btn_type" disabled="disabled">ARS인증하기</button>
				<button type="button" id="auth_req_app" name="auth_req_app" class="btn_xr btn_type" disabled="disabled">전자서명하기</button>
			</li>
		</ul>
	</form>
</div>
<!-- //content -->

<script>
	// 출금동의 선택 토글
	$("#tab_cont_app, #auth_req_app").hide();
	function doAuthAction(type){
		if(type == "ars"){
			$("#tab_cont_ars, #auth_req_ars").show();
			$("#tab_cont_app, #auth_req_app").hide();
		}else if(type == "app"){
			$("#tab_cont_ars, #auth_req_ars").hide();
			$("#tab_cont_app, #auth_req_app").show();
		}
	}
</script>
</body>
</html>
