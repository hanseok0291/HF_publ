<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/gigworker.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker familyInfoEnter">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap">
            <h3 class="mainTitle normal">
              박혜빈님의 <br>
              <b>부양가족</b>에 대해 알려주세요.
            </h3>
          </div>
          <ul class="mt24">
            <!-- 입력가능 범위를 초과 시 error 클래스 -->
            <li class="boxInput">
              <span class="default">이름</span>
              <span class="errorText">확인 후 다시 입력해 주세요.</span>
              <input type="text" placeholder="부양가족 이름 입력" />
              <button type="button" class="inputDel"></button>
            </li>
            <li class="boxInput residentNum type2"><!-- 생년월일 직접 입력 폼 type2 추가  -->
              <span class="default">주민등록번호</span>
              <span class="errorText">확인 후 다시 입력해 주세요.</span>
              <div class="inputArea">
                <span class="placeholderText">주민등록번호 입력</span>
                <input class="firstInput" type="text" pattern="\d*" maxlength="6" oninput="maxLengthCheck(this)"/>
                <span class="dash2">-</span>
                <div class="lastInputWrap">
                  <input class="lastInput" type="number" inputmode="numeric" pattern="\d*" maxlength="7" oninput="maxLengthCheck(this)"/>
                  <div class="inputDot">
                    <!-- span에 fill Class 추가 시 입력 -->
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                </div>
              </div>
              <button type="button" class="inputDel"></button>
            </li>
            <li class="boxInput selectInput" onclick="modalOpenSlide('modalRelationSel')">
              <span class="default">관계</span> 
              <input type="text" placeholder="본인과의 관계 선택" />
              <button class="btn-view"></button>
            </li>
            <li class="boxInput checkInput" onclick="modalOpenSlide('modalYearCheck')">
              <span class="default">공제 연도</span> 
              <input type="text" placeholder="공제 연도 선택" />
              <button class="btn-view"></button>
            </li>
          </ul>

          <div class="botBtnWrap">
            <!-- 버튼 비활성화 시 disable 클래스 -->
            <button type="button" class="bot-btn disable">등록하기</button>
          </div>
        </div>
        </div>
      <!-- //content -->

      <!-- slide modal -->
      <div id="modalRelationSel" class="modal modal-slide modal-select">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h3>본인과의 관계 선택</h3>
              <button type="button" class="btn btn-close hide">
                <i class="icon-times">닫기</i>
              </button>
            </div>
            <div class="modal-body">
              <div class="container">
                <ul class="optionWrap">
                  <li>본인의 직계 존속</li>
                  <li>배우자의 직계 존속</li>
                  <li>배우자</li>
                  <li>직계 비속(자녀, 입양자)</li>
                  <li>직계 비속(자녀, 입양자 제외)</li>
                  <li>형제자매</li>
                  <li>수급자</li>
                  <li>위탁 아동</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- //slide modal -->

      <!-- slide modal -->
      <div id="modalYearCheck" class="modal modal-slide modal-year">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h3>공제 연도 선택 <span>(복수 선택 가능)</span></h3>
              <button type="button" class="btn btn-close hide">
                <i class="icon-times">닫기</i>
              </button>
            </div>
            <div class="modal-body">
              <div class="container">
                <ul class="checkWrap">
                  <li>
                    <div class="topArea">
                      2022년
                      <span class="dropdown-btn"></span>
                    </div>
                    <div class="botArea">
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal1_1" checked>
                          <label for="agreeModal1_1">내국인이에요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal1_2">
                          <label for="agreeModal1_2">장애가 있어요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal1_3" checked>
                          <label for="agreeModal1_3">연소득 100만원 이하예요.</label>
                        </span>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="topArea">
                      2021년
                      <span class="dropdown-btn"></span>
                    </div>
                    <div class="botArea">
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal2_1" checked>
                          <label for="agreeModal2_1">내국인이에요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal2_2">
                          <label for="agreeModal2_2">장애가 있어요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal2_3" checked>
                          <label for="agreeModal2_3">연소득 100만원 이하예요.</label>
                        </span>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="topArea">
                      2020년
                      <span class="dropdown-btn"></span>
                    </div>
                    <div class="botArea">
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal3_1" checked>
                          <label for="agreeModal3_1">내국인이에요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal3_2">
                          <label for="agreeModal3_2">장애가 있어요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal3_3" checked>
                          <label for="agreeModal3_3">연소득 100만원 이하예요.</label>
                        </span>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="topArea">
                      2019년
                      <span class="dropdown-btn"></span>
                    </div>
                    <div class="botArea">
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal4_1" checked>
                          <label for="agreeModal4_1">내국인이에요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal4_2">
                          <label for="agreeModal4_2">장애가 있어요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal4_3" checked>
                          <label for="agreeModal4_3">연소득 100만원 이하예요.</label>
                        </span>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="topArea">
                      2018년
                      <span class="dropdown-btn"></span>
                    </div>
                    <div class="botArea">
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal5_1" checked>
                          <label for="agreeModal5_1">내국인이에요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal5_2">
                          <label for="agreeModal5_2">장애가 있어요.</label>
                        </span>
                      </div>
                      <div class="join-agree">
                        <span class="checkbox square2 blank">
                          <input type="checkbox" id="agreeModal5_3" checked>
                          <label for="agreeModal5_3">연소득 100만원 이하예요.</label>
                        </span>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
              <button type="button" class="bot-btn checkComplete">선택 완료</button>
            </div>
          </div>
        </div>
      </div>
      <!-- //slide modal -->
    </div>
    <!-- //wrap -->
    

    <script>
      function modalClose(e){
        var temp = $(e).parents(".modal");
        $(temp).fadeOut(200);
        $(e).parents(".modal-content").animate({ bottom: -450 }, 200);
        $(".bank-list").scrollTop(0);
        $("body").removeClass("modal-open");
        $("#wrap").css("top", 0);
        $("#wrap").css("position", "relative");
        $("#header").css("top", "-1px");
        $(".boxInput .btn-view").css({"transform": "rotate(90deg)"});
      };

      // 본인과의 관계 선택
      $(".modal-select .optionWrap li").on("click", function(){
        var option = $(this).text();
        $(".selectInput input").val(option);
        $(".selectInput").addClass("active");
        $("body").removeClass("modal-open");
        modalClose(this);
      });

      // 공제 연도 선택
      var yearArr = [];
      $(".modal-year .checkWrap .topArea").on("click", function(){
        var checkStatus = false;
        var $parent = $(this).parent();
        $(".botArea").not($parent.find(".botArea")).slideUp();
        $parent.find(".botArea").slideToggle();
        $parent.find(".botArea input").each(function(){
          if($(this).prop("checked")){
            checkStatus = true;
          }
        });
        // 230404 수정
        if(checkStatus){
          $parent.addClass("checked");
        }
        if(!$parent.hasClass("active")){
          $parent.addClass("active");
        } else {
          $parent.removeClass("active");
        }
        // 230404 수정 END
      });

      $(".botArea input").on("change", function(){
        var checkCount = 0;
        $(this).closest(".botArea").find("input").each(function(){
          if($(this).is(":checked")){
            checkCount++;
          }
        });
        if(checkCount > 0){
          $(this).closest("li").addClass("checked");
        } else {
          $(this).closest("li").removeClass("checked");
        }
      });

      $(".checkComplete").on("click", function(){
        $(".botArea").hide();
        yearArr = [];
        $(".checkWrap li").each(function(i, e){
          if($(e).hasClass("checked")){
            var year = $(e).find(".topArea").text().trim().replace("년", "")
            yearArr.push(year);
          }
        });

        if(yearArr.length > 0){
          $(".checkInput input").val(yearArr.sort().join(", "));
          $(".checkInput").addClass("active");
        } else {
          $(".checkInput input").val("");
          $(".checkInput").removeClass("active");
        }
        modalClose(this);
      });

    </script>
  </body>
</html>
