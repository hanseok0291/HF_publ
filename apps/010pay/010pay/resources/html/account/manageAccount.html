<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);">
	<!-- wrap -->
	<div id="wrap" class="bg-gray">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name"><a href="#"><span class="my-logo"><img src="../../images/logo-myaccount.png" class="logo" alt="내통장결제"></span></a></h1>
				<h2 class="page-title hidden">계좌 관리</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<div class="fix-layer top">
			<!-- nav tab -->
			<div class="nav-tab">
				<div class="container">
					<ul>
						<li><a href="#">HOME</a></li>
						<li><a href="#">이용내역</a></li>
						<li><a href="#" class="now">계좌관리</a></li>
						<li><a href="#">내정보</a></li>
					</ul>
				</div>
			</div>
			<!-- //nav tab -->
		</div>

		<!-- content -->
		<div id="content" class="menu-dep2 bg-gray">
			<!-- container -->
			<div class="container manage-wrap">
				<div class="manage-account">
					<!-- title area -->
					<div class="title-area">
						<h3>등록 계좌 <span class="count">10</span></h3>
						<button type="button" class="btn btn-outline btn-sm">계좌설정</button>
					</div>
					<!-- title area -->

					<!-- list -->
					<ol class="account-list">
						<li>
							<div class="desc default">
								<button type="button" class="btn-star on"><i class="icon icon-star"></i></button>
								<span class="account-number"><img src="../../images/bank/logo_090.png" alt="카카오뱅크"> 카카오뱅크 <em class="number"><i>****</i>123</em></span>
								<span class="check-primary"><span>주계좌</span> <i class="icon-check primary"></i></span>
							</div>
						</li>
						<li>
							<div class="desc">
								<button type="button" class="btn-star"><i class="icon icon-star"></i></button>
								<span class="account-number"><img src="../../images/bank/logo_020.png?ver=1.1" alt="우리"> 우리 <em class="number"><i>****</i>123</em></span>
								<span class="check-primary"><span>주계좌</span> <i class="icon-check primary"></i></span>
							</div>
						</li>
						<li>
							<div class="desc">
								<button type="button" class="btn-star"><i class="icon icon-star"></i></button>
								<span class="account-number"><img src="../../images/bank/logo_004.png?ver=1.1" alt="국민"> 국민 <em class="number"><i>****</i>123</em></span>
								<span class="check-primary"><span>주계좌</span> <i class="icon-check primary"></i></span>
							</div>
						</li>
						<li>
							<div class="desc">
								<button type="button" class="btn-star"><i class="icon icon-star"></i></button>
								<span class="account-number"><img src="../../images/bank/logo_088.png?ver=1.1" alt="신한"> 신한 <em class="number"><i>****</i>123</em></span>
								<span class="check-primary"><span>주계좌</span> <i class="icon-check primary"></i></span>
							</div>
						</li>
					</ol>
					<!-- //list -->

					<!-- info -->
					<p class="info text-light">등록 가능한 계좌는 최대 10개입니다.</p>
					<!-- //info -->
				</div>
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<button type="button" class="btn btn-outline"><i class="icon icon-plus"></i> <span>계좌 추가</span></button>
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
// 주거래 계좌 활성
$('.manage-wrap .btn-star').on('click', function() {
	$('.manage-wrap .desc').removeClass('default');
	$('.manage-wrap .btn-star').removeClass('on');
	$(this).addClass('on');
	$(this).parent().addClass('default');
});
</script>
</body>
</html>
