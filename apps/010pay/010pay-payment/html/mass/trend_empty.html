  <script>
    $(function () {
      /* =========================================================
       * 1) 퍼블리싱용 셀렉트 UI 공통 동작 (개발 정책 반영)
       * - 구조:
       *   .select-wrap(루트)
       *     > .select-btn
       *     > .option-wrap
       *         .option-btn ...
       * ========================================================= */
      function bindSelectUI() {
        // 셀렉트 버튼 클릭 → 해당 셀렉트의 option-wrap만 토글
        $(document).on("click", ".select-wrap > .select-btn", function (e) {
          e.preventDefault();
          e.stopPropagation();

          const $btn = $(this);
          const $root = $btn.closest(".select-wrap");
          const $options = $root.children(".option-wrap");

          // 다른 셀렉트 닫기(서로 간섭 금지)
          $(".select-wrap").not($root).children(".option-wrap:visible").hide();

          $options.toggle();
        });

        // 옵션 클릭 → 같은 셀렉트 내에서만 active + 라벨 변경 + option-wrap 닫기
        $(document).on(
          "click",
          ".select-wrap .option-wrap .option-btn",
          function (e) {
            e.preventDefault();
            e.stopPropagation();

            const $opt = $(this);
            const $root = $opt.closest(".select-wrap");
            const $options = $root.children(".option-wrap");

            // active는 해당 옵션 리스트 안에서만
            $options.find(".option-btn").removeClass("active");
            $opt.addClass("active");

            // 라벨 반영
            const label = $opt.find("span").text().trim();
            if (label) $root.find("> .select-btn > span").text(label);

            // option-wrap만 닫기 (select-wrap 자체 hide 금지)
            $options.hide();

            // 혜택 차트 셀렉트면 차트 변경 트리거
            if ($root.closest(".benefit-chart-wrap").length) {
              if (typeof window.__BENEFIT_SELECT_CHANGED__ === "function") {
                window.__BENEFIT_SELECT_CHANGED__(label);
              }
            }
          }
        );

        // 바깥 클릭 시 모든 option-wrap 닫기
        $(document).on("click", function () {
          $(".select-wrap").children(".option-wrap:visible").hide();
        });
      }

      bindSelectUI();

      /* =========================================================
       * 2) 카드사별 혜택 라인차트 (퍼블리싱용)
       * - 카드사 라인: 안쪽 영역 (마커/말풍선 표시)
       * - 평균 라인: 풀-와이드(그래프 구분선 시작~끝) + 점선 + 말풍선 없음
       * - 선은 항상 연결: 중간 null은 포인트만 생략하고 연결은 유지
       * ========================================================= */
      const MAIN_COLOR = "#A0D70B";
      const AVG_COLOR = "#F04806";
      const AVG_DASH = "4 4";
      const Y_MIN = 50000;
      const Y_MAX = 300000;

      let selectedIssr = null; // { values:[3] }
      let avgSeries = null; // [3] or null

      const svg = document.getElementById("cardChart");
      const NS = "http://www.w3.org/2000/svg";

      /* =========================
       * 퍼블리싱용 Mock API
       * ========================= */
      const MOCK_API = {
        KB국민: {
          resCd: "0",
          resData: {
            issrMthBenList: [
              { benMthText: "10월", benAmt: 130000 },
              { benMthText: "11월", benAmt: 210000 },
              { benMthText: "12월", benAmt: 470000 },
            ],
            issrMthBenAvgList: [
              { benMth: "202510", benAmt: "150000" },
              { benMth: "202511", benAmt: "160000" },
              { benMth: "202512", benAmt: "170000" },
            ],
          },
        },
        신한: {
          resCd: "0",
          resData: {
            issrMthBenList: [
              { benMthText: "10월", benAmt: 220000 },
              { benMthText: "11월", benAmt: 180000 },
              { benMthText: "12월", benAmt: 120000 },
            ],
            issrMthBenAvgList: [
              { benMth: "202510", benAmt: "170000" },
              { benMth: "202511", benAmt: "165000" },
              { benMth: "202512", benAmt: "160000" },
            ],
          },
        },
        현대: {
          resCd: "0",
          resData: {
            issrMthBenList: [
              { benMthText: "10월", benAmt: 300000 },
              // 11월 없음(중간 null)
              { benMthText: "12월", benAmt: 250000 },
            ],
            issrMthBenAvgList: [
              { benMth: "202510", benAmt: "180000" },
              { benMth: "202512", benAmt: "175000" },
            ],
          },
        },
      };

      function fetchMock(label) {
        return $.Deferred()
          .resolve(MOCK_API[label] || { resCd: "1" })
          .promise();
      }

      /* =========================
       * 유틸
       * ========================= */
      function createSvg(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach((k) => el.setAttribute(k, attrs[k]));
        return el;
      }

      function formatWanFromWon(v) {
        if (v === null || v === undefined) return "-";
        return Math.round(Number(v) / 10000) + "만";
      }

      function parseMonthNumber(text) {
        const m = String(text || "").match(/(\d{1,2})\s*월/);
        return m ? Number(m[1]) : null;
      }

      // 막대그래프 월 셀렉트(10~12월)에서 오름차순으로 3개 가져오기
      function getFixed3MonthsFromUI() {
        return $(".stick-graph-wrap .option-wrap .option-btn span")
          .map(function () {
            const t = $(this).text().trim();
            const m = parseMonthNumber(t);
            return m ? { t, m } : null;
          })
          .get()
          .filter(Boolean)
          .sort((a, b) => a.m - b.m)
          .slice(-3)
          .map((x) => x.t);
      }

      function mapIssrValues(issrList, months) {
        const map = {};
        (issrList || []).forEach((x) => {
          if (x?.benMthText != null) map[String(x.benMthText)] = x.benAmt;
        });

        return months.map((m) => {
          const v = map[m];
          return v === null || v === undefined ? null : Number(v);
        });
      }

      // 평균은 benMth(YYYYMM) 기반으로 매핑
      function mapAvgValues(avgList, months) {
        const map = {};
        (avgList || []).forEach((x) => {
          const mm = String(x?.benMth || "").slice(4, 6); // "10"
          if (!mm) return;
          const v = x?.benAmt;
          map[Number(mm)] = v === null || v === undefined ? null : Number(v);
        });

        const values = months.map((m) => {
          const mm = parseMonthNumber(m);
          return mm ? map[mm] ?? null : null;
        });

        return values.some((v) => v !== null && v !== undefined)
          ? values
          : null;
      }

      /* =========================
       * 카드사 말풍선(카드사만)
       * ========================= */
      function drawBubbleLabel(x, y, text) {
        const paddingX = 8;
        const radius = 16;
        const h = 28;

        // 퍼블용 텍스트 폭 추정
        const approxTextW = Math.max(28, String(text).length * 9);
        const w = approxTextW + paddingX * 2;

        const bx = x - w / 2;
        const by = y - h - 14;

        const tailW = 6;
        const tailH = 6;
        const tailX = x;
        const tailY = by + h;

        const g = createSvg("g", {});
        g.appendChild(
          createSvg("rect", {
            x: bx,
            y: by,
            rx: radius,
            ry: radius,
            width: w,
            height: h,
            fill: MAIN_COLOR,
          })
        );
        g.appendChild(
          createSvg("path", {
            d: `M ${tailX - tailW / 2} ${tailY} L ${
              tailX + tailW / 2
            } ${tailY} L ${tailX} ${tailY + tailH} Z`,
            fill: MAIN_COLOR,
          })
        );

        const t = createSvg("text", {
          x: x,
          y: by + h / 2 + 4,
          "text-anchor": "middle",
          "font-weight": "700",
          "font-size": 11,
          fill: "#111111",
        });
        t.textContent = text;
        g.appendChild(t);

        return g;
      }

      /* =========================
       * 차트 그리기
       * ========================= */
      function drawLineChart() {
        if (!svg || !selectedIssr) return;

        const container = document.querySelector(
          ".benefit-chart-wrap .chart-container"
        );
        const WIDTH = container ? container.offsetWidth : 0;
        if (!WIDTH) return;

        const HEIGHT = 252;
        svg.setAttribute("viewBox", `0 0 ${WIDTH} ${HEIGHT}`);
        svg.innerHTML = "";

        const months = getFixed3MonthsFromUI(); // ["10월","11월","12월"]
        const issuerValues = selectedIssr.values || [];
        const avgValues = avgSeries || null;

        // 레이아웃(기존 스타일 유지)
        const TOP = 14;
        const GAP = 40;
        const GRID_COUNT = 6;
        const BOTTOM = TOP + GAP * (GRID_COUNT - 1);

        const Y_LABEL_WIDTH = 48;

        // 카드사(안쪽) 영역
        const X_INNER_START = 68;
        const X_INNER_END = WIDTH - 48;

        // 평균(풀) 영역: 그래프 구분선 시작~끝
        const X_FULL_START = Y_LABEL_WIDTH;
        const X_FULL_END = WIDTH;

        const innerStep =
          months.length > 1
            ? (X_INNER_END - X_INNER_START) / (months.length - 1)
            : 0;
        const fullStep =
          months.length > 1
            ? (X_FULL_END - X_FULL_START) / (months.length - 1)
            : 0;

        const X_LABEL_Y = BOTTOM + 36;

        function valueToY(v) {
          const clamped = Math.max(Y_MIN, Math.min(Y_MAX, v));
          const ratio = (clamped - Y_MIN) / (Y_MAX - Y_MIN);
          return BOTTOM - (BOTTOM - TOP) * ratio;
        }

        function innerX(i) {
          return X_INNER_START + innerStep * i;
        }

        function fullX(i) {
          return X_FULL_START + fullStep * i;
        }

        // Y축 라벨/점선
        const yLabels = [300000, 250000, 200000, 150000, 100000, 50000];
        yLabels.forEach((val, idx) => {
          const y = TOP + GAP * idx;
          const isLast = idx === yLabels.length - 1;

          svg.appendChild(
            createSvg("line", {
              x1: X_FULL_START,
              y1: y,
              x2: WIDTH,
              y2: y,
              stroke: isLast ? "#B0B0B3" : "#E5E5E8", // ✅ 마지막만 변경
              "stroke-dasharray": "4 4",
            })
          );

          const t = createSvg("text", {
            x: 8,
            y: y + 4,
            "font-weight": "500",
            "font-size": 12,
            fill: "#454545",
          });
          t.textContent = formatWanFromWon(val);
          svg.appendChild(t);
        });

        // X축 라벨(카드사 기준으로 안쪽 위치)
        months.forEach((m, i) => {
          const t = createSvg("text", {
            x: innerX(i),
            y: X_LABEL_Y,
            "text-anchor": "middle",
            "font-weight": "500",
            "font-size": 12,
            fill: "#454545",
          });
          t.textContent = m;
          svg.appendChild(t);
        });

        /* =========================
         * 평균선 (풀-와이드) - 말풍선 없음
         * - null은 스킵하지만 "유효값들끼리"는 연결
         * ========================= */
        if (avgValues && avgValues.some((v) => v !== null && v !== undefined)) {
          const pts = avgValues
            .map((v, i) =>
              v === null || v === undefined ? null : [fullX(i), valueToY(v)]
            )
            .filter(Boolean);

          if (pts.length >= 2) {
            const d = pts
              .map((p, i) => (i ? "L " : "M ") + p[0] + " " + p[1])
              .join(" ");
            svg.appendChild(
              createSvg("path", {
                d,
                fill: "none",
                stroke: AVG_COLOR,
                "stroke-width": 2,
                "stroke-dasharray": AVG_DASH,
                "stroke-linecap": "round",
                "stroke-linejoin": "round",
              })
            );
          }
        }

        /* =========================
         * 카드사 라인 (안쪽) - 말풍선 있음(첫/마지막 유효값)
         * - null은 포인트만 생략, 선은 유효값들끼리 연결
         * ========================= */
        const issuerPts = issuerValues
          .map((v, i) =>
            v === null || v === undefined
              ? null
              : { i, x: innerX(i), y: valueToY(v), v }
          )
          .filter(Boolean);

        if (issuerPts.length >= 2) {
          const d = issuerPts
            .map((p, idx) => (idx ? "L " : "M ") + p.x + " " + p.y)
            .join(" ");
          svg.appendChild(
            createSvg("path", {
              d,
              fill: "none",
              stroke: MAIN_COLOR,
              "stroke-width": 3,
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
            })
          );
        }

        issuerPts.forEach((p) => {
          // 마커
          svg.appendChild(
            createSvg("circle", {
              cx: p.x,
              cy: p.y,
              r: 5,
              fill: "#ffffff",
              stroke: MAIN_COLOR,
              "stroke-width": 3,
            })
          );

          // ✅ 마커가 있으면 항상 말풍선
          svg.appendChild(drawBubbleLabel(p.x, p.y, formatWanFromWon(p.v)));
        });
      }

      /* =========================
       * 혜택 셀렉트 변경 핸들러
       * ========================= */
      window.__BENEFIT_SELECT_CHANGED__ = function (label) {
        fetchMock(label)
          .then(function (data) {
            if (!data || data.resCd !== "0") return;

            const months = getFixed3MonthsFromUI();
            const issrVals = mapIssrValues(data.resData.issrMthBenList, months);
            const avgVals = mapAvgValues(
              data.resData.issrMthBenAvgList,
              months
            );

            selectedIssr = { values: issrVals };
            avgSeries = avgVals;

            $(".benefit-chart-wrap").show();

            // show 후 width 안정화
            requestAnimationFrame(function () {
              requestAnimationFrame(drawLineChart);
            });
          })
          .catch(function () {
            // 퍼블리싱에서는 무시
          });
      };

      /* =========================
       * 초기 자동 선택
       * ========================= */
      function initAutoSelectBenefit() {
        const $wrap = $(".benefit-chart-wrap").first();
        if (!$wrap.length) return;

        const $optionsWrap = $wrap.find(
          ".top-contents-wrap .select-wrap > .option-wrap"
        );
        const $active = $optionsWrap.find(".option-btn.active").first();
        const $first = $optionsWrap.find(".option-btn").first();
        const $target = $active.length ? $active : $first;
        if (!$target.length) return;

        const label = $target.find("span").text().trim();

        // 상단 라벨 동기화
        $wrap
          .find(".top-contents-wrap .select-wrap > .select-btn > span")
          .text(label);

        window.__BENEFIT_SELECT_CHANGED__(label);
      }

      // 퍼블리싱 파일: 초기 숨김 → 자동선택 시 show
      $(".benefit-chart-wrap").hide();
      requestAnimationFrame(function () {
        requestAnimationFrame(initAutoSelectBenefit);
      });

      // 리사이즈 시 다시 그리기
      $(window).on("resize", function () {
        if (!$(".benefit-chart-wrap:visible").length) return;
        requestAnimationFrame(drawLineChart);
      });
    });

    /* =========================
     * (아래는 기존 막대 그래프 스크롤 관련 코드 그대로)
     * ========================= */

    $(function () {
      // graph-wrap 스크롤이 끝에 도달했는지 확인하여 no-scroll 클래스 추가/제거
      function updateGraphWrapScroll() {
        $(".graph-wrap").each(function () {
          var $graphWrap = $(this);
          var $container = $graphWrap.closest(".graph-wrap-container");

          if ($container.length === 0) return;

          var scrollLeft = $graphWrap.scrollLeft();
          var scrollWidth = $graphWrap[0].scrollWidth;
          var clientWidth = $graphWrap[0].clientWidth;

          // 스크롤이 끝에 도달했는지 확인 (1px 오차 허용)
          var isAtEnd = scrollLeft + clientWidth >= scrollWidth - 1;

          if (isAtEnd) {
            $container.addClass("scroll-end");
          } else {
            $container.removeClass("scroll-end");
          }
        });
      }

      // graph-list와 graph-wrap 너비 비교하여 flex-center 클래스 추가/제거
      function updateGraphListCenter() {
        $(".graph-wrap").each(function () {
          var $graphWrap = $(this);
          var $graphList = $graphWrap.find(".graph-list");
          var $cardList = $graphWrap.find(".card-list");

          if ($graphList.length === 0) return;

          // graph-wrap의 너비
          var wrapWidth = $graphWrap.width();

          // 각 li 요소의 가로값을 전부 더하기
          var totalLiWidth = 0;
          $graphList.find(".graph-item").each(function () {
            totalLiWidth += $(this).outerWidth(true); // margin 포함
          });

          // gap도 고려 (li 개수 - 1) * gap 크기
          var gapSize = parseFloat($graphList.css("gap")) || 12;
          var gapTotal = ($graphList.find(".graph-item").length - 1) * gapSize;
          var totalWidth = totalLiWidth + gapTotal;

          // li들의 가로값 합이 graph-wrap보다 클 경우 flex-center 추가
          if (totalWidth > wrapWidth) {
            $graphList.removeClass("flex-center");
            $cardList.removeClass("flex-center");
          } else {
            $graphList.addClass("flex-center");
            $cardList.addClass("flex-center");
          }
        });

        $(".bank-tab").eq(0).trigger("click");
      }

      // 초기 로드 시 실행
      updateGraphListCenter();
      updateGraphWrapScroll();

      // resize 이벤트 시 실행
      $(window).on("resize", function () {
        updateGraphListCenter();
        updateGraphWrapScroll();
      });

      // graph-wrap 스크롤 이벤트 시 실행
      $(".graph-wrap").on("scroll", function () {
        updateGraphWrapScroll();
      });
    });
  </script>
</html>
