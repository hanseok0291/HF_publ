<body>
<header id="header">
	<h1>신규/추가 등록</h1>
</header>

<div id="ct">
	<form name="frm" id="frm" method="post">
		<h2 class="logo_fullname"><img src="../../css/common/images/bank/fullname_092.png" alt="토스뱅크"></h2>
		<fieldset class="ars_form type2">
			<legend>계좌번호 입력폼</legend>
			<ul class="brb0">
				<li class="num">
					<span class="stit">계좌번호</span>
					<span class="input">
						<input type="tel" name="POacctNo" id="POacctNo" placeholder="‘-’없이 입력" tabindex="1" maxlength="20">
					</span>
				</li>
				<li class="num">
					<span class="stit">예금주</span>
					<span class="input">
						<input type="text" id="PUname" name="PUname" placeholder="예금주 입력" class="inppd" tabindex="2" maxlength="15" data-check="on">
					</span>
				</li>
			</ul>
		</fieldset>

		<ul class="info_list">
			<li>'SMS출금동의 서비스'는 ARS 인증방식을 대체하여 SMS 인증방식으로 출금동의하는 서비스입니다.</li>
			<li>본 서비스는 금융위원회가 주관하는 금융 규제 샌드박스로 지정된 시범 서비스로 매월 적용 대상에 제한을 두고 있으며, 제한 기준을 초과하는 경우 기존 인증방식으로 처리됩니다.</li>
			<li>본 서비스는 'SMS출금동의 서비스 이용약관'에 동의하신 고객에게만 노출되며, 내용은 약관을 참고하시기 바랍니다.</li>
		</ul>

		<div class="btn_area v6">
			<button type="button" class="btn_xr btn_type">확인</button>
		</div>
	</form>
</div>
