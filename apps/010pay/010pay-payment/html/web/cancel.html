<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/pay/transactionHistory.css" />
    <link rel="stylesheet" href="../../css/web/cancel.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="is-terms-page">
        <!-- container -->
        <div class="container">
          <!-- headline -->
          <div class="headline pt-0">
            <p class="text-big">
              라운드 페이 서비스 해지 전<br />
              아래 내용을 확인해 주세요
            </p>
          </div>
          <!-- //headline -->

          <!-- section -->
          <div class="section">
            <div class="agree-full-wrap">
              <!-- 첫 번째 약관 그룹 -->
              <div class="terms-wrap">
                <div class="check-all">
                  <span class="checkbox">
                    <input type="checkbox" id="checkbox2_group1_all" />
                    <label for="checkbox2_group1_all"
                      >회원 정보 및 혜택 소멸</label
                    >
                  </span>
                  <p class="checkbox-bottom-text">
                    회원 정보, 거래 내역, 페이 포인트가 <br />
                    모두 삭제되며 복구할 수 없어요.
                  </p>
                </div>
                <div class="check-all">
                  <span class="checkbox">
                    <input type="checkbox" id="checkbox3_group1_all" />
                    <label for="checkbox3_group1_all"
                      >쇼핑 및 결제 혜택 제한</label
                    >
                  </span>
                  <p class="checkbox-bottom-text">
                    라운드에서 결제를 할 수 없고, <br />
                    페이의 결제 혜택도 받을 수 없어요.
                  </p>
                </div>
                <div class="check-all">
                  <span class="checkbox">
                    <input type="checkbox" id="checkbox4_group1_all" />
                    <label for="checkbox4_group1_all">앱 보안 설정 불가</label>
                  </span>
                  <p class="checkbox-bottom-text">
                    결제 비밀번호가 삭제되어 라운드 보안 설정을 <br />이용할 수
                    없어요.
                  </p>
                </div>
                <div class="check-all">
                  <span class="checkbox">
                    <input type="checkbox" id="checkbox6_group1_all" />
                    <label for="checkbox6_group1_all">서비스 재가입 제한</label>
                  </span>
                  <p class="checkbox-bottom-text">
                    해지 후 24시간 동안 다시 이용할 수 없어요.
                  </p>
                </div>
              </div>
            </div>
          </div>
          <!-- //section -->
        </div>
        <!-- //container -->

        <!-- bottom area -->
        <div class="bottom-area fixed">
          <!-- container -->
          <div class="container">
            <button id="send" class="btn" disabled onclick="modalOpen('password-modal')">서비스 해지하기</button>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- 비밀번호 입력 모달 -->
    <div id="password-modal" class="modal type2 password-modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="modal-title">
              라운드페이 서비스 해지를 위해 <br>
              비밀번호를 입력해 주세요
            </h3>

          </div>
          <div class="modal-footer vertical">
            <button
              type="button"
              id="password-modal-ok"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              입력 완료
            </button>
            <button
              type="button"
              id="password-modal-close"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
              style="display: inline-block"
            >
              닫기
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //비밀번호 입력 모달 -->

    <!-- 해지 확인 모달 -->
    <div id="cancel-modal" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="modal-title">
              라운드 페이 서비스를 해지할까요?
            </h3>
            <p class="highlight-text">라운드 페이의 혜택이 모두 사라져요!</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="cancel-modal-close"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
              style="display: inline-block"
            >
              취소
            </button>
            <button
              type="button"
              id="cancel-modal-ok"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              해지하기
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //해지 확인 모달 -->

    <!-- 비밀번호 미일치 모달 -->
    <div id="password-mismatch-modal" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="modal-title">
              비밀번호가 일치하지 않습니다
            </h3>
            <p class="highlight-text">다시 확인해 주세요.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="password-mismatch-modal-ok"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //비밀번호 미일치 모달 -->
  </body>
  <script>
    $(document).ready(function () {
      // 모든 체크박스를 제어하고, 모든 체크박스가 체크되었을 때 버튼 활성화
      const termsCheckboxes = document.querySelectorAll("input[type='checkbox']");
      termsCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", function () {
          // 모든 체크박스를 확인
          const allChecked = Array.from(termsCheckboxes).every(
            (checkbox) => checkbox.checked
          );

          // send 버튼을 활성화 또는 비활성화
          const sendButton = document.getElementById("send");
          if (allChecked) {
            sendButton.classList.remove("disabled");
            sendButton.disabled = false;
          } else {
            sendButton.classList.add("disabled");
            sendButton.disabled = true;
          }
        });
      });
    });
  </script>
</html>
