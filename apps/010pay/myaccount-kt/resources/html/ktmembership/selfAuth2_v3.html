<!doctype html>
<html lang="ko">

<head>
	<title>내통장결제</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<meta name="format-detection" content="telephone=no, address=no, email=no">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge">
	<link rel="stylesheet" href="../../css/owl.carousel.min.css">
	<link rel="stylesheet" href="../../ktmembership/css/common.css">
	<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
	<script src="../../js/jquery-1.8.3.min.js"></script>
	<script src="../../js/jquery.placeholder.min.js"></script>
	<script src="../../js/owl.carousel.min.js"></script>
	<script src="../../ktmembership/js/design.js" defer="defer"></script>
	<script src="../../js/commonmsg.js"></script>
	<script src="../../js/commonutil.js"></script>
</head>

<body>
	<!-- form -->
	<form class="main_form" action="javascript: void(0);" autocomplete="off">
		<!-- wrap -->
		<div id="wrap" class="version-v3">
			<!-- header-v3 (로고 중앙 · 뒤로 — v2와 동일하게 닫기 없음) -->
			<div id="header" class="header-v3">
				<div class="container">
					<div class="page-title">
						<button type="button" id="btnBack" class="btn-back"><i class="icon icon-arrow-left new">뒤로가기</i></button>
						<h2 class="title">
							<img src="../../ktmembership/images/logo.svg" class="header-brand-v3__logo" width="73" height="24"
								alt="내통장결제"></h2>
					</div>
					<button type="button" id="closeWindow" class="btn-close btn-close-v3"><i
							class="icon icon-close-v3">창닫기</i></button>
				</div>
			</div>
			<!-- //header-v3 -->

			<!-- content -->
			<div id="content" class="kt-ui">
				<!-- container -->
				<div class="container">

					<!-- 정보 입력 -->
					<div class="section self-auth-v3__section self-auth-v3__section--step2">
						<ul class="form-type">
							<li class="captcha self-auth-v3-captcha">
								<div class="self-auth-v3-captcha__row">
									<div class="self-auth-v3-captcha__image">
										<img src="../../ktmembership/images/captchaImg.png" id="captchaImg" alt="보안문자 이미지"
											width="136" height="40">
									</div>
									<div id="captchaAudio" style="display:none;"></div>
									<div class="self-auth-v3-captcha__actions">
										<button type="button" id="refreshCaptcha" class="self-auth-v3-captcha__icon-btn"
											aria-label="보안문자 새로고침" onclick="refreshCaptchaImage()">
											<img src="../../ktmembership/images/icon_refresh_small.svg" alt="새로고침" width="21"
												height="21" class="self-auth-v3-captcha__icon">
										</button>
										<button type="button" id="soundCaptcha" class="self-auth-v3-captcha__icon-btn"
											aria-label="보안문자 음성듣기" onclick="audio()">
											<img src="../../ktmembership/images/icon_sound.svg" alt="음성듣기" width="21" height="21"
												class="self-auth-v3-captcha__icon">
										</button>
									</div>
								</div>
								<input type="tel" name="captchaInput" id="catpchaInput" placeholder="보안문자 입력" maxlength="6"
									class="captcha-input self-auth-v3-captcha__input">
							</li>
							<li class="phone-auth-btn self-auth-v3-phone-auth">
								<span class="input">
									<input type="tel" name="cnum" id="cnum" maxlength="6" placeholder="인증번호 입력">
									<span class="time" id="timer">
										<img src="../../ktmembership/images/icon_time.svg" alt="시간" width="14" height="14"
											class="self-auth-v3-phone-auth__time-icon">
										<em>2:59</em>
									</span>
									<button type="button" class="btn self-auth-v3-phone-auth__resend">인증번호 재발송</button>
								</span>
							</li>
						</ul>
					</div>
					<!-- //정보 입력 -->

					<!-- submit button -->
					<div class="submit-btn fixed">
						<button type="button" id="send" class="btn" disabled>확인</button>
					</div>
					<!-- //submit button -->
				</div>
				<!-- //container -->
			</div>
			<!-- //content -->
		</div>
		<!-- //wrap -->
	</form>
	<!-- //form -->

	<!-- loading -->
	<div class="modal modal-loading">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<div class="loading">
						<div class="loading-bar"></div>
						<div class="loading-bar"></div>
						<div class="loading-bar"></div>
						<div class="loading-bar"></div>
					</div>
					<span class="text">로딩 중</span>
				</div>
			</div>
		</div>
	</div>
	<!-- //loading -->

	<!-- common alert -->
	<div id="commonAlert" class="modal">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<h3 id="alertTitle"></h3>
					<p id="alertContents"></p>
				</div>
				<div class="modal-footer">
					<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
				</div>
			</div>
		</div>
	</div>
	<!-- //common alert -->

	<!-- common prompt -->
	<div id="commonPrompt" class="modal">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<h3 id="promptTitle"></h3>
					<p id="promptContents"></p>
				</div>
				<div class="modal-footer">
					<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
					<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
				</div>
			</div>
		</div>
	</div>
	<!-- //common prompt -->

	<script>
		$(document).ready(function(){
			// 폼 입력 시 확인 버튼 활성
			$("input").keyup(function(){
				if ($("#cnum").val().length == 6) {
					$("#send").attr("disabled",false).addClass("on");
				} else {
					$("#send").attr("disabled", true).removeClass("on");
				}
			});
		})
	</script>
</body>

</html>
