	<div class="check_all">
		<label class="li1">		<label for="all-agree" class="sr-only">all-agree</label>
		<input type="checkbox" name="agreelist" id="all-agree" tabindex="0" title="all-agree">
			<strong>전체약관동의</strong></label>
		<label class="li2"><em>ㄴ</em>		<label for="agree01" class="sr-only">agree01</label>
		<input type="checkbox" name="agreelist" id="agree01" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다." title="agree01"> <a
				href="javascript:void(window.open('./terms1.html', 'terms','width=470, height=750'))">통신과금서비스 이용약관</a>에
			동의합니다.</label>
		<label class="li3"><em>ㄴ</em>		<label for="agree02" class="sr-only">agree02</label>
		<input type="checkbox" name="agreelist" id="agree02" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다." title="agree02"> <a
				href="javascript:void(window.open('./terms2.html', 'terms','width=470, height=750'))">개인(신용)정보 수집 및 이용</a>에
			동의합니다.</label>
		<label class="li4"><em>ㄴ</em>		<label for="agree03" class="sr-only">agree03</label>
		<input type="checkbox" name="agreelist" id="agree03" class="checkSelect" tabindex="0"
				required="required" data-required-msg="필수 동의 항목을 모두 동의하셔야 다음 진행을 하실 수 있습니다." title="agree03"> <a
				href="javascript:void(window.open('./terms3.html', 'terms','width=470, height=750'))">개인(신용)정보 제3자 제공 및 위탁</a>에

	<div align="center" style="margin-top:10px;display:block;">
		<!-- 충전 -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_charge.gif" border="0" style="cursor:hand;">
		<!-- 취소  -->
		<img src="https://pay.pmang.com/Crusader/image/btn_payment_cancel.gif" border="0" style="cursor:hand;"
			onclick="pay_close();">
	</div>

	<script>
    // 전체약관동의 체크박스
  const allAgreeCheckbox = document.getElementById('all-agree');
  // 나머지 체크박스들
  const otherCheckboxes = document.querySelectorAll('.checkSelect');

  // selCarrier 선택 상자
  const selCarrier = document.querySelector('select[name="selCarrier"]');

  // trCpinFlag 요소
  const trCpinFlag = document.getElementById('trCpinFlag');

  // CpinFlag 라디오 버튼
  const cpinFlagN = document.getElementById('CpinFlagN');
  const cpinFlagY = document.getElementById('CpinFlagY');

  // trCarryPin 요소
  const trCarryPin = document.getElementById('trCarryPin');

	// "check-all" 체크박스의 변경 이벤트를 감지합니다.
	allAgreeCheckbox.addEventListener('change', function() {
		if (allAgreeCheckbox.checked) {
			// "check-all" 체크박스가 체크되어 있을 때
			otherCheckboxes.forEach(function(checkbox) {
				checkbox.checked = true;
			});
		} else {
			// "check-all" 체크박스가 체크되어 있지 않을 때
			// 모든 "otherCheckboxes"도 체크 해제
			otherCheckboxes.forEach(function(checkbox) {
				checkbox.checked = false;
			});
		}
	});

	// 다른 체크박스의 변경 이벤트를 감지하여 "check-all" 체크박스의 상태를 업데이트합니다.
	otherCheckboxes.forEach(function(checkbox) {
		checkbox.addEventListener('change', function() {
			// 모든 "otherCheckboxes"가 체크되어 있으면 "check-all" 체크박스도 체크합니다.
			if ([...otherCheckboxes].every(cb => cb.checked)) {
				allAgreeCheckbox.checked = true;
			} else {
				// 하나라도 체크가 해제되어 있으면 "check-all" 체크박스도 해제합니다.
				allAgreeCheckbox.checked = false;
			}
		});
	});

  selCarrier.addEventListener('change', function () {
	// 선택된 값을 가져오기
	const selectedValue = selCarrier.value;

		// "헬로모바일", "SK7mobile", "KCT"인 경우에 trCpinFlag를 보여주기
		if (selectedValue === "CJH" || selectedValue === "SKL" || selectedValue === "KCT") {
			trCpinFlag.style.display = 'table-row';
			// CpinFlag이 선택되어 있을 경우 trCarryPin 보이기
			if (cpinFlagY.checked) {
				trCarryPin.style.display = 'table-row';
			} else {
				trCarryPin.style.display = 'none';
			}
		} else {
			trCpinFlag.style.display = 'none';
			trCarryPin.style.display = 'none';
		}
  });

  // CpinFlag 라디오 버튼 변경 이벤트
  cpinFlagN.addEventListener('change', function () {
    // CpinFlagN 선택 시 trCarryPin을 숨김
    trCarryPin.style.display = 'none';
  });

  cpinFlagY.addEventListener('change', function () {
    // CpinFlagY 선택 시 trCarryPin을 보임
    trCarryPin.style.display = 'table-row';
  });
	</script>
