<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <!-- [2026-06-23] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../css/common_renewal_v2.css" />
    <!-- //[2026-06-23] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../css/pay/charge.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container banner-full-container">
          <div class="complete-text">
            <i class="lottie-check"></i>
            <p class="title">
              카드 발급 신청이 <br>
              완료 되었어요
              <span class="sub-title">
                지금 라운드를 시작해 보세요!
              </span>
            </p>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">라운드로 이동하기</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {
      // 로티 완료
      let svgContainer = document.querySelector(".lottie-check");

      let animItem = bodymovin.loadAnimation({
        wrapper: svgContainer,
        animType: "svg",
        loop: false,
        path: "../../images/lottie/check.json",
      });
    });
  </script>
</html>
