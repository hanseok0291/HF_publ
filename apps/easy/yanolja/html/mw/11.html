<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../resources/css/common.css">
<link rel="stylesheet" href="../../resources/css/site.css">
<link rel="stylesheet" href="../../resources/css/common/css/custom/yanolja/yanolja.css">

<script src="../../resources/js/design.js" defer="defer"></script>
<title>간편결제</title>
</head>
<body>

<header id="header">
	<h1>간편계좌 결제 관리</h1>
	<button type="button" class="btn_cls"><i class="ico_com ico_cls">창닫기</i></button>
</header>

<div id="ct">
	<hgroup class="tit_type">
		<h2>현금영수증 설정</h2>
		<p class="txt">현금영수증 발행을 위한 설정을 입력해 주세요.</p>
	</hgroup>
	<section class="tax_set">
		<article class="taxbx active">
			<h3><button type="button">개인소득공제용</button></h3>
			<div class="row">
				<span class="input"><span class="checkbox ty3"><input type="radio" name="private" id="private1" checked><label for="private1" class="on"></label></span><input type="tel" name="" id="" placeholder="휴대폰번호(-없이 입력)" maxlength="11" value="01012345789"><button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button></span>
				<span class="input"><span class="checkbox ty3"><input type="radio" name="private" id="private2"><label for="private2"></label></span><input type="tel" name="" id="" placeholder="현금영수증 카드번호 입력" maxlength=""><button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button></span>
			</div>
		</article>
		<!-- //개인소득공제용 -->
		<article class="taxbx">
			<h3><button type="button">지출증빙용</button></h3>
			<div class="row">
				<span class="input"><span class="checkbox ty3"><input type="radio" name="report" id="report1"><label for="report1"></label></span><input type="tel" name="" id="" placeholder="사업자번호 입력(-없이 입력)" maxlength="10" value=""><button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button></span>
				<span class="input"><span class="checkbox ty3"><input type="radio" name="report" id="report2"><label for="report2"></label></span><input type="tel" name="" id="" placeholder="현금영수증 카드번호 입력" maxlength=""><button type="button" onclick="" class="btn_del"><i class="ico_com ico_del3"></i></button></span>
			</div>
		</article>
		<!-- //지출증빙용 -->
		<ul class="caulst">
		<li><i>-</i>현금영수증 등록 정보는 현금영수증 자동발급을 위해 저장되며, 회원탈퇴 또는 서비스 종료시까지 보관 됩니다.</li>
		<li><i>-</i>등록 전 사용금액은 소급 적용되지 않습니다.</li>
		<li><i>-</i>국세청 현금영수증 사이트에 등록하신 휴대폰번호 또는 현금영수증 카드번호를 입력하셔야 정상 처리됩니다.</li>
		</ul>
	</section>
	<div class="btn_area v6">
		<button type="button" onclick="" class="btn_xr btn_type on">확인</button>
	</div>
</div>
<!-- //content -->

</body>
</html>
