<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../../css/jquery-ui.css" /> 
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/setting.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box justify-start">
            <button type="button" class="btn-back js-change-btn">
              <i class="icon-arrow-left"></i>
            </button>
            <h2 class="page-title">원터치 결제</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container setting-container">
          <ul class="setting-list">
            <li>
              <div>
                <p class="setting-name">원터치 결제</p>
              </div>
              <div class="toggle-switch">
                <div class="toggle-circle"></div>
              </div>
            </li>
          </ul>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- 생체인증 정보 팝업 -->
    <div
      id="modal-bio-check"
      class="modal modal-slide type-title"
    >
      <div class="modal-dialog">
        <div class="modal-content" style="bottom: 0px; position: fixed">
          <div class="modal-head">
            <p class="modal-head-title">
              원터치 결제
            </p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul>
                <li>저장된 결제수단으로 결제 시 비밀번호 입력없이 간편하게 결제하는 방식이에요.</li>
                <li>안전한 거래임을 확인한 경우에만 진행돼요.</li>
                <li>부정거래방지시스템(FDS)을 통해 상시 모니터링을 진행하고있어요.</li>
              </ul>
            </div> 
          </div>
        </div>
      </div>
    </div>
    <!-- //생체인증 정보 팝업 -->
</html>
