  <script>
    $(".tab button").on("click", function () {
      var tab_index = $(this).index();
      $(this).closest(".tab").find("button").removeClass("active");
      $(this).addClass("active");
      $(".tab-contents > div").hide();
      $(".tab-contents > div").eq(tab_index).show();
    });

    let isSorting = false; // Sortable.js 동작 여부 확인
    let isSwiping = false; // 스와이프 동작 여부 확인

    // 스와이프 삭제 버튼 기능
    document.querySelectorAll(".list-item").forEach((item) => {
      const listBox = item.querySelector(".list-box"); // 스와이프 대상
      const deleteBtn = item.querySelector(".delete-btn");
      let startX = 0;
      let currentX = 0;

      // 각 리스트에서 swiped 상태를 독립적으로 관리
      item.dataset.swiped = "false"; // 초기 상태 설정

      // 다른 리스트 초기화
      const resetOtherItems = (currentItem) => {
        document.querySelectorAll(".list-item").forEach((otherItem) => {
          if (
            otherItem !== currentItem &&
            otherItem.dataset.swiped === "true"
          ) {
            otherItem.querySelector(".list-box").style.transform =
              "translateX(0)";
            otherItem.dataset.swiped = "false"; // 상태 초기화
          }
        });
      };

      listBox.addEventListener("touchstart", (e) => {
        if (isSorting) return; // Sortable.js 동작 중일 경우 스와이프 방지

        startX = e.touches[0].clientX;
        isSwiping = false;

        // 다른 리스트 상태 초기화
        resetOtherItems(item);
      });

      listBox.addEventListener("touchmove", (e) => {
        if (isSorting) return; // Sortable.js 동작 중일 경우 스와이프 방지

        const touchX = e.touches[0].clientX;
        const deltaX = touchX - startX;

        if (Math.abs(deltaX) > 10) {
          isSwiping = true; // 스와이프 활성화
        }

        if (item.dataset.swiped === "false" && deltaX < 0) {
          // 삭제 버튼이 숨겨진 상태에서 왼쪽 스와이프
          currentX = Math.max(deltaX, -70); // 최대 -70px까지 이동
          listBox.style.transform = `translateX(${currentX}px)`;
        } else if (item.dataset.swiped === "true" && deltaX > 0) {
          // 삭제 버튼이 노출된 상태에서 오른쪽 스와이프
          currentX = Math.min(deltaX, 70); // 최대 70px까지 이동
          listBox.style.transform = `translateX(${currentX - 70}px)`; // 초기 위치 조정
        }
      });

      listBox.addEventListener("touchend", () => {
        if (isSorting) return; // Sortable.js 동작 중일 경우 스와이프 방지

        if (item.dataset.swiped === "false" && currentX <= -30) {
          // 왼쪽 스와이프하여 삭제 버튼 노출
          item.dataset.swiped = "true";
          listBox.style.transform = "translateX(-70px)";
        } else if (item.dataset.swiped === "true" && currentX >= 30) {
          // 오른쪽 스와이프하여 삭제 버튼 숨김
          item.dataset.swiped = "false";
          listBox.style.transform = "translateX(0)";
        } else {
          // 스와이프 거리가 부족하면 현재 상태 유지
          listBox.style.transform =
            item.dataset.swiped === "true"
              ? "translateX(-70px)"
              : "translateX(0)";
        }

        // currentX 값 초기화 (불필요한 동작 방지)
        currentX = 0;
      });

      deleteBtn.addEventListener("click", () => {
        item.remove(); // 항목 제거
      });
    });

    // Sortable.js 설정
    const list1 = document.getElementById("sortable-list-1");

    new Sortable(list1, {
      animation: 150, // 드래그 애니메이션
      handle: ".handle",
      onStart: () => {
        isSorting = true; // Sortable.js 동작 시작
      },
      onEnd: () => {
        isSorting = false; // Sortable.js 동작 종료
      },
      onMove: (evt) => {
        if (isSwiping) {
          // 스와이프 중일 경우 드래그 중단
          return false;
        }
      },
    });

    const list2 = document.getElementById("sortable-list-2");

    new Sortable(list2, {
      animation: 150, // 드래그 애니메이션
      handle: ".handle",
      onStart: () => {
        isSorting = true; // Sortable.js 동작 시작
      },
      onEnd: () => {
        isSorting = false; // Sortable.js 동작 종료
      },
      onMove: (evt) => {
        if (isSwiping) {
          // 스와이프 중일 경우 드래그 중단
          return false;
        }
      },
    });

    document.addEventListener("DOMContentLoaded", () => {
      // 각 drag-list 내에서 이벤트 리스너 설정
      document.querySelectorAll(".drag-list").forEach((dragList) => {
        dragList.querySelectorAll(".icon-star-off").forEach((icon) => {
          icon.addEventListener("click", (event) =>
            handleStarOffClick(event, dragList)
          );
        });
      });
    });

    function handleStarOffClick(event, dragList) {
      const clickedItem = event.target.closest(".list-item"); // 클릭된 li
      const topList = dragList.querySelector(".top-list"); // 해당 drag-list 내의 top-list
      const sortableList = dragList.querySelector(".sortable-list"); // 해당 drag-list 내의 sortable-list
      const listItems = Array.from(sortableList.children); // 현재 drag-list 하단 ul의 모든 li 목록
      const itemHeight = 90; // li 높이

      const topListItem = topList.querySelector(".list-item");

      // === right-box 내용 변경 (클릭 즉시) ===
      const clickedRightBox = clickedItem.querySelector(".right-box");
      const topRightBox = topListItem.querySelector(".right-box");

      clickedRightBox.innerHTML = `<span class="icon-star"></span>`; // 클릭된 li는 icon-star로 변경
      topRightBox.innerHTML = `
    <span class="icon-star-off"></span>
    <button type="button" class="handle">핸들</button>
  `; // 기존 li는 icon-star-off + handle 추가

      // === 전체 인덱스 계산 (top-list와 sortable-list 통합 기준) ===
      const topListCount = topList.querySelectorAll(".list-item").length;
      const clickedIndex = listItems.indexOf(clickedItem); // 클릭된 li의 인덱스 (sortable-list 기준)
      const totalIndex = topListCount + clickedIndex; // 전체 인덱스 = 상단 li 개수 + 클릭된 인덱스

      const offsetUp = totalIndex * itemHeight; // 전체 인덱스 기반 이동 거리

      // 1. 클릭된 li 위로 이동 (애니메이션)
      clickedItem.style.transition = "transform 0.4s ease";
      clickedItem.style.transform = `translateY(-${offsetUp}px)`; // 음수로 위로 이동

      // 2. 클릭된 li보다 위에 있는 li들 아래로 이동 (상단 li 포함)
      listItems.forEach((item, index) => {
        if (index < clickedIndex) {
          item.style.transition = "transform 0.4s ease";
          item.style.transform = `translateY(${itemHeight}px)`;
        }
      });

      topListItem.style.transition = "transform 0.4s ease";
      topListItem.style.transform = `translateY(${itemHeight}px)`;

      // === 애니메이션 종료 후 DOM 재배치 ===
      setTimeout(() => {
        // === 1. 기존 상단 li를 먼저 sortable-list로 이동 ===
        sortableList.insertBefore(topListItem, sortableList.firstChild);

        // === 2. 클릭된 li를 top-list로 이동 ===
        topList.appendChild(clickedItem);

        // === DOM 참조 갱신 ===
        const updatedListItems = Array.from(sortableList.children);

        // transform 초기화 (겹침 방지)
        requestAnimationFrame(() => {
          clickedItem.style.transition = "none";
          clickedItem.style.transform = "translateY(0px)";
        });

        // 아래로 밀린 나머지 li 초기화
        updatedListItems.forEach((item) => {
          item.style.transition = "";
          item.style.transform = "";
        });

        // 새로 추가된 icon-star-off에 이벤트 리스너 등록 (dragList 내에서만 동작)
        const newIcon = topRightBox.querySelector(".icon-star-off");
        if (newIcon) {
          newIcon.addEventListener("click", (event) =>
            handleStarOffClick(event, dragList)
          );
        }
      }, 400); // transition 시간과 맞춤
    }
  </script>
