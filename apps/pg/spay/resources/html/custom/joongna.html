<body>
<!-- custom style -->
<style>
.modal-footer .btn:not(.btn-xl), .terms h3, .text-primary { color: #ff6900; }
.checkbox > input:checked + label:before, .checkbox.circle > input:checked + label:after,
.switch .switch-inner:before, .badge-primary, .btn-primary:not(:disabled), .bg-primary { background-color: #ff6900; }
input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, input[type="email"]:focus, input[type="tel"]:focus,
select:focus, textarea:focus, .input.focus, .checkbox > input:checked + label:before,
.btn-primary:not(:disabled), .bubble-bg, .bubble:after, .card.active, .pay-complete .headline:before, .pay-complete .headline:after, .border-primary { border-color: #ff6900; }
.loading:after { border-top-color: #ff6900; }
</style>
<!-- //custom style -->
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/custom/logo-joongna.svg" alt="중고나라 PAY"></span></h1>
				<!-- <button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button> -->
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">{결제수단명} 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">상품명 상품명 상품명</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">298,000</em>원</strong> 결제합니다.</p>
					<p class="prd-period">별도 제공기간 없음</p>
				</div>
				<!-- //주문정보 -->

				<!-- seection -->
				<div class="section">
					<h3 class="section-title">H3 Section Title</h3>
					<div class="section-content">
						<p>Section Content</p>
						<p class="text-primary">Primary Text Color</p>
					</div>
				</div>
				<!-- //seection -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary">확인</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
