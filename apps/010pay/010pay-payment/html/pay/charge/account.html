<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css?v=2606191" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-23] renewal-v2 적용 — 계좌 머니 충전 (Figma 충전_디폴트 · keypad) -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">계좌 머니 충전</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container charge-account-v2-scroll-fill">
          <div class="charge-container charge-account-v2">
            <div class="charge-account-v2-body">
              <button
                type="button"
                class="charge-account-select"
                onclick="modalOpenSlide('modal-select-account')"
              >
                <span class="charge-account-logo">
                  <img src="../../../images/bank/bank_new/logo-bank-shinhan.png" alt="" />
                </span>
                <span class="charge-account-text">
                  <strong>신한 123 계좌</strong>에서
                </span>
                <i class="icon-arrow-down size-16" aria-hidden="true"></i>
              </button>

              <div class="charge-amount-section">
                <div class="input-wrap charge-input-wrap">
                  <div class="input-container label-n charge-input">
                    <input
                      type="tel"
                      class="custom-input"
                      placeholder=" "
                      id="chargeAmount"
                      autocomplete="off"
                      readonly
                    />
                    <label for="chargeAmount" class="floating-label"
                      >얼마를 충전할까요?</label
                    >
                    <div class="fake-label">
                      <p class="number"></p>
                      <span class="unit">만원</span>
                    </div>
                    <button type="button" class="icon icon-del js-text-del"></button>
                  </div>
                </div>
                <div class="charge-balance-row">
                  <span class="label">현재 보유 머니</span>
                  <span class="value">80,000원</span>
                </div>
                <div class="charge-limit-hint">
                  <p class="charge-limit-text">
                    최대 충전 가능 금액은
                    <button
                      type="button"
                      class="charge-limit-link js-charge-limit-fill"
                      data-amount="192"
                    >
                      192만원
                    </button>
                    이에요
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- bottom area — Figma: chip → keypad → CTA -->
        <div class="bottom-area charge-account-v2-foot">
          <!-- container -->
          <div class="container charge-foot-stack">
            <div class="add-money-btn-wrap">
              <button type="button" data-money="1">1만원</button>
              <button type="button" data-money="5">5만원</button>
              <button type="button" data-money="10">10만원</button>
              <button type="button" data-money="100">100만원</button>
            </div>
            <!-- keypad — 퍼블: keypad.png · 개발: 버튼식 키패드 연동 예정 -->
            <div class="charge-keypad-slot" aria-hidden="true">
              <img
                class="charge-keypad-image"
                src="../../../images/pay/money/keypad.png"
                alt=""
              />
            </div>
            <div class="charge-foot-cta">
              <button
                type="button"
                class="btn btn-charge-submit"
                disabled
              >
                충전하기
              </button>
            </div>
          </div>
          <!-- //container -->
        </div>
        <!-- //bottom area -->
      </div>
      <!-- //content -->
    </div>
    <!-- //[2026-06-23] renewal-v2 적용 — 계좌 머니 충전 (Figma 충전_디폴트 · keypad) -->
    <!-- //wrap -->

    <!-- 계좌 선택하기 팝업 -->
    <div id="modal-select-account" class="modal modal-slide type-select type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">계좌 선택하기</p>
            <button type="button" class="btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="btn-list account-list">
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img src="../../../images/bank/bank_new/logo-bank-toss.png" alt="" />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                    <p class="icon-star"></p>
                  </button>
                </li>
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img src="../../../images/bank/bank_new/logo-bank-hana.png" alt="" />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                  </button>
                </li>
                <li class="btn-wrap">
                  <button type="button" class="btn btn-add">계좌 추가하기</button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //계좌 선택하기 팝업 -->
  </body>
  <script>
    /* ============================================================
     * 계좌 머니 충전 — 금액 입력 · 에러 · CTA 제어
     * 단위: 만원 (칩 data-money, input_value 모두 만원 기준)
     * ============================================================ */

    // 현재 입력된 충전 금액 (만원)
    var input_value = 0;
    // 충전 가능 금액 (만원)
    var charge_available = 192;

    /** 에러 문구 내 "192만원" 링크 텍스트·data-amount·aria-label 동기화 */
    function updateChargeLimitLink() {
      $(".js-charge-limit-fill")
        .text(charge_available + "만원")
        .attr("data-amount", charge_available)
        .attr("aria-label", charge_available + "만원 입력");
    }

    /** 충전하기 버튼 활성/비활성 — 값 있음 + 에러 없을 때만 enabled */
    function updateChargeSubmitState() {
      if (input_value > 0 && !$(".charge-input").hasClass("error")) {
        $(".btn-charge-submit").prop("disabled", false);
      } else {
        $(".btn-charge-submit").prop("disabled", true);
      }
    }

    /**
     * 금액 표시·에러 상태 일괄 갱신
     * - has-value: fake-label(큰 금액) 노출
     * - error: charge_available 초과 시 — 금액 빨간색 + 한도 안내 문구 (CSS :has 연동)
     */
    function updateChargeAmountUI() {
      var $wrap = $(".charge-input");
      var $label = $wrap.find(".floating-label");

      if (input_value > 0) {
        $wrap.addClass("has-value");
        $wrap.find(".fake-label .number").text(input_value);
        $wrap.find(".fake-label .unit").show();
      } else {
        $wrap.removeClass("has-value");
        $wrap.find(".fake-label .number").text("");
        $wrap.find(".fake-label .unit").hide();
        $label.text("얼마를 충전할까요?");
      }

      if (input_value > charge_available) {
        $wrap.addClass("error");
      } else {
        $wrap.removeClass("error");

        if (input_value > 0) {
          $label.text("충전 금액");
        }
      }

      updateChargeSubmitState();
    }

    /** 금액을 직접 설정 (삭제·한도 링크 클릭 등 공통 진입점) */
    function setChargeAmount(amount) {
      input_value = amount;
      $("#chargeAmount").val(amount > 0 ? amount : "");
      updateChargeAmountUI();
    }

    // --- 금액 입력 (버튼식 키패드 연동 전 — 칩·한도 링크로만 갱신) ---
    $(".charge-input input").on("input", function () {
      var $this = $(this);
      var maxlength = 15;
      var parsed = parseInt($this.val().replace(/[^0-9]/g, ""), 10);

      input_value = isNaN(parsed) ? 0 : parsed;

      // 최대 자릿수 초과 시 잘라냄
      if ($this.val().length > maxlength) {
        input_value = parseInt(String(input_value).substring(0, maxlength), 10);
        $this.val(input_value);
      }

      updateChargeAmountUI();
    });

    // 포커스·블러 — 빈 값일 때 placeholder 문구 유지
    $(".charge-input input").on("focus", function () {
      var $this = $(this);
      var $label = $this.closest(".charge-input").find(".floating-label");

      if ($this.val().length === 0) {
        $label.text("얼마를 충전할까요?");
      }
    });

    $(".charge-input input").on("blur", function () {
      var $this = $(this);
      var $label = $this.closest(".charge-input").find(".floating-label");

      if ($this.val().length === 0) {
        $label.text("얼마를 충전할까요?");
      }
    });

    // 입력값 삭제 (X 버튼 — mousedown: blur 전에 처리)
    $(".charge-input .js-text-del").on("mousedown", function () {
      setChargeAmount(0);
    });

    // --- 하단 금액 칩 — 누적 가산 (1·5·10·100만원) ---
    $(".add-money-btn-wrap button").on("click", function () {
      var moneyValue = parseInt($(this).attr("data-money"), 10);

      input_value += moneyValue;
      $("#chargeAmount").val(input_value);
      updateChargeAmountUI();
    });

    // 에러 시 "192만원" 밑줄 클릭 → 최대 충전 가능 금액으로 즉시 입력
    $(".js-charge-limit-fill").on("click", function () {
      var amount = parseInt($(this).attr("data-amount"), 10);

      setChargeAmount(amount);
    });

    // 초기 렌더
    updateChargeLimitLink();
    updateChargeAmountUI();
  </script>
</html>
