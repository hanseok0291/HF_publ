<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
    <meta name="format-detection" content="telephone=no" />
    <title>카드 플립</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/cardFlip.css" />
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- section -->
      <section>
        <!-- container -->
        <div id="content" class="container">
          <!-- card-flip-area -->
          <div class="card-flip-area">
            <!-- 3D 회전 씬 : 좌우 드래그 + 자동 회전 -->
            <div
              class="card-scene"
              id="cardScene"
              role="img"
              aria-labelledby="cardSceneDesc"
            >
              <div class="card-3d" id="card3d">
                <div class="card-body">
                  <!-- 앞면 -->
                  <figure class="card-face front">
                    <!-- TODO: 실제 카드 이미지(img)로 교체 -->
                    <span class="card-placeholder is-front" aria-hidden="true">FRONT</span>
                    <figcaption class="blind">카드 디자인 앞면</figcaption>
                  </figure>
                  <!-- 뒷면 -->
                  <figure class="card-face back" aria-hidden="true">
                    <!-- TODO: 실제 카드 이미지(img)로 교체 -->
                    <span class="card-placeholder is-back" aria-hidden="true">BACK</span>
                    <figcaption class="blind">카드 디자인 뒷면</figcaption>
                  </figure>
                  <!-- 두께 면 (측면) -->
                  <span class="card-edge card-edge--right" aria-hidden="true"></span>
                  <span class="card-edge card-edge--left" aria-hidden="true"></span>
                  <span class="card-edge card-edge--top" aria-hidden="true"></span>
                  <span class="card-edge card-edge--bottom" aria-hidden="true"></span>
                </div>
              </div>
            </div>
            <p class="blind" id="cardSceneDesc">
              체크카드 미리보기. 좌우로 드래그하면 회전하고, 놓으면 자동으로 계속 회전합니다.
            </p>
          </div>
          <!-- //card-flip-area -->
        </div>
        <!-- //container -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->

    <script src="../js/cardFlip.js"></script>
  </body>
</html>
