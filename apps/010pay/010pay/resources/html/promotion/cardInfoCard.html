<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>

<body>
<!-- form -->
<form class="main_form wooricard-wrap app-info" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header" class="hidden">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<span class="page-title">더블 체크 로또 이벤트</span>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- headline -->
			<div class="headline">
				<!-- container -->
				<div class="container">
					<h1 class="brand-name"><img src="../../images/promotion/card/logo-org.png" class="logo" alt="010PAY X 우리카드"></h1>
					<h2 class="page-title"><i class="icon-event"><img src="../../images/promotion/card/icon-card.png" alt="icon"></i> 카드 신청 완료</h2>

					<!-- visual -->
					<div class="info-visual">
						<!-- pc ver. -->
						<div class="hidden-mobile">
							<p>이벤트 참여를 위해<br> <strong>QR코드</strong> 찍고 앱 다운로드<i class="italic">!</i></p>
							<p class="btn-area"><img src="../../images/promotion/card/qr.png" class="qr" alt="QR코드"></p>
						</div>
						<!-- //pc ver. -->

						<!-- mobile ver. -->
						<div class="hidden-tablet hidden-pc">
							<p>이벤트 참여를 위해<br> 지금 바로 <strong>앱 다운로드</strong><i class="italic">!</i></p>
							<p class="btn-area btn-store">
								<a href="#" class="btn btn-googleplay">구글 플레이</a>
								<a href="#" class="btn btn-appstore">앱 스토어</a>
							</p>
						</div>
						<!-- //mobile ver. -->
					</div>
					<!-- //visual -->
				</div>
				<!-- //container -->
			</div>
			<!-- //headline -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				 <div class="container">
					<!-- notice -->
  					<div class="section note">
 						<h3 class="note-header">유의사항</h3>
 						<div class="note-content">
 							<p>* 카드 신청 후 이벤트에 참여하지 않은 경우 010PAY 앱 &gt; 카드 메뉴에서 응모하실 수 있습니다.</p>
							<p class="mgt15">* 체크카드 발급 상태는 010PAY 앱에서만 확인 가능합니다.</p>
 						</div>
  					</div>
  					<!-- notice -->
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" id="promptCancel" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
	// 회색 배경 추가
	$("html, body").css("background-color","#e9e9e9");
</script>
</body>
</html>
