<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-23] renewal-v2 적용 — 출금 (Figma 출금 · keypad) -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">출금</h2>
            <button
              type="button"
              class="right-0"
              onclick="modalOpenSlide('modal-withdrawalt-info')"
            >
              <i class="icon-info-circle"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container charge-account-v2-scroll-fill">
          <div class="charge-container charge-account-v2 withdrawal-v2">
            <div class="charge-account-v2-body">
              <button
                type="button"
                class="charge-account-select"
                onclick="modalOpenSlide('modal-select-account')"
              >
                <span class="charge-account-logo">
                  <img
                    src="../../../images/payment/bank/kakao-small.png"
                    alt=""
                  />
                </span>
                <span class="charge-account-text">
                  <strong>카카오뱅크 123 계좌</strong>로
                </span>
                <i class="icon-arrow-down size-16" aria-hidden="true"></i>
              </button>

              <div class="charge-amount-section">
                <div class="input-wrap charge-input-wrap">
                  <div class="input-container label-n charge-input">
                    <input
                      type="tel"
                      class="custom-input"
                      placeholder=" "
                      id="withdrawAmount"
                      autocomplete="off"
                      readonly
                    />
                    <label for="withdrawAmount" class="floating-label"
                      >얼마를 보낼까요?</label
                    >
                    <div class="fake-label">
                      <p class="number"></p>
                      <span class="unit">원</span>
                    </div>
                    <button type="button" class="icon icon-del js-text-del"></button>
                  </div>
                </div>
                <div class="charge-balance-row withdrawal-balance-row">
                  <span class="label">출금 가능 머니</span>
                  <button
                    type="button"
                    class="withdraw-limit-link js-withdraw-balance-display"
                    data-amount="164000"
                  >
                    16만 4,000원
                  </button>
                </div>
                <div class="charge-limit-hint">
                  <p class="charge-limit-text">
                    출금 가능 금액은
                    <button
                      type="button"
                      class="charge-limit-link js-withdraw-limit-fill"
                      data-amount="164000"
                    >
                      16만 4,000원
                    </button>
                    이에요
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- bottom area — Figma: 수수료 안내 → keypad → CTA -->
        <div class="bottom-area charge-account-v2-foot withdrawal-v2-foot">
          <div class="container charge-foot-stack">
            <p class="withdrawal-fee-notice">월 5회 수수료 0원</p>
            <!-- keypad -->
            <div class="keypad-slot">
              <div class="keypad" role="group" aria-label="숫자 키패드">
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="1">1</button>
                  <button type="button" class="keypad-key" data-value="2">2</button>
                  <button type="button" class="keypad-key" data-value="3">3</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="4">4</button>
                  <button type="button" class="keypad-key" data-value="5">5</button>
                  <button type="button" class="keypad-key" data-value="6">6</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="7">7</button>
                  <button type="button" class="keypad-key" data-value="8">8</button>
                  <button type="button" class="keypad-key" data-value="9">9</button>
                </div>
                <div class="keypad-row">
                  <button type="button" class="keypad-key" data-value="00">00</button>
                  <button type="button" class="keypad-key" data-value="0">0</button>
                  <button
                    type="button"
                    class="keypad-key keypad-delete"
                    data-action="delete"
                    aria-label="삭제"
                  >
                    <img
                      src="../../../images/pay/charge/ico-keypad-delete.svg"
                      alt=""
                      width="24"
                      height="24"
                    />
                  </button>
                </div>
              </div>
            </div>
            <!-- //keypad -->
            <div class="charge-foot-cta">
              <button
                type="button"
                class="btn btn-charge-submit btn-withdraw-submit"
                disabled
              >
                출금하기
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //[2026-06-23] renewal-v2 적용 — 출금 (Figma 출금 · keypad) -->
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <!-- 출금 안내 팝업 -->
    <div id="modal-withdrawalt-info" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">출금 안내</p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="note-wrap">
                <li>
                  안전한 거래를 위해 머니를 출금한 계좌로의 출금을 원칙으로
                  합니다.
                </li>
                <li>현재 보유 중인 일반 머니만 출금 가능합니다.</li>
                <li>
                  은행 점검 시간에는 출금이 제한될 수 있습니다. <br />
                  (평균 23시 50분 ~ 00시 10분)
                </li>
                <li>월 5회 무료 출금 이후 건당 500원의 수수료가 부과됩니다.</li>
                <li>출금 가능머니가 수수료보다 많을 때만 출금이 가능합니다.</li>
              </ul>
              <div class="info-wrap"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn js-modal-close">확인</button>
          </div>
        </div>
      </div>
    </div>
    <!-- //출금 안내 팝업 -->

    <!-- 계좌 선택하기 팝업 -->
    <div
      id="modal-select-account"
      class="modal modal-slide type-select type-title"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">계좌 선택하기</p>
            <button type="button" class="btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="btn-list account-list">
                <li class="option-item">
                  <button
                    type="button"
                    class="flex items-center js-modal-close"
                  >
                    <p class="img-bank">
                      <img
                        src="../../../images/bank/bank_new/logo-bank-kb.png"
                        alt=""
                      />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                    <p class="icon-star"></p>
                  </button>
                </li>
                <li class="option-item">
                  <button
                    type="button"
                    class="flex items-center js-modal-close"
                  >
                    <p class="img-bank">
                      <img
                        src="../../../images/bank/bank_new/logo-bank-kb.png"
                        alt=""
                      />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                  </button>
                </li>
                <li class="btn-wrap">
                  <button type="button" class="btn btn-add">
                    계좌 추가하기
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //계좌 선택하기 팝업 -->
  </body>
  <script>
    /* 출금 — RenewalAmountPage 공통 초기화 (design_renewal.js defer 이후) */
    $(function () {
      /** 사용자 보유 출금 가능 머니(원) — API 연동 시 applyWithdrawableWon()으로 갱신 */
      var withdrawableWon = 164000;

      /** 출금 가능 머니 표기 — 1만원 이하: x,000원 · 1만원 초과: x만원 / x만 x,xxx원 */
      function formatWithdrawableLabel(amountWon) {
        amountWon = parseInt(amountWon, 10) || 0;

        if (amountWon <= 0) {
          return "0원";
        }

        if (amountWon <= 10000) {
          return RenewalAmountKeypad.formatWon(amountWon) + "원";
        }

        var man = Math.floor(amountWon / 10000);
        var rest = amountWon % 10000;

        if (rest === 0) {
          return man + "만원";
        }

        return man + "만 " + RenewalAmountKeypad.formatWon(rest) + "원";
      }

      var page = RenewalAmountPage.init({
        input: "#withdrawAmount",
        available: withdrawableWon,
        maxDigits: 7,
        submitBtn: ".btn-withdraw-submit",
        limitLink:
          ".js-withdraw-balance-display, .charge-limit-hint .js-withdraw-limit-fill",
        limitLabel: formatWithdrawableLabel,
        labels: {
          empty: "얼마를 보낼까요?",
          filled: "출금 금액",
        },
      });

      /** 출금 가능 금액·한도·표시 UI 일괄 갱신 — API 응답 반영 시 이 함수만 호출 */
      function applyWithdrawableWon(nextWon) {
        withdrawableWon = Math.max(0, parseInt(nextWon, 10) || 0);
        page.setAvailable(withdrawableWon);
      }
    });
  </script>
</html>
