<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/join.css" />
    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/commonutil.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <div class="step1">
        <!-- header -->
        <div id="header">
          <div class="container">
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
        <!-- //header -->

        <!-- content -->
        <div id="content">
          <!-- container -->
          <div class="container">
            <!-- headline -->
            <div class="headline">
              <p>휴대폰 번호를 알려주세요</p>
            </div>
            <!-- //headline -->

            <!-- section -->
            <div class="section">
              <ul class="form-type">
                <li>
                  <div class="input-container label-n">
                    <input
                      type="text"
                      class="custom-input"
                      placeholder=""
                      id="phoneNumber1"
                      maxlength="11"
                    />
                    <label for="phoneNumber1" class="floating-label"
                      >휴대폰 번호</label
                    >
                    <button
                      type="button"
                      class="icon icon-del js-text-del"
                    ></button>
                  </div>
                </li>
              </ul>
            </div>
            <!-- //section -->
          </div>
          <!-- //container -->

          <!-- bottom area -->
          <div class="bottom-area">
            <!-- container -->
            <div class="container">
              <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
              <button
                type="button"
                id="nextBtn"
                class="btn"
                disabled
                onclick="modalOpenSlide('modal-agree')"
              >
                다음
              </button>
            </div>
            <!-- //container -->
          </div>
          <!-- //bottom area -->
        </div>
        <!-- //content -->
      </div>
    </div>
    <!-- //wrap -->

    <!-- loading -->
    <div class="modal modal-loading">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="loading">
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
          </div>
          <span class="sr-only">로딩 중</span>
        </div>
      </div>
    </div>
    <!-- //loading -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <!-- select modal list -->
    <div id="modal-agree" class="modal modal-slide type-title modal-agree">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">
              결제 서비스를 이용하기 위해 <br />
              아래의 약관 동의가 필요해요.
            </p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <!-- 전체 동의 체크박스 -->
            <div class="container">
              <div class="check-all top">
                <span class="checkbox">
                  <input
                    type="checkbox"
                    name="checkbox_1"
                    id="checkbox1_all"
                  />
                  <label for="checkbox1_all">약관 전체 동의</label>
                </span>
              </div>
            </div>
            <!-- 첫 번째 약관 그룹 -->
            <div class="container mb16">
              <div class="check-all">
                <span class="checkbox">
                  <input type="checkbox" id="checkbox1_group1_all" />
                  <label for="checkbox1_group1_all"> 서비스 이용 약관 </label>
                </span>
              </div>
              <ul class="terms-list terms-block-list">
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_1"
                        data-group="checkbox1_group1"
                        data-required="true"
                      />
                      <label for="checkbox1_group1_1"
                        >(필수) 서비스 이용 약관
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_2"
                        data-group="checkbox1_group1"
                        data-required="true"
                      />
                      <label for="checkbox1_group1_2"
                        >(필수) 전자금융거래 이용약관
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_3"
                        data-group="checkbox1_group1"
                        data-required="true"
                      />
                      <label for="checkbox1_group1_3"
                        >(필수) 개인정보 수집·이용
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_4"
                        data-group="checkbox1_group1"
                        data-required="true"
                      />
                      <label for="checkbox1_group1_4"
                        >(필수) 개인정보 제3자 제공 및 위탁
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_5"
                        data-group="checkbox1_group1"
                        data-required="false"
                      />
                      <label for="checkbox1_group1_5"
                        >(선택) 마케팅 목적 개인정보 수집/이용
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group1_6"
                        data-group="checkbox1_group1"
                        data-required="false"
                      />
                      <label for="checkbox1_group1_6"
                        >(선택) 마케팅 정보 수신
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
              </ul>
              <div class="check-all">
                <span class="checkbox">
                  <input type="checkbox" id="checkbox1_group2_all" />
                  <label for="checkbox1_group2_all"
                    >본인 확인 이용 약관동의
                  </label>
                </span>
              </div>
              <ul class="terms-list terms-block-list">
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group2_1"
                        data-group="checkbox1_group2"
                        data-required="true"
                      />
                      <label for="checkbox1_group2_1"
                        >(필수) 휴대폰 본인 확인 이용 약관
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group2_2"
                        data-group="checkbox1_group2"
                        data-required="true"
                      />
                      <label for="checkbox1_group2_2"
                        >(필수) 본인 인증 개인 정보 수집·이용
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group2_3"
                        data-group="checkbox1_group2"
                        data-required="true"
                      />
                      <label for="checkbox1_group2_3"
                        >(필수) 본인 인증 개인 정보 제공 위탁
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="checkbox-block-group">
                    <span class="checkbox child">
                      <input
                        type="checkbox"
                        id="checkbox1_group2_4"
                        data-group="checkbox1_group2"
                        data-required="true"
                      />
                      <label for="checkbox1_group2_4"
                        >(필수) 본인 인증 고유 식별 정보 처리
                        <button
                          type="button"
                          class="arrow-right js-open-terms"
                        ></button
                      ></label>
                    </span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="btn-agree1" class="btn-confirm" onclick="location.href='join_step2.html'">동의하기</button>
          </div>
        </div>
      </div>
    </div>
    <!-- //select modal list -->

    <script>
      $(function () {
        $("#phoneNumber1").on("input", function () {
          var input = $(this).val(); // 현재 입력된 값
          if (input.length === 11) {
            $("#nextBtn").attr("disabled", false);
          }
        });
      });
    </script>
  </body>
</html>
