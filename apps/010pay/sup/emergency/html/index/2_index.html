    <script>
      const targets = document.querySelectorAll(".scroll-fade-up");

      const observer = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry, index) => {
            if (entry.isIntersecting) {
              // 순차적으로 delay 주기
              setTimeout(() => {
                entry.target.classList.add("active");
              }, index * 300); // 300ms씩 순차 delay
              observer.unobserve(entry.target); // 1번만 실행하고 제거
            }
          });
        },
        {
          threshold: 0.3,
        },
      );

      targets.forEach((target) => observer.observe(target));

      window.addEventListener("load", function () {
        // 에러 모달
        // modalOpenSlide('modal-select-title');
        // modalOpenSlide('modal-empty');
      });

      // 250526 퍼블리싱 수정 시작
      document.addEventListener("DOMContentLoaded", function () {
        const checkboxAll2 = document.getElementById("checkbox_all2");
        const childCheckboxes = document.querySelectorAll(
          'input[type="checkbox"][data-group="checkbox4_group1"]',
        );
        const toggleBtn = document.querySelector(
          "#modal-select-title .check-all .btn-toggle",
        );
        const termsList = document.querySelector(
          "#modal-select-title .terms-list.terms-block-list",
        );

        // 상태 저장용
        let isManuallyToggled = false;

        checkboxAll2.checked = true;
        childCheckboxes.forEach((cb) => (cb.checked = true));

        updateAgreeButton();
        updateTermsListVisibility();

        checkboxAll2.addEventListener("change", () => {
          childCheckboxes.forEach((cb) => (cb.checked = checkboxAll2.checked));
          updateAgreeButton();
          // 수동으로 열었더라도 checkbox가 바뀌면 자동 통제 우선
          isManuallyToggled = false;
          updateTermsListVisibility();
        });

        childCheckboxes.forEach((cb) => {
          cb.addEventListener("change", () => {
            const allChecked = Array.from(childCheckboxes).every(
              (i) => i.checked,
            );
            checkboxAll2.checked = allChecked;
            updateAgreeButton();
            // 하위가 바뀌어도 checkbox_all2에 따라 자동 제어
            isManuallyToggled = false;
            updateTermsListVisibility();
          });
        });

        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            const isOpen = toggleBtn.classList.contains("open");
            isManuallyToggled = true;

            if (isOpen) {
              toggleBtn.classList.remove("open");
              termsList.style.display = "none";
              // ✅ check-all에서도 open 제거
              toggleBtn.closest(".check-all").classList.remove("open");
            } else {
              toggleBtn.classList.add("open");
              termsList.style.display = "";
              // ✅ check-all에 open 추가
              toggleBtn.closest(".check-all").classList.add("open");
            }
          });
        }

        function updateAgreeButton() {
          const agreeButton = document.getElementById("btn-agree1");
          const allChecked = Array.from(childCheckboxes).every(
            (i) => i.checked,
          );
          agreeButton.disabled = !allChecked;
          agreeButton.classList.toggle("disabled", !allChecked);
        }

        function updateTermsListVisibility() {
          if (!termsList || !toggleBtn) return;

          if (!isManuallyToggled) {
            if (checkboxAll2.checked) {
              termsList.style.display = "none";
              toggleBtn.classList.remove("open");
            } else {
              termsList.style.display = "";
              toggleBtn.classList.add("open");
            }
          }
        }
      });
      // 250526 퍼블리싱 수정 끝
    </script>
