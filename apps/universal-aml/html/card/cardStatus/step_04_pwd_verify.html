<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>헥토파이낸셜</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/common.css" />
    <link rel="stylesheet" href="../../../css/card.css" />
    <script src="../../../js/jquery-1.8.3.min.js"></script>
    <script src="../../../js/common.js" defer></script>
    <script src="../../../js/aml.js" defer></script>
    <script src="../../../js/design_renewal.js" defer></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="card step card-status-step-04-pwd-verify keypad-on">
      <!-- header -->
      <header class="header">
        <div class="container">
          <button type="button" class="btn-back btn"></button>
          <h1 class="brand-name">카드 비밀번호 등록</h1>
          <button type="button" class="btn-close btn"></button>
        </div>
      </header>
      <!-- //header -->
      <div class="step-bar">
        <div class="step-wrap">
          <span class="step step-05"></span>
        </div>
      </div>
      <!-- section -->
      <section>
        <div id="content" class="container keypad-on">
          <div class="tit-wrap">
            <!-- tit -->
            <h2 class="tit">
              카드 비밀번호 4자리를 <br />
              한번더 입력해주세요. 
            </h2>
            <!-- //tit -->
          </div>

          <div class="form-wrap">
            <div class="input-mark">
              <span class="mark mark--4" role="group" aria-label="카드 비밀번호 4자리 재입력">
                <i id="pwd_01"></i>
                <i id="pwd_02"></i>
                <i id="pwd_03"></i>
                <i id="pwd_04"></i>
              </span>
            </div>
          </div>

        </div>

        <!-- 보안키패드 -->
        <div class="nppfs-keypad-div">
          <div class="kpd-wrap kpd-image">
            <img
              src="../../../images/card/keypad-card-pwd.png"
              alt="보안키패드"
            />
          </div>
        </div>
        <!-- //보안키패드 -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->

    <div id="modalSlide02" class="modal modal-slide">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <div class="container">
              <ul class="accordion-list">
                <li>
                  <div class="list-header accordion-title">
                    <h3 class="subject">
                      <div class="check-box check-all w-full">
                        <input
                          type="checkbox"
                          id="check-all"
                          name="check-all"
                        />
                        <label for="check-all">선불충전서비스 이용 약관</label>
                      </div>
                    </h3>
                  </div>
                  <div class="list-body accordion-item">
                    <div class="content">
                      <ul class="list-sub">
                        <li class="list-item">
                          <div class="check-box child">
                            <input
                              type="checkbox"
                              id="chk1"
                              class="checkSelect"
                              name="chk1"
                              value="Y"
                            />
                            <label for="chk1"
                              >통신과금서비스 이용약관(필수)</label
                            >
                          </div>
                          <span class="btn-right"
                            ><a
                              href="javascript:;"
                              data-toggle="modal"
                              data-target="#noticeDetail01"
                              ><span class="btn_view">보기</span></a
                            ></span
                          >
                        </li>
                        <li class="list-item">
                          <div class="check-box child">
                            <input
                              type="checkbox"
                              id="chk2"
                              class="checkSelect"
                              name="chk2"
                              value="Y"
                            />
                            <label for="chk2">개인정보 수집·이용(필수)</label>
                          </div>
                          <span class="btn-right"
                            ><a
                              href="javascript:;"
                              data-toggle="modal"
                              data-target="#noticeDetail02"
                              ><span class="btn_view">보기</span></a
                            ></span
                          >
                        </li>
                        <li class="list-item">
                          <div class="check-box child">
                            <input
                              type="checkbox"
                              id="chk3"
                              class="checkSelect"
                              name="chk3"
                              value="Y"
                            />
                            <label for="chk3"
                              >개인정보 제3자 제공 및 위탁 안내(필수)</label
                            >
                          </div>
                          <span class="btn-right"
                            ><a
                              href="javascript:;"
                              data-toggle="modal"
                              data-target="#noticeDetail03"
                              ><span class="btn_view">보기</span></a
                            ></span
                          >
                        </li>
                      </ul>
                    </div>
                  </div>
                </li>
              </ul>
              <div class="btn-wrap">
                <button
                  type="button"
                  id="next"
                  class="btn btn-default"
                  disabled
                  onclick="location.href='step_05.html'"
                >
                  다음
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- modal - 공지사항 상세 -->
    <div
      id="noticeDetail01"
      class="modal modal-full"
      tabindex="-1"
      role="dialog"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <div class="container">
              <h1 class="brand-name">
                <span class="my-logo"
                  ><img
                    src="../../../images/common/logo.svg"
                    alt="헥토파이낸셜"
                /></span>
              </h1>
              <button
                type="button"
                class="btn btn-close"
                data-dismiss="modal"
                data-target="#noticeDetail"
              ></button>
            </div>
          </div>
          <div class="modal-body">
            <div class="container">
              <div class="terms scroll">
                <p class="terms-title">통신과금 서비스 이용약관(필수)</p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div class="btn-wrap">
              <button
                type="button"
                class="btn btn-xl btn-secondary"
                data-dismiss="modal"
                data-target="chk1"
              >
                동의 후 닫기
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="noticeDetail02"
      class="modal modal-full"
      tabindex="-1"
      role="dialog"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <div class="container">
              <h1 class="brand-name">
                <span class="my-logo"
                  ><img
                    src="../../../images/common/logo.svg"
                    alt="헥토파이낸셜"
                /></span>
              </h1>
              <button
                type="button"
                class="btn btn-close"
                data-dismiss="modal"
                data-target="#noticeDetail"
              ></button>
            </div>
          </div>
          <div class="modal-body">
            <div class="container">
              <div class="terms scroll">
                <p class="terms-title">개인정보 수집·이용(필수)</p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div class="btn-wrap">
              <button
                type="button"
                class="btn btn-xl btn-secondary"
                data-dismiss="modal"
                data-target="chk2"
              >
                동의 후 닫기
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="noticeDetail03"
      class="modal modal-full"
      tabindex="-1"
      role="dialog"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <div class="container">
              <h1 class="brand-name">
                <span class="my-logo"
                  ><img
                    src="../../../images/common/logo.svg"
                    alt="헥토파이낸셜"
                /></span>
              </h1>
              <button
                type="button"
                class="btn btn-close"
                data-dismiss="modal"
                data-target="#noticeDetail"
              ></button>
            </div>
          </div>
          <div class="modal-body">
            <div class="container">
              <div class="terms scroll">
                <p class="terms-title">개인정보 제3자 제공 및 위탁 안내(필수)</p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div class="btn-wrap">
              <button
                type="button"
                class="btn btn-xl btn-secondary"
                data-dismiss="modal"
                data-target="chk3"
              >
                동의 후 닫기
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //modal - 공지사항 상세 -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="prompt-title"></h3>
            <p class="prompt-contents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              아니오
            </button>
            <button
              type="button"
              onclick="modalClose();"
              id="promptOk"
              class="btn btn-confirm"
            >
              예
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <script>
      $(".btn-close.btn").click(function () {
        $.promptMessage(
          "",
          "선불충전서비스를 이용하기 위해서는<br>본인확인이 필요합니다.<br><br><b>본인확인을 계속 하시겠습니까?</b>",
          $("#commonPrompt"),
        );
      });

      (function () {
        var dots = document.querySelectorAll(".input-mark .mark i");
        var filled = 0;
        var keypad = document.querySelector(".nppfs-keypad-div .kpd-wrap");

        if (!keypad) return;

        keypad.addEventListener("click", function () {
          if (filled < dots.length) {
            dots[filled].classList.add("on");
            filled += 1;
          }

          if (filled >= dots.length) {
            setTimeout(function () {
              modalOpenSlide("modalSlide02");
            }, 300);
          }
        });
      })();
    </script>
  </body>
</html>
