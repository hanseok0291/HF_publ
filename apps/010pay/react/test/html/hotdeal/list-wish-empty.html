<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>핫딜</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">

	<!-- styles -->
	<link rel="stylesheet" href="../../../styles/globals.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Common.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Layout.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/Nav.module.css">
	<link rel="stylesheet" href="../../../styles/hotdeal/List.module.css">
	<!-- //styles -->

	<!-- script -->
	<script src="../../js/common/jquery-1.8.3.min.js"></script>
	<!-- //script -->
</head>

<body>
	<!-- wrap -->
	<div class="wrap">
		<!-- header -->
		<div class="pageHeader subHeader">
			<div class="container">
				<button type="button" class="btnIcon btnBack">뒤로 가기</button>
				<h1 class="pageTitle">핫딜 목록</h1>
			</div>
		</div>
		<!-- //header -->

		<!-- tab navigation -->
		<div class="navTab">
			<div class="container">
				<ul class="nav">
					<li><a href="#">응모한</a></li>
					<li><a href="#">진행&middot;예정</a></li>
					<li class="active"><a href="#">관심있는</a></li>
					<li><a href="#">마감된</a></li>
				</ul>
			</div>
		</div>
		<!-- //tab navigation -->

		<!-- content -->
		<div class="listpageContent">
			<!-- container -->
			<div class="container">
				<!-- hotdeal list -->
				<div class="hotdealList">
					<!-- empty content -->
					<div class="emptyContent">
						<div id="hotdeal-tab-1" class="emptyBox">
							<p class="emptyTxt"><i class="icon iconEmpty"></i> 아직 응모한 핫딜이 없어요.<br> 진행 중인 핫딜을 살표볼까요?</p>
						</div>
						<div id="hotdeal-tab-2" class="emptyBox">
							<p class="emptyTxt"><i class="icon iconEmpty iconEmptyReady"></i> 엄청난 핫딜을 준비 중이에요<i class="italic">!</i></p>
						</div>
						<div id="hotdeal-tab-3" class="emptyBox active">
							<p class="emptyTxt"><i class="icon iconEmpty iconEmptyWish"></i> 관심 핫딜이 없어요.<br> <i class="btnIcon btnWish">좋아요</i>를 눌러 관심 핫딜을 설정해 보세요.</p>
						</div>
						<div id="hotdeal-tab-4" class="emptyBox">
							<p class="emptyTxt"><i class="icon iconEmpty"></i> 마감된 핫딜이 없어요</p>
						</div>
					</div>
					<!-- //empty content -->
				</div>
				<!-- //hotdeal list -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</body>
</html>
