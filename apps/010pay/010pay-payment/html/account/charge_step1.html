<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/lottie.min.js"></script>
    <script src="../../js/swiper.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box justify-start">
            <button
              type="button"
              class="btn-prev"
              onclick="window.location.href='./registerCard_step1.html'"
            >
              <i class="icon-arrow-left"></i>
            </button>
            <h2 class="page-title"></h2>
            <button
              type="button"
              class="btn-close js-change-btn"
              data-message="창을 닫으시면 결제가 취소됩니다.<br>종료하시겠습니까?"
              data-cancel="취소"
              data-confirm="확인"
            ></button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container">
          <!-- headline -->
          <div class="headline big">
            <p>어떻게 충전할까요?</p>
          </div>
          <!-- //headline -->
          <!-- section -->
          <div class="section">
            <ul class="form-type box-list">
              <li>
                <div class="gray-box bank-box">
                  <button type="button">
                    <div class="flex flex-col">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-x-2">
                          <div class="img-box flex items-center justify-center">
                            <p>
                              <img
                                src="../../images/bank/logo_020.png"
                                alt=""
                                class="icon-bank"
                              />
                            </p>
                          </div>
                          <div class="flex flex-col items-start text-box">
                            <span class="title">신한</span>
                            <span class="sub-title">7899</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </button>
                </div>
              </li>
              <li>
                <div class="gray-box bank-box">
                  <button type="button">
                    <div class="flex flex-col">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-x-2">
                          <div class="img-box flex items-center justify-center">
                            <!-- <p><img src="../../images/bank/logo_020.png" alt="" class="icon-bank" /></p> -->
                            <div class="swiper-container">
                              <div class="swiper-wrapper">
                                <!-- 슬라이드 1 -->
                                <div class="swiper-slide">
                                  <img
                                    src="../../images/bank/logo_020.png"
                                    alt="신한"
                                    class="icon-bank"
                                  />
                                </div>
                                <!-- 슬라이드 2 -->
                                <div class="swiper-slide">
                                  <img
                                    src="../../images/bank/logo_004.png"
                                    alt="국민"
                                    class="icon-bank"
                                  />
                                </div>
                                <!-- 슬라이드 3 -->
                                <div class="swiper-slide">
                                  <img
                                    src="../../images/bank/logo_005.png"
                                    alt="하나"
                                    class="icon-bank"
                                  />
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="flex flex-col items-start text-box">
                            <span class="title">은행계좌</span>
                            <span class="sub-title type2 flex items-center">연결하기 > <!-- <i class="icon-arrow-right"></i> --></span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </button>
                </div>
              </li>
              <li>
                <div class="gray-box phone-box">
                  <button type="button">
                    <div class="flex flex-col">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-x-2">
                          <div class="img-box flex items-center justify-center">
                            <p>
                              <img
                                src="../../images/bank/logo_020.png"
                                alt=""
                                class="icon-bank"
                              />
                            </p>
                          </div>
                          <div class="flex flex-col items-start text-box">
                            <span class="title">휴대폰 소액결제</span>
                            <span class="sub-title">010-9999-9999</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </button>
                </div>
              </li>
              <!-- 휴대폰 소액결제 미동의자 대상 -->
              <li>
                <div class="gray-box phone-box">
                  <button type="button">
                    <div class="flex flex-col">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-x-2">
                          <div class="img-box flex items-center justify-center">
                            <p>
                              <img
                                src="../../images/bank/logo_020.png"
                                alt=""
                                class="icon-bank"
                              />
                            </p>
                          </div>
                          <div class="flex flex-col items-start text-box">
                            <span class="title">휴대폰 소액결제</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </button>
                </div>
              </li>
              <!-- //휴대폰 소액결제 미동의자 대상 -->
            </ul>
          </div>
          <!-- //section -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id="promptOk"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->
  </body>
  <script>document.addEventListener('DOMContentLoaded', () => {
    const swiper = new Swiper('.swiper-container', {
      direction: 'vertical', // 세로 방향 슬라이드
      loop: true, // 무한 롤링
      autoplay: {
        delay: 3000, // 3초마다 슬라이드 전환
        disableOnInteraction: false, // 사용자와 상호작용 후에도 자동 롤링 유지
      },
      slidesPerView: 1, // 한 번에 보이는 슬라이드 수
    });
  });</script>
</html>
