<script type="text/javascript">
$(function(){
	$(".box_detail:not(:first)").css("display","none");
	$("h2:first").addClass("selected");
	$(".box h2").click(function(){
		if($("+.box_detail",this).css("display")=="none"){
			$(".box_detail").slideUp("slow");
			$("+.box_detail",this).slideDown("slow");
			$("h2").removeClass("selected");
			$(this).addClass("selected");
		}
	});
});
</script>
