<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- header -->
	<div id="header">
		<div class="container">
			<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
			<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="content">
		<!-- container -->
		<div class="container">
			<!-- headline -->
			<div class="headline">
				<p>더 좋은 서비스를 위한<br> <strong>시스템 점검 중</strong>입니다</p>
			</div>
			<!-- //headline -->

			<!-- 안내 -->
			<div class="section pay-fail">
				<p><img src="../../images/icon-circle-error.png" alt="알림"></p>
				<p class="info-center">서비스 이용에 불편을 드려 죄송합니다.<br>
					잠시 후 다시 이용해주세요.</p>
			</div>
			<!-- //안내 -->
		</div>
		<!-- //container -->

		<!-- bottom area -->
		<div class="bottom-area">
			<!-- container -->
			<div class="container">
				<!-- button area -->
				<div class="btn-area">
					<button type="button" id="send" class="btn btn-submit">확인</button>
				</div>
				<!-- //button area -->
			</div>
			<!-- //container -->
		</div>
		<!-- //bottom area -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<div id="promptContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<!-- default script -->
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</body>
</html>
