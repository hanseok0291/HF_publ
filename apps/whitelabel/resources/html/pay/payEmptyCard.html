<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>

<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">결제</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main class="no-footer">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<h2 class="headline"><strong>헥토헬스케어</strong>에서<br>
					<strong class="text-primary">98,000원</strong>을 결제합니다.</h2>
				<!-- //headline -->

				<!-- payment -->
				<section class="pay">
					<h3 class="hidden">결제 수단 등록</h3>

					<!-- empty -->

						<div class="bubble"><img src="../../images/main-bubble.png" alt="결제 수단을 등록하고 결제를 진행해 주세요!"></div>

							<button type="button" class="btn btn-xl btn-plus">카드 등록</button>
						</div>
					</div> -->
					<div class="empty card-only">
						<div class="bubble"><img src="../../images/main-bubble-new.png" alt="결제 수단을 등록하고 결제를 진행해 주세요!"></div>
						<div class="btn-area">
							<button type="button" class="btn btn-xl btn-dash btn-plus">카드 등록</button>
						</div>
					</div>
					<!-- //empty -->
				</section>
				<!-- //payment -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title">알림</h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title">안내</h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->
