<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>선불머니 결제 비밀번호 설정 — 헥토파이낸셜</title>
    <link rel="stylesheet" href="../css/pin-input.css" />
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="pin-page">
      <!-- header -->
      <header class="pin-header">
        <div class="pin-container">
          <!-- 브랜드 로고(Figma title 1:678 · h 18px) -->
          <h1 class="pin-brand">
            <img
              class="pin-logo"
              src="../images/common/logo.svg"
              alt="헥토파이낸셜"
            />
          </h1>
          <button type="button" class="pin-close" aria-label="화면 닫기"></button>
        </div>
      </header>
      <!-- //header -->

      <!-- section -->
      <section class="pin-section" aria-labelledby="pin-heading">
        <!-- 1:872~873 본문 + 1:879 PIN 표시. 상태바(54)·홈(1:874) 미구현 -->
        <div id="pin-body" class="pin-main">
          <h2 id="pin-heading" class="pin-heading">
            PIN 번호를 입력해주세요
          </h2>

          <div
            class="pin-form"
            role="group"
            aria-label="PIN 번호 6자리 입력 상태"
          >
            <ul class="pin-dots">
              <li class="pin-dot is-filled" aria-hidden="true"></li>
              <li class="pin-dot is-filled" aria-hidden="true"></li>
              <li class="pin-dot" aria-hidden="true"></li>
              <li class="pin-dot" aria-hidden="true"></li>
              <li class="pin-dot" aria-hidden="true"></li>
              <li class="pin-dot" aria-hidden="true"></li>
            </ul>
          </div>
        </div>

        <div class="pin-keypad-area">
          <!-- 1:878 키패드 영역 430×281 -->
          <div class="pin-keypad-sample">
            <img
              src="../images/common/keypad.png"
              alt="보안키패드 샘플"
            />
          </div>
        </div>
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->
  </body>
</html>
