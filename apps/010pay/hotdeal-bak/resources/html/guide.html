<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>핫딜</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="../css/slick.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="https://code.jquery.com/jquery-2.2.0.min.js"></script>
	<script src="../js/slick.js"></script>
    <script src="../js/modal.js"></script>
</head>
<body>

<!-- wrap -->
<div id="wrap" class="detail-page">
    <!-- header -->
    <div id="header" class="detail-header bg-white">
        <div class="container">
            <h1 class="page-title-wrap">
                <a href="#" class="page-title">
                    <span><i class="icon-arrow-left"></i></span>
                    <span class="page-title-name">핫딜 안내</span>
                </a>
            </h1>
        </div>
    </div>
    <!-- //header -->

    <!-- content -->
    <div id="content" class="guide-content">
        <div class="container">
            <!-- guide-slide-wrap -->
            <div class="guide-slide-wrap">
                <!-- guide-slide-box -->
                <div class="guide-slide-box">
                    <div class="guide-slide">
                        <div class="guide-slide-box">
                            <div class="guide-tit-box">
                                <h2 class="guide-title"><i class="icon-logo-colorful"></i><strong
                                        class="highlight">핫딜</strong>?
                                </h2>
                                <p class="guide-txt">
                                    010PAY를 이용해주시는 회원님께 <br>
                                    감사의 마음으로 준비한 혜택입니다
                                </p>
                            </div>
                            <div class="guide-img guide-img-gift"></div>
                        </div>
                        <div class="guide-slide-box">
                            <div class="guide-tit-box">
                                <h2 class="guide-title">한 달에 <strong class="highlight">두 번</strong><i
                                        class="italic">!</i></h2>
                                <p class="guide-txt">
                                    2주, 4주 째 화요일 핫딜이 열려요 <br>
                                    일정 기간동안 핫딜에 참여할 수 있어요
                                </p>
                            </div>
                            <div class="guide-img guide-img-time"></div>
                        </div>
                        <div class="guide-slide-box">
                            <div class="guide-tit-box">
                                <h2 class="guide-title">엄선된 상품을 <strong class="highlight">0원</strong>에</h2>
                                <p class="guide-txt">
                                    트렌드, 품질 모두 고려하여 고급 상품만을 엄선합니다 <br>
                                    가격은 진짜 0원이에요<i class="italic">!</i>
                                </p>
                            </div>
                            <div class="guide-img guide-img-zero"></div>
                        </div>
                        <div class="guide-slide-box">
                            <div class="guide-tit-box">
                                <h2 class="guide-title"><strong class="highlight">응모조건</strong> 없이</h2>
                                <p class="guide-txt">
                                    010PAY 회원이면 누구나 응모할 수 있고 <br>
                                    준비된 수량만큼 당첨자를 랜덤 추첨합니다
                                </p>
                            </div>
                            <div class="guide-img guide-img-free"></div>
                        </div>
                    </div>
                </div>
                <!-- //guide-slide-box -->

                <script>
                    $('.guide-slide').slick({
                        dots: true,
                        infinite: true,
                        slidesToShow: 1,
                        arrows: false,
                        initialSlide: 1,
                        autoplay: true,
                        autoplaySpeed: 2000
                    });

                    $('.guide-slide').slick('slickGoTo', 0);
                </script>
            </div>
            <!-- //guide-slide-wrap -->

            <!-- guide-list -->
            <div class="guide-list">
                <div>
                    <a href="#" class="clearfix">
                        <h3 class="guide-list-title">핫딜 자주 묻는 질문</h3>
                        <p class="guide-list-txt">
                            <i class="icon-arrow-right"></i>
                        </p>
                    </a>
                </div>
                <div>
                    <a href="tel:1600-5220" class="clearfix">
                        <h3 class="guide-list-title">핫딜 문의</h3>
                        <p class="guide-list-txt">
                            <i class="icon-phone"></i>
                            <span class="guide-tel">1600-5220</span>
                            <i class="icon-arrow-right"></i>
                        </p>
                    </a>
                </div>
            </div>
            <!-- //guide-list -->
        </div>
    </div>
    <!-- //content -->
</div>
<!-- //wrap -->

</body>
</html>
