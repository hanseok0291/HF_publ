<script>
  $(document).ready(function () {
    /* 카드사 오류 일 경우 바로 바텀 노출 */;
    // modalOpenSlide('modal-select-title2')
    /* 이미 등록된 카드 모달 */;
    /* modalOpen('commonPrompt2') */
    /* 사용 중지 모달 */;
    /* modalOpen('commonAlert'); */

    $(document).on('click', '.option-item button', function () {
      const imgSrc = $(this).find('img').attr('src'); // 클릭된 버튼 내부 이미지 src
      $('#cardLogo').attr('src', imgSrc); // logo-box 아래 이미지 변경
      modalCloseSlide();
      const logoBox = document.querySelector('.logo-box');
      logoBox.classList.add('size-up');
    });

  });

  const cardInputs = document.querySelectorAll('.col-box .custom-input');
  const cardLogoImg = document.getElementById('cardLogo');

  // 카드 BIN별 카드사 매칭 예시
  const cardCompanies = [
    { name: 'Visa', bins: ['4'], logo: 'visa.png' },
    { name: 'MasterCard', bins: ['51', '52', '53', '54', '55'], logo: 'mastercard.png' },
    { name: 'Amex', bins: ['34', '37'], logo: 'amex.png' },
    { name: 'BC', bins: ['95'], logo: 'logo_bc.png' },
    { name: 'KB', bins: ['94'], logo: 'logo_kb.png' },
    // 필요시 BIN 추가
  ];

  function detectCardCompany(cardNumber) {
    for (const company of cardCompanies) {
      if (company.bins.some(bin => cardNumber.startsWith(bin))) {
        return company.logo;
      }
    }
    return null;
  }

  function handleCardInput() {
    const cardNumber = Array.from(cardInputs).map(input => input.value).join('');
    const logoBox = document.querySelector('.logo-box');

    if (cardNumber.length >= 6) {
      const logo = detectCardCompany(cardNumber);
      if (logo) {
        cardLogoImg.src = `../../images/logo/${logo}`; // 카드사 이미지 경로 예시
        if (logoBox) logoBox.classList.add('size-up');
      } else {
        cardLogoImg.src = '../../images/common/icon-credit-card.svg';
        if (logoBox) logoBox.classList.remove('size-up');
      }
    } else {
      cardLogoImg.src = '../../images/common/icon-credit-card.svg';
      if (logoBox) logoBox.classList.remove('size-up');
    }
  }

  cardInputs.forEach(input => {
    input.addEventListener('input', handleCardInput);
  });
</script>
