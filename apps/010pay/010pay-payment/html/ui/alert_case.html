<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>내통장결제</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../resources/css/jquery-ui.css" />
        <link rel="stylesheet" href="../../resources/css/common_renewal.css" />
        <!--[if lt IE 9]>
            <script type="text/javascript" src="../../js/html5shiv.js"></script>
            <script type="text/javascript" src="../../js/respond.min.js"></script>
        <![endif]-->
        <script src="../../resources/js/jquery.3.4.1.min.js"></script>
        <script src="../../resources/js/jquery.placeholder.min.js"></script>
        <script src="../../resources/js/jquery-ui.js"></script>
        <script src="../../resources/js/design_renewal.js" defer="defer"></script>
        <script src="../../resources/js/commonmsg.js"></script>
        <script src="../../resources/js/commonutil.js"></script>
        <script src="../../resources/js/owl.carousel.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title">얼럿 케이스</h2>
                        <button type="button" class="btn-close"><i class="icon-close"></i></button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!-- container -->
                <div class="container">
                    <!-- headline -->
                    <div class="headline">
                        <p>얼럿 케이스 모음 입니다.</p>
                        <br />
                        <button type="button" onclick="$.alertMessage('', '이미 등록된 계좌에요. <br>다른 계좌번호를 등록해주세요!', $('#commonAlert'));" class="btn">등록한 계좌 있는 케이스</button>
                        <br />
                        <br />
                        <button type="button" onclick="$.alertMessage('', '본인 명의 계좌만 등록이 가능해요.<br>계좌번호를 다시 확인해주세요!', $('#commonAlert'));" class="btn">
                            본인명의 계좌 아닌 케이스
                        </button>
                        <br />
                        <br />
                        <button type="button" onclick="$.alertMessage('', '기존과 동일한 비밀번호로 사용할 수 없어요.<br>다시 설정해주세요.', $('#commonAlert'));" class="btn">
                            기존과 동일한 번호 입력 시
                        </button>
                        <br />
                        <br />
                        <button type="button" onclick="$.alertMessage('', '숫자만 입력 가능해요.', $('#commonAlert'));" class="btn">타 계좌 붙여넣기 시 숫자 외에 복사된 케이스</button>
                        <br />
                        <br />
                        <button
                            type="button"
                            onclick="$.promptMessage(
												'', 
												'비밀번호 등록이 완료되지 않아 간편결제<br>등록이 안됐어요. 이대로 중단할까요?', 
												$('#commonPrompt'), 
												$('#promptOk'), 
												'modalClose()', 
												'',  // warning
												'취소',  // 취소 버튼 텍스트
												'확인'       // 확인 버튼 텍스트
											);"
                            class="btn change-btn js-change-btn"
                        >
                            X 클릭 시 팝업
                        </button>
                        <br />
                        <br />
                        <button
                            type="button"
                            onclick="$.promptMessage(
												'', 
												'변경 시 계좌인증을 다시 진행해야해요.<br>그래도 변경할까요?', 
												$('#commonPrompt'), 
												$('#promptOk'), 
												'modalClose()', 
												'',  // warning
												'취소',  // 취소 버튼 텍스트
												'확인'       // 확인 버튼 텍스트
											);"
                            class="btn change-btn js-change-btn"
                        >
                            계좌 변경 버튼 클릭 시 팝업
                        </button>
                        <br />
                        <br />
                        <button
                            type="button"
                            onclick="$.promptMessage(
												'', 
												'이미 등록된 계좌에요. <br>다른 계좌번호를 등록해주세요!', 
												$('#commonPrompt'), 
												$('#promptOk'), 
												'modalClose()', 
												'',  // warning
												'취소',  // 취소 버튼 텍스트
												'확인'       // 확인 버튼 텍스트
											);"
                            class="btn change-btn js-change-btn"
                        >
                            등록한 계좌 있는 케이스
                        </button>
                    </div>
                    <!-- //headline -->

                    <!-- section -->
                    <div class="section"></div>
                    <!-- //section -->
                </div>
                <!-- //container -->

                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
                        <button type="button" id="send" class="btn">다음</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- loading -->
        <div class="modal modal-loading">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="loading">
                        <span class="loading-bar"></span>
                        <span class="loading-bar"></span>
                        <span class="loading-bar"></span>
                    </div>
                    <span class="sr-only">로딩 중</span>
                </div>
            </div>
        </div>
        <!-- //loading -->

        <!-- common alert -->
        <div id="commonAlert" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="alertTitle"></h3>
                        <p id="alertContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common alert -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->
    </body>
</html>
