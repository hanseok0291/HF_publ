<!DOCTYPE html>

  <head>

    <meta

      content="telephone=no, address=no, email=no"

    <link rel="stylesheet" href="../../css/jquery-ui.css" />

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker condition">

          <h2>진행 현황</h2>
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <div class="pdLR22">
            <div class="topContent">
              <em>🔔</em> 종합소득세 신청 단계가 변경되면 <b>PUSH로 알려드려요.</b>
            </div>
  
            <div class="section1">
              <div class="leftContent">
              </div>
              <div class="rightContent">
                <div class="active">
                  <span class="circle"></span>
                  <p class="titleText">접수 대기 중</p>
                  <p class="subText">제휴 세무사 접수 대기 단계는 <br>

                </div>
                <div>
                  <span class="circle"></span>
                  <p class="titleText">처리중</p>
                  <p class="subText">유의사항 내용</p>
                </div>
                <div>
                  <span class="circle"></span>
                  <p class="titleText">관할 세무서 확인</p>
                  <p class="subText">유의사항 내용</p>
                </div>
              </div>
            </div>
          </div>

          <div class="footContent">
            <h4>고객문의</h4>
            <div class="infoWrap">
              <span>운영시간</span>
              <i class="divider"></i>
              <span>평일 09:00 ~ 18:00 (주말 · 공휴일 휴무)</span>
            </div>
            <div class="numberArea">
              <p>결제 · 서비스 이용문의</p>
              <div class="box">
                <span>1600-5220</span>
              </div>
            </div>
            <div class="numberArea">
              <p>종합소득세 신고 관련 문의</p>
              <div class="box taxby">
                <i class="divider"></i>
                <span>0000-0000</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
