<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />
    <link rel="stylesheet" href="../../css/gigworker_check.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker checkNot">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
					<div class="pdLR22">
						<div class="titleWrap">
							<h3 class="mainTitle normal">
								박혜빈님은 환급액 계산이 <br>
								<b>어려울 것 같아요.</b>
							</h3>
							<p class="subText">아래 경우가 아니라면 환급이 가능할 수 있으니 <br>
                홈택스를 이용해주세요.</p>
						</div>
					</div>
					
          <figure class="visualImg"></figure>

          <div class="noteWrap">
            <p class="title">이런 경우일 수 있어요</p>
            <ul class="note">
              <li>최근 5년 이내 신고한 적이 있는 경우</li>
              <li>연말정산을 마친 일반 근로자의 경우</li>
              <li>소득이 없는 경우</li>
              <li>환급받을 세금이 없는 경우</li>
              <li>납부할 세금이 있는 경우</li>
            </ul>
          </div>

					<div class="pdLR22">
						<div class="botBtnWrap">
              <!-- 버튼 비활성화 시 disable 클래스 -->
              <button type="button" class="bot-btn" onclick="modalOpenSlide('modalSlideType1')">확인</button>
            </div>
          </div>
        </div>
      </div>
      <!-- //content -->
      <div class="toastModal">
				<a href="#" class="container">
					<em>☕</em>
					<div class="textWrap">
						<h4><span class="mainColor">스타벅스 쿠폰</span> 응모 완료 !</h4>
						<p>이벤트 확인하기 <i class="icon-right-arrow"></i></p>
					</div>
				</a>
			</div>
    </div>
    <!-- //wrap -->

    <script>

    </script>
  </body>
</html>
