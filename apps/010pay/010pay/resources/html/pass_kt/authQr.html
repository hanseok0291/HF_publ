<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
<style>
.bg-primary, .input-mark .mark i.on, .switch .switch-inner:before, .icon-star.on, .btn-star.on > .icon-star, .btn-primary, .loading-bar { background-color: #ff3a4a; }
.icon-check.primary:before, .btn-primary, .btn-primary-outline, .home-sec.current .per { border-color: #ff3a4a; }
.used-sec .price .add, .check-primary { color: #ff3a4a; }
.text-primary { color: #ff3a4a !important; }
</style>
</head>

<body class="custom-pass kt">
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name">
					<a href="#">
						<span class="shop-logo"><img src="../../images/logo-pass-org.png?ver=1.1" alt="PASS"></span>
						<span class="my-logo"><img src="../../images/logo-010pay-black.png?ver=1.1" class="logo" alt="010PAY"></span>
					</a>
				</h1>
				<h2 class="page-title hidden">QR로 결제</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- button group -->
				<ul class="btn-group ui-switch mgt25">
					<li class="active"><button type="button" class="btn" disabled>QR로 결제</button></li>
					<li><button type="button" class="btn">휴대폰번호로 결제</button></li>
				</ul>
				<!-- //button group -->

				<!-- QR 촬영 안내 -->
				<div class="section auth-select">
					<p class="auth-qr"><img src="../../images/sample/qr.png" class="img-qr" alt="QR"></p>
					<ul class="step-list-lg">
						<li><span class="number">1</span> <strong>PASS 앱</strong>에서 <strong class="underline">'QR인증'<button type="button" id="qrInfo" class="btn btn-icon info-chg"><i class="icon icon-question-circle black"><span class="sr-only">도움말</span></i></button></strong> 선택 후<br> QR코드 스캔</li>
						<li><span class="number">2</span> PASS 앱에서 결제 진행 후 아래<br> <strong>'결제 완료' 버튼</strong> 클릭!</li>
					</ul>
				</div>
				<!-- //QR 촬영 안내 -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- 알림 -->
					<div class="text-center">
						<p><span class="text-alert">최신 버전의 PASS 앱이 필요합니다.</span></p>
						<p><button type="button" id="appinfo" class="text-error text-link info-chg">PASS 앱은 어떻게 다운로드 하나요?</button></p>
					</div>
					<!-- //알림 -->
					<button type="button" id="send" class="btn mgt30">결제 완료</button>
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- PASS 앱 다운로드 안내 -->
<div id="modal-appinfo" class="modal modal-slide modal-info">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body my-info">
				<button type="button" class="btn btn-close">취소</button>
				<div class="chg-info appinfo">
					<p>앱스토어에서 'PASS'를 검색하시고<br>
						사용 중이신 통신사 앱을 다운 받아주세요.</p>
					<p class="pass-cust"><img src="../../images/logo/pass-icon.svg" class="logo-pass-icon" alt="PASS"><br>
						PASS by <span id="telecomName">KT</span></p>
					<p class="btn-group">
						<button type="button" class="btn btn-outline"><i class="icon icon-android"></i> <small>GOOGLE PLAY</small></button>
						<button type="button" class="btn btn-outline"><i class="icon icon-apple"></i> <small>APP STORE</small></button>
					</p>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //PASS 앱 다운로드 안내 -->

<!-- PASS 앱 메뉴 안내 -->
<div id="modal-qrInfo" class="modal modal-slide modal-info">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body my-info pdb0">
				<button type="button" class="btn btn-close">취소</button>
				<div class="chg-info appinfo">
					<p>PASS앱 메인 화면에서<br>
						아래 메뉴를 클릭해 주세요.</p>
					<p class="pass-cust"><img src="../../images/custom/pass-info-qr.png?ver=1.1" class="img-qr" alt="QR인증"></p>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //PASS 앱 메뉴 안내 -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
