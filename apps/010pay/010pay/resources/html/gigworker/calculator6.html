<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />
    <link rel="stylesheet" href="../../css/gigworker_check.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker noRefund">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
					<div class="pdLR22">
						<div class="titleWrap">
							<h3 class="mainTitle normal">
								이명구님은 <br>
                <b>예상 환급액이 0원이에요.</b>
							</h3>
							<p class="subText">예상 환급/납부액은 추정치로 실제와 다를 수 있어요.</p>
						</div>
					</div>
					
          <figure class="visualImg"></figure>

        </div>
      </div>
      <!-- //content -->

      <!-- 응모 완료 -->
      <a class="bottomBanner">
        <p class="text">이명구님 응모가 완료되었어요!</p>
        <img class="textImg" src="../../images/gigworker/calculator-banner-text2.png" alt="내 응모 현황과 당첨 TIP을 살펴보세요!">
        <img class="btnImg" src="../../images/gigworker/calculator-banner-btn2.png" alt="응모 현황 확인하기">
      </a>
      <!-- // 응모 완료 -->
    </div>
    <!-- //wrap -->

    <script>
      // 하단 배너 노출
      $(window).on("load", function(){
        setTimeout(function(){
          $(".bottomBanner").css("bottom"," 0");
        }, 1000)
      });
    </script>
  </body>
</html>
