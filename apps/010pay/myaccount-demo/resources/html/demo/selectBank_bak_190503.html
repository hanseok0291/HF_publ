<!doctype html>
<html lang="ko">
<head>
<title>내통장결제 데모</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/demo.css">
</head>

<body class="demo">
<!-- form -->
<form class="main_form" autocomplete="off">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<div class="page-title">
					<h2 class="title">은행 선택</h2>
				</div>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content" class="select-bank">
			<!-- section -->
			<div class="section select-area">
				<div class="container">
					<!-- 버튼 스타일 체크박스 -->
					<div class="btn-area">
						<p>내통장결제로<br> “계좌결제”를 간편하게 이용해 보세요!</p>
						<div class="checkbox btn-type">
							<input type="radio" name="radio" id="radio" checked>
							<label for="radio">내통장결제</label>
						</div>
					</div>
					<!-- //버튼 스타일 체크박스 -->

					<!-- 은행 목록 -->
					<div class="bank-area">
						<ul class="bank-list">
							<li>
								<button type="button" name="011">
									<span class="logo"><img src="../../images/bank/logo_011.png" alt="NH농협"></span>
									<span class="name">NH농협</span>
								</button>
							</li>
							<li>
								<button type="button" name="004">
									<span class="logo"><img src="../../images/bank/logo_004.png" alt="국민"></span>
									<span class="name">국민</span>
								</button>
							</li>
							<li>
								<button type="button" name="003">
									<span class="logo"><img src="../../images/bank/logo_003.png" alt="기업"></span>
									<span class="name">기업</span>
								</button>
							</li>
							<li>
								<button type="button" name="031">
									<span class="logo"><img src="../../images/bank/logo_031.png" alt="대구"></span>
									<span class="name">대구</span>
								</button>
							</li>
							<li>
								<button type="button" name="088">
									<span class="logo"><img src="../../images/bank/logo_088.png" alt="신한"></span>
									<span class="name">신한</span>
								</button>
							</li>
							<li>
								<button type="button" name="034">
									<span class="logo"><img src="../../images/bank/logo_034.png" alt="광주"></span>
									<span class="name">광주</span>
								</button>
							</li>
							<li>
								<button type="button" name="039">
									<span class="logo"><img src="../../images/bank/logo_039.png" alt="경남"></span>
									<span class="name">경남</span>
								</button>
							</li>
							<li>
								<button type="button" name="023">
									<span class="logo"><img src="../../images/bank/logo_023.png" alt="SC제일"></span>
									<span class="name">SC제일</span>
								</button>
							</li>
							<li>
								<button type="button" name="027">
									<span class="logo"><img src="../../images/bank/logo_027.png" alt="한국시티"></span>
									<span class="name">한국시티</span>
								</button>
							</li>
							<li>
								<button type="button" name="045">
									<span class="logo"><img src="../../images/bank/logo_045.png" alt="새마을"></span>
									<span class="name">새마을</span>
								</button>
							</li>
							<li>
								<button type="button" name="007">
									<span class="logo"><img src="../../images/bank/logo_007.png" alt="수협"></span>
									<span class="name">수협</span>
								</button>
							</li>
							<li>
								<button type="button" name="032">
									<span class="logo"><img src="../../images/bank/logo_032.png" alt="부산"></span>
									<span class="name">부산</span>
								</button>
							</li>
							<li>
								<button type="button" name="037">
									<span class="logo"><img src="../../images/bank/logo_037.png" alt="전북"></span>
									<span class="name">전북</span>
								</button>
							</li>
							<li>

									<span class="logo"><img src="../../images/bank/logo_048.png" alt="신협"></span>
									<span class="name">신협</span>

							</li>
							<li>

									<span class="name">제주</span>
								</button>
							</li>
							<li>
								<button type="button" name="071">
									<span class="logo"><img src="../../images/bank/logo_071.png" alt="우체국"></span>
									<span class="name">우체국</span>
								</button>
							</li>
							<li>
								<button type="button" name="002">
									<span class="logo"><img src="../../images/bank/logo_002.png" alt="산업"></span>
									<span class="name">산업</span>
								</button>
							</li>
							<li>
								<button type="button" name="020">
									<span class="logo"><img src="../../images/bank/logo_020.png" alt="우리"></span>
									<span class="name">우리</span>
								</button>
							</li>
							<li>
								<button type="button" name="005">
									<span class="logo"><img src="../../images/bank/logo_005.png" alt="KEB하나"></span>
									<span class="name">KEB하나</span>
								</button>
							</li>
						</ul>
					</div>
					<!-- //은행 목록 -->
				</div>
			</div>
			<!-- //section -->

			<!-- submit button -->
			<div class="section submit-btn fixed">
				<div class="container">
					<button type="button" id="send" class="btn on">다음</button>
				</div>
			</div>
			<!-- //submit button -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->
</body>
</html>
