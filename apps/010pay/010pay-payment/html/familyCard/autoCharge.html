<!DOCTYPE html>

      <!-- content -->

        <!-- container -->

                    <div class="right-box">

                  </div>
                </li>
              </ul>
              <ul id="sortable-list" class="sortable-list">
                <li class="list-item">
                  <div class="list-box">
                    <div class="img-wrap">
                      <img
                        src="../../images/payment/bank/hana.png"
                        alt="은행"
                      />
                    </div>
                    <div class="text-wrap">
                      <p class="title-text">하나</p>
                      <p class="sub-text">456</p>
                    </div>
                    <div class="right-box">
                      <span class="icon-star-off"></span>
                      <button type="button" class="handle">핸들</button>
                    </div>
                    <button
                      type="button"
                      class="delete-btn js-change-btn"
                      data-message="등록된 계좌를 삭제할까요?"
                      data-cancel="취소"
                      data-confirm="확인"
                    >
                      삭제
                    </button>
                  </div>
                </li>
                <li class="list-item">
                  <div class="list-box">
                    <div class="img-wrap">
                      <img
                        src="../../images/payment/bank/kakao-large.png"
                        alt="은행"
                      />
                    </div>
                    <div class="text-wrap">
                      <p class="title-text">카카오</p>
                      <p class="sub-text">789</p>
                    </div>
                    <div class="right-box">
                      <span class="icon-star-off"></span>
                      <button type="button" class="handle">핸들</button>
                    </div>
                    <button

                      class="delete-btn js-change-btn"
                      data-message="등록된 계좌를 삭제할까요?"

              </ul>
              <!-- bottom area -->
              <div class="bottom-area auto">
                <!-- container -->

                  <!-- <p class="balloon-text-box">계좌 등록 후  자동 충전 설정하세요!</p> -->

        </div>
        <!-- //container -->

    <!-- //wrap -->

    <!-- 대표 계좌 변경 토스트 모달 -->

    <!-- //대표 계좌 변경 토스트 모달 -->

    <!-- 자동 충전 활성화 토스트 모달  -->

        앞으로 헥토 패밀리 카드로 결제 시 <br />

    <!-- //자동 충전 활성화 토스트 모달 -->

    <!-- common prompt -->

            <p id="promptContents"></p>

          <div class="modal-footer">
            <button
              type="button"
              id=""
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              id=""
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              삭제할게요
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <!-- 머니 자동 충전 안내 팝업 -->
    <div id="modal-auto-charge-info" class="modal modal-slide type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">머니 자동 충전 안내</p>
            <button type="button" class="btn btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="note-wrap">
                <li>
                  결제 금액보다 머니/포인트의 총 잔액이 부족할 경우, 등록한 연결계좌를 통해 자동으로 충전 후 결제가 진행됩니다.
                </li>
                <li>
                  자동 충전은 1만원 단위로 충전되어 결제됩니다.
                </li>
              </ul>
              <div class="info-wrap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //머니 자동 충전 안내 팝업 -->
  </body>
  <script>
    $(document).ready(function () {
      // 모든 sortable-list를 선택
      document.querySelectorAll(".sortable-list").forEach((sortableList) => {
        // 각 sortable-list 내의 list-item 개수 확인
        const listItems = sortableList.querySelectorAll(".list-item");

        // list-item 개수 출력
        console.log(`sortable-list 내 list-item 개수: ${listItems.length}`);

        // list-item의 개수가 1일 경우 handle 버튼 숨기기
        if (listItems.length === 1) {
          const handleButton = listItems[0].querySelector(".handle");
          if (handleButton) {
            handleButton.style.display = "none"; // handle 버튼 숨기기
          }
        } else {
          // 1개가 아닌 경우 handle 버튼 보이게
          listItems.forEach((item) => {
            const handleButton = item.querySelector(".handle");
            if (handleButton) {
              handleButton.style.display = "block"; // handle 버튼 보이기
            }
          });
        }
      });
    });

    let isSorting = false; // Sortable.js 동작 여부 확인
    let isSwiping = false; // 스와이프 동작 여부 확인
    
    // Sortable.js 설정
    const list = document.getElementById("sortable-list");

    new Sortable(list, {
      animation: 150, // 드래그 애니메이션
      handle: ".handle",
      onStart: () => {
        isSorting = true; // Sortable.js 동작 시작
      },
      onEnd: () => {
        isSorting = false; // Sortable.js 동작 종료
      },
      onMove: (evt) => {
        if (isSwiping) {
          // 스와이프 중일 경우 드래그 중단
          return false;
        }
      },
    });

    document.addEventListener("DOMContentLoaded", () => {
      // 각 drag-list 내에서 이벤트 리스너 설정
      document.querySelectorAll(".drag-list").forEach((dragList) => {
        dragList.querySelectorAll(".icon-star-off").forEach((icon) => {
          icon.addEventListener("click", (event) => {
            modalToastOpen("toast-change-aaccount");
            handleStarOffClick(event, dragList);
          });
        });
      });
    });

    function handleStarOffClick(event, dragList) {
      const clickedItem = event.target.closest(".list-item");
      const topList = dragList.querySelector(".top-list");
      const sortableList = dragList.querySelector(".sortable-list");
      const listItems = Array.from(sortableList.children);
      const itemHeight = 90;

      const topListItem = topList.querySelector(".list-item");

      // === 오른쪽 아이콘 변경 ===
      const clickedRightBox = clickedItem.querySelector(".right-box");
      const topRightBox = topListItem.querySelector(".right-box");

      clickedRightBox.innerHTML = `<span class="icon-star"></span>`;

      const sortableCount = sortableList.querySelectorAll(".list-item").length;

      if (sortableCount > 1) {
        console.log(sortableCount);
        topRightBox.innerHTML = `
      <span class="icon-star-off"></span>
      <button type="button" class="handle">핸들</button>
    `;
      } else {
        topRightBox.innerHTML = `<span class="icon-star-off"></span>`;
      }

      const clickedIndex = listItems.indexOf(clickedItem);
      const topListCount = topList.querySelectorAll(".list-item").length;
      const totalIndex = topListCount + clickedIndex;
      const offsetUp = totalIndex * itemHeight;

      clickedItem.style.transition = "transform 0.4s ease";
      clickedItem.style.transform = `translateY(-${offsetUp}px)`;

      listItems.forEach((item, index) => {
        if (index < clickedIndex) {
          item.style.transition = "transform 0.4s ease";
          item.style.transform = `translateY(${itemHeight}px)`;
        }
      });

      topListItem.style.transition = "transform 0.4s ease";
      topListItem.style.transform = `translateY(${itemHeight}px)`;

      // === 애니메이션 후 DOM 재배치 및 상태 정리 ===
      setTimeout(() => {
        sortableList.insertBefore(topListItem, sortableList.firstChild);
        topList.appendChild(clickedItem);

        const updatedListItems = Array.from(sortableList.children);

        requestAnimationFrame(() => {
          clickedItem.style.transition = "none";
          clickedItem.style.transform = "translateY(0px)";
        });

        updatedListItems.forEach((item) => {
          item.style.transition = "";
          item.style.transform = "";
        });

        const newIcon = topRightBox.querySelector(".icon-star-off");
        if (newIcon) {
          newIcon.addEventListener("click", (event) =>
            handleStarOffClick(event, dragList)
          );
        }

        const updatedSortableCount =
          sortableList.querySelectorAll(".list-item").length;
        if (updatedSortableCount === 0) {
          const handleButtons = dragList.querySelectorAll(".handle");
          handleButtons.forEach((btn) => btn.remove());
        }
      }, 400);
    }

    // 자동 충전 토글 스위치 클릭 이벤트
    $("#bio-toggle-switch").on("click", function () {
      if (!$(this).hasClass("active")) {
        // 활성화 시
        modalToastOpen("toast-auto-charge-active");
      }
    });

    $(".tab button").on("click", function () {
      var tab_index = $(this).index();
      $(this).closest(".tab").find("button").removeClass("active");
      $(this).addClass("active");
      $(".tab-contents > div").hide();
      $(".tab-contents > div").eq(tab_index).css("display", "flex");

      // 카드 이미지 가로 일 때 회전
      $(".drag-list.card .img-wrap img").each(function (i, e) {
        var $this = $(this);
        var imgWidth = $this.get(0).naturalWidth;
        var imgHeight = $this.get(0).naturalHeight;
        if (imgWidth > imgHeight) {
          $this.addClass("rotate");
        }
      });
    });
  </script>
</html>
