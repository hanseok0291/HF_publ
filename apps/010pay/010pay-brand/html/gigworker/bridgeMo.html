<body>

					<div class="flow-banner flow-bannerLeft">

						<ul class="list list-right">
							<li><img src="../../../resource/images/promotion/benefit/s-011.png" alt=""></li>
							<li><img src="../../../resource/images/promotion/benefit/s-011.png" alt=""></li>
						</ul>
					</div>
					<div class="btn-wrap bridge">
						<div class="container">

	<!-- modal -->
	<div id="modal-draw" class="modal modal-bridge">

				<div class="modal-body">
					<h3 class="modal-title">

					<div>
						<ul class="qr-list">
							<li>
								<img
									src="../../../resource/images/promotion/benefit/qr.png"
									alt="QR코드"

									<h3><img

										alt="QR코드"

									<span class="bar"></span>
									<h3><img
										src="../../../resource/images/promotion/benefit/bridge-title-app.png"

						</ul>
						<h4 class="modal-title-sub">

							src="../../../resource/images/promotion/benefit/bridge-title-05.png"

					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
$(window).on('load', function () {
    setFlowBanner();
})

function setFlowBanner(){
    const $wrap = $('.flow-banner');
    const $wrapLeft = $('.flow-bannerLeft');
    const $wrapRight = $('.flow-bannerRight');
    const $list = $('.flow-banner .list');
    const $listLeft = $('.flow-bannerLeft .list');
    const $listRight = $('.flow-bannerRight .list');
    let wrapWidth = $wrap.width();
    let listWidth = $list.width();
    const speed = 50; //1초에 몇픽셀 이동하는지 설정

    //리스트 복제
    let $cloneLeft = $listLeft.clone(),
    $cloneRight = $listRight.clone();
    $wrapLeft.append($cloneLeft);
    $wrapRight.append($cloneRight);
    flowBannerAct()

    //배너 실행 함수
    function flowBannerAct() {
        //무한 반복을 위해 리스트를 복제 후 배너에 추가
        if (listWidth < wrapWidth) {
            const listCount = Math.ceil(wrapWidth * 2 / listWidth);
            for (let i = 2; i < listCount; i++) {
                $cloneLeft = $cloneLeft.clone();
                $cloneRight = $cloneRight.clone();
                $wrapLeft.append($cloneLeft);
                $wrapRight.append($cloneRight);
            }
        }
        $wrapLeft.find('.list-left').css({ 'animation': `${listWidth / speed}s linear infinite flowRollingLeft` }); 
        $wrapRight.find('.list-right').css({ 'animation': `${listWidth / speed}s linear infinite flowRollingRight` }); 
    } 
}

		$(document).ready(function(){
			$('input:radio[name=selectProduct]').click(function(){
				$(this).parents('li').siblings().removeClass('on').addClass('cover');
				$(this).parents('li').addClass('on').removeClass('cover');
				if($(this).is(':checked')) {
					$('.btn-draw').attr('disabled', false);
				}
			});
			
			$(window).scroll(function(){
				var scrollT = $(this).scrollTop();
		
				// 스크롤 시 하단 버튼 토글
				if (scrollT > 10) {
					$(".footer-btn").css("margin-bottom", 0);
				} else {
					$(".footer-btn").css("margin-bottom", "-100%");
				}

				if($(window).scrollTop() + $(window).height() == $(document).height()) {
					$(".wrap-promotion .section .container").addClass('bg-on');
				} else {
					$(".wrap-promotion .section .container").removeClass('bg-on');
				}
		
				// 스크롤 최하단일 경우 하단 버튼 배경 제거
				var scrollMax = $("#content").innerHeight() - $(window).innerHeight() - 100;
				if (scrollT > scrollMax) {
					$(".footer-btn").addClass("bottom");
				} else {
					$(".footer-btn").removeClass("bottom");
				}
			});

			// 스크롤 시 애니메이션 활성화
			var winHeight = $(window).height();
			var scrollTop = $(window).scrollTop();
			
			function sectionActive(){
				// section active
				$(".section").each(function(){
					var sectionTop = $(this).offset().top;
					if (scrollTop > sectionTop - winHeight + winHeight/6) {
						$(this).addClass("active");
					}
				});
			}

			$(window).load(function(){
				setTimeout(function(){
					sectionActive();
				}, 100);
			});
			
			$(window).scroll(function(){
				sectionActive();
				scrollTop = $(window).scrollTop();
				if (scrollTop > 30) {
					$("body:not(.modal-open) .fixed-bottom").addClass("active");
				} else {
					$("body:not(.modal-open) .fixed-bottom").removeClass("active");
				}
			});

      // 바디 스크롤 제거/해제
      var scrollHeight = 0;
      function scrollOff() {
        scrollHeight = $(document).scrollTop();
        $("body").addClass("modal-open");
        $(".content_wrap").css("position", "fixed");
        $(".content_wrap").css("top", -scrollHeight);
      }
      function scrollOn() {
        $("body").removeClass("modal-open");
        $(".content_wrap").css("top", 0);
        $(".content_wrap").css("position", "relative");
        $(document).scrollTop(scrollHeight);
      }

			// 레이어 팝업(모달) 열기
      function modalOpen(obj) {
        var temp = $("#" + obj);
        temp.fadeIn(100).addClass("open");
        scrollOff(); // 바디 스크롤 제거

        // 슬라이드 모달 닫기
        function modalOut() {
          temp.fadeOut(300).removeClass("open");

          // 이중 모달이 아닌 경우
          if (!$(temp).hasClass("depth2")) {
            scrollOn(); // 바디 스크롤 제거 해제
          }
        }

        // 팝업 내 닫기 버튼 클릭 시 팝업 닫기
        $(temp)
          .find(".modal-close")
          .click(function () {
            modalOut();
          });
      }

      // 레이어 팝업(모달) 닫기
      function modalClose(obj) {
        if (obj != null && obj != undefined && obj != "") {
          var temp = $("#" + obj);
          temp.fadeOut(300).removeClass("open");
        } else {
          $(".modal").fadeOut(300).removeClass("open");
        }
        scrollOn(); // 바디 스크롤 제거 해제
      }

      // 화면 너비에 따라 열리는 방식 지정
      $(".btn-draw").click(function (e) {
          modalOpen("modal-draw");
      });

		});
		</script>
