<script>
$(window).on('load', function() {
	var is_action = false;

	//DOM 생성 후
	function rollerArea() {
		if (is_action === true) { return false; }
		is_action = true;
		var roller = document.querySelector('.roller');
		roller.id = 'roller1';

		var clone = roller.cloneNode(true);
		clone.id = 'roller2';
		document.querySelector('.rollingbanner .wrap').appendChild(clone);

		document.querySelector('#roller1').style.left = '0px';
		document.querySelector('#roller2').style.left = document.querySelector('.roller .roller_list').offsetWidth+'px';

		$('#roller1').addClass('original');
		$('#roller2').addClass('clone');
	}
	rollerArea();

	// 리사이즈
	$(window).resize(function(){
		rollerArea();
	});
});
