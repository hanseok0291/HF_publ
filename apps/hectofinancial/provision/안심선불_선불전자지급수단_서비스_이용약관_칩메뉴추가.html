<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>헥토파이낸셜 안심선불 선불전자지급수단 서비스 이용약관</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="../resources/css/n_sb_style.css"
    />
  </head>
  <style>
    .select-container {
      display: flex;
      align-items: center;
      width: 100%;
      min-width: 0;
      padding: 0 0 10px;
      overflow: hidden;
    }
    .round-box {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .round-box::-webkit-scrollbar {
      display: none;
    }
    .round-box-item {
      flex: 0 0 auto;
    }
    .round-box-item button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 18px;
      background: #f5f5f7;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: #1d1d1f;
      white-space: nowrap;
      cursor: pointer;
    }
    .round-box-item.active button {
      background: #ff6114;
      color: #fff;
    }
    /* 약관 패널 — active만 표시 */
    .terms-panel {
      display: none;
    }
    .terms-panel.active {
      display: block;
    }
  </style>

  <body>
    <div class="popup_terms iframe">
      <!-- select-container -->
      <div class="select-container">
        <ul class="round-box" role="list">
          <li class="round-box-item active">
            <button type="button" data-value="roundpay">라운드페이</button>
          </li>
          <li class="round-box-item">
            <button type="button" data-value="vroong">부릉</button>
          </li>
          <li class="round-box-item">
            <button type="button" data-value="ably">에이블리</button>
          </li>
        </ul>
      </div>
      <!-- //select-container -->

      <!-- terms-content : 개발에서 각 패널에 약관 연결 -->
      <div class="terms-content">
        <div
          id="terms-roundpay"
          class="terms-panel active"
          data-terms="roundpay"
        >
          <!-- 라운드페이 약관 영역 -->
          <div class="g_box mb30">
            라운드페이 약관 영역
          </div>
        </div>
        <div id="terms-vroong" class="terms-panel" data-terms="vroong">
          <!-- 부릉 약관 영역 -->
          <div class="g_box mb30">
            부릉 약관 영역
          </div>
        </div>
        <div id="terms-ably" class="terms-panel" data-terms="ably">
          <!-- 에이블리 약관 영역 -->
          <div class="g_box mb30">
            에이블리 약관 영역
          </div>
        </div>
      </div>
      <!-- //terms-content -->
    </div>
    <script>
      // 칩 클릭 시 active + 약관 패널 전환 (본문 연동은 개발)
      (function () {
        var roundBox = document.querySelector('.round-box');
        if (!roundBox) return;

        roundBox.addEventListener('click', function (e) {
          var button = e.target.closest('button');
          if (!button || !roundBox.contains(button)) return;

          var item = button.closest('.round-box-item');
          var value = button.getAttribute('data-value');
          if (!item || !value) return;

          // 칩 active
          var items = roundBox.querySelectorAll('.round-box-item');
          for (var i = 0; i < items.length; i++) {
            items[i].classList.remove('active');
          }
          item.classList.add('active');

          // 약관 패널 전환
          var panels = document.querySelectorAll('.terms-panel');
          for (var j = 0; j < panels.length; j++) {
            panels[j].classList.remove('active');
          }
          var target = document.getElementById('terms-' + value);
          if (target) target.classList.add('active');
        });
      })();
    </script>
  </body>
</html>
