<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p>비밀번호를<br> 입력해 주세요</p>
				</div>
				<!-- //headline -->

				<!-- 비밀번호 입력 -->
				<div class="section">
					<div class="input-mark">
						<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02"></i><i id="pwd_03"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
					</div>
					<span class="input input-help hidden" id="pwdSpan">
						<input type="password" name="pw" id="pw" maxlength="6" autofocus placeholder="숫자 6자리">
					</span>
				</div>
				<!-- //비밀번호 입력 -->

				<!-- link -->
				<div class="keypad-top-area">
					<button type="button" id="forgetPassword" class="btn btn-sm btn-outline-secondary">비밀번호를 잊어버리셨나요?</button>
				</div>
				<!-- //link -->
			</div>
			<!-- //container -->

			<!-- keypad sample -->
			<div class="nppfs-keypad-div">
				<div class="kpd-wrap kpd-image"><img src="../../images/sample/keypad-sample.png" alt="보안키패드 샘플"></div>
			</div>
			<!-- //keypad sample -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<div id="promptContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
// 보안 키패드 상단 링크 위치
function keypadOffset(){
	if($(document).innerHeight() > 550){
		if($(".kpd-wrap").length) {
			var keypadOffset = $(".kpd-wrap").offset().top;		// 키패드 상단 오프셋
			var topAreaH = $(".keypad-top-area").innerHeight(); // 키패드 상단 영역 padding-bottom 포함 높이
			var keypadOffsetT = keypadOffset - topAreaH;
			$(".keypad-top-area").css("top", keypadOffsetT);
		}
	} else {
		$(".keypad-top-area").css("top", 250);
	}
}

$(document).ready(function(){
	keypadOffset();

	$('#forgetPassword').click(function(){
		$.promptMessage("", "비밀번호 분실 및 5회 오류 시 이용이 제한됩니다.<br> 비밀번호 재설정은 본인인증 후 진행됩니다.<br> 진행하시겠습니까?", $('#commonPrompt'), $('#promptOk'), "$.resetPassword()");
	});
});

// 리사이즈
$(window).resize(function(){
	keypadOffset();
});
</script>

<!-- default script -->
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</body>
</html>
