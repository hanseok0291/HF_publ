<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <!-- [2026-06-23] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../css/common_renewal_v2.css" />
    <!-- //[2026-06-23] renewal-v2 stylesheet -->

    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">

        <div

          <div class="connect-account-empty-content">

      </div>

      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button
            type="button"
            class="btn"
            onclick="window.location.href='./registerAccount_step1.html'"

            계좌 연결하기
          </button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
    </div>

    <!-- //wrap -->
