<script>
$(document).ready(function() {
	//배너 슬라이드
	$(".banner_slide").owlCarousel({
		stageElement: 'ul',
		itemElement: 'li',
		items: 1,
		loop: true,
		smartSpeed: 500,
		autoplay: true,
		autoplayTimeout: 5000
	});
	
	//등록 은행 체크
	var btn = $('.bank_list button');
	btn.click(function(){
		if  ( $(this).children('.ico_upload').length == 0  ) {
			$('input[name="bnkCd"]').val($(this).prop('name'));
			//$.paySend();
		} else {
			$.alertMessage(errTitle.bankSelection, errMsg.dualSelection, $('#commonAlert'));
		}
	});

	$('#closeWindow').click(function() {
		if ( 'Y' == 'Y' )
			$.closeSetting();
		else
			$.closeOrder();
	});

	$('#prevPage').click(function() {
		$.prevPage();
	});
});
</script>
