<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-23] renewal-v2 적용 — 대기 머니 출금 -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">대기 머니 출금</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container charge-account-v2-scroll-fill">
          <div class="charge-container charge-account-v2 wait-withdrawal-v2">
            <div class="charge-account-v2-body wait-withdrawal-v2-body">
              <div class="wait-withdrawal-v2-main">
                <!-- 연결계좌 있을 경우 -->
                <!-- <button
                  type="button"
                  class="charge-account-select"
                  onclick="modalOpenSlide('modal-select-account')"
                >
                  <span class="charge-account-logo">
                    <img
                      src="../../../images/payment/bank/kakao-small.png"
                      alt=""
                    />
                  </span>
                  <span class="charge-account-text">
                    <strong>카카오뱅크 123 계좌</strong>로
                  </span>
                  <i class="icon-arrow-down size-16" aria-hidden="true"></i>
                </button> -->
                <!-- //연결계좌 있을 경우 -->
                <!-- 연결계좌 없을 경우 -->
                <button
                type="button"
                class="charge-account-select"
              >
                <span class="charge-account-logo">
                  <img
                    src="../../../images/common/icon-warning-red.svg"
                    alt=""
                  />
                </span>
                <span class="charge-account-text">
                  <strong>계좌를 연결해 주세요</strong>
                </span>
                <i class="icon-arrow-down size-16" aria-hidden="true"></i>
              </button>
              <!-- //연결계좌 없을 경우 -->

                <!-- 출금 금액 — 대기 머니 전액 고정 표시 (입력·키패드 없음) -->
                <p class="wait-withdrawal-amount">19,000원</p>
              </div>

              <!-- Notice -->
              <div class="wait-withdrawal-notice">
                <ul class="wait-withdrawal-notice-list">
                  <li>
                    현재 보유 중인 대기 머니 전액 출금만 가능합니다.
                  </li>
                  <li>
                    은행 점검 시간에는 출금이 제한될 수 있습니다.<br />
                    (평균 23시 50분 ~ 00시 10분)
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <!-- bottom area — Figma: 수수료 안내 → CTA -->
        <div class="bottom-area charge-account-v2-foot wait-withdrawal-v2-foot">
          <div class="container charge-foot-stack">
            <!-- 수수료 없을 경우 -->
            <p class="withdrawal-fee-notice">월 5회 수수료 0원</p>
            <!-- 수수료 있을 경우 -->
            <!-- <p class="withdrawal-fee-notice">수수료 500원이 발생해요</p> -->
            <!-- 출금 가능 -->
            <!-- <button type="button" class="btn btn-charge-submit btn-wait-withdraw-submit">
              출금하기
            </button> -->
            <!-- 출금 불가능 -->
            <button type="button" class="btn btn-charge-submit btn-wait-withdraw-submit" disabled>
              출금하기
            </button>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //[2026-06-23] renewal-v2 적용 -->
    <!-- //wrap -->

    <!-- 계좌 선택하기 팝업 -->
    <div id="modal-select-account" class="modal modal-slide type-select type-title">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head">
            <p class="modal-head-title">계좌 선택하기</p>
            <button type="button" class="btn-close js-modal-close">
              <i class="icon-close"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="container">
              <ul class="btn-list account-list">
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img
                        src="../../../images/bank/bank_new/logo-bank-toss.png"
                        alt=""
                      />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                    <p class="icon-star"></p>
                  </button>
                </li>
                <li class="option-item">
                  <button type="button" class="flex items-center js-modal-close">
                    <p class="img-bank">
                      <img
                        src="../../../images/bank/bank_new/logo-bank-hana.png"
                        alt=""
                      />
                    </p>
                    <p class="text-bank">
                      <span>국민</span>
                      <span>345</span>
                    </p>
                  </button>
                </li>
                <li class="btn-wrap">
                  <button type="button" class="btn btn-add">계좌 추가하기</button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- //계좌 선택하기 팝업 -->
  </body>
</html>
