<title>간편결제</title>
<script>
	$(document).ready(function(){
		var check = true;
		var retryCheck = true;
		var min = 3;
		var sec = 00;
		$("#limit_time").text(min + ":" + (sec < 10 ? "0" + sec : sec));
		var interval = -1;
		$(function(){
			var $timer = $("#limit_time");
			var after = new Date(Date.parse(new Date()) + ((1000 * 60 * min) + (sec * 1000) + 1000));
			interval = setInterval(function(){
				var nowTime = new Date();
				var nowTimeStr = timeString(nowTime);
				var afterTime = after
				var afterTimeStr = timeString(afterTime);
				if (afterTimeStr <= nowTimeStr){
					clearInterval(interval);
					$("#_method").val("againGoArsAuth");
					$("#arsAuthFailMsg").val(encodeURIComponent("입력시간 초과"));
					$("#frm").attr('action', '' + URL_PATH).submit();
				} else {
					var diff = new Date(afterTime - nowTime);
					var resultMin = diff.getMinutes();
					var resultSec = diff.getSeconds();
					resultSec = resultSec < 10 ? "0" + resultSec : resultSec;
					$("#limit_time").text(resultMin + ":" + resultSec);
				}
			}, 1000);

			function timeString(d){
				var year = d.getFullYear();
				var month = (d.getMonth() + 1);
				month = month < 10 ? "0" + month : month;
				var day = d.getDate();
				day = day < 10 ? "0" + day : day;
				var hour = d.getHours();
				hour = hour < 10 ? "0" + hour : hour;
				var min = d.getMinutes();
				min = min < 10 ? "0" + min : min;
				var sec = d.getSeconds();
				sec = sec < 10 ? "0" + sec : sec;
				return year + "" + month + "" + day + "" + hour + "" + min + "" + sec;
			}
		});
		$('.btn_xr.btn_type.on').click(function(e){
			$.ajax({
				type: "post",
				url: "/firm/FirmArsAction.do?_method=getResult",
				dataType: "json",
				async: false,
				data: {
					mid: 'bio1101t',
					trNo: 'SBank_FIRMbio1101tW220190730150749043195'
				},
				success: function(data){
					if (data.code == "00"){
						if ("false" == "true"){
							clearInterval(interval);
							alert(decodeURIComponent(""), function(){
								goRegAcct();
							});
						} else {
							goRegAcct();
						}
					} else if (data.code == "000"){
						alert("인증처리가 완료되지 않았습니다. 잠시 후 다시 시도해 주세요");
					} else {
						clearInterval(interval);
						$("#_method").val("againGoArsAuth");
						$("#arsAuthFailMsg").val(encodeURIComponent(data.msg));
						$("#frm").attr('action', '' + URL_PATH).submit();
					}
				},
				error: function(err){
					clearInterval(interval);
					$("#_method").val("againGoArsAuth");
					$("#arsAuthFailMsg").val(encodeURIComponent("정상적인 거래가 아닙니다. 처음부터 다시 해주세요."));
					$("#frm").attr('action', '' + URL_PATH).submit();
				}
			});
		});
		// 계좌등록
		var goRegAcct = function(){
			clearInterval(interval);
			if ("0" == '1'){
				$("#_method").val("regAcctNo");
				$("#frm").attr('action', '' + URL_PATH).submit();
			} else {
				$("#_method").val("transNoRegView");
				$("#frm").attr('action', '' + URL_PATH).unbind("submit").submit();
			}
		};
	});
</script>

<script>

		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');

		}

	}
