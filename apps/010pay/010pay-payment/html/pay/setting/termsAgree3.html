<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/setting.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="is-terms-page">
        <!-- container -->
        <div class="container setting-container">
          <!-- headline -->
          <div class="headline">
            <p>
              정기결제 서비스
            </p>
          </div>
          <!-- //headline -->
          <ul class="setting-list">
            <li>
              <div class="btn-text-box">
                <p class="setting-name">정기결제 서비스 약관</p>
              </div>
              <a href="#">
                <i class="icon-arrow-right medium"></i>
              </a>
            </li>
          </ul>
          <ul class="note-list">
            <li>
              동의 철회 시 본 서비스와 관련된 모든 정보가 삭제되며, <br>
              이는 복구할 수 없습니다. (단, 관계 법령에 따라 보존 필요가 있는경우는 해당 보존기간 동안 보관)
            </li>
            <li>
              아직 종료되지 않은 거래 등 동의 유지가 필수적인 상황인 경우,
              즉시 철회가 불가할 수 있습니다.
            </li>
          </ul>
          <div class="btn-wrap">
            <button type="button" class="cancel-btn">서비스 동의 철회하기</button>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- loading -->
    <div class="modal modal-loading">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="loading">
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
            <span class="loading-bar"></span>
          </div>
          <span class="sr-only">로딩 중</span>
        </div>
      </div>
    </div>
    <!-- //loading -->

    <!-- 서비스 철회 확인 -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle">정기결제 서비스 동의를 <br>철회할까요?</h3>
            <p id="promptContents">본 서비스와 관련된 모든 정보가 삭제되며, <br>복구가 어려워요.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              철회하기
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //서비스 철회 확인 -->

    <!-- 서비스 철회 확인 -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle">이용중인 정기결제가 있어요</h3>
            <p id="promptContents">
              신청한 서비스에서 해지 후 <br>
              다시 시도해 주세요.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalCloseAlert();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //서비스 철회 확인 -->
  </body>
</html>
