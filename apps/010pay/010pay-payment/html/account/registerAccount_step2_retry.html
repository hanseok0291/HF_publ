<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title">계좌 등록</h2>
                        <button type="button" class="btn-close js-change-btn" data-title="카드 등록을 안하면 결제 시 <br>포인트 적립 혜택을 받을 수 없어요!" data-message="이대로 취소할까요?" data-cancel="취소하기" data-confirm="계속하기">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!-- container -->
                <div class="container">
                    <!-- section -->
                    <div class="section">
                        <ul class="form-type type2 accordion-list">
                            <li>
                                <div class="checkbox-block-group">
                                    <span class="checkbox round">
                                        <input type="checkbox" name="checkbox_01" id="checkbox_01_01" />
                                        <label for="checkbox_01_01">새마을금고</label>
                                        <button
                                            type="button"
                                            class="change-btn js-change-btn"
                                            data-message="변경 시 계좌인증을 다시 진행해야해요.<br>그래도 변경할까요?"
                                            data-cancel="취소"
                                            data-confirm="확인"
                                        >
                                            변경
                                        </button>
                                    </span>
                                    <span class="checkbox-near">11022773450698</span>
                                </div>
                            </li>
                            <li>
                                <div class="checkbox-block-group">
                                    <span class="checkbox round">
                                        <input type="checkbox" name="checkbox_02" id="checkbox_02_01" />
                                        <label for="checkbox_02_01">약관 동의</label>
                                    </span>
                                </div>
                            </li>
                            <li>
                                <div class="checkbox-block-group">
                                    <span class="checkbox more">
                                        <input type="checkbox" name="checkbox_03" id="checkbox_03_01" />
                                        <label for="checkbox_03_01">자동이체 출금 동의</label>
                                    </span>
                                </div>

                                <div class="gray-box">
                                    <div class="toggle-box">
                                        <div class="toggle-buttons">
                                            <button class="toggle-button active" onclick="selectToggle('ars')">ARS 인증</button>
                                            <button class="toggle-button" onclick="selectToggle('pass')">PASS 인증</button>
                                        </div>

                                        <!-- ARS 인증 내용 -->
                                        <div class="ars-content toggle-content active">
                                            <p class="instruction">버튼을 누른 후, 인증번호를 입력해주세요.</p>
                                            <div class="verification-code">25</div>
                                            <button class="call-button js-call-button" onclick="window.location.href='./registerAccount_step3.html'">인증 전화 요청</button>
                                        </div>

                                        <!-- PASS 인증 내용 -->
                                        <div class="pass-content toggle-content">
                                            <p class="instruction">
                                                PASS앱을 통해<br />
                                                비밀번호 또는 지문, Face ID 등<br />
                                                생체 정보로 인증할 수 있습니다.
                                            </p>
                                            <button type="button" class=""></button>
                                            <button
                                                type="button"
                                                class="pass-button js-pass-button js-change-btn"
                                                data-message="정상적으로 처리되지 않았어요.<br>다시 시도해주세요!"
                                                data-cancel="확인"
                                                data-confirm="재인증하기"
                                            >
                                                PASS 인증 요청
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <!-- //section -->
                </div>
                <!-- //container -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- cancel prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //cancel prompt -->
    </body>
    <script>
        $(document).ready(function () {
            // 초기 상태: 첫 번째 li만 열림
            const $accordionItems = $(".accordion-list li"); // 모든 li 요소 선택
            let currentIndex = 0; // 현재 노출 중인 li의 인덱스

            function showNextItem() {
                if (currentIndex < $accordionItems.length) {
                    // 현재 항목을 fadeIn으로 부드럽게 나타냄
                    $accordionItems.eq(currentIndex).fadeIn(250, function () {
                        // fadeIn 후 active 클래스 추가
                        $(this).addClass("active");
                    });
                    currentIndex++; // 다음 인덱스로 이동
                    setTimeout(showNextItem, 250); // 1초 후에 다음 li를 보여줌
                }
            }

            // 초기 설정: 모든 li 숨김
            $accordionItems.hide();

            // 첫 번째 li부터 시작
            showNextItem();
        });

        // 토글버튼
        function selectToggle(type) {
            const arsButton = document.querySelector(".toggle-buttons .toggle-button:first-child");
            const passButton = document.querySelector(".toggle-buttons .toggle-button:last-child");

            const arsContent = document.querySelector(".ars-content");
            const passContent = document.querySelector(".pass-content");

            if (type === "ars") {
                arsButton.classList.add("active");
                passButton.classList.remove("active");
                arsContent.classList.add("active");
                passContent.classList.remove("active");
            } else {
                passButton.classList.add("active");
                arsButton.classList.remove("active");
                passContent.classList.add("active");
                arsContent.classList.remove("active");
            }
        }

        // 전화 인증 버튼
        document.querySelector(".js-call-button").addEventListener("click", function () {
            // 버튼의 텍스트를 변경
            this.innerHTML = '전화수신 중';

            // 버튼을 비활성화
            this.disabled = true;
        });

        // pass 인증 버튼
        const passButton = document.querySelector(".js-pass-button");
        passButton.addEventListener("click", function () {
            // 버튼의 텍스트를 변경
            this.innerHTML = "PASS 재인증";

            // 버튼을 비활성화
            this.disabled = true;

            // 3초 후 작업 실행
            setTimeout(() => {
                // 버튼 비활성화 해제
                this.disabled = false;
            }, 3000);
        });
    </script>
</html>
