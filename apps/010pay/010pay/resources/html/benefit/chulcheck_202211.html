<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>010PAY</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/owl.carousel.min.css" />
    <link rel="stylesheet" href="../../css/slick.min.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/jquery.ui.touch-punch.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/slick.min.js"></script>
    <script src="../../js/design.js" defer="defer"></script>
    <script src="../../js/commonmsg.js"></script>
    <script src="../../js/commonutil.js"></script>
  </head>

  <body>
    <!-- form -->
    <form class="main_form" action="javascript: void(0);" autocomplete="off">
      <!-- wrap -->
      <div id="wrap" class="wrap wrap-app no-header chulcheck chulcheck-november">
        <!-- content -->
        <div id="content">
          <!-- section - visual -->
          <div class="section section-visual">
            <div class="container">
              <h2 class="title">
                <span class="text-sm">제법 쌀쌀해진 11월</span>
                포인트 모아
								<br />
								겨울맞이 쇼핑 어때요?
              </h2>
              <p class="date">30</p>
              <p class="complete">출석 완료</p>
            </div>
          </div>
          <!-- //section - visual -->

          <!-- section - info -->
          <div class="section section-info">
            <div class="container">
              <h3 class="info-title">
                <i class="icon-info-circle">!</i> 안내 사항
              </h3>
              <ul class="ul-list">
                <li>계정당 하루 1회만 출석할 수 있습니다.</li>
                <li>
                  <strong>출석도장 찍기</strong> 버튼을 눌러야 출석이
                  인정됩니다.
                </li>
                <li>
                  본 미션은 일 단위로 갱신되며, 매일 00:00~23:59 출석할 수
                  있습니다.
                </li>
              </ul>
            </div>
          </div>
          <!-- //section - info -->

          <!-- bottom area - fixed bottom -->
          <div class="fixed-bottom">
            <!-- container -->
            <div class="container">
              <!-- <button type="button" id="send" class="btn">출석도장 찍기</button> -->
              <button type="button" id="send" class="btn" disabled>
                내일 또 만나요
              </button>
            </div>
            <!-- //container -->
          </div>
          <!-- //bottom area - fixed bottom -->
        </div>
        <!-- //content -->
      </div>
      <!-- //wrap -->
    </form>
    <!-- //form -->

    <!-- loading -->
    <div class="modal modal-loading">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <div class="loading">
              <div class="loading-bar"></div>
              <div class="loading-bar"></div>
              <div class="loading-bar"></div>
              <div class="loading-bar"></div>
            </div>
            <span class="text">로딩 중</span>
          </div>
        </div>
      </div>
    </div>
    <!-- //loading -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button type="button" id="promptOk" class="btn btn-confirm">
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->
  </body>
</html>
