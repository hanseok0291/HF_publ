<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>헥토파이낸셜</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/card.css" />
    <link rel="stylesheet" href="../../css/autoCharge.css" />
    <link rel="stylesheet" href="../../css/swiper-bundle.min.css" />
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/common.js" defer></script>
    <script src="../../js/aml.js" defer></script>
    <script src="../../js/design_renewal.js" defer></script>
    <script src="../../js/postcode.v2.js"></script>
    <script src="../../js/swiper.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="card step">
      <!-- header -->
      <header class="header">
        <div class="container">
          <button type="button" class="btn-back btn"></button>
          <h1 class="brand-name">계좌 등록</h1>
          <button type="button" class="btn-close btn"></button>
        </div>
      </header>
      <!-- //header -->

      <!-- section -->
      <section>
        <!-- container -->
        <div id="content" class="container">
          <!-- 단계 1: 은행 선택 -->
          <div class="step-content" id="step1">
            <div class="tit-wrap">
              <h2 class="tit">계좌 등록을 위해 은행을 선택해 주세요.</h2>
            </div>

            <div class="form-wrap">
              <div class="bank-select-grid">
                <div class="bank-item" data-bank="nh">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_001.png"
                      alt="NH농협"
                    />
                  </div>
                  <span class="bank-name">NH농협</span>
                </div>
                <div class="bank-item" data-bank="kakao">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_kakao.png"
                      alt="카카오뱅크"
                    />
                  </div>
                  <span class="bank-name">카카오뱅크</span>
                </div>
                <div class="bank-item" data-bank="kb">
                  <div class="bank-icon">
                    <img src="../../images/logo/bank/logo_004.png" alt="국민" />
                  </div>
                  <span class="bank-name">국민</span>
                </div>
                <div class="bank-item" data-bank="sh">
                  <div class="bank-icon">
                    <img src="../../images/logo/bank/logo_011.png" alt="신한" />
                  </div>
                  <span class="bank-name">신한</span>
                </div>
                <div class="bank-item" data-bank="woori">
                  <div class="bank-icon">
                    <img src="../../images/logo/bank/logo_020.png" alt="우리" />
                  </div>
                  <span class="bank-name">우리</span>
                </div>
                <div class="bank-item" data-bank="hana">
                  <div class="bank-icon">
                    <img src="../../images/logo/bank/logo_081.png" alt="하나" />
                  </div>
                  <span class="bank-name">하나</span>
                </div>
                <div class="bank-item" data-bank="ibk">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_027.png"
                      alt="IBK기업"
                    />
                  </div>
                  <span class="bank-name">IBK기업</span>
                </div>
                <div class="bank-item" data-bank="sc">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_023.png"
                      alt="SC제일"
                    />
                  </div>
                  <span class="bank-name">SC제일</span>
                </div>
                <div class="bank-item" data-bank="citi">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_003.png"
                      alt="한국씨티"
                    />
                  </div>
                  <span class="bank-name">한국씨티</span>
                </div>
                <div class="bank-item" data-bank="kdb">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_002.png"
                      alt="KDB산업"
                    />
                  </div>
                  <span class="bank-name">KDB산업</span>
                </div>
                <div class="bank-item" data-bank="suhyup">
                  <div class="bank-icon">
                    <img src="../../images/logo/bank/logo_007.png" alt="수협" />
                  </div>
                  <span class="bank-name">수협</span>
                </div>
                <div class="bank-item" data-bank="kbank">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_kbank.png"
                      alt="케이뱅크"
                    />
                  </div>
                  <span class="bank-name">케이뱅크</span>
                </div>
                <div class="bank-item" data-bank="toss">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_toss.png"
                      alt="토스뱅크"
                    />
                  </div>
                  <span class="bank-name">토스뱅크</span>
                </div>
                <div class="bank-item" data-bank="post">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_071.png"
                      alt="우체국"
                    />
                  </div>
                  <span class="bank-name">우체국</span>
                </div>
                <div class="bank-item" data-bank="mg">
                  <div class="bank-icon">
                    <img
                      src="../../images/logo/bank/logo_088.png"
                      alt="새마을금고"
                    />
                  </div>
                  <span class="bank-name">새마을금고</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 단계 2: 계좌 정보 입력 -->
          <div class="step-content" id="step2" style="display: none">
            <div class="tit-wrap">
              <h2 class="tit">
                계좌 정보를 입력 후<br />출금 동의를 진행해 주세요.
              </h2>
            </div>

            <div class="form-wrap">
              <div class="custom-input value">
                <p class="sub-tit">은행명</p>
                <div class="bank-info">
                  <p class="tit" id="selectedBank">NH농협은행</p>
                  <button
                    type="button"
                    class="btn-reselect"
                    onclick="goToStep(1)"
                  >
                    재선택
                  </button>
                </div>
              </div>

              <div class="custom-input mt-40">
                <label for="accountNumber" class="custom-label"
                  >계좌번호</label
                >
                <input
                  type="text"
                  id="accountNumber"
                  class=""
                  placeholder="계좌번호를 입력해주세요"
                  value="1234549871234"
                />
              </div>
            </div>
          </div>

          <!-- 단계 3: ARS 인증 -->
          <div class="step-content" id="step3" style="display: none">
            <div class="tit-wrap">
              <h2 class="tit">
                ARS에서 불러주는<br />
                <span class="tit-highlight">인증번호 2자리</span>를<br />
                휴대폰에 입력해주세요.
              </h2>
            </div>

            <div class="form-wrap">
              <div class="custom-input value">
                <p class="sub-tit">계좌정보</p>
                <p class="tit" id="accountInfo">NH농협은행 241244131242</p>
              </div>
            </div>
          </div>
        </div>
        <!-- //container -->

        <!-- footer -->
        <div id="footer">
          <div class="btn-wrap">
            <!-- 단계 1 버튼 (은행 선택 시 자동으로 단계 2로 이동하므로 숨김) -->
            <button
              type="button"
              id="btnStep1"
              class="btn btn-default"
              style="display: none"
            >
              다음
            </button>
            <!-- 단계 2 버튼 -->
            <button
              type="button"
              id="btnStep2"
              class="btn btn-default"
              style="display: none"
              onclick="goToStep(3)"
            >
              다음
            </button>
            <!-- 단계 3 버튼 -->
            <div id="btnStep3" style="display: none">
              <button
                type="button"
                id="btnArsRetry"
                class="btn btn-ars-retry"
              >
                ARS 인증 재요청
              </button>
              <button
                type="button"
                id="btnAuthComplete"
                class="btn btn-default"
                onclick="location.href='pin.html'"
              >
                인증 완료
              </button>
            </div>
          </div>
        </div>
        <!-- //footer -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->


    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="prompt-title"></h3>
            <p class="prompt-contents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              onclick="modalClose();"
              id="promptOk"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    

    <script>
      // 뒤로가기 버튼 클릭 이벤트
      $(document).on("click", ".btn-back", function () {
        // 초기화 플래그를 sessionStorage에 저장
        sessionStorage.setItem("resetAutoChargePage", "true");
        // index.html로 이동
        window.location.href = "index.html";
      });

      $(window).on("load", function () {
        formatPhoneNumber();
        
        // 초기 상태 설정: 단계 1 버튼 표시
        $("#btnStep1").show();
        $("#btnStep2").hide();
        $("#btnStep3").hide();
        
        // URL 파라미터에서 은행 정보와 단계 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const bankCode = urlParams.get("bank");
        const bankName = urlParams.get("bankName");
        const step = urlParams.get("step");
        
        // 은행 정보가 있으면 적용
        if (bankName) {
          // 은행명 업데이트 (디코딩)
          const decodedBankName = decodeURIComponent(bankName);
          $("#selectedBank").text(decodedBankName);
          
          // 단계 2로 이동
          if (step === "2") {
            goToStep(2);
          }
        }
      });

      // 단계 이동 함수
      function goToStep(step) {
        // 모든 단계 숨기기
        document.querySelectorAll(".step-content").forEach((el) => {
          el.style.display = "none";
        });
        // 모든 버튼 숨기기
        document.querySelectorAll("#footer .btn").forEach((el) => {
          el.style.display = "none";
        });
        document.querySelectorAll("#footer .btn-wrap > div").forEach((el) => {
          el.style.display = "none";
        });

        // 선택한 단계 표시
        document.getElementById("step" + step).style.display = "block";
        const btnStep = document.getElementById("btnStep" + step);
        if (btnStep) {
          // step3은 flex 컨테이너이므로 display: flex로 설정
          if (step === 3) {
            btnStep.style.display = "flex";
          } else {
            btnStep.style.display = "block";
          }
          // 내부 버튼 다시 표시 (step3은 div 내부에 버튼이 있으므로 모두 보이게 처리)
          btnStep.querySelectorAll(".btn").forEach((btn) => {
            btn.style.display = "block";
          });
        }

        // 단계 3일 때 푸터에 클래스 추가 (버튼 2개일 때 높이 220px)
        const footer = document.getElementById("footer");
        if (step === 3) {
          footer.classList.add("has-two-buttons");
        } else {
          footer.classList.remove("has-two-buttons");
        }

        // 단계 2로 이동 시 계좌 정보 업데이트
        if (step === 2) {
          // URL 파라미터에서 은행명 가져오기
          const urlParams = new URLSearchParams(window.location.search);
          const bankName = urlParams.get("bankName");
          
          if (bankName) {
            document.getElementById("selectedBank").textContent = decodeURIComponent(bankName);
          } else {
            // URL 파라미터가 없으면 그리드에서 선택된 은행 사용
            const selectedBankItem = document.querySelector(".bank-select-grid .bank-item.selected");
            if (selectedBankItem) {
              const bankName = selectedBankItem.querySelector(".bank-name").textContent.trim();
              document.getElementById("selectedBank").textContent = bankName;
            }
          }
        }

        // 단계 3로 이동 시 계좌 정보 업데이트 (하이픈 제거)
        if (step === 3) {
          const bank = document.getElementById("selectedBank").textContent;
          const account = document.getElementById("accountNumber").value;
          // 하이픈 제거
          const accountNoHyphen = account.replace(/-/g, "");
          document.getElementById("accountInfo").textContent =
            bank + " " + accountNoHyphen;
        }
      }

      // 은행 선택 (그리드 형태)
      $(".bank-select-grid .bank-item").on("click", function () {
        const $item = $(this);
        const bankCode = $item.data("bank");
        const bankName = $item.find(".bank-name").text().trim();

        // 선택된 은행 표시 (selected 클래스)
        $(".bank-select-grid .bank-item").removeClass("selected");
        $item.addClass("selected");

        // 단계 2로 이동
        goToStep(2);
        
        // 선택된 은행 정보 저장
        $("#selectedBank").text(bankName);
      });

      // 계좌번호 입력 시 다음 버튼 활성화
      $("#accountNumber").on("input", function () {
        if ($(this).val().length > 0) {
          $("#btnStep2").prop("disabled", false);
        } else {
          $("#btnStep2").prop("disabled", true);
        }
      });

      // ARS 인증 재요청 버튼
      $(document).on("click", "#btnArsRetry", function () {
        $.promptMessage(
          "",
          "ARS 인증을 다시 요청하시겠습니까?",
          $("#commonPrompt")
        );
      });
    </script>
  </body>
</html>
