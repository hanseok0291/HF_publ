<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/pay/transactionHistory.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">헥토 Family 카드</h2>
            <a href="#" class="btn-right-menu" onclick="modalToastOpen('toast-card-manage')">카드 관리</a>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container money-container transaction-history-container family-card">
          <div class="top-contents-wrap">
            <div class="top-contents-box">
              <div class="top-text-wrap">
                <p class="bank-text">총 이용 금액</p>
                <button type="button" class="money-amount">0원</button>
              </div>
              <div class="info-text-wrap">
                <dl>
                  <dt>머니</dt>
                  <dd>90,000원</dd>
                </dl>
                <dl>
                  <dt>포인트</dt>
                  <dd>10,000원</dd>
                </dl>
              </div>
            </div>
            <div class="auto-charge-wrap">
              <p class="auto-charge-text">머니 자동 충전을 설정해보세요</p>
              <button type="button" class="auto-charge-btn">자동 충전</button>
            </div>
          </div>

          <div class="month-wrap">
            <button
              type="button"
              class="prev-btn icon-arrow-left size-16 disabled"
            >
              이전
            </button>
            <button
              type="button"
              class="month-text"
              onclick="modalOpenSlide('modal-period')"
            >
              2025년 7월
            </button>
            <button type="button" class="next-btn icon-arrow-right size-16">
              다음
            </button>
          </div>

          <!-- <div class="empty-list">
            <p>거래 내역이 없어요!</p>
          </div> -->
          <div class="trade-list-wrap">
            <ul class="trade-list history">
              <li>
                <span class="date-text">11일</span>
                <div class="list-contents-box">
                  <div class="right-text-box">
                    <div class="top-text">
                      <p class="time-text">오후 11:56</p>
                      <p class="type">결제</p>
                    </div>
                    <div class="bottom-text-box">
                      <p class="detail-text">임직원 복지포인트 지급 임직원 복지포인트 지급 임직원 복지포인트 지급 임직원 복지포인트 지급 임직원 복지포인트 지급 임직원 복지포인트 지급</p>
                      <p class="amount">100,000원</p>
                    </div>
                  </div>
                </div>
              </li>
            </ul>
            <!-- 리스트 20개 이상 더보기 -->
            <!-- <div class="add-view-btn-wrap">
              <button type="button" class="add-view-btn">더보기</button>
            </div> -->
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- 카드 관리 토스트 모달 -->
    <div id="toast-card-manage" class="modal-toast is-btn">
      <p><b>카드 관리</b>를 위해 외부 링크로 이동할게요</p>
    </div>
    <!-- //카드 관리 토스트 모달 -->

    <!-- 기간 팝업 -->
    <div
      id="modal-period"
      class="modal modal-slide type-title modal-period not-dim-close"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-head round-btn">
            <button type="button" class="btn btn-close js-modal-close"></button>
          </div>
          <div class="modal-body">
            <div class="year-wrap">
              <button
                type="button"
                class="prev-btn icon-arrow-left size-20 disabled"
              >
                이전
              </button>
              <span class="year-text">2024년</span>
              <button type="button" class="next-btn icon-arrow-right size-20">
                다음
              </button>
            </div>
            <ul class="month-list-wrap">
              <li>
                <button type="button" class="active">1월</button>
              </li>
              <li>
                <button type="button">2월</button>
              </li>
              <li>
                <button type="button">3월</button>
              </li>
              <li>
                <button type="button" disabled>4월</button>
              </li>
              <li>
                <button type="button" disabled>5월</button>
              </li>
              <li>
                <button type="button" disabled>6월</button>
              </li>
              <li>
                <button type="button" disabled>7월</button>
              </li>
              <li>
                <button type="button" disabled>8월</button>
              </li>
              <li>
                <button type="button" disabled>9월</button>
              </li>
              <li>
                <button type="button" disabled>10월</button>
              </li>
              <li>
                <button type="button" disabled>11월</button>
              </li>
              <li>
                <button type="button" disabled>12월</button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- //기간 팝업 -->
  </body>
  <script>
    $(function () {
      $(window).on("scroll", function () {
        var scrollTop = $(window).scrollTop();
        var tradeTabOffset = $(".trade-tab-wrap").offset().top - 64;
        if (scrollTop >= tradeTabOffset) {
          $(".trade-tab-wrap").addClass("fixed");
        } else {
          $(".trade-tab-wrap").removeClass("fixed");
        }
      });

      $(".tab-list button").on("click", function () {
        $(this).closest(".tab-list").find("button").removeClass("active");
        $(this).addClass("active");
      });

      // phone-box 터치다운 이벤트 처리
      $(".list-contents-box.phone-box").on("touchstart mousedown", function () {
        $(this).addClass("touched");
      });

      $(".list-contents-box.phone-box").on(
        "touchend mouseup mouseleave",
        function () {
          $(this).removeClass("touched");
        }
      );
    });
  </script>
</html>
