  <script>
    $(function(){
      $(window).on("scroll", function(){
        var scrollTop = $(window).scrollTop();
        var tradeTabOffset = $(".trade-tab-wrap").offset().top - 64;
        if (scrollTop >= tradeTabOffset) {
          $(".trade-tab-wrap").addClass("fixed");
        } else {
          $(".trade-tab-wrap").removeClass("fixed");
        }
      });
    });
  </script>
