<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../ktmembership/css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../ktmembership/js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="version-v3 register-pw-v3">
		<!-- header-v3 (로고 중앙 · 뒤로 — v2와 동일하게 닫기 없음) -->
		<div id="header" class="header-v3">
			<div class="container">
				<div class="page-title">
					<h2 class="title">
						<img src="../../ktmembership/images/logo.svg" class="header-brand-v3__logo" width="73" height="24" alt="내통장결제"></h2>
				</div>
				<button type="button" id="closeWindow" class="btn-close btn-close-v3"><i class="icon icon-close-v3">창닫기</i></button>
			</div>
		</div>
		<!-- //header-v3 -->

		<!-- content -->
		<div id="content" class="kt-ui">
			<!-- container -->
			<div class="container">
				<!-- 페이지 타이틀·스텝 (헤더 → 본문 상단) -->
				<div class="page-head">
					<h2 class="page-head__title">비밀번호 입력</h2>
					<ul class="top-step">
						<li>1</li>
						<li>2</li>
						<li>3</li>
						<li class="active">4</li>
						<li>5</li>
					</ul>
				</div>
				<!-- //페이지 타이틀·스텝 -->

				<!-- 비밀번호 입력 + 재설정 -->
				<div class="version-v3-pw-stack">
					<div class="section">
						<div class="well pw-box">
							<p class="info-text">6자리를 입력해주세요</p>
							<div class="input-mark input-mark-v3"> 
								<span class="mark"><i id="pwd_01" class="on"></i><i id="pwd_02" class="on"></i><i id="pwd_03" class="on"></i><i id="pwd_04"></i><i id="pwd_05"></i><i id="pwd_06"></i></span>
							</div>
							<span class="input input-help hidden" id="pwdSpan">
								<input type="password" name="newPwd" id="newPwd" style="ime-mode:disabled;" npkencrypt="on" data-keypad-type="nusssm" data-keypad-theme="settle_keypad" data-keypad-next="__hide__" class="input-text" maxlength="6" size="24" autofocus placeholder="숫자 6자리">
							</span>
						</div>
					</div>
					<p class="pw-reset-v3-wrap">
						<a href="javascript:void(0);" class="pw-reset-v3">비밀번호를 잊어버리셨나요?</a>
					</p>
				</div>
				<!-- //비밀번호 입력 + 재설정 -->
			</div>
			<!-- //container -->

			<!-- keypad sample (NPPFS 영역 — v2와 동일, 이미지 샘플만 배치) -->
			<div class="nppfs-keypad-div">
				<div class="kpd-wrap kpd-image"><img src="../../ktmembership/images/sample/keypad-sample-new.png" alt="보안키패드 샘플"></div>
			</div>
			<!-- //keypad sample -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩 중</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-v3-alert">
	<div class="modal-dialog modal-v3-alert__dialog">
		<div class="modal-content modal-v3-alert__panel">
			<div class="modal-body modal-v3-alert__body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents" class="modal-v3-alert__message"></p>
			</div>
			<div class="modal-footer modal-v3-alert__footer">
				<button type="button" id="alertOk" onclick="modalClose();" class="btn modal-v3-alert__btn">철회하기</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt (v3 — 버튼 2개) -->
<div id="commonPrompt" class="modal modal-v3-alert modal-v3-alert--confirm">
	<div class="modal-dialog modal-v3-alert__dialog">
		<div class="modal-content modal-v3-alert__panel">
			<div class="modal-body modal-v3-alert__body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents" class="modal-v3-alert__message"></p>
			</div>
			<div class="modal-footer modal-v3-alert__footer">
				<button type="button" onclick="modalClose();" class="btn modal-v3-alert__btn modal-v3-alert__btn--cancel">취소</button>
				<button type="button" id="promptOk" class="btn modal-v3-alert__btn modal-v3-alert__btn--confirm">철회하기</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
	$(document).ready(function(){
		// 퍼블 확인용 — 1버튼: $.alertMessage('', '비밀번호 5회 오류로<br>재설정 후 이용이 가능합니다.', $('#commonAlert'));
		// 퍼블 확인용 — 2버튼 (연동 시 $.promptMessage + scrollOff)
		$.promptMessage('비밀번호 1회 오류', '5회 오류 시 이용이 제한됩니다.', $('#commonPrompt'), $('#promptOk'), 'modalClose();');
		scrollOff();
	});
</script>
</body>
</html>
