<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/challenge/main.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-close js-change-btn">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container challenge-container">
          <div class="section title-section">
            <p class="top-text">RROUND X 디지로카</p>
            <img src="../../images/challenge/title-text-img.png" alt="챌린지 리워드 파워적립" class="title-text">
            <p class="sub-text">
              1만원 이상 결제하고 챌린지 참여하면 <br>

            </p>
            <div class="img-wrap">
              <span class="img-1"></span>
              <span class="img-2"></span>
              <span class="img-3"></span>
              <span class="img-4"></span>
              <span class="img-5"></span>
              <span class="img-6"></span>
              <span class="img-7"></span>
            </div>
          </div>
          <div class="section info-section">
            <h3><span>5배</span>로 받을 수 있는 챌린지</h3>
            <div class="rolling-wrap">
              <div class="rolling-item rolling-item-1">
                <img src="../../images/challenge/rolling-img-1.png" alt="">
                <img src="../../images/challenge/rolling-img-1.png" alt="">
              </div>
              <div class="rolling-item rolling-item-2">
                <img src="../../images/challenge/rolling-img-2.png" alt="">
                <img src="../../images/challenge/rolling-img-2.png" alt="">
              </div>
            </div>
          </div>
          <div class="section step-section">

          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

  <script></script>
