<!DOCTYPE html>
<html lang="ko" class="wf-loading" style="font-size: 78.71%;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">




<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/site.css">
<script src="../js/jquery-1.8.3.min.js"></script>
<script src="../js/webfont.js"></script>
<script src="../js/design.js" defer="defer"></script>

<!--[if lt IE 9]>
<script src="/css/bandipay/js/html5shiv.js"></script>
<link rel="stylesheet" href="/css/bandipay/css/ie-down.css">
<![endif]-->

<title>간편결제</title>

</head>
<body>

<header id="header">
	
	  	
	  		 <h1>결제실패</h1>
	  		
	  		
	
</header>
<div id="ct">	
	<section class="ars_timer">
		
		  		
		  	<h2>등록 실패</h2>	
	 	
		<p class="txt">확인 후 재시도해 주세요.</p>
		<span class="circle"><i class="ico_com ico_folder"></i><i class="ico_com ico_del2"></i></span>
		<p class="timer2 fc_reg">실패사유 : 등록을 취소 하였습니다.</p>
		<ul class="btn_area2 v1">
			<li class="bt1"><button type="button" class="btn_xr btn_type2" id="cancel">취소</button></li>
			<li class="bt2"><button type="button" class="btn_xr btn_type on" id="submit">
		  		
		  	등록	
	 	 재시도</button></li>
		</ul>
		
	  		
	  	
		   <div class="btn_cm_btm"><button type="button" id="findPwd"><u>비밀번호찾기</u></button></div>
	  		
	  
	</section>
</div>
<!-- //content -->


<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>


</body></html>
