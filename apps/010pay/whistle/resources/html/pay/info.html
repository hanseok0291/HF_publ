<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
				<button type="button" id="closeWindow" class="btn-close btn-icon"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline text-center">
					<p class="step step2">Step 2/3</p>
					<p><strong>이체정보</strong>를<br> 확인해 주세요</p>
					<p class="mgt15"><span class="badge"><span class="text-light">받는 분에게 표시 :</span> 이명구지롱</span></p>
				</div>
				<!-- //headline -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- pay info -->
					<div class="section card section-pay">
						<div class="card-body">
							<ul class="list">
								<li class="account">
									<span class="dt">받는계좌</span>
									<span class="dd account-number">
										<span class="logo"><img src="../../images/bank/logo_090.png" alt="카카오뱅크"></span>
										<span class="name">카카오뱅크 123456789012345</span>
									</span>
								</li>
								<li class="price">
									<span class="dt">보낼금액</span>
									<span class="dd">44,000원</span>
								</li>
							</ul>
						</div>
					</div>
					<!-- //pay info -->

					<!-- button area -->
					<div class="btn-area type2">
						<button type="button" id="goBack" class="btn btn-back">이전</button>
						<button type="button" id="send" class="btn btn-submit">다음</button>
					</div>
					<!-- //button area -->
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<div id="promptContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<!-- default script -->
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</body>
</html>
