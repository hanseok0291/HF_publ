<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker condition">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <h2>진행 현황</h2>
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <div class="pdLR22">
            <div class="topContent">
              <em>🔔</em> 종합소득세 신청 단계가 변경되면 <b>PUSH로 알려드려요.</b>
            </div>
  
            <!-- 처리중 step2 관할 세무서 확인 step3 Class 추가 -->
            <div class="section1 step2">
              <div class="leftContent">
              </div>
              <div class="rightContent">
                <!-- 완료 시 complete class 추가 -->
                <div class="complete">
                  <span class="circle"></span>
                  <p class="titleText">신청 완료</p>
                  <p class="subText">
                    제휴 세무사 접수 대기 중이에요. <br>
                    평균 1~3일이 걸려요.
                  </p>
                </div>
                <!-- 활성화 시 active class 추가 -->
                <div class="active">
                  <span class="circle"></span>
                  <p class="titleText">처리중</p>
                  <p class="subText">
                    제휴 세무사가 검토 중이에요. <br>
                    평균 1일이 걸려요.
                  </p>
                </div>
                <div>
                  <span class="circle"></span>
                  <p class="titleText">관할 세무서 확인</p>
                  <p class="subText">
                    환급이 결정되면 환급액 입금까지 <br>
                    최소 2주~최대 3개월이 걸려요.
                  </p>
                </div>
              </div>
            </div>
          </div>

          <div class="footContent">
            <h4>고객문의</h4>
            <div class="infoWrap">
              <span>운영시간</span>
              <i class="divider"></i>
              <span>평일 09:00 ~ 18:00 (주말 · 공휴일 휴무)</span>
            </div>
            <div class="numberArea">
              <p>결제 · 서비스 이용문의</p>
                <div class="box pay">
                <i class="divider"></i>
                <span>1600-5220</span>
              </div>
            </div>
            <div class="numberArea">
              <p>종합소득세 신고 관련 문의</p>
              <div class="box taxby">
                <i class="divider"></i>
                <span>0000-0000</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- //content -->

      <div class="toastModal">
				<a href="#" class="container">
					<em>💸</em>
					<div class="textWrap">
						<h4><span class="mainColor">여행지원금 · 스타벅스 쿠폰</span> 응모 완료 !</h4>
						<p>이벤트 확인하기 <i class="icon-right-arrow"></i></p>
					</div>
				</a>
			</div>
    </div>
    <!-- //wrap -->
    
    <script>
    </script>
  </body>
</html>
