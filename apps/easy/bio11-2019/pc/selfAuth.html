<script>
	var agent = navigator.userAgent.toLocaleLowerCase();
	var scCheckFlag = true;
	var goNextPage = false;
	$(function(){
		$("#authType").val("sms");
		setInterval(function(){
			if (goNextPage){
				$("#_method").val("phoneAuthCheck");
				$("#frm").attr('action', '' + URL_PATH).submit();
			}
		}, 1000);
		$('input[type=tel]').keyup(function(e){
			var id = $(this).attr('id');
			var len = $(this).attr("maxLength");
			if (this.value != this.value.replace(/[^0-9]/g, '')){
				this.value = this.value.replace(/[^0-9]/g, '');
			} else {
				if (this.value.length > len){
					$(this).val(this.value.substring(0, len));
				} else if ($('#' + id).val().length == len){
					$(this).next('input').focus();
				}
			}
		});
		$('[data-type="number"]').keyup(function(){
			if (this.value != this.value.replace(/[^0-9]/g, '')){
				this.value = this.value.replace(/[^0-9]/g, '');
				return;
			}
		});
		$('[data-type="number1"]').keyup(function(){
			if (this.value != this.value.replace(/[^1-8]/g, '')){
				this.value = this.value.replace(/[^1-8]/g, '');
				return;
			}
		});
		$('[data-check="on"]').keyup(function(){
			reqBtnCheck();
		});
		$('[data-focus="on"]').keyup(function(){
			var group = $(this).attr("data-focus-group");
			var step = $(this).attr("data-focus-step");
			var length = $(this).attr("maxlength");
			if ($(this).val().length == length){
				$(this).parents().find('[data-focus-group="' + group + '"][data-focus-step="' + (Number(step) + 1) + '"]').focus();
			}
		});
		$("#refreshBtn").click(function(){
			refreshcatpcha1();
		});
		$("#speakerBtn").click(function(){
			var d = new Date();
			var agent = window.navigator.userAgent;
			var ie = agent.indexOf("MSIE");
			var ie8 = agent.indexOf("IE8");
			var trident = agent.indexOf("Trident");
			if (ie > 0){
				var ver = getIEVersion("MSIE");
				if (ver < 8){
					document.getElementById("ifmAudioCaptcha").src = 'https://testpay.settlebank.co.kr:443/audio.wav';
				} else if (ver == 8){
					setTimeout(function(){
						document.getElementById("audioSupport").innerHTML = "<object type=\"audio/x-wav\" data=\"https://testpay.settlebank.co.kr:443/audio.wav?var1=" + d.getTime() + "\" width=\"200\" height=\"40\">"
							+ "<param name=\"src\" value=\"https://testpay.settlebank.co.kr:443/audio.wav?var1=" + d.getTime() + "\"/>"
							+ "<param name=\"autoplay\" value=\"true\"/>"
							+ "<param name=\"autostart\" value=\"true\"/>"
							+ "<param name=\"controller\" value=\"false\"/>"
							+ "</object>"
					}, 200);
				} else if (ver > 8){
					setTimeout(function(){
						document.getElementById("audioSupport").innerHTML = "오디오 <BGSOUND src='https://testpay.settlebank.co.kr:443/audio.wav?var1=" + d.getTime() + "' loop='1'>";
					}, 200);
				}
			} else {
				if (trident > 0){
					setTimeout(function(){
						document.getElementById("audioSupport").innerHTML = "오디오 <BGSOUND src='https://testpay.settlebank.co.kr:443/audio.wav?var1=" + d.getTime() + "' loop='1'>";
					}, 200);
				} else {
					setTimeout(function(){
						document.getElementById("audioSupport").innerHTML = "오디오 <audio controls autoplay src='https://testpay.settlebank.co.kr:443/audio.wav?var1=" + d.getTime() + "'></audio>";
					}, 200);
				}
			}
		});

		function getIEVersion(ver){
			var rv = -1; // Return value assumes failure.
			var ua = navigator.userAgent;
			var re = null;
			if (ver == "MSIE"){
				re = new RegExp("MSIE ([0-9]{1,}[\.0-9]{0,})");
			} else {
				re = new RegExp(ver + "/([0-9]{1,}[\.0-9]{0,})");
			}
			if (re.exec(ua) != null){
				rv = parseFloat(RegExp.$1);
			}
			return rv;
		}

		function refreshcatpcha1(){
			$('#catpcha').html('<img src="/stickyCaptcha.png?rand=' + Math.random() + '" width="80%" style="height: 3.2rem;" class="temp"/>');
		}
		$(".ly_tel").click(function(){
			$("#mvno_txt").text($(this).text().replace("(", "").replace(")", ""));
			$("#mobileCo").val($(this).val());
			$("#mvnoYn").val("Y");
		});
		$("#sel_mvno").click(function(){
			if ($("#mvnoYn").val() != "Y"){
				$(".tel_select").find("button").each(function(){
					$(this).removeClass("selected");
				});
			}
			if ($("#mvnoYn").val() == "N"){
				$(".tel_select").find("button").each(function(){
					$(this).removeClass("selected");
				});
				$(".tel_select").find($('[name=' + $("#mobileCo").val() + ']')).addClass("selected");
			}
		});
		$(".tel_select").find("button").click(function(){
			$(".tel_select").find("button").each(function(){
				$(this).removeClass("selected");
			});
			$(this).addClass("selected");
			if ($(this).val()){
				$("#mvno_txt").text("알뜰폰");
				$("#mvnoYn").val("N");
				$("#mobileCo").val($(this).val());
			}
		});
		//인증번호 요청 클릭
		$("#auth_req").click(function(){
			//비활성화일때 버튼방지
			if ($(this).hasClass('off')) return false;
			if (scCheckFlag){
				//sms 인증
				//인증번호 체크
				if ($('#PUname').val() == null || '' == $('#PUname').val()){
					alert("이름을 입력해주세요.");
					return;
				}
				if ($('#PUname').val() == $('#PUname').attr("placeholder")){
					alert("이름을 입력해주세요.");
					return;
				}
				if ($('#PRrn').val() == null || $('#genderCheck').val() == null
					|| $('#PRrn').val() == '' || $('#genderCheck').val() == ''){
					alert("주민번호를 입력해주세요.");
					return;
				}
				if ($('#PRrn').val() == $('#PRrn').attr("placeholder")){
					alert("주민번호를 입력해주세요.");
					return;
				}
				if ($("#PRrn").val().length < 6){
					alert("주민번호 앞 6자리를 입력해주세요.");
					return;
				}
				if ($('#mobileCo').val() == ''){
					alert("통신사를 선택해 주세요.");
					return;
				}
				if ($('#phoneNo').val() == null || '' == $('#phoneNo').val()){
					alert("휴대폰번호를 입력해주세요.");
					return;
				}
				if ($('#phoneNo').val() == $('#phoneNo').attr("placeholder")){
					alert("휴대폰번호를 입력해주세요.");
					return;
				}
				if ($("#authType").val() == 'sms'){
					if ($("#answer").val() == ''){
						alert("보안숫자를 입력하세요.");
						return;
					}
					if ($('#answer').val() == $('#answer').attr("placeholder")){
						alert("보안숫자를 입력하세요.");
						return;
					}
					if ($('#answer').val() != null || '' != $('#answer').val()){
						$.ajax({
							type: "post",
							url: "/api/ApiMultiAction.do?_method=captchaCheck",
							dataType: "json",
							data: {
								answer: $('#answer').val()
							},
							success: function(data){
								if (data.code == "0000"){
									scCheckFlag = false;
									setTimeout(
										function(){
											authCheck();
										}, 300);
									return;
								} else if (data.code == "0031"){
									alert("보안숫자가 잘못 입력되었습니다.", function(){
										$("#answer").val("");
										refreshcatpcha1();
									});
									return false;
								} else if (data.code == "session"){
									$("#_method").val("goErrorPage");
									$("#frm").attr('action', '' + URL_PATH).submit();
								} else {
									alert(data.msg, function(){
										refreshcatpcha1();
										scCheckFlag = true;
									});
								}
							},
							error: function(e){
								alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
							}
						});
					}
				} else if ($("#authType").val() == 'app'){ //간편본인인증
					authCheckByApp();
				}
			}
		});

		function authCheck(){
			var temp = $("#genderCheck").val();
			$("#juminNo").val($("#PRrn").val() + temp);
			$.ajax({
				type: "post",
				url: "" + URL_PATH + "?_method=authCheck_rep",
				dataType: "json",
				data: {
					juminNo: $("#juminNo").val(),
					PUname: $("#PUname").val(),
					PAuthGb: "ARS",
					phoneNo: $("#phoneNo").val(),
					mobileCo: $("#mobileCo").val(),
					PTrNo: $("#PTrNo").val(),
					mvnoYn: $("#mvnoYn").val(),
					PRrn: $("#PRrn").val(),
					payGb: $("#payGb").val(),
					PCustId: $("#PCustId").val(),
					PMid: $("#PMid").val(),
					authType: $("#authType").val()
				},
				success: function(data){
					if (data.code == "0000"){
						$("#tid").val(data.msg);
						goNextPage = true;
						//확인완료체크하기
					} else if (data.code == "session"){
						$("#_method").val("goErrorPage");
						$("#frm").attr('action', '' + URL_PATH).submit();
					} else {
						//초기화
						if (data.msg == ""){
							data.msg = "인증실패입니다. 이름,생년월일,휴대폰번호,성별,통신사를 확인후 다시 시도 바랍니다.";
						}
						alert(data.msg, function(){
							scCheckFlag = true;
						});
						return;
					}
				},
				error: function(e){
					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.", function(){
						scCheckFlag = true;
						init("sms");
					});
					return;
				}
			});
		}

		function authCheckByApp(){
			var temp = $("#genderCheck").val();
			$("#juminNo").val($("#PRrn").val() + temp);
			$.ajax({
				type: "post",
				url: "" + URL_PATH + "?_method=authCheck",
				dataType: "json",
				data: {
					juminNo: $("#juminNo").val(),
					PUname: $("#PUname").val(),
					PAuthGb: "ARS",
					phoneNo: $("#phoneNo").val(),
					mobileCo: $("#mobileCo").val(),
					phoneAuthNo: $("#phoneNo").val(),
					PRrn: $("#PRrn").val(),
					PTrNo: $("#PTrNo").val(),
					mvnoYn: $("#mvnoYn").val(),
					payGb: $("#payGb").val(),
					PCustId: $("#PCustId").val(),
					PMid: $("#PMid").val(),
					authType: $("#authType").val()
				},
				success: function(data){
					if (data.code == "0000"){
						$("#tid").val(data.msg);
						$("#PTrNo").val();
						$("#_method").val("authCheckByAppView");
						$("#frm").attr('action', '' + URL_PATH).submit();
					} else if (data.code == "session"){

						$("#_method").val("goErrorPage");
						$("#frm").attr('action', '' + URL_PATH).submit();
					} else {
						if (data.msg == ""){
							data.msg = "인증실패입니다. 이름,생년월일,휴대폰번호,성별,통신사를 확인후 다시 시도 바랍니다.";
						}
						alert(data.msg, function(){
							scCheckFlag = true;
						});
					}
				},
				error: function(e){
					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.", function(){
						scCheckFlag = true;
						init("app");
					});
					return;
				}
			});
		}
		//화면 초기 진입시 SKT 선택
		$("#SKT").click();
		//본인확인 APP 인증에서 진입
		var smsData = '01';
		if (smsData == "00"){
			$("#PUname").val('');
			$("#genderCheck").val('');
			$("#PRrn").val('');
			$("#phoneNo").val('');
			var mobileCo = '';
			$("#mobileCo").val(mobileCo);
			if (mobileCo.indexOf("2") != -1){
				$("#mvnoYn").val("Y");
				$("#mvno_txt").text($("#" + mobileCo).text().replace("(", "").replace(")", ""));
				$(".tel_select").find("button").each(function(){
					$(this).removeClass("selected");
				});
				$("#MVNO").addClass("selected");
				$(".ly_tel").each(function(){
					if ($(this).attr("id") == mobileCo){
						$(this).addClass("selected");
					}
				});
			} else {
				$("#mvnoYn").val("N");
				$("#" + mobileCo).click();
			}
		}
	});

	function doLayer(id){
		if ($("#mvnoYn").val() != "Y"){
			$("#" + id).find("button").each(function(){
				$(this).removeClass("selected");
			});
		}
		layer_open(id);
	}

	function agreeCancelConfirm(){
		confirm("인증을 취소하시겠습니까?", function(){
			$("#_method").val("payCancel");
			$("#frm").attr('action', '' + URL_PATH).submit();
		});
	}

	function doSmsAction(type){
		//nav 클릭 시 ie placeholder 문제
		/* if(agent.indexOf("msie") != -1){
		$('input').each(function(){
		$(this).focus();
		document.body.focus();
		});
		} */
		$("#authType").val(type);
		if (type == "app"){
			$(".capcha").hide();
			$(".btn_area2").addClass("v1");
			$("#SKT2").hide();
			//앱인증 시 SKT 알뜰폰 없음.
			if ($('#mobileCo').val() == "SKT2"){
				$('#SKT').click();
			}
		} else {
			$(".capcha").show();
			$(".btn_area2").removeClass("v1");
			$("#SKT2").show();
		}
		reqBtnCheck();
	}

	function reqBtnCheck(){
		var btnFlg = true;
		$('[data-check="on"]').each(function(e){
			var dataId = $("#" + $(this).attr('id')).val();
			if ($("#authType").val() == "app"){
				//보안숫자 제외
				if ($(this).attr('id') != "answer"){
					if (!dataId) btnFlg = false;
				}
			} else {
				if (!dataId) btnFlg = false;
			}
		});
		var $btn = $("#auth_req");
		if (btnFlg){
			$btn.removeClass("off");
			$btn.addClass("on");
			//$btn.attr('disabled', false);
		} else {
			$btn.removeClass("on");
			$btn.addClass("off");
			//$btn.attr('disabled', true);
		}
	}

	function init(type){
		if (type == "app"){
			$(".capcha").hide();
			$(".btn_area2").addClass("v1");
			$("#SKT2").hide();
		} else {
			$(".capcha").show();
			$(".btn_area2").removeClass("v1");
			$("#SKT2").show();
		}
		$("#juminNo").val("");
		$("#PUname").val("");
		$("#PRrn").val("");
		$("#genderCheck").val("");
		$("#mobileCo").val("");
		$('#phoneNo').val("");
		$('#answer').val("");
		$(".tel_select").find("button").each(function(){
			$(this).removeClass("selected");
		});
		$("#mvno_txt").text("알뜰폰");
		$("#mvnoYn").val("");
		//초기화 시 SKT 선택
		$("#SKT").click();
		reqBtnCheck();
	}
</script>

<script>
	$(document).ajaxStart(function(){
		openLoading();
	});

	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		layer_close();
	}
</script>
