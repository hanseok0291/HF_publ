<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="card-main">
	<!-- content -->
	<div id="content">
		<!-- logo -->
		<h1 class="brand-name"><img src="../../images/logo/010pay-wooricard-black.png" class="logo" alt="010PAY X 우리카드"></h1>
		<!-- //logo -->

		<!-- headline -->
		<div class="headline">
			<!-- conainer-->
			<div class="container">
				<p class="icon-area"><i class="icon status-1"></i></p>
				<p class="small">카드 신청이 완료되었어요.</p>
				<p>현재 <strong>발급 심사 중</strong>입니다.</p>
				<p class="xsmall">카드 배송이 시작되면 <img src="../../images/card/logo-kakao.png" class="logo" alt="카카오톡"> 알림톡으로 안내해 드려요.</p>
			</div>
			<!-- //conainer -->
		</div>
		<!-- //headline -->

		<!-- bottom area -->
		<div class="bottom-area fixed">
			<p class="fixed-btn"><button type="button" onclick="modalOpenSlide('modalCardInfo')" class="btn btn-nobg text-link"><span>카드 발송 문자를 받지 못하셨어요?</span> <i class="icon icon-card arrow-circle"></i></button></p>
			<p class="fixed-banner"><button type="button"><img src="../../images/banner/wooricard.png" class="banner" alt="체크카드 번호 맞추고 2,000만원 받아가자!"></button></p>
		</div>
		<!-- //bottom area -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- modal - 체크카드 발급 정보 안내 -->
<div id="modalCardInfo" class="modal modal-slide modal-info card-main no-footer">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
			</div>
			<div class="modal-body text-center">
				<h3>발급 정보 안내</h3>
				<button type="button" class="btn btn-close"><i class="icon-times">닫기</i></button>
				<ul class="well">
					<li><span class="dt">신청인</span>
						<span class="dd">김*틀</span></li>
					<li><span class="dt">연락처</span>
						<span class="dd">010-****-4567</span></li>
					<li><span class="dt">주소</span>
						<span class="dd">서울특별시 관악구 봉천동 541-213 봉천빌라 201호</span></li>
				</ul>
				<p class="mgt25">위의 발급 정보를 확인 후<br> 우리카드 고객센터로 문의하세요.</p>
				<p class="mgt15"><a href="tel:15889955" class="btn">고객센터 1588-9955</a></p>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 체크카드 발급 정보 안내 -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" id="promptCancel" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
