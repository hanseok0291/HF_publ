<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>본인확인 정보 입력</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />
        <!-- //favicon -->

        <link rel="stylesheet" href="../../css/point_damoa.css" />
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/commonutil.js"></script>
    </head>

    <body class="point-damoa-kyc-input-body">
        <!-- wrap -->
        <div id="wrap" class="wrap point-damoa point-damoa-kyc-input iframe">
            <div class="kyc-input-content">
                <div class="kyc-input-header">
                    <h2 class="kyc-input-title">본인확인을 위해 정확한 정보를 입력해주세요</h2>
                    <button type="button" class="btn-close-kyc-input" aria-label="닫기" onclick="window.parent.postMessage('closeKycInput', '*')"></button>
                </div>

                <div class="input-group">
                    <div class="input-row">
                        <!-- 이름 입력 -->
                        <div class="input-field name">
                            <label for="inputName" class="input-label">이름</label>
                            <div class="input-wrapper">
                                <input type="text" id="inputName" name="name" placeholder="" />
                            </div>
                        </div>

                        <!-- 주민등록번호 입력 -->
                        <div class="input-field rrn">
                            <label for="inputRrnFirst" class="input-label">주민등록번호</label>
                            <div class="rrn-input-group">
                                <div class="rrn-input-first">
                                    <input type="text" id="inputRrnFirst" name="rrnFirst" maxlength="6" placeholder="" />
                                    <div class="rrn-dash"></div>
                                    <input type="text" id="inputRrnLast" name="rrnLast" maxlength="1" />
                                </div>
                                <div class="rrn-dots" id="rrnDots">
                                    <span class="rrn-dot fill"></span>
                                    <span class="rrn-dot fill"></span>
                                    <span class="rrn-dot fill"></span>
                                    <span class="rrn-dot fill"></span>
                                    <span class="rrn-dot fill"></span>
                                    <span class="rrn-dot fill"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="input-row">
                        <!-- 통신사 선택 -->
                        <div class="input-field telecom">
                            <label for="selectTelecom" class="input-label">통신사</label>
                            <div class="select-wrapper" id="selectTelecomWrapper">
                                <span class="select-value placeholder" id="selectTelecomValue">선택</span>
                                <span class="select-arrow"></span>
                                <div class="telecom-modal" id="telecomModal">
                                    <ul class="telecom-list">
                                        <li class="telecom-item" data-value="SKT">SKT</li>
                                        <li class="telecom-item" data-value="KT">KT</li>
                                        <li class="telecom-item" data-value="LGU+">LG U+</li>
                                        <li class="telecom-item" data-value="SKT알뜰폰">SKT 알뜰폰</li>
                                        <li class="telecom-item" data-value="KT알뜰폰">KT 알뜰폰</li>
                                        <li class="telecom-item" data-value="LGU+알뜰폰">LG U+ 알뜰폰</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- 휴대폰번호 입력 -->
                        <div class="input-field phone">
                            <label for="inputPhone" class="input-label">휴대폰번호</label>
                            <div class="input-wrapper">
                                <input type="tel" id="inputPhone" name="phone" placeholder="'-'없이 입력해주세요." maxlength="11" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="kyc-input-footer">
                <button type="button" class="btn-auth-request" id="btnAuthRequest" disabled>인증요청</button>
            </div>
        </div>
        <!-- //wrap -->

        <script>
            $(document).ready(function () {
                // 입력 필드 참조
                const nameInput = document.getElementById("inputName");
                const rrnFirstInput = document.getElementById("inputRrnFirst");
                const rrnLastInput = document.getElementById("inputRrnLast");
                const phoneInput = document.getElementById("inputPhone");
                const selectTelecomWrapper = document.getElementById("selectTelecomWrapper");
                const selectTelecomValue = document.getElementById("selectTelecomValue");
                const telecomModal = document.getElementById("telecomModal");
                const btnAuthRequest = document.getElementById("btnAuthRequest");
                const rrnDots = document.querySelectorAll(".rrn-dot");

                let selectedTelecom = "";

                // 주민등록번호 뒷자리 입력 처리
                rrnFirstInput.addEventListener("input", function () {
                    const value = this.value.replace(/\D/g, "");
                    this.value = value;
                    if (value.length === 6) {
                        // 6자리 입력 완료 시 뒷자리 입력 필드로 포커스 이동
                        rrnLastInput.style.position = "absolute";
                        rrnLastInput.style.opacity = "1";
                        rrnLastInput.style.pointerEvents = "auto";
                        rrnLastInput.focus();
                    }
                    updateRrnDots();
                    checkAllFields();
                });

                // 주민등록번호 뒷자리 입력 처리
                rrnLastInput.addEventListener("input", function () {
                    const value = this.value.replace(/\D/g, "");
                    this.value = value;
                    if (value.length === 1) {
                        // 1자리 입력 완료 시 다음 필드로 포커스 이동
                        this.blur();
                    }
                    updateRrnDots();
                    checkAllFields();
                });

                // 주민등록번호 점 업데이트 (항상 fill 상태 유지)
                function updateRrnDots() {
                    // 항상 모든 dot에 fill 클래스 유지
                    rrnDots.forEach(function (dot) {
                        dot.classList.add("fill");
                    });
                }

                // 통신사 선택
                selectTelecomWrapper.addEventListener("click", function (e) {
                    e.stopPropagation();
                    telecomModal.classList.toggle("active");
                    selectTelecomWrapper.classList.toggle("active");
                });

                // 통신사 항목 클릭
                document.querySelectorAll(".telecom-item").forEach(function (item) {
                    item.addEventListener("click", function (e) {
                        e.stopPropagation(); // 이벤트 전파 중지
                        selectedTelecom = this.getAttribute("data-value");
                        selectTelecomValue.textContent = selectedTelecom;
                        selectTelecomValue.classList.remove("placeholder");
                        telecomModal.classList.remove("active");
                        selectTelecomWrapper.classList.remove("active");
                        checkAllFields();
                    });
                });

                // 모달 외부 클릭 시 닫기
                document.addEventListener("click", function (e) {
                    // selectTelecomWrapper나 telecomModal 내부 클릭이 아닌 경우에만 닫기
                    if (!selectTelecomWrapper.contains(e.target) && !telecomModal.contains(e.target)) {
                        telecomModal.classList.remove("active");
                        selectTelecomWrapper.classList.remove("active");
                    }
                });

                // 모든 필드 입력 확인
                function checkAllFields() {
                    const name = nameInput.value.trim();
                    const rrnFirst = rrnFirstInput.value.trim();
                    const rrnLast = rrnLastInput.value.trim();
                    const phone = phoneInput.value.replace(/\D/g, "");

                    const allFilled = name.length > 0 && rrnFirst.length === 6 && rrnLast.length === 1 && selectedTelecom.length > 0 && phone.length >= 10;

                    btnAuthRequest.disabled = !allFilled;
                }

                // 각 입력 필드 이벤트 리스너
                nameInput.addEventListener("input", checkAllFields);
                phoneInput.addEventListener("input", function () {
                    // 숫자만 입력 허용
                    this.value = this.value.replace(/\D/g, "");
                    checkAllFields();
                });

                // 인증요청 버튼 클릭
                btnAuthRequest.addEventListener("click", function () {
                    if (!this.disabled) {
                        // 부모 창에 인증요청 메시지 전송
                        window.parent.postMessage(
                            {
                                type: "kycAuthRequest",
                                data: {
                                    name: nameInput.value.trim(),
                                    rrnFirst: rrnFirstInput.value.trim(),
                                    rrnLast: rrnLastInput.value.trim(),
                                    telecom: selectedTelecom,
                                    phone: phoneInput.value.replace(/\D/g, ""),
                                },
                            },
                            "*"
                        );
                    }
                });

                // 초기 상태 설정
                checkAllFields();
            });
        </script>
    </body>
</html>
