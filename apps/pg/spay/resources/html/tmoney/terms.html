<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- favicon -->
<link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png">

<link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png">
<link rel="manifest" href="../../images/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/slick.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">티머니 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">드시모네 키즈 세트 afghjlmoprqyz 12345678901234567890</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">298,000</em>원</strong> 결제합니다.</p>
					<p class="prd-period">별도 제공기간 없음</p>
				</div>
				<!-- //주문정보 -->

				<!-- 약관 동의 -->
				<div class="section card">
					<div class="card-body agree-terms">
						<h3>약관 및 이용 동의</h3>
						<ul class="terms-list mgt10">
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree_01" id="agree_01_01">
									<label for="agree_01_01">전자금융거래 이용약관</label>
								</span>
								<button type="button" class="btn btn-icon" data-toggle="modal" data-target="#termsDetail">보기 <i class="icon-angle-right-sm gray"></i></button>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree_01" id="agree_01_02">
									<label for="agree_01_02">개인정보 수집·이용</label>
								</span>
								<button type="button" class="btn btn-icon" data-toggle="modal" data-target="#termsDetail">보기 <i class="icon-angle-right-sm gray"></i></button>
							</li>
							<li>
								<span class="checkbox child">
									<input type="checkbox" name="agree_01" id="agree_01_03">
									<label for="agree_01_03">개인정보 제3자 제공 및 위탁 안내</label>
								</span>
								<button type="button" class="btn btn-icon" data-toggle="modal" data-target="#termsDetail">보기 <i class="icon-angle-right-sm gray"></i></button>
							</li>
						</ul>
					</div>
					<div class="card-footer">
						<p><strong class="text-primary">결제 서비스 이용약관에 동의하고 결제를 진행합니다.</strong></p>
					</div>
				</div>
				<!-- //약관 동의 -->

				<!-- 광고 배너 -->
				<div class="banner floating">
					<div class="container">
						<button type="button" class="btn-image" data-toggle="modal" data-target="#bannerDetail"><img src="../../images/banner/floating/desimone2.png" alt="드시모네"></button>
						<button type="button" class="btn btn-icon btn-close" data-dismiss="banner"><i class="icon-times-sm gray"></i> 닫기</button>
					</div>
				</div>
				<!-- //광고 배너 -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary">전체 동의</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 약관 상세 -->
<div id="termsDetail" class="modal modal-full modal-terms" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- nav -->
					<div class="nav owl-carousel">
						<div class="item">
							<h3>전자금융거래 이용약관</h3>
							<select class="select-sm">
								<option value="">2018.11.01</option>
							</select>
						</div>
						<div class="item">
							<h3>개인정보 수집·이용</h3>
						</div>
						<div class="item">
							<h3>개인정보 제3자 제공 및 위탁 안내</h3>
						</div>
					</div>
					<!-- //terms nav -->

					<!-- terms detail -->
					<div class="terms scroll">
						약관 내용
					</div>
					<!-- //terms detail -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 약관 상세 -->

<!-- modal - 공지사항 상세 -->
<div id="noticeDetail" class="modal modal-full" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- 게시판 상세 -->
					<div class="board-detail">
						<h3 class="subject">공지 제목 들어갈 곳</h3>
						<div class="content">
							공지 내용 들어갈 곳
						</div>
					</div>
					<!-- //게시판 상세 -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 공지사항 상세 -->

<!-- modal - 광고 배너 상세 -->
<div id="bannerDetail" class="modal modal-banner" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<button type="button" class="btn btn-icon btn-close" data-dismiss="modal"><i class="icon-times-lg white"></i> 닫기</button>
					<div class="img-area"><img src="../../images/banner/floating/desimone-detail.png" alt="드시모네"></div>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 광고 배너 상세 -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->
</body>
</html>
