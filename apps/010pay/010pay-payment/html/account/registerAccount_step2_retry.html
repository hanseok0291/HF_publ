<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <!-- [2026-06-17] renewal-v2 stylesheet -->
        <link rel="stylesheet" href="../../css/common_renewal_v2.css" />
        <!-- //[2026-06-17] renewal-v2 stylesheet -->
        <link rel="stylesheet" href="../../css/account/registerAccount.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <!-- [2026-06-17] renewal-v2 적용 — ARS 재시도 -->
        <div id="wrap" class="renewal-v2">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title">계좌 등록</h2>
                        <button type="button" class="btn-close js-change-btn" data-title="카드 등록을 안하면 결제 시 <br>포인트 적립 혜택을 받을 수 없어요!" data-message="이대로 취소할까요?" data-cancel="취소하기" data-confirm="계속하기">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content" class="content-foot-fixed">
                <!-- container -->
                <div class="container content-scroll">
                    <!-- section -->
                    <div class="section">
                        <ul class="form-type type2 accordion-list register-account-step2 register-account-step2--static">
                            <!-- 1. 계좌 입력 (완료) -->
                            <li class="accordion-step step-account is-done">
                                <div class="step-panel step-panel--done">
                                    <div class="step-row step-row--done">
                                        <span class="step-icon step-icon--done" aria-hidden="true"></span>
                                        <div class="step-text">
                                            <p class="step-title">새마을금고</p>
                                            <p class="step-desc">11022773450698</p>
                                        </div>
                                        <button
                                            type="button"
                                            class="change-btn js-change-btn"
                                            data-message="변경 시 계좌인증을 다시 진행해야해요.<br>그래도 변경할까요?"
                                            data-cancel="취소"
                                            data-confirm="확인"
                                        >
                                            변경
                                        </button>
                                    </div>
                                </div>
                            </li>
                            <!-- //1. 계좌 입력 -->
                            <!-- 2. 약관 동의 (완료) -->
                            <li class="accordion-step step-terms is-done">
                                <div class="step-panel step-panel--done">
                                    <div class="step-row step-row--done">
                                        <span class="step-icon step-icon--done" aria-hidden="true"></span>
                                        <p class="step-title">약관 동의</p>
                                    </div>
                                </div>
                            </li>
                            <!-- //2. 약관 동의 -->
                            <!-- 3. 자동이체 출금 동의 -->
                            <li class="accordion-step step-auto-debit is-slid-in">
                                <div class="step-row step-row--auto-debit">
                                    <span class="step-icon step-icon--count3" aria-hidden="true"></span>
                                    <p class="step-title">자동이체 출금 동의</p>
                                </div>

                                <div class="gray-box ars-box button-one">
                                    <!-- ARS 인증 -->
                                    <div class="ars-content toggle-content active">
                                        <p class="ars-title">ARS 인증</p>
                                        <div class="ars-text-group">
                                            <p class="instruction">ARS 인증 전화 요청 후<br />아래 숫자 2자리를 입력해 주세요</p>
                                            <div class="verification-code">25</div>
                                        </div>
                                        <button type="button" class="call-button js-call-button">ARS 인증 전화 요청</button>
                                    </div>
                                    <!-- //ARS 인증 -->
                                </div>
                                <!-- 짧은 화면용 안내 — step-auto-debit 하단 -->
                                <p class="bottom-guide-text bottom-guide-text--inline">
                                    인증이 완료되면 문자가 발송돼요.<br />
                                    계좌 등록 안내 문자이며, 자동 출금은 되지 않아요.
                                </p>
                            </li>
                            <!-- //3. 자동이체 출금 동의 -->
                        </ul>
                    </div>
                    <!-- //section -->
                </div>
                <!-- //container -->

                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- 긴 화면용 안내 — fixed 버튼 영역 -->
                    <p class="bottom-guide-text bottom-guide-text--fixed">
                        인증이 완료되면 문자가 발송돼요.<br />
                        계좌 등록 안내 문자이며, 자동 출금은 되지 않아요.
                    </p>
                    <!-- container -->
                    <div class="container">
                        <button type="button" class="btn js-auth-complete-btn" disabled onclick="window.location.href='./registerAccount_step3.html'">인증 완료</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //[2026-06-17] renewal-v2 적용 -->
        <!-- //wrap -->

        <!-- cancel prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //cancel prompt -->

        <script>
        document.querySelector(".js-call-button").addEventListener("click", function () {
            this.textContent = "전화 수신 중";
            this.disabled = true;
            document.querySelector(".js-auth-complete-btn").disabled = false;
        });
        </script>
    </body>
</html>
