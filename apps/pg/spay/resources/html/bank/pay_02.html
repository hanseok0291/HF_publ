<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- favicon -->
<link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png">
<link rel="manifest" href="../../images/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
<!-- //favicon -->

<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/slick.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content" class="giftcard-pay">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">계좌이체 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">드시모네 키즈 세트 afghjlmoprqyz 12345678901234567890</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">298,000</em>원</strong> 결제합니다.</p>
					<p class="prd-period">별도 제공기간 없음</p>
				</div>
				<!-- //주문정보 -->

				<!-- 현금영수증 발행 -->
				<div class="section">
					<ul class="form-type">
						<li>
							<div class="checkbox square">
								<input type="checkbox" name="rcptYn" id="rcptYn" checked>
								<label for="rcptYn">현금영수증 발행</label>
							</div>
						</li>
						<li>
							<div class="check-group">
								<input type="radio" name="rcptRegGb" id="rcptRegGb_01" checked>
								<label for="rcptRegGb_01">소득공제용</label>
								<input type="radio" name="rcptRegGb" id="rcptRegGb_02">
								<label for="rcptRegGb_02">지출증빙용</label>
							</div>
						</li>
						<li>
							<div class="input select-input">
								<select name="rcptIdGb_01" id="rcptIdGb_01" class="select">
									<option value="">휴대폰번호</option>
									<option value="">카드번호</option>
								</select>
								<select name="rcptIdGb_02" id="rcptIdGb_02" class="select hidden">
									<option value="">사업자등록번호</option>
									<option value="">카드번호</option>
								</select>
								<input type="tel" name="PSocId" id="PSocId" maxlength="16" placeholder="'-' 없이 입력">
							</div>
							<div class="text-error">현금영수증 발행 번호를 입력해 주세요.</div>
						</li>
					</ul>
				</div>
				<!-- //현금영수증 발행 -->

				<!-- 결제 정보 메일 -->
				<div class="section">
					<div class="form-type">
						<div class="checkbox square">
							<input type="checkbox" name="emailSend" id="emailSend">
							<label for="emailSend">결제 정보 메일 수신 (선택)</label>
						</div>
						<input type="text" name="email" id="email" placeholder="이메일 입력">
						<div class="text-error">이메일을 입력해 주세요.</div>
					</div>
				</div>
				<!-- //결제 정보 메일 -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary" disabled>결제하기</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 공지사항 상세 -->
<div id="noticeDetail" class="modal modal-full" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- 게시판 상세 -->
					<div class="board-detail">
						<h3 class="subject">공지사항 제목</h3>
						<div class="content">
							공지사항 내용
						</div>
					</div>
					<!-- //게시판 상세 -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 공지사항 상세 -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<!-- loading - 결제 중 -->
<div class="loading hidden"><span class="text">결제 진행 중입니다.</span></div>
<!-- //loading - 결제 중 -->

<script>
	$(document).ready(function(){
		// 현금영수증 소득증빙용/지출증빙용 선택 시 하위 select 노출/미노출
		$("[name='rcptRegGb']").click(function(){
			if($("#rcptRegGb_01").is(":checked")){
				$("#rcptIdGb_01").removeClass("hidden");
				$("#rcptIdGb_02").addClass("hidden");
			} else {
				$("#rcptIdGb_01").addClass("hidden");
				$("#rcptIdGb_02").removeClass("hidden");
			}
		});
	});
</script>
</body>
</html>
