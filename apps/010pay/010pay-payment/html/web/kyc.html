<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <link rel="stylesheet" href="../../css/web/kyc.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <div class="modal" style="display: block">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
            <h3 class="modal-title">고객확인제도 재이행 대상이에요</h3>
            <h3 class="modal-title">이용 가능 한도가 늘어났어요</h3>
            <div class="highlight-text">
              <p class="execute-title">재이행 기간: YYYY-MM-DD까지</p>
              <div class="execute-wrap">
                [특정금융정보법] 시행령 재 10조6에 따라<br />고객확인 재이행
                기간이 도래하여<br class="view-mo" />정보 재등록이 필요해요.<br />기한
                내 고객확인을 이행하지 않을 경우 관련 법에<br />따라 서비스
                이용이 제한됩니다.
              </div>
              <!-- <div class="execute-wrap">
                라운드 페이에서는 자금 세탁 등으로부터 계좌를 <br />보호하기
                위해 고객님의 정보와 <br />실제 계좌 소유 여부를
                확인하고 있습니다.
              </div> -->
              <!-- <div class="execute-wrap">
                고객 정보를 업데이트하면 머니 이용 한도가 <br />
                200만원으로 늘어나요. <br />
                지금 바로 정보를 재입력해 주세요.
              </div> -->
            </div>
            <div class="qr-box">
              <img
                src="../../images/web/kyc/qr-img.png"
                alt="QR"
                class="qr-img"
              />
              <img
                src="../../images/web/kyc/icon-rrpay-logo.svg"
                alt="RROUND PAY"
                class="rrpay-logo"
              />
            </div>
          </div>
          <div class="modal-footer vertical">
            <button type="button" class="btn">고객확인 완료</button> 
            <!-- <button type="button" class="btn">고객확인 진행</button> -->
            <!-- <button type="button" class="btn">재입력하기</button> -->
            <button type="button" class="btn btn-cancel">다음에</button>
            <!-- <button type="button" class="btn btn-cancel">다른 결제수단 선택</button> -->
            <button type="button" class="btn btn-noShow">
              7일 동안 안보기
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    $(document).ready(function () {});
  </script>
</html>
