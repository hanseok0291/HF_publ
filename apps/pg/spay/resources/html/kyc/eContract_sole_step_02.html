<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>헥토파이낸셜 지불서비스</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="../../images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="57x57" href="../../images/favicon/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="../../images/favicon/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="../../images/favicon/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="../../images/favicon/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-icon-180x180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon/android-icon-192x192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png" />
        <link rel="manifest" href="../../images/favicon/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />
        <!-- //favicon -->

        <link rel="stylesheet" href="../../css/slick.min.css" />
        <link rel="stylesheet" href="../../css/kyc.css" />
        <script src="../../js/jquery-1.8.3.min.js"></script>
        <script src="../../js/slick.min.js"></script>
        <script src="../../js/kyc.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap" class="wrap kyc sole">
            <header>
                <div class="container">
                    <div class="titleWrap">
                        <h1 class="logo"></h1>
                        <span class="text">가맹점 서비스 계약</span>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="container">
                    <h2 class="title textLeft">서비스 신청서</h2>

                    <div class="stepWrap">
                        <div class="step step-end" data-step="1">
                            <div class="step-number">1</div>
                        </div>
                        <div class="step line step-active" data-step="2">
                            <div class="step-number">2</div>
                        </div>
                        <div class="step line" data-step="3">
                            <div class="step-number">3</div>
                        </div>
                        <div class="step" data-step="4">
                            <div class="step-number">4</div>
                        </div>
                    </div>

                    <div class="guideWrap">
                        <p class="title">상점 아이디 신청 및 기타 정보</p>
                        <ul class="guideList">
                            <li>후취 이용 시, ‘CMS 출금이체 신청서’를 제출하세요.</li>
                            <li>본 서비스 신청서 기재 내용의 변동 없이 MID(상점 아이디)만 추가 신청하는 경우, 담당자 E-mail을 통해 접수 가능합니다.</li>
                        </ul>
                    </div>

                    <div class="formWrap">
                        <!--  -->
                        <div class="formContainer">
                            <div>
                                <!-- MID(상점아이디) -->
                                <div class="formGroup">
                                    <label for="shopId">MID(상점아이디)</label>
                                    <input type="text" id="shopId" name="shopId" placeholder="" />
                                    <span class="subBottomTitle">8자리 이내 영문/숫자(특수문자 불가), 일부 서비스 자동</span>
                                    <!-- 여기서 subBottomTitle은 formGroup 안에 위치 -->
                                </div>

                                <!-- 서비스 URL -->
                                <div class="formGroup">
                                    <label for="serviceUrl">서비스 URL</label>
                                    <input type="text" id="serviceUrl" name="serviceUrl" placeholder="" />
                                    <span class="subBottomTitle">서비스 URL이 없는 경우 없음으로 입력</span>
                                    <!-- 여기서 subBottomTitle은 formGroup 안에 위치 -->
                                </div>

                                <!-- 로그인 계정 -->
                                <div class="formGroup">
                                    <label for="loginId">로그인 계정</label>
                                    <input type="text" id="loginId" name="loginId" placeholder="" />
                                    <span class="subBottomTitle">관리자 페이지 로그인 시 이용할 아이디 기재. (대표 아이디 1개만 발급하며, 추가 발급은 대표 아이디로 로그인 후 직접 생성)</span>
                                    <!-- 여기서 subBottomTitle은 formGroup 안에 위치 -->
                                </div>

                                <!-- 테스트 계정 -->
                                <div class="formGroup">
                                    <label for="testId">테스트계정 ID</label>
                                    <input type="text" id="testId" name="testId" placeholder="직접 입력" />
                                </div>

                                <!-- 테스트 계정 -->
                                <div class="formGroup">
                                    <label for="testPw">테스트계정 PW</label>
                                    <input type="text" id="testPw" name="testPw" placeholder="직접 입력" />
                                </div>

                                <!-- 주요 판매 목적 -->
                                <div class="formGroup">
                                    <label for="keySale">주요 판매 목적</label>
                                    <input type="text" id="keySale" name="keySale" placeholder="직접 입력" />
                                </div>

                                <!-- 정산 계좌 정보 -->
                                <div class="formGroup">
                                    <label for="billingAccount">정산 계좌 정보</label>
                                    <input type="text" id="billingAccount" name="billingAccount" placeholder="은행명" />
                                </div>
                                <div class="formGroup">
                                    <label for="billingAccount2"></label>
                                    <input type="text" id="billingAccount2" name="billingAccount" placeholder="계좌번호" />
                                </div>
                                <div class="formGroup">
                                    <label for="billingAccount3"></label>
                                    <input type="text" id="billingAccount3" name="billingAccount" placeholder="예금주명" />
                                </div>
                            </div>
                        </div>
                        <!--  -->
                    </div>

                    <div class="btnWrap">
                        <button type="button" class="btn btnPrev">이전</button>
                        <button type="button" class="btn btnNext" disabled>다음</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //wrap -->
        <script>
            // 모든 input 입력시 버튼 활성화
            document.addEventListener("DOMContentLoaded", function () {
                const btnNext = document.querySelector(".btnNext");
                const formInputs = document.querySelectorAll(".formContainer input");

                // 모든 input 요소의 값이 채워져 있는지 확인하는 함수
                function checkInputs(inputs) {
                    const totalInputs = inputs.length;
                    const filledInputs = Array.from(inputs).filter((input) => input.value.trim() !== "").length;

                    // 콘솔 출력: 총 input 개수와 채워진 input 개수
                    console.log(`Total inputs: ${totalInputs}, Filled inputs: ${filledInputs}`);

                    return filledInputs === totalInputs;
                }

                // .formContainer 내의 모든 input 값을 확인하여 버튼 상태를 업데이트하는 함수
                function updateButtonState() {
                    if (checkInputs(formInputs)) {
                        btnNext.disabled = false;
                        btnNext.classList.remove("btnOff");
                    } else {
                        btnNext.disabled = true;
                        btnNext.classList.add("btnOff");
                    }
                }

                // 각 input 요소에 input 이벤트를 추가하여 값이 변경될 때마다 버튼 상태 업데이트
                formInputs.forEach((input) => input.addEventListener("input", updateButtonState));

                // 페이지가 처음 로드될 때 버튼 상태 초기화
                updateButtonState();
            });
        </script>
    </body>
</html>
