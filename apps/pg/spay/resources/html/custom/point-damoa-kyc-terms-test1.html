<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>약관 동의 iframe 테스트</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                margin: 0;
                padding: 20px;
                font-family: "Pretendard", "Malgun Gothic", sans-serif;
                background: #f5f5f5;
            }
            .test-container {
                max-width: 800px;
                margin: 0 auto;
                background: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            .test-title {
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 20px;
                color: #303030;
            }
            .test-info {
                background: #f0f0f0;
                padding: 15px;
                border-radius: 4px;
                margin-bottom: 20px;
                font-size: 14px;
                color: #666;
            }
            .iframe-wrapper {
                border: 2px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
                margin-bottom: 20px;
            }
            .iframe-wrapper iframe {
                display: block;
                border: none;
            }
            .iframe-wrapper.iframe-size-pc iframe {
                width: 692px;
                height: 300px;
            }
            .iframe-wrapper.iframe-size-mobile iframe {
                width: 375px;
                height: 667px;
            }
            .test-buttons {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }
            .test-btn {
                padding: 12px 24px;
                background: #303030;
                color: #fff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
            }
            .test-btn:hover {
                background: #474747;
            }
            .test-btn.secondary {
                background: #6c757d;
            }
            .test-btn.secondary:hover {
                background: #5a6268;
            }
            .message-log {
                margin-top: 20px;
                padding: 15px;
                background: #f9f9f9;
                border-radius: 4px;
                max-height: 200px;
                overflow-y: auto;
                font-size: 12px;
                font-family: monospace;
            }
            .message-log h3 {
                margin: 0 0 10px 0;
                font-size: 14px;
                color: #303030;
            }
            .message-item {
                padding: 5px 0;
                border-bottom: 1px solid #e0e0e0;
            }
            .message-item:last-child {
                border-bottom: none;
            }
        </style>
    </head>

    <body>
        <div class="test-container">
            <h1 class="test-title">포인트다모아 KYC iframe 테스트</h1>
            
            <div class="test-info">
                <strong>테스트 정보:</strong><br />
                • PC: 692px × 300px / 모바일: 가로 375px · iframe 세로 100vh<br />
                • 새창으로 열기 버튼을 클릭하면 별도 창에서 iframe을 확인할 수 있습니다.<br />
                • iframe에서 발생하는 메시지가 하단에 표시됩니다.
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: 600; margin-right: 10px;">페이지 선택:</label>
                <select id="pageSelect" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                    <option value="point-damoa-kyc-terms1.html?ver=2603255">약관 동의</option>
                    <option value="point-damoa-kyc-terms1.html?ver=2603255" data-mobile="1">약관 동의 (모바일)</option>
                    <option value="point-damoa-kyc-terms-simple1.html?ver=2603255">약관 동의 (간단)</option>
                    <option value="point-damoa-kyc-terms-simple1.html?ver=2603255" data-mobile="1">약관 동의 (간단) (모바일)</option>
                    <option value="point-damoa-kyc-input1.html?ver=2603255">인증정보 입력</option>
                    <option value="point-damoa-kyc-input1.html?ver=2603255" data-mobile="1">인증정보 입력 (모바일)</option>
                    <option value="point-damoa-kyc-verify1.html?ver=2603255">인증번호 입력</option>
                    <option value="point-damoa-kyc-verify1.html?ver=2603255" data-mobile="1">인증번호 입력 (모바일)</option>
                    <option value="point-damoa-kyc-point-input1.html?ver=2603255">포인트 입력</option>
                    <option value="point-damoa-kyc-point-input1.html?ver=2603255" data-mobile="1">포인트 입력 (모바일)</option>
                </select>
            </div>

            <!-- <div class="iframe-wrapper">
                <iframe id="kycIframe" src="point-damoa-kyc-terms.html" title="헥토파이낸셜 이용약관"></iframe>
            </div> -->

            <div class="test-buttons">
                <button type="button" class="test-btn" onclick="openInNewWindow()">새창으로 열기</button>
                <!-- <button type="button" class="test-btn secondary" onclick="reloadIframe()">iframe 새로고침</button>
                <button type="button" class="test-btn secondary" onclick="clearLog()">로그 지우기</button> -->
            </div>

            <!-- <div class="message-log">
                <h3>메시지 로그</h3>
                <div id="messageLog"></div>
            </div> -->
        </div>

        <script>
            // 페이지 선택 변경 이벤트
            document.getElementById("pageSelect").addEventListener("change", function () {
                const iframe = document.getElementById("kycIframe");
                iframe.src = this.value;
            });

            // iframe에서 오는 메시지 수신
            window.addEventListener("message", function (event) {
                // 보안을 위해 origin 체크 (실제 사용 시 적절한 origin으로 변경)
                // if (event.origin !== "http://localhost:8080") return;

                const logDiv = document.getElementById("messageLog");
                const messageItem = document.createElement("div");
                messageItem.className = "message-item";
                messageItem.innerHTML = `
                    <strong>[${new Date().toLocaleTimeString()}]</strong><br />
                    Type: ${event.data.type || event.data}<br />
                    Data: ${JSON.stringify(event.data, null, 2)}
                `;

                // 특정 메시지 처리
                if (event.data && event.data.type) {
                    switch (event.data.type) {
                        case "closeKycTerms":
                            alert("약관 창 닫기 요청");
                            break;
                        case "closeKycTermsSimple":
                            alert("약관 동의 (간단) 창 닫기 요청");
                            break;
                        case "closeKycInput":
                            alert("인증정보 입력 창 닫기 요청");
                            break;
                        case "closeKycVerify":
                            alert("인증번호 입력 창 닫기 요청");
                            break;
                        case "closeKycPointInput":
                            alert("포인트 입력 창 닫기 요청");
                            break;
                        case "backKycPointInput":
                            alert("포인트 입력 창 뒤로가기 요청");
                            break;
                        case "openTermDetail":
                            alert(`약관 상세보기: ${event.data.termId}`);
                            break;
                        case "kycTermsAgreed":
                            alert("약관 동의 완료!\n" + JSON.stringify(event.data.terms, null, 2));
                            break;
                        case "kycTermsAgree":
                            alert("약관 동의 완료!\n" + JSON.stringify(event.data.data, null, 2));
                            break;
                        case "kycAuthRequest":
                            alert("인증요청 완료!\n" + JSON.stringify(event.data.data, null, 2));
                            break;
                        case "kycResendCode":
                            alert("인증번호 재발송 요청");
                            break;
                        case "kycVerifyCode":
                            alert("인증번호 확인 완료!\n" + JSON.stringify(event.data.data, null, 2));
                            break;
                        case "kycSelectCard":
                            alert("카드 선택: " + event.data.data.cardId);
                            break;
                        case "kycFullUsage":
                            alert("전액 사용하기: " + (event.data.data.enabled ? "활성화" : "비활성화"));
                            break;
                        case "kycFoldPointInput":
                            alert("포인트 입력창 접기 요청");
                            break;
                        case "kycConvertPoints":
                            alert("포인트 전환 완료!\n" + JSON.stringify(event.data.data, null, 2));
                            break;
                    }
                } else if (typeof event.data === "string") {
                    // 문자열 메시지 처리
                    if (event.data === "closeKycTerms" || event.data === "closeKycTermsSimple" || event.data === "closeKycInput" || event.data === "closeKycVerify" || event.data === "closeKycPointInput") {
                        alert("창 닫기 요청");
                    }
                }
            });

            // 새창으로 열기 (모바일: 가로 375px·iframe 세로 100vh / PC: 692×300)
            function openInNewWindow() {
                const pageSelect = document.getElementById("pageSelect");
                const selectedOption = pageSelect.options[pageSelect.selectedIndex];
                const selectedPage = pageSelect.value;
                const isMobile = selectedOption.getAttribute("data-mobile") === "1";
                const iframeWidth = isMobile ? 375 : 692;
                const iframeHeight = isMobile ? 667 : 300; /* PC만 px. 모바일 iframe 높이는 CSS 100vh */
                const popupHeight = isMobile
                    ? (typeof screen !== "undefined" && screen.availHeight ? screen.availHeight : 800)
                    : iframeHeight;
                const iframeHeightCss = isMobile
                    ? "100vh;\n                                    height: 100dvh;"
                    : iframeHeight + "px;";
                const iframeContainerCss = isMobile
                    ? "overflow: hidden;\n                                    background: #fff;\n                                    width: 100%;\n                                    min-height: 100vh;\n                                    display: flex;\n                                    justify-content: center;"
                    : "overflow: hidden;\n                                    background: #fff;";

                let pageTitle = "헥토파이낸셜 이용약관";
                if (selectedPage.indexOf("point-damoa-kyc-terms-simple") !== -1) {
                    pageTitle = "포인트다모아 약관동의";
                } else if (selectedPage.indexOf("point-damoa-kyc-input") !== -1) {
                    pageTitle = "본인확인 정보 입력";
                } else if (selectedPage.indexOf("point-damoa-kyc-verify") !== -1) {
                    pageTitle = "인증번호 입력";
                } else if (selectedPage.indexOf("point-damoa-kyc-point-input") !== -1) {
                    pageTitle = "포인트 입력";
                }
                if (isMobile) pageTitle += " (모바일)";

                // 현재 페이지의 경로를 기준으로 절대 경로 생성
                const currentPath = window.location.pathname;
                const currentDir = currentPath.substring(0, currentPath.lastIndexOf("/") + 1);
                const absolutePath = window.location.origin + currentDir + selectedPage;

                const newWindow = window.open("", "kycIframe", "width=" + iframeWidth + ",height=" + popupHeight + ",scrollbars=yes,resizable=yes");
                if (newWindow) {
                    newWindow.document.write(`
                        <!DOCTYPE html>
                        <html lang="ko">
                        <head>
                            <title>${pageTitle}</title>
                            <meta charset="UTF-8" />
                            <meta name="viewport" content="width=${iframeWidth}, initial-scale=1" />
                            <style>
                                body {
                                    margin: 0;
                                    padding: 0;
                                    background: #fff;
                                    display: flex;
                                    justify-content: center;
                                    align-items: center;
                                    min-height: 100vh;
                                }
                                .iframe-container {
                                    ${iframeContainerCss}
                                }
                                iframe {
                                    display: block;
                                    width: ${iframeWidth}px;
                                    height: ${iframeHeightCss}
                                    border: none;
                                    overflow: hidden;
                                }
                            </style>
                        </head>
                        <body>
                            <div class="iframe-container">
                                <iframe src="${absolutePath}" title="${pageTitle}"></iframe>
                            </div>
                        </body>
                        </html>
                    `);
                    newWindow.document.close();
                } else {
                    alert("팝업이 차단되었습니다. 브라우저 설정에서 팝업을 허용해주세요.");
                }
            }

            // iframe 새로고침
            function reloadIframe() {
                const iframe = document.getElementById("kycIframe");
                iframe.src = iframe.src;
            }

            // 로그 지우기
            function clearLog() {
                document.getElementById("messageLog").innerHTML = "";
            }
        </script>
    </body>
</html>
