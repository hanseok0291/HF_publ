		$('[data-type="number"]').keyup(function(){

		$('[data-focus="on"]').keyup(function(){
			var group = $(this).attr("data-focus-group");
			var step = $(this).attr("data-focus-step");
			var length = $(this).attr("maxlength");
			if($(this).val().length ==length){
				$(this).parents().find('[data-focus-group="'+group+'"][data-focus-step="'+(Number(step)+1)+'"]').focus();
			}
		});

		function getCaptchaData(){
			$.ajax({
				type: "post",
				url: "/api/ApiMultiAction.do?_method=getCaptchaData",
				dataType : "json",
				success:function(data){
					if(data.code == "0000"){
						//이미지
						$('#catpcha').html('<img src="' + data.msg.captchaData.captchaImage +'" width="80%" style="height: 3.2rem;" /><br/>');
						//사운드
						snd = Sound(data.msg.captchaData.captchaAudio);
					}else if(data.code == "session"){
						$("#_method").val("goErrorPage");
						$("#frm").attr('action',''+URL_PATH).submit();
					}else{
						alert(data.msg);
					}
				},
				error:function(e){
					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
				}
			});
		}

		function refreshcatpcha1(){
			getCaptchaData();
		}

		});

				$(".tel_select").find($('[name='+$("#mobileCo").val()+']')).addClass("selected");
			}
		});

			});

			}

					alert("통신사를 선택해 주세요.");
					return;
				}
				if($('#phoneNo').val() == null || '' == $('#phoneNo').val()){
					alert("휴대폰번호를 입력해주세요.");
					return;
				}
				if($('#phoneNo').val() == $('#phoneNo').attr("placeholder")){
					alert("휴대폰번호를 입력해주세요.");
					return;
				}
				
				if ($("#authType").val() == 'sms'){
					if ($("#answer").val() == ''){
						alert("보안숫자를 입력하세요.");
						return;
					}
					if($('#answer').val() == $('#answer').attr("placeholder")){
						alert("보안숫자를 입력하세요.");
						return;
					}
					if($('#answer').val() != null || '' != $('#answer').val()){
						$.ajax({
							type: "post",
							url: "/api/ApiMultiAction.do?_method=captchaCheck",
							dataType : "json",
							data: {answer:$('#answer').val()},
							success:function(data){
								if(data.code == "0000"){
									scCheckFlag = false;
									setTimeout(
									function(){
									authCheck();
									}
									,300);
									return;
								}else if(data.code == "0031"){
								alert("보안숫자가 잘못 입력되었습니다.", function(){
									$("#answer").val("");
									refreshcatpcha1();
									});
									return false;
								}else if(data.code == "session"){
									$("#_method").val("goErrorPage");
									$("#frm").attr('action',''+URL_PATH).submit();
								}else{
									alert(data.msg, function(){
										refreshcatpcha1();
										scCheckFlag = true;
									});
								}
							},
							error:function(e){
								alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.");
							}
						});
					}
				}else if ($("#authType").val() == 'app'){ //간편본인인증
				authCheckByApp();
				}
			}
		});

		function authCheck(){
			var temp = $("#genderCheck").val();
			$("#juminNo").val($("#PRrn").val() + temp);
			$.ajax({
				type : "post",
				url : ""+URL_PATH+"?_method=authCheck_rep",
				dataType : "json",
				data : {
					juminNo : $("#juminNo").val(),
					PUname : $("#PUname").val(),
					PAuthGb : "ARS",
					phoneNo : $("#phoneNo").val(),
					mobileCo : $("#mobileCo").val(),
					PTrNo : $("#PTrNo").val(),
					mvnoYn : $("#mvnoYn").val(),
					PRrn : $("#PRrn").val(),
					payGb : $("#payGb").val(),
					PCustId : $("#PCustId").val(),
					PMid : $("#PMid").val(),
					authType : $("#authType").val()
				},
				success : function(data){
					if (data.code == "0000"){
						$("#tid").val(data.msg);
						goNextPage = true;
						//확인완료체크하기
					}else if(data.code == "session"){
						$("#_method").val("goErrorPage");
						$("#frm").attr('action',''+URL_PATH).submit();
					}else {
						//초기화
						if (data.msg == ""){
							data.msg = "인증실패입니다. 이름,생년월일,휴대폰번호,성별,통신사를 확인후 다시 시도 바랍니다.";
						}
						alert(data.msg, function(){
							scCheckFlag = true;
						});
						return;
					}
				},
				error : function(e){
					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.", function(){
						scCheckFlag = true;
						init("sms");
					});
					return;
				}
			});
		}

		function authCheckByApp(){
			var temp = $("#genderCheck").val();
			$("#juminNo").val($("#PRrn").val() + temp);

			$.ajax({
				type : "post",
				url : ""+URL_PATH+"?_method=authCheck",
				dataType : "json",
				data : {
					juminNo : $("#juminNo").val(),
					PUname : $("#PUname").val(),
					PAuthGb : "ARS",
					phoneNo : $("#phoneNo").val(),
					mobileCo : $("#mobileCo").val(),
					phoneAuthNo : $("#phoneNo").val(),
					PRrn : $("#PRrn").val(),
					PTrNo : $("#PTrNo").val(),
					mvnoYn : $("#mvnoYn").val(),
					payGb : $("#payGb").val(),
					PCustId : $("#PCustId").val(),
					PMid : $("#PMid").val(),
					authType : $("#authType").val()
				},
				success:function(data){
					if(data.code == "0000"){
						$("#tid").val(data.msg);
						$("#PTrNo").val();
						$("#_method").val("authCheckByAppView");
						$("#frm").attr('action',''+URL_PATH).submit();
					}else if(data.code == "session"){
						$("#_method").val("goErrorPage");
						$("#frm").attr('action',''+URL_PATH).submit();
					}else{
						if (data.msg == ""){
							data.msg = "인증실패입니다. 이름,생년월일,휴대폰번호,성별,통신사를 확인후 다시 시도 바랍니다.";

							scCheckFlag = true;
						});

					alert("서비스 오류가 발생되었습니다.\n다시 시도 하십시오.", function(){
						scCheckFlag = true;

					});
					return;

		$("#SKT").click();

				});

				$(".ly_tel").each(function(){
					if($(this).attr("id") == mobileCo){

					}
				});
			}else{

			}

	});

	function doLayer(id){
		if($("#mvnoYn").val() != "Y"){
			$("#"+id).find("button").each(function(){
				$(this).removeClass("selected");
			});
		}
		layer_open(id);
	}

	function agreeCancelConfirm(){
		confirm("인증을 취소하시겠습니까?", function(){
			$("#_method").val("payCancel");
			$("#frm").attr('action',''+URL_PATH).submit();
		});
	}

	function doSmsAction(type){
		$("#authType").val(type);
		if(type == "app"){
		$(".capcha").hide();
		$(".btn_area2").addClass("v1");
		$("#SKT2").hide();

		}
		}else{
		$(".capcha").show();
		$(".btn_area2").removeClass("v1");
		$("#SKT2").show();
		}
		reqBtnCheck();
	}

	function reqBtnCheck(){
		var btnFlg = true;
		$('[data-check="on"]').each(function(e){
			var dataId = $("#"+$(this).attr('id')).val();
			if($("#authType").val() == "app"){
				//보안숫자 제외
				if($(this).attr('id') != "answer"){
					if(!dataId) btnFlg = false;
				}
			}else{
				if(!dataId) btnFlg = false;
			}
		});
		
		var $btn = $("#auth_req");
		if(btnFlg){
			$btn.removeClass("off");
			$btn.addClass("on");
			$btn.attr('disabled', false);
		}else{
			$btn.removeClass("on");
			$btn.addClass("off");
			$btn.attr('disabled', true);
		}
	}

	function init(type){
		if(type == "app"){
			$(".capcha").hide();
			$(".btn_area2").addClass("v1");
			$("#SKT2").hide();
		}else{
			$(".capcha").show();
			$(".btn_area2").removeClass("v1");
			$("#SKT2").show();
		}
		$("#juminNo").val("");
		$("#PUname").val("");
		$("#PRrn").val("");
		$("#genderCheck").val("");
		$("#mobileCo").val("");
		$('#phoneNo').val("");
		$('#answer').val("");
		$(".tel_select").find("button").each(function(){
			$(this).removeClass("selected");
		});
		$("#mvno_txt").text("알뜰폰");
		$("#mvnoYn").val("");
		//초기화 시 SKT 선택
		$("#SKT").click();
		reqBtnCheck();
	}
</script>
</head>
