              그래도 이 창을 닫을까요?
            </p>

            <button type="button" onclick="modalClose();" class="btn btn-confirm">예</button>
            <button type="button" onclick="modalClose();" class="btn btn-confirm">아니요</button>
          </div>
        </div>
      </div>

    <script>
      modalOpenSlide("modalAgree")
      function modalClose(e){
        var temp = $(e).parents(".modal");
        $(temp).fadeOut(200);
        $(e).parents(".modal-content").animate({ bottom: -450 }, 200);
        $(".bank-list").scrollTop(0);
        
      };

      $(".modal-slide").click(function(e){
        if (!$(".modal-content").has(e.target).length) {
          $(".btn-view").css({"transform": "rotate(90deg)"});
        }
      });

      $(".btn-close").click(function(e){
        $(".btn-view").css({"transform": "rotate(90deg)"});
      });



      $(".bankInput").on("click", function(){
        $(".btn-view").css({"transform": "rotate(270deg)"});
        if($(".bankWrap").height() > 400){
          $(".modal-bank .modal-body").addClass("blur");
        }
      });

      $(".modal-bank .container").on("scroll", function(){
        var curScroll = $(this).scrollTop();
        var bottomScroll = $(".bankWrap").height() -$(this).height()
        if(curScroll >= bottomScroll) {
          $(this).closest(".modal-body").removeClass("blur");
        } else {
          $(this).closest(".modal-body").addClass("blur");
        }
      });

      // 은행 선택
      $(".modal-bank .bankWrap li").on("click", function(){
        var bankLogo = $(this).find(".bankLogo").attr("src");
        var bankName = $(this).find(".bankName").text();
        $(".modal-bank .bankWrap li").removeClass("on");
        $(this).addClass("on");
        $(".bankInput").addClass("active");
        $(".bankInput .inputArea").html("<img src='" + bankLogo + "' alt='" + bankName + "' /><span>"+bankName+"</span>");
        $(".btn-view").css({"transform": "rotate(90deg)"});
        modalClose(this);
      });

    </script>
