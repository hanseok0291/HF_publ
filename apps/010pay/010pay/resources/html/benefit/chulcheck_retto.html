        <div id="content">
          <!-- section - visual -->
          <div class="section section-visual">
            <div class="container">
              <h2 class="title">
								출석도장 찍고 <br>

              <p class="date">27</p>
              <!-- <p class="complete">출석 완료</p> -->
            </div>
          </div>
          <!-- //section - visual --> 

          <!-- section - info -->
          <div class="section section-info">
            <div class="container">
              <h3 class="info-title">

                </li>
              </ul>

            </div>
          </div>

          <div class="fixed-bottom">

            <div class="container">
              <button type="button" id="send" class="btn">행운상자 열기</button>

          </div>

		<!-- slide modal -->

							<img src="../../images/benefit/win5.png" class="win5"></img> -->

								<!--<strong class="benefit-highlight">999</strong>원 당첨

					</div>
				</div>
			</div>
		</div>

    <!-- loading -->
    <div class="modal modal-loading">
      <div class="modal-dialog">

          <div class="modal-body">

        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>

              class="btn btn-confirm"

          </div>
        </div>
      </div>

        <div class="modal-content">

            <h3 id="promptTitle"></h3>

          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="promptNo"
              onclick="modalClose();"
              class="btn btn-cancel"

              취소
            </button>
            <button type="button" id="promptOk" class="btn btn-confirm">
