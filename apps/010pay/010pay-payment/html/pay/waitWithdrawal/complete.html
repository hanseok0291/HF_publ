<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <!-- [2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/common_renewal_v2.css" />
    <!-- //[2026-06-17] renewal-v2 stylesheet -->
    <link rel="stylesheet" href="../../../css/pay/charge.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
    <script src="../../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <!-- [2026-06-17] renewal-v2 적용 — 출금 완료 (Figma 출금_완료) -->
    <div id="wrap" class="renewal-v2">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container charge-container banner-full-container withdrawal-complete-v2">
          <div class="withdrawal-complete-body">
            <div class="complete-text">
              <i class="lottie-check"></i>
              <div class="withdrawal-complete-content">
                <p class="title">출금이 완료되었어요</p>
                <div class="withdrawal-summary-wrap">
                  <div class="withdrawal-summary-row">
                    <p class="label">수수료</p>
                    <p class="value">0원(월 3회 남음)</p>
                  </div>
                  <div class="divide-line" aria-hidden="true"></div>
                  <div class="withdrawal-summary-row">
                    <p class="label">최종 출금 금액</p>
                    <p class="value">20,000원</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- bottom area -->
      <div class="bottom-area">
        <!-- container -->
        <div class="container">
          <button type="button" class="btn">확인</button>
        </div>
        <!-- //container -->
      </div>
      <!-- //bottom area -->
      <!-- //content -->
    </div>
    <!-- //[2026-06-17] renewal-v2 적용 — 출금 완료 -->
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {
      // 로티 완료
      let svgContainer = document.querySelector(".lottie-check");

      let animItem = bodymovin.loadAnimation({
        wrapper: svgContainer,
        animType: "svg",
        loop: false,
        path: "https://ux.sbsvc.online/010pay/010pay-payment/images/lottie/check.json",
      });
    });
  </script>
</html>
