<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="resources/css/common.css"> <!-- 실제 소스 경로로 변경해 주세요. -->
<link rel="stylesheet" href="resources/css/site.css"> <!-- 실제 소스 경로로 변경해 주세요. -->
<script type="text/javascript" async="" src="https://www.google-analytics.com/analytics.js"></script>
<script src="https://www.googletagmanager.com/gtag/js?id=UA-97416420-4" async=""></script>
<script src="resources/js/jquery-1.8.3.min.js"></script> <!-- 실제 소스 경로로 변경해 주세요. -->
<script src="resources/js/design.js" defer="defer"></script> <!-- 실제 소스 경로로 변경해 주세요. -->
<script src="resources/js/dialog.js" defer="defer"></script> <!-- 실제 소스 경로로 변경해 주세요. -->

<title>간편결제</title>

<body>
<header id="header">
	<h1>신규/추가등록</h1>
	<button type="button" class="btn_cls"><i class="ico_com ico_cls">창닫기</i></button>
</header>

<!-- content -->
<div id="ct">
	<form name="form" id="form" method="post">
		<h2 class="logo_fullname"><img src="resources/images/bank/fullname_020.png" alt="우리은행"></h2>
		<fieldset class="ars_form">
			<legend>계좌번호 입력폼</legend>
			<ul class="brb0">
				<li class="master">
					<span class="stit">예금주</span>
					<strong>강정인</strong>
				</li>
				<li>
					<span class="stit">계좌번호</span>
					<strong>123-4567-891011</strong>
				</li>
				<li class="num">
					<span class="stit">입금자명</span>
					<span class="input"><input type="tel" name="POacctNo" id="POacctNo" placeholder="입금자명 앞 숫자 3자리 입력" tabindex="2" autocomplete="off"></span>
				</li>
			</ul>
		</fieldset>
		<div class="btn_area v2">
			<p class="txt_cm_cau text_left">* 18시 20분까지 입력해주세요.
				<span class="pull_right"><button type="button" onClick="layer_open('ly_guide');" class="btn_guide">확인방법 <i class="ico_com ico_guide">?</i></button></span></p>
			<p class="mt15"><button type="button" class="btn_xr btn_type" id="doAuthAcctNmCheck">ARS 인증하기</button></p>
		</div>
		<div class="arsInfoText">
			<p><strong>'ARS 인증하기'</strong> 버튼을 누르면,<br/>
				휴대폰으로 계좌등록을 위한 ARS전화가 수신됩니다.<br/>
				전화를 받고 <strong class="fc_reg">주민번호 앞 6자리</strong>를 입력해주세요.</p>
		</div>
	</form>
</div>
<!-- //content -->

<!-- ARS인증 -->
<div class="ly_pop">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_ars" class="cont">
		<div class="ele">
			<section class="inner2">
				<h2>계좌등록을 완료하기 위해<br/>ARS 출금이체 동의가 진행됩니다.</h2>
				<p>전화가 오면, <strong class="fc_reg">주민번호 앞 6자리</strong>를<br/>입력해주세요.</p>
			</section>
			<ul class="btn_area5">
				<li class="bt3" id="doArs"><button type="button" onclick="" class="btn_xr btn_type3 fc_reg">ARS 인증하기</button></li>
			</ul>
		</div>
	</div>
</div>
<!-- //ARS인증 -->

<!-- 계좌 확인방법 안내 -->
<div class="ly_pop ly_guide" style="display: block">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_guide" class="cont">
		<div class="ele">
			<section>
				<img src="resources/images/occupy_guide.png" alt="">
			</section>
			<ul class="btn_area5">
				<li class="bt3"><button type="button" onclick="layer_close();" class="btn_xr btn_type3">확인</button></li>
			</ul>
		</div>
	</div>
</div>
<!-- //계좌 확인방법 안내 -->
</body>
</html>
