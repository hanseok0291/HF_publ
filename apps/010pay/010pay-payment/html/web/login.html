<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/login.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="flex-container">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box"></div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="flex-container">
        <!-- container -->
        <div class="container login-container">
          <div class="main-logo-wrap">
            <img src="../../images/web/round_pay_logo.svg" alt="RROUND" />
            <p class="sub-title">더 나은 일상을 위한 간편결제</p>
          </div>
          <div class="form-wrap">
            <ul class="form-type">
              <li>
                <div class="input-container label-n">
                  <input
                    type="number"
                    class="custom-input"
                    placeholder=" "
                    id="accountNumber"
                  />
                  <label for="accountNumber" class="floating-label"
                    >휴대폰 번호</label
                  >
                  <button
                    type="button"
                    class="icon icon-del js-text-del"
                  ></button>
                </div>
              </li>
              <li>
                <div class="input-container label-n">
                  <input
                    type="number"
                    class="custom-input"
                    placeholder=" "
                    id="accountNumber"
                  />
                  <ul class="dot-wrap"></ul>
                  <label for="accountNumber" class="floating-label"
                    >비밀번호</label
                  >
                  <button
                    type="button"
                    class="icon icon-del js-text-del"
                  ></button>
                </div>
              </li>
            </ul>
          </div>
          <div class="login-btn-wrap">
            <button type="button" class="btn">로그인</button>
          </div>
          <div class="link-btn-wrap">
            <button type="button" class="btn-link">비밀번호 찾기</button>
            <button type="button" class="btn-link">회원가입</button>
          </div>
          <div class="tooltip-wrap">
            <button type="button" class="btn-tooltip">
              <i class="icon icon-exclamation-circle-line"></i>
              라운드페이에 이미 가입하셨나요?
            </button>
            <div class="tooltip-content">
              <button type="button" class="icon icon-close-gray"></button>
              <p>
                라운드 앱으로 가입한 회원은 <b>비밀번호 찾기</b>를 통해 웹 로그인용
                비밀번호를 새로 만들 수 있습니다. 이후에는 해당 비밀번호로
                간편하게 로그인할 수 있습니다.
              </p>
            </div>
          </div>
        </div>
        <!-- //container -->
      </div>
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {});
  </script>
</html>
