<form id="formErr" action="/error_custom.do" method="post">
	<input type="hidden" name="eCode" id="eCode">
	<input type="hidden" name="eMsg" id="eMsg">
</form>

<script type="text/javascript">
	function errCustom(data){
		$('#eCode').val(data.ret_code);
		$('#eMsg').val(data.ret_msg);
		var url = $('#formErr').attr('action');
		var attrObj = {'form' : '#formErr'};
		PHFnc.doAction(url, '', attrObj);
	}
</script>

<script type="text/javascript">

$(document).ready(function(){
	PHFnc.progressbar(true, false);
	var cert_code = '<c:out value="${cert_code}"/>'; // KMC 본인인증 검증 결과 (컬처랜드)

	if(cert_code === 'true') {
		clsAgr();
	}else {
		PHFnc.doAction("/error_custom.do");
	}

});

function clsAgr(){


	//TODO phubTrNo 확인
	var phubTrNo =  '${phubTrNo}';

	var url = '/phub/std/clsAgr.do';
	var params = {
			'phubTrNo'	: phubTrNo
	}
	var type = 'post';
	var dataType = 'json';
	var success = function(data, textStatus, jqXHR){
		console.log('data:', data.ret_code);
		if(data.ret_code == '00'){
			if(data.serviceId == 'SVC_FP' && data.payYn == 'N'){
				if(data.path == 'CL'){
					PHFnc.doAction("/phub/fp/couponList.do", "custId="+data.custId);
				}else{
					PHFnc.doAction("/phub/fp/familyList.do", "phub_tr_no=${phubTrNo}");
				}
			}else{
				PHFnc.doAction("/phub/std/point.do", "phubTrNo=${phubTrNo}");
			}
		}else{
			PHFnc.progressbar(false, false);
			PHFnc.alert(data.ret_msg);
		}
	}
	PHFnc.ajax(url, params, type, dataType, success, errCustom, true, true);
}
</script>
