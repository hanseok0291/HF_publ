<body>
<!-- wrap -->
<div id="wrap">
	<!-- header -->
	<div id="header">
		<div class="container">
			<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo.png?ver=20201103" class="logo" alt="010가상계좌"></span></h1>
			<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="content">
		<!-- container -->
		<div class="container">
			<!-- headline -->
			<div class="headline">
				<p><strong>시스템 오류</strong></p>
				<p class="small">요청하신 페이지를 찾을 수 없습니다.</p>
			</div>
			<!-- //headline -->

			<!-- 안내 -->
			<div class="section pay-fail">
				<p><img src="../../images/icon-circle-error.png" alt="알림"></p>
				<p class="info-center">서비스 이용에 불편을 드려 죄송합니다.<br>
					잠시 후 다시 이용해주세요.</p>
			</div>
			<!-- //안내 -->
		</div>
		<!-- //container -->

		<!-- bottom area -->
		<div class="bottom-area">
			<div class="container">
				<button type="button" id="send" class="btn">확인</button>
			</div>
		</div>
		<!-- //bottom area -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
