<!doctype html>
<html>
<head>
<title>표준간편결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="resources/css/owl.carousel.min.css">
<link rel="stylesheet" href="resources/css/common.css">
<link rel="stylesheet" href="resources/css/site.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="resources/js/html5shiv.js"></script>
<script type="text/javascript" src="resources/js/respond.min.js"></script>
<![endif]-->
<script src="resources/js/jquery-1.8.3.min.js"></script>
<script src="resources/js/placeholders.min.js"></script>
<script src="resources/js/owl.carousel.min.js"></script>
<script src="resources/js/design.js" defer="defer"></script>
<script src="resources/js/commonmsg.js"></script>
<script src="resources/js/commonutil.js"></script>
</head>

<body>
<script>

// 설정으로 호출된 경우 비트 OR로 호출된 페이지에서 확인하기 위한 용도 
var setting = FStatus.setting;

var myAccountList = [
	{"name" : "국민은행", "code": "004", "accountNo": "815********945" },
	{"name" : "신한은행", "code": "088", "accountNo": "366*****452" },
];

$(document).ready(function() {
	$('#closeWindow').click(function() {
		if ( '' == 'Y' )
			$.closeSetting();
		else
			$.closeOrder();
	});

	$('#prevPage').click(function() {
		$.prevPage();
	});

	$('#send').click(function() {
		$.paySend();
	});

	$('#addAccountNo').click(function() {
		$.addAccountNo();
	});

	$('#setPassword').click(function() {
		$.setPassword();
	});

	$('#resetPassword').click(function() {
		$.promptMessage("휴대폰 본인인증 요청", "<span class='text_primary'>비밀번호를 재설정하기 위해<br> 휴대폰본인인증이 진행됩니다.</span>", $('#commonPrompt'), 
						$('#promptOk'),
						"$.resetPassword()");
	}); 

	$('#manageCashReceipt').click(function() {
		$.manageCashReceipt();
	}); 

	$('#withdraw').click(function() {
		$.promptMessageEx($('#promptTitleWithdraw'), 
							$('#promptContentsWithdraw'), 
							alertTitle.withdraw,  
							alertMsg.withdrawQuestion, 
							$('#commonPromptWithdraw'), 
							$('#promptOkWithdraw'), 
							"$.withdraw()");
	});

	$("button[name*='bankDelete_']").click(function(){
		var idxStr = $(this).prop('name');
		var idx = idxStr.substring('bankDelete_'.length);

		if ( $("button[name*='bankDelete_']").size() > 1 || '' == 'Y' ) {
			$.promptMessage("계좌삭제", 
							"<span class='text_primary'>" +  myAccountList[idx].name +"(" + myAccountList[idx].accountNo + ") 계좌</span>를<br> 정말 삭제 하시겠습니까?", 
							$('#commonPrompt'), 
							$('#promptOk'), 
							"$.deleteAccount(" + idx + ")");
		} else {
			$.promptMessage("계좌삭제안내", 
							"결제 계좌를 전부 삭제하시면 서비스를 이용할 수 없습니다.<br>" +  myAccountList[idx].name +"(" + myAccountList[idx].accountNo + ") 계좌를<br>  <span class='text_primary'>정말 삭제하시겠습니까?</span>", 
							$('#commonPrompt'), 
							$('#promptOk'), 
							"$.deleteAccountAndExit(" + idx + ")");
		}
	});
});

$.paySend = function() {
	var sendPayForm  = document.sendPayForm;
	sendPayForm.method = 'POST';
	sendPayForm.action = 'pay.do';
	sendPayForm.submit();
}

$.addAccountNo = function() {
	var sendPayForm  = document.sendPayForm;
	
	$('input[name="fStatus"]').val(setting + FStatus.newAccount);
	sendPayForm.method = 'POST';
	sendPayForm.action = 'selectBank.do';
	sendPayForm.submit();
}

$.deleteAccount = function(idx) {
	$('#commonPrompt').hide();
	$('#bankList' + idx ).remove();
}

$.deleteAccountAndExit = function(idx) {
	$.deleteAccount(idx);
	$.closeWindow();
}

$.setPassword = function(idx) {
	var sendPayForm  = document.sendPayForm;
	
	$('input[name="fStatus"]').val(setting + FStatus.setPassword);
	sendPayForm.method = 'POST';
	sendPayForm.action = 'verifyPassword.do';
	
	sendPayForm.submit();
}

$.resetPassword = function(idx) {
	var sendPayForm  = document.sendPayForm;
	
	$('#commonPrompt').hide();
	$('input[name="fStatus"]').val(setting + FStatus.resetPassword);
	sendPayForm.method = 'POST';
	sendPayForm.action = 'selfAuth.do';
	
	sendPayForm.submit();
}

$.manageCashReceipt = function(idx) {
	var sendPayForm  = document.sendPayForm;
	
	sendPayForm.method = 'POST';
	sendPayForm.action = 'manageCashReceipt.do';
	sendPayForm.submit();
}

$.withdraw = function(idx) {
	//var sendPayForm  = document.sendPayForm;
	
	$('#commonPromptWithdraw').hide();
	//$('input[name="fStatus"]').val(setting + FStatus.withdraw);
	//sendPayForm.method = 'POST';
	//sendPayForm.action = 'verifyPassword.do';
	//sendPayForm.submit();
	
	//$.alertMessageCallback("", "간편계좌결제 서비스가 해지 되었습니다. <br>서비스를 이용해 주셔서 감사합니다.", $('#commonAlert'), "$.closeWindow()");
	//$.closeWindow();
}

$.prevPage = function() {
	var sendPayForm  = document.sendPayForm; 
	sendPayForm.method = 'POST';
	
	if ( $('input[name=fSetting]').val() == 'Y' ) {
		$.closeSetting();
	} else {
		sendPayForm.action = 'pay.do';
		sendPayForm.submit();
	}
}
</script>

<!-- wrap -->
<div id="wrap">
	<!-- header -->
	<div id="header">
		<div class="logo_area"><img src="resources/images/logo_payco.png" alt="PAYCO"></div>
		<div class="tit_area">
			<button type="button" id="prevPage" class="btn_prev"><i class="ico ico_prev">뒤로가기</i></button>
			<h1>간편현금결제 관리</h1>
			<button type="button" id="closeWindow" class="btn_cls"><i class="ico ico_cls">창닫기</i></button>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="ct" class="manage">
		<!-- container -->
		<div class="container">
			<!-- 설정 -->
			<fieldset>
				<h2 class="tit_small">설정</h2>
				<ul class="list_menu">
					<li><button type="button" id="setPassword">비밀번호 변경</button></li>
					<li><button type="button" id="resetPassword">비밀번호 초기화</button></li>
					<li><button type="button" id="manageCashReceipt" onClick="layer_open('ly_manageCashReceipt');">현금영수증 설정</button></li>
					<li><button type="button" id="withdraw">서비스 해지</button></li>
				</ul>
			</fieldset>
			<!-- //설정 -->

			<!-- 계좌관리 -->
			<fieldset>
				<h2 class="tit_small">계좌관리</h2>
				<ul class="list_bank">
					<li id="bankList0">
						<button type="button" class="btn_star on"><i class="ico ico_star"></i></button>
						<label for="bank_0"><span class="name">국민은행</span> 815********945</label>
						<button type="button" name="bankDelete_0" class="btn_del"><i class="ico ico_del">삭제</i></button>
					</li>
					<li id="bankList1">
						<button type="button" class="btn_star"><i class="ico ico_star"></i></button>
						<label for="bank_1"><span class="name">신한은행</span> 366*****452</label>
						<button type="button" name="bankDelete_1" class="btn_del"><i class="ico ico_del">삭제</i></button>
					</li>
				</ul>
				<p class="mt10"><button type="button" id="addAccountNo" class="btn btn_default2"><i class="ico ico_plus_o"></i> 계좌추가</button></p>
			</fieldset>
			<!-- 계좌관리 -->
		</div>
		<!-- //container -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- Alert Format -->
<div id="commonAlert" class="ly_pop">
	<div class="bg"></div>
	<div id="ly_pwre" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="alertTitle"></h2>
				<p id="alertContents"></p>
			</div>
			<div class="pop_footer">
				<button type="button" onclick="layer_close();" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Alert Format -->

<!-- Prompt Format -->
<div id="commonPrompt" class="ly_pop ly_bank">
	<div class="bg"></div>
	<div id="ly_bank" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="promptTitle"></h2>
				<p id="promptContents"></p>
			</div>
			<div class="pop_footer btn_type2">
				<button type="button" onclick="layer_close();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Prompt Format -->

<!-- Prompt Format -->
<div id="commonPromptWithdraw" class="ly_pop ly_withdraw">
	<div class="bg"></div>
	<div id="ly_withdraw" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="promptTitleWithdraw"></h2>
				<p id="promptContentsWithdraw"></p>
			</div>
			<div class="pop_footer btn_type2">
				<button type="button" onclick="layer_close();" class="btn">취소</button>
				<button type="button" id="promptOkWithdraw" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Prompt Format -->

<!-- 현금영수증 설정 -->
<div class="ly_pop ly_manageCashReceipt">
	<div class="bg"></div>
	<div id="ly_manageCashReceipt" class="cont">
		<div class="ele">
			<div class="pop_body dropdown_wrap">
				<!-- 분류 선택 드롭다운 -->
				<div class="dropdown">
					<div class="head">개인소득공제용</div>
					<ul class="list">
						<li class="active"><a href="dropdown_content1_1">개인소득공제용</a></li>
						<li><a href="dropdown_content1_2">지출증빙용</a></li>
					</ul>
				</div>
				<!-- //분류 선택 드롭다운 -->

				<!-- 개인소득공제용 -->
				<div id="dropdown_content1_1" class="list_content active">
					<div class="input">
						<span class="checkbox circle">
							<input type="radio" name="private" id="private1" checked>
							<label for="private1"></label>
						</span>
						<input type="text" name="receiptPersonMobileNo" id="receiptPersonMobileNo" placeholder="휴대폰번호(-없이 입력)" maxlength="11" value="01031229785">
						<button type="button" class="btn_del"><i class="ico ico_del"></i></button>
					</div>
					
					<div class="input">
						<span class="checkbox circle">
							<input type="radio" name="private" id="private2">
							<label for="private2"></label>
						</span>
						<input type="text" name="receiptPersonCashCard" id="receiptPersonCashCard" placeholder="현금영수증 카드번호 입력" maxlength="16">
						<button type="button" class="btn_del"><i class="ico ico_del"></i></button>
					</div>
				</div>
				<!-- //개인소득공제용 -->

				<!-- 지출증빙용 -->
				<div id="dropdown_content1_2" class="list_content">
					<div class="input">
						<span class="checkbox circle">
							<input type="radio" name="report" id="report1">
							<label for="report1"></label>
						</span>
						<input type="text" name="receiptCompanyNo" id="receiptCompanyNo" placeholder="사업자번호 입력(-없이 입력)" maxlength="10">
						<button type="button" class="btn_del"><i class="ico ico_del"></i></button>
					</div>
					
					<div class="input">
						<span class="checkbox circle">
							<input type="radio" name="report" id="report2">
							<label for="report2"></label>
						</span>
						<input type="text" name="receiptCompanyCashCard" id="receiptCompanyCashCard" placeholder="현금영수증 카드번호 입력" maxlength="16">
						<button type="button" class="btn_del"><i class="ico ico_del"></i></button>
					</div>
				</div>
				<!-- //지출증빙용 -->
			</div>

			<div class="pop_footer">
				<button type="button" onclick="layer_close();" class="btn btn_primary">저장</button>
			</div>
		</div>
	</div>
</div>
<!-- //현금영수증 설정 -->
</body>
</html>
