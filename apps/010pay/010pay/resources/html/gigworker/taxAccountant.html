<!DOCTYPE html>
<html lang="ko">
  <head>

    <meta

    <link rel="stylesheet" href="../../css/jquery-ui.css" />

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker taxAccountant">

            </h3>
            <p class="subText">010PAY는 수수료를 취득하지 않아요.</p>
          </div>

          <ul class="contentWrap">
            <li>
              <div class="topCon">
                <div class="leftCon">
                  <h4>김헥토 세무사</h4>
                  <p>
                    빠르고 깔끔하게 처리하겠습니다.

                  </div>
                </div>
                <div class="rightCon">
                  <img src="../../images/gigworker/accountant-01.png" alt="세무사 사진">
                </div>
              </div>
              <a href="tel:010-1234-5678" class="phone"><em>📞</em> 010 - 1234 - 5678 <i class="icon-right-arrow"></i></a>
            </li>
            <li>
              <div class="topCon">
                <div class="leftCon">
                  <h4>김헥토 세무사</h4>
                  <p>
                    빠르고 깔끔하게 처리하겠습니다. <br>
                    믿고 맡겨만 주세요.
                  </p>
                  <div class="infoWrap">
                    <span>세무법인 헥토</span>
                    <span>경력 7년</span>
                  </div>
                </div>
                <div class="rightCon">
                  <img src="../../images/gigworker/accountant-02.png" alt="세무사 사진">
                </div>
              </div>
              <a href="tel:010-1234-5678" class="phone"><em>📞</em> 010 - 1234 - 5678 <i class="icon-right-arrow"></i></a>
            </li>
          </ul>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <script>
      $(".navWrap button").on("click", function(){
        var idx = $(this).index() + 1;
        var scroll = $(".content" + idx).offset().top;
        $(".navWrap button").removeClass("active");
        $(this).addClass("active");
        $("html, body").animate({scrollTop: scroll - $("#header").height() - $(".navWrap").outerHeight()});
      });
    </script>
  </body>
</html>
