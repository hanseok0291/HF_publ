<!doctype html>
<html lang="ko">
<head>
<title>내통장결제 데모</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/demo.css">
</head>

<body class="demo">
<!-- form -->
<form class="main_form" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="order type-a">
		<!-- header -->
		<div id="header">
			<div class="container">
				<div class="page-title">
					<h1 class="title"><span class="text-primary">세틀청과주식회사</span> 주문하기</h1>
				</div>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- 주문상품 -->
			<div class="section order-info">
				<h2 class="section-title"><span class="container">주문상품</span></h2>
				<div class="section-content">
					<div class="product-list">
						<div class="container">
							<div class="product-thumb"><img src="../../images/demo/product/thumb_01.jpg" alt="thumb"></div>
							<div class="product-info">
								<div class="product-name">샤인머스캣 600g</div>
								<div class="product-price">69,000원<br><small>(배송비 무료)</small></div>
							</div>
						</div>
					</div>
					<div class="total">
						<div class="container">
							<div class="dt">최종 결제금액</div>
							<div class="dd text-primary">69,000원</div>
						</div>
					</div>
				</div>
			</div>
			<!-- //주문상품 -->

			<!-- 결제수단 선택 -->
			<div class="section order-pay">
				<h2 class="section-title"><span class="container">결제수단 선택</span></h2>
				<div class="section-content">
					<div class="container">
						<ul class="pay-list">
							<li class="wide active"><button type="button">010가상계좌</button></li>
							<li><button type="button">신용카드</button></li>
							<li><button type="button">무통장입금</button></li>
							<li><button type="button"><img src="../../images/demo/order/order_kakaopay.png" alt="Kakao Pay"></button></li>
							<li><button type="button"><img src="../../images/demo/order/order_samsungpay.png" alt="Kakao Pay"></button></li>
							<li><button type="button"><img src="../../images/demo/order/order_naverpay.png" alt="Kakao Pay"></button></li>
							<li><button type="button"><img src="../../images/demo/order/order_smilepay.png" alt="Kakao Pay"></button></li>
						</ul>
					</div>
				</div>
			</div>
			<!-- //결제수단 선택 -->

			<!-- submit button -->
			<div class="section submit-btn">
				<div class="container">
					<div class="checkbox square">
						<input type="checkbox" name="cashReceipt" id="cashReceipt" checked="">
						<label for="cashReceipt">위 주문의 상품, 가격, 할인, 배송 정보에 동의합니다.</label>
					</div>
					<a href="../vbank/step1-1.html" class="btn on">결제하기</a>
				</div>
			</div>
			<!-- //submit button -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->
</body>
</html>
