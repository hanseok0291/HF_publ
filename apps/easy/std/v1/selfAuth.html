<!doctype html>
<html>
<head>
<title>표준간편결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="resources/css/owl.carousel.min.css">
<link rel="stylesheet" href="resources/css/common.css">
<link rel="stylesheet" href="resources/css/site.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="resources/js/html5shiv.js"></script>
<script type="text/javascript" src="resources/js/respond.min.js"></script>
<![endif]-->
<script src="resources/js/jquery-1.8.3.min.js"></script>
<script src="resources/js/placeholders.min.js"></script>
<script src="resources/js/owl.carousel.min.js"></script>
<script src="resources/js/design.js" defer="defer"></script>
<script src="resources/js/commonmsg.js"></script>
<script src="resources/js/commonutil.js"></script>
</head>

<body>
<form name="sendPayForm">
	<!-- wrap -->
	<div id="wrap">
		<!-- header -->
		<div id="header">
			<div class="logo_area"><img src="resources/images/logo_payco.png" alt="PAYCO"></div>
			<div class="tit_area">
				<button type="button" id="prevPage" class="btn_prev"><i class="ico ico_prev">뒤로가기</i></button>
				<h1>본인인증</h1>
				<button type="button" id="closeWindow" class="btn_cls"><i class="ico ico_cls">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="ct" class="self_auth">
			<!-- container -->
			<div class="container">
				<fieldset class="form_type">
					<legend>휴대폰본인확인 입력폼</legend>
					<ul>
						<li><input type="text" name="custNmBasic" id="custNmBasic" placeholder="이름" tabindex="1" maxlength="4" value=""></li>
						<li>
							<span class="input input_myid">
								<input type="text" name="rrnBasic" id="rrnBasic" placeholder="주민번호 앞 6자리" tabindex="2" maxlength="6">
								<span class="num"><label for="sexBasic" class="lbl"><i></i></label>
								<input type="text" name="sexBasic" id="sexBasic" tabindex="3" maxlength="1" class="i_text"><i></i><i></i><i></i><i></i><i></i><i></i></span>
							</span>
						</li>
						<li class="telecom">
							<ul>
								<li><button type="button" name="mobileCoBasicSKT" class="selected">SKT</button></li>
								<li><button type="button" name="mobileCoBasicKT">KT</button></li>
								<li><button type="button" name="mobileCoBasicUPlus">LG U+</button></li>
								<li><button type="button" name="mobileCoBasicEtc" onclick="layer_open('ly_frugal')">알뜰폰<span class="brnd"></span></button></li>
							</ul>
							<input type="text" name="phoneNoBasic" id="phoneNoBasic" placeholder="휴대폰번호(-없이 입력)" tabindex="4" maxlength="11">
						</li>
						<li class="capcha">
							<ul>
								<li>
									<img src="resources/images/temp_captcha.png" id="captchaImg" alt="보안문자 이미지" class="temp">
									<div class="btn_area">
										<button type="button" id="soundCaptcha" class="btn_speaker"><i class="ico ico_speaker">소리로 듣기</i></button>
										<button type="button" id="refreshCaptcha" class="btn_refresh"><i class="ico ico_refresh">새로고침</i></button>
									</div>
								</li>
								<li><input type="text" name="capchaInput" id="capchaInput" placeholder="보안숫자 입력" tabindex="5" maxlength="5"></li>
							</ul>
						</li>
					</ul>
				</fieldset>
			</div>
			<!-- //container -->

			<!-- fixed bottom button -->
			<div class="fix_btm_btn"><button type="button" id="send" class="btn btn_lg">인증받기</button></div>
			<!-- //fixed bottom button -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->

	<!-- 알뜰폰 통신사 선택 -->
	<div class="ly_pop ly_frugal">
		<div class="bg"></div>
		<div id="ly_frugal" class="cont">
			<div class="ele">
				<ul>
					<li><button type="button" onclick="layer_close();$('.telecom .brnd').text('SKT');" class="btn btn_white">SKT(알뜰폰)</button></li>
					<li><button type="button" onclick="layer_close();$('.telecom .brnd').text('KT');" class="btn btn_white">KT(알뜰폰)</button></li>
					<li><button type="button" onclick="layer_close();$('.telecom .brnd').text('LGU+');" class="btn btn_white">LGU+(알뜰폰)</button></li>
				</ul>
			</div>
		</div>
	</div>
	<!-- //알뜰폰 통신사 선택 -->
</form>

<!-- Alert Format -->
<div id="commonAlert" class="ly_pop ly_pwre">
	<div class="bg"></div>
	<div id="ly_pwre" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="alertTitle"></h2>
				<p id="alertContents"></p>
			</div>
			<div class="pop_footer">
				<button type="button" onclick="layer_close();" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Alert Format -->

<!-- Prompt Format -->
<div id="commonPrompt" class="ly_pop ly_bank">
	<div class="bg"></div>
	<div id="ly_bank" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="promptTitle"></h2>
				<p id="promptContents"><span class="text_primary"></span></p>
			</div>
			<div class="pop_footer btn_type2">
				<button type="button" onclick="layer_close();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Prompt Format -->
</body>
</html>
