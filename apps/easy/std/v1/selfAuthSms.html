<!doctype html>
<html>
<head>
<title>표준간편결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="resources/css/owl.carousel.min.css">
<link rel="stylesheet" href="resources/css/common.css">
<link rel="stylesheet" href="resources/css/site.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="resources/js/html5shiv.js"></script>
<script type="text/javascript" src="resources/js/respond.min.js"></script>
<![endif]-->
<script src="resources/js/jquery-1.8.3.min.js"></script>
<script src="resources/js/placeholders.min.js"></script>
<script src="resources/js/owl.carousel.min.js"></script>
<script src="resources/js/design.js" defer="defer"></script>
<script src="resources/js/commonmsg.js"></script>
<script src="resources/js/commonutil.js"></script>
</head>

<body>
<script>
$(document).ready(function() {

	$('#closeWindow').click(function() {
		if ( '' == 'Y' )
			$.closeSetting();
		else
			$.closeOrder();
	});

	$('#prevPage').click(function() {
		$.prevPage();
	});

	$('#send').click(function() {
		$.paySend();
	});    

	$('#smsResend').click(function() {
		$.alertMessage("알림", errMsg.smsResend, $('#commonAlert'));
		$('#timer').text($.toMMSSTimeFormat());
		clearInterval(timeId);
		time = DEFAULT_TIMER_VALUE;
		$.startTimer();
		$('input[name="cnum"]').val('');
	});

	$('input').keyup(function() {
		if ( $('input[name="cnum"]').val().length >= SMS_MIN_LEN )
		{
			$('#send').addClass('btn_primary');
		}	
		else
		{
			$('#send').removeClass('btn_primary');
		}
	});

	$('#timer').text($.toMMSSTimeFormat());
	$.startTimer();
});

$.paySend = function() {
	var sendPayForm  = document.sendPayForm;
	sendPayForm.method = 'POST';

	if ( parseInt($('input[name=fStatus]').val()) & FStatus.resetPassword )
		sendPayForm.action = 'registerPassword.do';
	else
		sendPayForm.action = 'selectBank.do';

	sendPayForm.submit();
}

$.prevPage = function() {
	var sendPayForm  = document.sendPayForm; 
	sendPayForm.method = 'POST';
	sendPayForm.action = 'selfAuth.do';
	sendPayForm.submit();  
}
</script>

<!-- wrap -->
<div id="wrap">
	<!-- header -->
	<div id="header">
		<div class="logo_area"><img src="resources/images/logo_payco.png" alt="PAYCO"></div>
		<div class="tit_area">
			<button type="button" id="prevPage" class="btn_prev"><i class="ico ico_prev">뒤로가기</i></button>
			<h1>인증번호 입력</h1>
			<button type="button" id="closeWindow" class="btn_cls"><i class="ico ico_cls">창닫기</i></button>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="ct">
		<!-- container -->
		<div class="container">
			<fieldset class="form_type">
				<legend>인증번호 입력폼</legend>
				<ul>
					<li class="cau">문자로 받은 인증번호를 입력해주세요.</li>
					<li class="numskip">
						<span class="input"><input type="text" name="cnum" id="cnum" placeholder="인증번호(숫자6자리)" maxlength="6" class=""></span>
						<strong class="time" id="timer">00:00</strong>
					</li>
					<li class="right_link"><button type="button" id="smsResend" class="underline">인증번호재전송</button></li>
				</ul>
			</fieldset>
		</div>
		<!-- //container -->

		<!-- fixed bottom button -->
		<div class="fix_btm_btn"><button type="button" id="send" class="btn btn_lg">인증번호 입력완료</button></div>
		<!-- //fixed bottom button -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->

<!-- Alert Format -->
<div id="commonAlert" class="ly_pop ly_pwre">
	<div class="bg"></div>
	<div id="ly_pwre" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="alertTitle"></h2>
				<p id="alertContents"></p>
			</div>
			<div class="pop_footer">
				<button type="button" onclick="layer_close();" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Alert Format -->

<!-- Prompt Format -->
<div id="commonPrompt" class="ly_pop ly_bank">
	<div class="bg"></div>
	<div id="ly_bank" class="cont">
		<div class="ele">
			<div class="pop_body">
				<h2 id="promptTitle"></h2>
				<p id="promptContents"><span class="text_primary"></span></p>
			</div>
			<div class="pop_footer btn_type2">
				<button type="button" onclick="layer_close();" class="btn">취소</button>
				<button type="button" id="promptOk" class="btn btn_primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //Prompt Format -->
</body>
</html>
