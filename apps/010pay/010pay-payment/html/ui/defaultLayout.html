<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <!--[if lt IE 9]>
            <script type="text/javascript" src="../../js/html5shiv.js"></script>
            <script type="text/javascript" src="../../js/respond.min.js"></script>
        <![endif]-->
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery.placeholder.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/commonmsg.js"></script>
        <script src="../../js/commonutil.js"></script>
        <script src="../../js/owl.carousel.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-arrow-left">뒤로가기</i></button>
                    <h1 class="brand-name hidden">
                        <a href="#">
                            <span class="shop-logo"><img src="../../resources/images/common/logo.png" alt="로고 샘플" /></span>
                        </a>
                    </h1>
                    <h2 class="page-title">계좌 등록</h2> -->
                    <div class="header-box">
                        <h2 class="page-title">계좌 등록</h2>
                        <button type="button" class="btn-close js-change-btn" data-message="창을 닫으시면 결제가 취소됩니다.<br>종료하시겠습니까?" data-cancel="취소" data-confirm="확인">
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!-- container -->
                <div class="container">
                    <!-- headline -->
                    <div class="headline">
                        <p>페이지 소개 및 도움말입니다.(headline)</p>
                    </div>
                    <!-- //headline -->

                    <!-- section -->
                    <div class="section">
                        content<br />
                        content<br />
                        content
                    </div>
                    <!-- //section -->
                </div>
                <!-- //container -->

                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <!--<button type="button" id="send" class="btn" disabled>다음</button>-->
                        <button type="button" id="send" class="btn">다음</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- loading -->
        <div class="modal modal-loading">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="loading">
                        <span class="loading-bar"></span>
                        <span class="loading-bar"></span>
                        <span class="loading-bar"></span>
                    </div>
                    <span class="sr-only">로딩 중</span>
                </div>
            </div>
        </div>
        <!-- //loading -->

        <!-- common alert -->
        <div id="commonAlert" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="alertTitle"></h3>
                        <p id="alertContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common alert -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->
    </body>
</html>
