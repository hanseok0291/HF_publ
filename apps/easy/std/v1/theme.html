<!doctype html>
<html>
<head>
<title>표준간편결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="resources/css/owl.carousel.min.css">
<link rel="stylesheet" href="resources/css/common.css">
<link rel="stylesheet" href="resources/css/site.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="resources/js/html5shiv.js"></script>
<script type="text/javascript" src="resources/js/respond.min.js"></script>
<![endif]-->
<script src="resources/js/jquery-1.8.3.min.js"></script>
<script src="resources/js/placeholders.min.js"></script>
<script src="resources/js/owl.carousel.min.js"></script>
<script src="resources/js/design.js" defer="defer"></script>
<script src="resources/js/commonmsg.js"></script>
<script src="resources/js/commonutil.js"></script>
</head>

<body>
<script>
$(document).ready(function(){
	$('.checkbox').click(function() {
		$('body').removeClass();
		var myTheme = ($("input[name=theme]:checked").attr('id'));
		$('body').addClass(myTheme);
	});
});
</script>
<!-- wrap -->
<div id="wrap">
	<!-- header -->
	<div id="header">
		<div class="logo_area"><img src="resources/images/logo_payco.png" alt="PAYCO"></div>
		<div class="tit_area">
			<button type="button" id="prevPage" class="btn_prev"><i class="ico ico_prev">뒤로가기</i></button>
			<h1>테마 선택</h1>
			<button type="button" id="closeWindow" class="btn_cls"><i class="ico ico_cls">창닫기</i></button>
		</div>
	</div>
	<!-- //header -->

	<!-- content -->
	<div id="ct">
		<!-- container -->
		<div class="container">
			<!-- 체크박스 -->
			<div class="text_center">
				<h2 class="headline">적용할 테마를 선택해 주세요.</h2>
				<p class="checkbox_inline_group select_theme">
					<span class="checkbox circle">
						<input type="radio" name="theme" id="themeA" checked>
						<label for="themeA" class="on">Red</label>
					</span>
					<span class="checkbox circle">
						<input type="radio" name="theme" id="themeB">
						<label for="themeB">Blue</label>
					</span>
					<span class="checkbox circle">
						<input type="radio" name="theme" id="themeC">
						<label for="themeC">Green</label>
					</span>
					<span class="checkbox circle">
						<input type="radio" name="theme" id="themeD">
						<label for="themeD" >Yellow</label>
					</span>
				</p>
			</div>
			<!-- //체크박스 -->

			<!-- 하단 버튼 -->
			<div class="fix_btm_btn btn_type2">
				<button type="button" class="btn btn_lg">취소</button>
				<button type="button" class="btn btn_lg btn_primary">저장</button>
			</div>
			<!-- //하단 버튼 -->
		</div>
		<!-- //container -->
	</div>
	<!-- //content -->
</div>
<!-- //wrap -->
</body>
</html>
