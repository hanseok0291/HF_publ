<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>내통장결제</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box center">
                        <button type="button" class="btn-prev" onclick="window.location.href='./charge_step1.html'"><i class="icon-arrow-left"></i></button>
                        <h2 class="page-title">계좌 머니 충전</h2>
                        <button type="button" class="btn-close js-change-btn" data-message="창을 닫으시면 결제가 취소됩니다.<br>종료하시겠습니까?" data-cancel="취소" data-confirm="확인"></button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!-- container -->
                <div class="container">
                    <!-- section -->
                    <div class="section">
                        <ul class="form-type">
                            <li>
                                <div class="input-container">
                                    <input type="tel" class="custom-input n-border" id="cntPrice" pattern="[0-9]*" placeholder="충전할 금액을 입력해 주세요" />
                                </div>
                                <div class="helper-text helper-text-error" id="error-text" style="display: none">최소 1만원 이상 충전 가능해요.</div>
                                <div class="helper-text helper-text-error" id="limit-error-text" style="display: none">
                                    <!-- 한도 초과 메시지 -->
                                </div>
                            </li>
                        </ul>

                        <div>
                            <p class="load-option-box">
                                <button type="button" class="btn-load" data-value="10000">+ 1만원</button>
                                <button type="button" class="btn-load" data-value="50000">+ 5만원</button>
                                <button type="button" class="btn-load" data-value="100000">+ 10만원</button>
                                <button type="button" class="btn-load" data-value="500000">+ 50만원</button>
                            </p>
                        </div>

                        <div class="charge-info-list">
                            <ul>
                                <li>
                                    <p>현재 보유머니</p>
                                    <p>14,000원</p>
                                </li>
                                <li>
                                    <p>등록 계좌</p>
                                    <p class="btn-label flex items-center" onclick="modalOpenSlide('modal-select-account')">
                                        <img src="../../images/bank/logo_090.png" alt="" /> 카카오뱅크789<i class="icon-triangle-down"></i>
                                    </p>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <!-- //section -->
                </div>
                <!-- //container -->

                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <button type="button" class="btn js-modal-close disabled" disabled onclick="modalOpenSlide('modal-select-title')" data-target="modal-select-title">충전하기</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->

        <div id="modal-select-account" class="modal modal-slide type-select type-title">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-head">
                        <p class="modal-head-title">등록 계좌</p>
                    </div>
                    <div class="modal-body">
                        <!-- 전체 동의 체크박스 -->
                        <div class="container">
                            <ul class="btn-list account-list">
                                <li class="option-item">
                                    <button type="button" class="flex items-center js-modal-close">
                                        <p class="img-bank">
                                            <img src="../../images/bank/logo_004.png" alt="" />
                                        </p>
                                        <p class="text-bank">
                                            <span>KB국민</span>
                                            <span>국민 345</span>
                                        </p>
                                        <p class="icon-star"></p>
                                    </button>
                                </li>
                                <li class="option-item">
                                    <button type="button" class="flex items-center js-modal-close">
                                        <p class="img-bank">
                                            <img src="../../images/bank/logo_004.png" alt="" />
                                        </p>
                                        <p class="text-bank">
                                            <span>KB국민</span>
                                            <span>국민 345</span>
                                        </p>
                                    </button>
                                </li>
                                <li class="option-item">
                                    <button type="button" class="flex items-center js-modal-close">
                                        <p class="img-bank">
                                            <img src="../../images/bank/logo_004.png" alt="" />
                                        </p>
                                        <p class="text-bank">
                                            <span>계좌 추가하기</span>
                                        </p>
                                        <i class="icon-arrow-right"></i>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script></script>
</html>
