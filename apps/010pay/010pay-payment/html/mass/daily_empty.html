<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/mass/main.css" />
    <link rel="stylesheet" href="../../css/mass/benefitCard.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">데일리 전용관</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container benefit-card-container daily-container">
          <div class="theme-content">
            <div class="daily-tab-btn-wrap">
              <button type="button" class="daily-tab-btn active">신용카드</button>
              <button type="button" class="daily-tab-btn">체크카드</button>
            </div>
            <div class="empty-list alert">
              <p class="empty-text">진행 중인 이벤트가 없어요</p>
            </div>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(function () {
      $(".daily-tab-btn-wrap .daily-tab-btn").on("click", function () {
        $(this).addClass("active").siblings().removeClass("active");
      });
    });
  </script>
</html>
