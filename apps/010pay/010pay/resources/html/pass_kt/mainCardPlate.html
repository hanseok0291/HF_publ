<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>PASS페이</title>
<link rel="stylesheet" href="../../fonts/notosanskr-v13/notosanskr.min.css">
<script src="../../js/jquery-1.8.3.min.js"></script>

<style>
	html, body { width: 100%; height: 100%; background-color: transparent; }
	html { font-size: 10px; }
	* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
	body { font-family: 'Noto Sans KR', sans-serif; font-weight: 500; letter-spacing: -0.1em; line-height: 1.2; color: #787878; }
	img { width: 100%; height: auto; vertical-align: top; }
	.text-dark { color: #333; }
	.card { position: relative; padding: 1.7rem 2rem; width: 100%; min-height: 10.7rem; white-space: nowrap; font-size: 1.1rem; }
	.bottom { position: absolute; bottom: 2rem; left: 2rem; right: 2rem; }
	.number { letter-spacing: 0; }
	.link { display: inline-block; background: url('../../images/custom/kt/icon-arrow-gray.svg') right center no-repeat; background-size: auto 1rem; }
	.info .link { padding-right: 1.4rem; }
	.info .headline { font-size: 1.7rem; line-height: 2rem; font-weight: 700; }
	.summary .link { padding-right: 2.2rem; background-image: url('../../images/custom/kt/icon-arrow-gray-light.svg'); background-size: 1.1rem auto; }
	.summary dd { text-align: right; }
	.summary .total dt { font-size: 1.466rem; }
	.summary .total dd { margin-right: -0.7rem; font-size: 1.666rem; }
	.summary .total dd strong { display: inline-block; margin-right: .3rem; font-size: 2.333rem; vertical-align: -0.05em; }
	.summary .account { font-size: 1.2rem; }
	.summary .account dt { float: left; }
	.summary .account dd { float: right; }
</style>

<script>
	// body 폰트 사이즈
	var winW = $(window).width();
	function fontSize(w) {
		var fontSize = w / 5.12; // 320 기준
		$('html').css('font-size', Math.floor(fontSize*100)/100 + '%');
	}
	fontSize(winW);
	$(window).resize(function(){
		var winW = $(window).width();
		fontSize(winW);
	});
</script>
</head>

<body>
<!-- 가입 전 -->
<div class="card info">
	<p class="headline text-dark">이제 어디서든 PASS 앱으로<br>
		간편하게 결제해보세요.</p>
	<p class="bottom"><span class="link">서비스 가입하기</span></p>
</div>
<!-- //가입 전 -->

<!-- 가입 후 -->
<div class="card summary">
	<dl class="total">
		<dt><strong>5월</strong> 결제금액</dt>
		<dd><span class="link text-dark"><strong>12,270</strong>원</span></dd>
	</dl>
	<dl class="account bottom">
		<dt>연결계좌</dt>
		<dd>케이뱅크 <span class="number">123456*******</span></dd>
	</dl>
</div>
<!-- 가입 후 -->

<!-- 가입 후 - 계좌 미등록 -->
<div class="card summary">
	<dl class="total">
		<dt><strong>5월</strong> 결제금액</dt>
		<dd><span class="link text-dark"><strong>0</strong>원</span></dd>
	</dl>
	<dl class="account bottom">
		<!-- <dt>연결계좌</dt> -->
		<dd>연결된 계좌가 없습니다</dd>
	</dl>
</div>
<!-- 가입 후 계좌 미등록 -->
</body>
</html>
