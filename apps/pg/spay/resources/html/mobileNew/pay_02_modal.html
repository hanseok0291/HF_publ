<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">

<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>

<script src="../../js/owl.carousel.min.js"></script>

<script src="../../js/design.js" defer="defer"></script>

<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">휴대폰 결제</h2>
				<!-- modal preview sample -->
				<div class="section">
					<h4 class="section-title">LG U+ 옵트인 모달</h4>
					<button type="button" onclick="authLgu1()" class="btn btn-sm btn-secondary">휴대폰 소액결제 - 이용 동의 안내</button><br>
					<button type="button" onclick="authLgu2()" class="btn btn-sm btn-secondary" style="margin-top:5px">휴대폰 소액결제 - 이용 동의 안내 오류</button><br>
					<button type="button" onclick="authLgu3()" class="btn btn-sm btn-secondary" style="margin-top:5px">U&plus;멤버스 인증 - 앱 설치 안내</button><br>
					<button type="button" onclick="authLgu4()" class="btn btn-sm btn-secondary" style="margin-top:5px">U&plus;멤버스 인증 - 앱 설치 안내 오류</button>
				</div>
				<!-- //modal preview sample -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	function authLgu1(){
		$.confirmMessage('휴대폰 소액결제 이용 안내', '<p>휴대폰 소액결제 이용을 위해 이용 동의가 필요합니다.<br> 안내 문자 확인을 위해 SMS 수신에 동의해 주세요.</p><p class="mgt10 checkbox square"><input type="checkbox" name="agreeSms" id="agreeSms"><label for="agreeSms">SMS 수신 동의</label></p><p class="text-error mgt10">SMS 수신 동의에 체크해 주세요.</p>', $('#confirmOk'), '');
	}
	function authLgu2(){
		$.alertMessage('휴대폰 소액결제 이용 안내', 'U&plus; 고객센터 앱에서<br> 휴대폰 소액결제 이용에 동의해 주세요.', '');
	}
	function authLgu3(){
		$.confirmMessage('U&plus;멤버스 인증 안내', '<p>U&plus;멤버스 간편결제 이용을 위해 앱 설치가 필요합니다.<br> 안내 문자 확인을 위해 SMS 수신에 동의해 주세요.</p><p class="mgt10 checkbox square"><input type="checkbox" name="agreeSms" id="agreeSms"><label for="agreeSms">SMS 수신 동의</label></p><p class="text-error mgt10">SMS 수신 동의에 체크해 주세요.</p>', $('#confirmOk'), '');
	}
	function authLgu4(){
		$.alertMessage('U&plus;멤버스 인증 안내', '간편결제 서비스 이용을 위해<br> U&plus;멤버스 앱 설치 및 인증이 필요합니다.', '');
	}
</script>
</body>
</html>
