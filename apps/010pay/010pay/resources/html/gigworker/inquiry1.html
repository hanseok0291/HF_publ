<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/gigworker.js"></script>
  </head>

  <!-- 230310 검토 -->
  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker serviceAgree">
      <!-- header -->
      <div id="header">
        <div class="container">
          <!-- <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button> -->
          <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap small">
            <h3 class="mainTitle normal">
              010PAY가 <br>
              <b>내 환급액 찾아드려요 !</b>
            </h3>
            <p class="subText">
              세금 환급 서비스 이용을 위해 <br>
              아래 약관 동의가 필요해요.
            </p>
          </div>

          <div>
            <button type="button" class="noraml-btn agreement-btn">전체 동의</button>
            <div class="formWrap">
              <div class="join-agree">
                <span class="checkbox square2 blank">
                  <input type="checkbox" name="agreeTerms" id="agreeTerms1">
                  <label for="agreeTerms1">(필수) 국세청 이용약관</label>
                </span>
                <ul class="inner-agree">
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree1_1">
                    <label for="innerAgree1_1">개인정보 이용 동의</label>
                    <button class="btn-view"></button>
                  </li>
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree1_2">
                    <label for="innerAgree1_2">제 3자 정보 제공 동의</label>
                    <button class="btn-view"></button>
                  </li>
                </ul>
              </div>
              <div class="join-agree">
                <span class="checkbox square2 blank">
                  <input type="checkbox" name="agreeTerms" id="agreeTerms2">
                  <label for="agreeTerms2">(필수) 헥토파이낸셜 이용약관</label>
                </span>
                <ul class="inner-agree">
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree2_1">
                    <label for="innerAgree2_1">서비스 이용약관</label>
                    <button class="btn-view"></button>
                  </li>
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree2_2">
                    <label for="innerAgree2_2">개인정보 수집 및 이용 동의</label>
                    <button class="btn-view"></button>
                  </li>
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree2_3">
                    <label for="innerAgree2_3">개인정보 제 3자 제공 동의</label>
                    <button class="btn-view"></button>
                  </li>
                </ul>
              </div>
              <div class="join-agree">
                <span class="checkbox square2 blank">
                  <input type="checkbox" name="agreeTerms" id="agreeTerms3">
                  <label for="agreeTerms3">(필수) 택스비 이용약관</label>
                </span>
                <ul class="inner-agree">
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree3_1">
                    <label for="innerAgree3_1">개인정보 수집 및 이용 동의</label>
                    <button class="btn-view"></button>
                  </li>
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree3_2">
                    <label for="innerAgree3_2">개인정보 제 3자 제공 동의</label>
                    <button class="btn-view"></button>
                  </li>
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree3_3">
                    <label for="innerAgree3_3">고유식별정보 수집 및 이용 동의</label>
                    <button class="btn-view"></button>
                  </li>
                </ul>
              </div>
              <div class="join-agree">
                <span class="checkbox square2 blank">
                  <input type="checkbox" name="agreeTerms" id="agreeTerms4">
                  <label for="agreeTerms4">(필수) 세무법인 택스비 이용약관</label>
                </span>
                <ul class="inner-agree">
                  <li>
                    <input type="checkbox" name="agreeTerms" id="innerAgree4_1">
                    <label for="innerAgree4_1">고유식별정보 수집 및 이용 동의</label>
                    <button class="btn-view"></button>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          
          <div class="botBtnWrap">
            <!-- 버튼 비활성화 시 disable 클래스 -->
            <button type="button" class="bot-btn disable">확인</button>
          </div>
        </div>
      </div>
      <!-- //content -->

      <!-- 약관 상세  -->
      <div id="termsDetail" class="modal-app modal modal-fullpage modal-terms depth2" style="display: none;">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h3 class="modal-title">개인정보 제 3자 제공 동의</h3>
              <button type="button" class="btn btn-icon btn-close"><i class="icon-times">닫기</i></button>
            </div>
            <div class="modal-body">
              <div class="terms text-lg termsContents">
                <p>내용</p>
                <p>&nbsp;</p>
                <p>내용</p>
                <p>1. 제공받는 자 : (주)헥토파이낸셜</p>
                <p>2. 제공 목적 : 발로소득 가입 여부 확인 및 발로소득 포인트 조회/사용(전환)</p>
                <p>3. 제공 정보 : 동일인 식별정보(CI), 접속 IP</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- // 약관 상세  -->
    </div>
    <!-- //wrap -->

    <script>
      $(document).ready(function(){
        // 약관 상세 모달
        var $termsModal = $('#termsDetail');
        $('.inner-agree .btn-view').click(function() {
          $termsModal.show();
        });
        $termsModal.find('.btn-close').click(function(){
            console.log(123)
            $termsModal.hide();
          });
      });
    </script>
  </body>
</html>
