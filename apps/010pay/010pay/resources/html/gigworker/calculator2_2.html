<!DOCTYPE html>

      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>

    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker searchPage">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <button type="button" class="searchBtn">프리랜서는 기타자영업으로 검색해보세요.</button>
          <button type="button" class="cancleBtn">취소</button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <div class="searchBefore pdLR22">
            <div class="titleWrap">
              <h3 class="mainTitle">
                이명구님은 <br>
                어떤 일을 하시나요? <em>👩‍🍳</em>
              </h3>
              <p class="subText">업종에 맞는 예상 소득세를 빠르게 계산해볼게요.</p>
            </div>
            <div class="selectJob">
              <button type="button">작가</button>
              <button type="button">화가 및 관련 예술가</button>
              <button type="button">작곡가</button>
              <button type="button">배우, 탤런트 등</button>
              <button type="button">모델</button>
              <button type="button">가수</button>
              <button type="button" class="active">성악가 등</button>
              <button type="button">1인 미디어 콘텐츠 창작자</button>
              <button type="button">연예보조 서비스</button>
              <button type="button">자문/고문</button>
              <button type="button">바둑기사</button>
              <button type="button">꽃꽂이교사</button>
              <button type="button">학원강사</button>
              <button type="button">직업운동가</button>
              <button type="button">유흥접객원 및 댄서</button>
              <button type="button">보험설계사</button>
              <button type="button">음료품배달원</button>
              <button type="button">방문판매원</button>
              <button type="button">기타자영업</button>
              <button type="button">다단계판매원의후원수당</button>
              <button type="button">기타모집수당</button>
              <button type="button">개인간병인</button>
              <button type="button">대리운전기사</button>
              <button type="button">골프장캐디</button>
            </div>
          </div>
          <div class="serchWrap">
            <div class="searchArea">
              <button type="button" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
              <input type="text" placeholder="프리랜서는 기타자영업으로 검색해보세요." value="강사" id="search"/>
              <button type="button" class="inputDel"></button>
              <button type="button" class="cancleBtn">취소</button>
            </div>
            <div class="searchAfter">
              <div class="isResult pdLR22">
                <h4 class="resultTitle">
                  <span>'강사'</span>로 검색된 업종이에요.
                </h4>
                <div class="selectJob">
                  <button type="button">작가</button>
                  <button type="button">화가 및 관련 예술가</button>
                  <button type="button">작곡가</button>
                  <button type="button">배우, 탤런트 등</button>
                  <button type="button">모델</button>
                  <button type="button">가수</button>
                  <button type="button" class="active">성악가 등</button>
                  <button type="button">1인 미디어 콘텐츠 창작자</button>
                  <button type="button">연예보조 서비스</button>
                  <button type="button">자문/고문</button>
                  <button type="button">바둑기사</button>
                  <button type="button">꽃꽂이교사</button>
                  <button type="button">학원강사</button>
                  <button type="button">직업운동가</button>
                  <button type="button">유흥접객원 및 댄서</button>
                  <button type="button">보험설계사</button>
                  <button type="button">음료품배달원</button>
                  <button type="button">방문판매원</button>
                  <button type="button">기타자영업</button>
                  <button type="button">다단계판매원의후원수당</button>
                  <button type="button">기타모집수당</button>
                  <button type="button">개인간병인</button>
                  <button type="button">대리운전기사</button>
                  <button type="button">골프장캐디</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- //content -->

      
    </div>
    <!-- //wrap -->


    <script>
      function searchToggle(state){
        if(state){
          $("body").addClass("noScroll");
          $(".serchWrap").css("display", "flex");
          $("#search").focus();
        } else {
          $("body").removeClass("noScroll");
          $(".serchWrap").css("display", "none");
        }
      }

      $(".searchBtn").on("click", function(){
        searchToggle(true);
        setTimeout(function(){
          $(".gigworker").addClass("searching");
        }, 50)
      });

      $("#search").on("propertychange change paste input", function(){
        if($(this).val().length > 0){
          $(".inputDel").show();           
        } else {
          $(".inputDel").hide(); 
        }
      });

      $(".cancleBtn").on("click", function(){
        searchToggle(false);
        $(".gigworker").removeClass("searching");
        $("#search").val("");
        $(".inputDel").hide(); 
      });

      $(".selectJob button").on("click", function(){
        $(".selectJob button").removeClass("active");
        $(this).addClass("active");
      });

      $(".inputDel").on("click", function(){
        $("#search").val("").focus();
        $(".inputDel").hide(); 
      });
    </script>
  </body>
</html>
