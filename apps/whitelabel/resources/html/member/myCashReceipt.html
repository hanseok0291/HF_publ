<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">

<!-- css -->
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">

<!-- javascript -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
</head>

<body>
<!-- IE 브라우저 지원 안내 -->
<!--[if lte IE 10]>
<div class="info-ie-update">
	<div class="container">
		<h2>브라우저를 업데이트해 주세요.</h2>
		<p>안전한 결제 환경을 위해 크롬, 엣지 또는<br> Internet Explorer 10 이상을 이용해 주세요.</p>
		<p class="btn-area">
			<a href="http://www.google.com/chrome" target="_blank" class="btn">크롬 설치</a>
			<a href="http://windows.microsoft.com/ko-kr/internet-explorer/download-ie" target="_blank" class="btn">엣지 설치 / IE 업데이트</a>
		</p>
	</div>
</div>
<![endif]-->
<!-- //IE 브라우저 지원 안내 -->

<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<header>
			<div class="container">
				<h1 class="page-title">현금영수증 설정</h1>
				<button type="button" id="btnBack" class="btn-icon btn-back">뒤로 가기</button>
				<button type="button" id="closeWindow" class="btn-icon btn-close hidden" data-toggle="modal" data-target="#commonConfirm">창 닫기</button>
			</div>
		</header>
		<!-- //header -->

		<!-- main content -->
		<main class="mypage">
			<!-- container -->
			<div class="container">
				<!-- section -->
				<section>
					<h3 class="hidden">현금영수증 설정</h3>

					<!-- form area -->
					<div class="form-area">
						<div class="form-group">
							<label class="form-label">발급 정보</label>
							<button type="button" id="select2" class="form-control select" data-toggle="modal" data-target="#select2Modal">개인소득공제(휴대폰 번호)</button>
							<input type="tel" class="form-control" placeholder="'-' 없이 입력" value="01012341234">
							<div class="text-error"></div>
						</div>
					</div>
					<!-- //form area -->

					<!-- info -->
					<ul class="info-list">
						<li>현금영수증 등록 정보는 현금영수증 자동 발급을 위해 저장되며, 회원 탈퇴 또는 서비스 종료 시까지 보관됩니다.</li>
						<li>등록 전 사용 금액은 소급 적용되지 않습니다.</li>
						<li>국세청 현금영수증 사이트에 등록하신 휴대폰 번호 또는 현금영수증 카드번호를 입력하셔야 합니다.</li>
					</ul>
					<!-- //info -->
				</section>
				<!-- //section -->
			</div>
			<!-- //container -->
		</main>
		<!-- //main content -->

		<!-- footer -->
		<footer>
			<!-- container -->
			<div class="container">
				<button type="button" id="submit" class="btn btn-lg btn-primary shadow">확인</button>
			</div>
			<!-- //container -->
		</footer>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 현금영수증 발급 수단 선택 -->
<div id="select2Modal" class="modal modal-slide" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h3 class="modal-title">현금영수증 선택</h3>
			</div>
			<div class="modal-body">
				<ul class="btn-list">
					<li class="active"><button type="button" class="btn btn-white" data-dismiss="modal" aria-label="Close">개인소득공제(휴대폰 번호)</button></li>
					<li><button type="button" class="btn btn-white" data-dismiss="modal" aria-label="Close">개인소득공제용(카드번호)</button></li>
					<li><button type="button" class="btn btn-white" data-dismiss="modal" aria-label="Close">지출증빙용(사업자등록번호)</button></li>
					<li><button type="button" class="btn btn-white" data-dismiss="modal" aria-label="Close">지출증빙용(카드번호)</button></li>
				</ul>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 현금영수증 발급 수단 선택 -->

<!-- modal - common -->
<div id="commonAlert" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="alertTitle" class="modal-title">알림</h3>
			</div>
			<div class="modal-body">
				<div id="alertContents">알려드립니다.</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- modal - common -->
<div id="commonConfirm" class="modal fade common" tabindex="-1" role="dialog" data-backdrop="static">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="confirmTitle" class="modal-title">안내</h3>
			</div>
			<div class="modal-body">
				<div id="confirmContents">확인하시겠습니까?</div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn btn-md btn-primary">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
$(document).ready(function(){
	// 현금영수증 선택
	$('#select2Modal .btn-list .btn').click(function(){
		var text = $(this).html();
		$('#select2').html(text);
	});
});
</script>
</body>
</html>
