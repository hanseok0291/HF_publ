<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker">
      <!-- header -->
      <div id="header">
        <div class="container searching">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <div class="searchArea">
            <input type="text" placeholder="프리랜서는 기타자영업으로 검색해보세요." id="search" value="강사"/>
            <button type="button" class="cancleBtn">취소</button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <div class="searchAfter">
            <div class="noResult">
              <h4 class="resultTitle pdLR24">
                일치하는 업종을 찾지 못했어요.
              </h4>
              <ul class="note">
                <li>검색어의 철자가 정확한지 확인해보세요.</li>
                <li>두 단어 이상의 검색어라면 띄어쓰기를 확인해보세요.</li>
                <li>
                  정확한 업종명이 기억나지 않는 경우, 단어의 일부만 입력하여
                  검색해보세요.
                  <p>예)  <span>강사</span> → 강사, 학원강사, 방과후강사, 학습지 방문강사 등</p>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->


    <script>
      $("#search").on("propertychange change paste input", function(){
        if($(this).val().length > 0){
          $(".container").addClass("searching");
        } else {
          $(".container").removeClass("searching");
        }
      });

      $(".cancleBtn").on("click", function(){
        $("#search").val("");
        $(".container").removeClass("searching");
      });

      $(".selectJob button").on("click", function(){
        $(".selectJob button").removeClass("active");
        $(this).addClass("active");
      });
    </script>
  </body>
</html>
