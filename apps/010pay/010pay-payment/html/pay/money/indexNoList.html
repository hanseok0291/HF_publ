<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../css/pay/transactionHistory.css" />
    <script src="../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../js/jquery-ui.js"></script>
    <script src="../../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="btn-back js-change-btn left-0">
              <i class="icon-back"></i>
            </button>
            <h2 class="page-title">머니</h2>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="container money-container">
          <div class="top-contents-wrap">
            <div class="top-contents-box">
              <div class="top-text-wrap">
                <button type="button" class="money-amount">0원</button>
              </div>
              <div class="money-control-wrap">
                <button type="button" class="withdraw-btn">충전하기</button>
                <p class="card-make-guide">전용카드 발급받고 혜택 받자~</p>
              </div>
            </div>
          </div>
          <div class="aml-info-wrap">
            <div class="text-wrap">
              <i class="icon-warning-red"></i>
              <p><b>출금해야 할 대기 머니</b>가 있어요.</p>
            </div>
            <button type="button">
              <i class="icon-arrow-right size-16"></i>
            </button>
          </div>
          <div class="aml-info-wrap">
            <div class="text-wrap">
              <i class="icon-warning-red"></i>
              <p><b>고객확인 정보 추가 입력</b>이 필요합니다.</p>
            </div>
            <button type="button">
              <i class="icon-arrow-right size-16"></i>
            </button>
          </div>
          <div class="banner-wrap">
            <img src="../../../images/payment/samlple/money-banner.png" alt="이번달만 특별 혜택! 쇼핑지원금 혜택 받자">
          </div>
          <div class="trade-tab-wrap">
            <ul class="tab-list">
              <li>
                <button type="button" class="active">전체</button>
              </li>
              <li>
                <button type="button">충전</button> 
              </li>
              <li>
                <button type="button">사용</button>
              </li>
              <li>
                <button type="button">출금</button>
              </li>
              <li>
                <button type="button">소멸</button>
              </li>
            </ul>
          </div>
          <div class="empty-list">
            <p>이용 내역이 없어요!</p>
          </div>
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- 보유 머니 바텀 시트 팝업 -->
    <div
      id="modal-money-info"
      class="modal modal-slide type-title money-info"
    >
      <div class="modal-dialog">
        <div class="modal-content" style="bottom: 0px; position: fixed">
          <div class="modal-head round-btn">
            <button type="button" class="btn btn-close js-modal-close">
            </button>
          </div>
          <div class="modal-body">
            <dl class="bold-text-wrap">
              <dt><b>보유 머니</b></dt>
              <ddl><b>12,000원</b></ddl>
            </dl>
            <dl>
              <dt>일반 머니</dt>
              <dd>1,010원</dd>
            </dl>
            <dl>
              <dt>휴대폰 충전 머니</dt>
              <dd>5,000원</dd>
            </dl>
            <dl class="bold-text-wrap">
              <dt><b>포인트</b></dt>
              <dd><b>2,000원</b></dd>
            </dl>
          </div>
        </div>
      </div>
    </div>
    <!-- //보유 머니 바텀 시트 팝업 -->

    <!-- 충전하기 유도 모달 팝업 -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <p id="alertContents">전용통장으로 머니 관리하고 <br>이자받으세요!</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              충전하기
            </button>
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              자세히 보기
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //충전하기 유도 모달 팝업 -->
  </body>
  <script>
    $(function(){
      $(window).on("scroll", function(){
        var scrollTop = $(window).scrollTop();
        var tradeTabOffset = $(".trade-tab-wrap").offset().top - 64;
        if (scrollTop >= tradeTabOffset) {
          $(".trade-tab-wrap").addClass("fixed");
        } else {
          $(".trade-tab-wrap").removeClass("fixed");
        }
      });
    });
  </script>
</html>
