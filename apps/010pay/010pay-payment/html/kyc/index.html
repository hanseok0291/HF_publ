  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    var isTooltip = false;
    $(".tooptip-box button").on("click", function () {
      if (!isTooltip) {
        $(this).next(".tooltip-text").show();
      } else {
        $(this).next(".tooltip-text").hide();
      }
      isTooltip = !isTooltip;
    });

    // 우편번호 검색 열기
    function openPostcode() {
      document.getElementById("postcodeOverlay").style.display = "block"; // 전체 화면 레이어 표시

      new daum.Postcode({
        oncomplete: function (data) {
          // 검색 완료 시 레이어 닫기
          closePostcode();

          // 주소를 특정 input에 넣기
          var fullAddr = data.address; // 기본 주소
          var extraAddr = ""; // 참고 항목

          // 참고 항목 추가
          if (data.addressType === "R") {
            if (data.bname !== "") {
              extraAddr += data.bname;
            }
            if (data.buildingName !== "") {
              extraAddr +=
                extraAddr !== "" ? ", " + data.buildingName : data.buildingName;
            }
            fullAddr += extraAddr !== "" ? " (" + extraAddr + ")" : "";
          }

          // 주소를 input에 설정
          document.getElementById("addressInput").value = fullAddr;
        },
        width: "100%",
        height: "100%",
      }).embed(document.getElementById("postcodeContainer")); // 검색 창을 전체 화면에 임베드
    }

    // 레이어 닫기
    function closePostcode() {
      document.getElementById("postcodeOverlay").style.display = "none";
    }
  </script>
