<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/web/home.css" />
    <link rel="stylesheet" href="../../css/web/layout.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
    <script src="../../js/lottie.min.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="flex-container">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <button type="button" class="left-0 text-btn">
              내 정보
            </button>
            <h2 class="page-title">
              <img class="rrpay-logo" src="../../images/web/round_pay_logo.svg" alt="RROUND PAY">
            </h2>
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content" class="flex-container">
        <!-- container -->
        <div class="container home-container">
          <div class="text-wrap">
            <p class="title-text">더 나은 일상을 위한 간편결제</p>
            <p class="sub-text">
              자세한 정보는 라운드 앱 → 페이에서 <br>
              확인할 수 있어요. <br>
              앱 설치 후 간편한 라이프를 경험해보세요.
            </p>
          </div>
          <img class="qr-img" src="../../images/web/account/rround-qr-img.png" alt="RROUND PAY QR">
        </div>
        <!-- //container -->
        <div class="button-wrap">
          <button type="button" class="btn">
            라운드 설치하기
          </button>
          <button type="button" class="btn btn-logout">
            로그아웃
          </button>
        </div>
      </div>
    </div>
    <!-- //wrap -->
  </body>
  <script>
    $(document).ready(function () {

    });
  </script>
</html>
