<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../../../css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../../../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../../../css/promotion.css" />
    <script src="../../../../js/jquery.3.4.1.min.js"></script>
    <script src="../../../../js/jquery-ui.js"></script>
    <script src="../../../../js/design_renewal.js" defer="defer"></script>
    <script src="../../../../js/swiper.js"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="rroundHow">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title"></h2>
            <button type="button" class="btn-close">
              <i class="icon-close icon-close-white"></i>
            </button>
          </div>
        </div>
        <!-- headline -->
        <div class="headline">
          <p class="small-title">쓸수록 혜택받는 간편결제</p>
          <p class="big-title">라운드 페이 <br />어떻게 사용하나요?</p>
        </div>
        <!-- //headline -->
        <!-- float img -->
        <div class="float-wrap">
          <span class="img img-1"></span>
          <span class="img img-2"></span>
          <span class="img img-3"></span>
        </div>
        <!-- float img -->
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <!-- container -->
        <div class="">
          <!-- section -->
          <div class="section">
            <div class="sec sec-1 scroll-fade-up">
              <span class="label">간편결제</span>
              <p class="title">
                매번 등록할 필요 없어요<br />
                한 번 설정하고 간편하게 결제해요
              </p>
              <div>
                <div class="swiper-container">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <img
                        src="../../../../images/promotion/rroundHow/sec1-slide-01.png"
                        alt="등록 한 번으로 간편하게 결제해요"
                        class=""
                      />
                    </div>
                    <div class="swiper-slide">
                      <img
                        src="../../../../images/promotion/rroundHow/sec1-slide-02.png"
                        alt="결제 비밀번호는 안전하게 관리하고 있어요"
                        class=""
                      />
                    </div>
                  </div>
                  <div class="swiper-pagination"></div>
                </div>
              </div>
            </div>
            <div class="sec sec-2 scroll-fade-up">
              <span class="label">정기결제</span>
              <p class="title">
                정기적으로 필요한 상품·<br class="mo-br" />서비스를<br class="pc-br" />
                놓치지 않도록 꼭 성공할게요!
              </p>
              <div>
                <div class="swiper-container swiper2">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <img
                        src="../../../../images/promotion/rroundHow/sec2-slide-01.png"
                        alt="결제 실패 걱정없이 더 편리하게 이용할 수 있어요"
                        class=""
                      />
                    </div>
                    <div class="swiper-slide slide2">
                      <img
                        src="../../../../images/promotion/rroundHow/sec2-slide-02.png"
                        alt="보유 머니가 부족하면 결제 전 알람을 드려요"
                        class=""
                      />
                    </div>
                  </div>
                  <div class="swiper-pagination"></div>
                </div>
              </div>
            </div>
            <div class="sec sec-3 scroll-fade-up">
              <span class="label">혜택</span>
              <p class="title">
                결제를 더 즐겁게<br />
                경험하세요!
              </p>
              <div>
                <ul class="list-wrap">
                  <li>
                    <p class="small-text">결제 수단 등록하면</p>
                    <p class="big-text">라운드 로또 지급</p>
                  </li>
                  <li>
                    <p class="small-text">간편결제 수단으로</p>
                    <p class="big-text">포인트 적립</p>
                  </li>
                  <li>
                    <p class="small-text">머니로 결제하면</p>
                    <p class="big-text">포인트 적립률 UP!</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <!-- //section -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="promptTitle"></h3>
            <p id="promptContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalCloseAlert();"
              class="btn btn-cancel"
            >
              취소
            </button>
            <button
              type="button"
              onclick="modalCloseAlert();"
              id="promptOk"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->
    <script>
      const targets = document.querySelectorAll(".scroll-fade-up");

      const observer = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry, index) => {
            if (entry.isIntersecting) {
              // 순차적으로 delay 주기
              setTimeout(() => {
                entry.target.classList.add("active");
              }, index * 300); // 300ms씩 순차 delay
              observer.unobserve(entry.target); // 1번만 실행하고 제거
            }
          });
        },
        {
          threshold: 0.1,
        },
      );

      targets.forEach((target) => observer.observe(target));

      document.addEventListener("DOMContentLoaded", () => {
        const swiper = new Swiper(".swiper-container", {
          loop: true, // 무한 롤링
          autoplay: {
            delay: 2000, // 3초마다 슬라이드 전환
            disableOnInteraction: false, // 사용자와 상호작용 후에도 자동 롤링 유지
          },
          slidesPerView: 1, // 한 번에 보이는 슬라이드 수
          pagination: {
            el: ".swiper-pagination",
          },
        });
      });
    </script>
  </body>
</html>
