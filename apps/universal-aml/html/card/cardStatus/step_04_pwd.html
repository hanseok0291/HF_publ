<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>헥토파이낸셜</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/common.css" />
    <link rel="stylesheet" href="../../../css/card.css" />
    <script src="../../../js/jquery-1.8.3.min.js"></script>
    <script src="../../../js/common.js" defer></script>
    <script src="../../../js/aml.js" defer></script>
    <script src="../../../js/design_renewal.js" defer></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="card step card-status-step-04-pwd keypad-on">
      <!-- header -->
      <header class="header">
        <div class="container">
          <button type="button" class="btn-back btn"></button>
          <h1 class="brand-name">카드 비밀번호 등록</h1>
          <button type="button" class="btn-close btn"></button>
        </div>
      </header>
      <!-- //header -->
      <div class="step-bar">
        <div class="step-wrap">
          <span class="step step-05"></span>
        </div>
      </div>
      <!-- section -->
      <section>
        <div id="content" class="container keypad-on">
          <div class="tit-wrap">
            <!-- tit -->
            <h2 class="tit">
              카드 비밀번호 4자리를 <br />
              설정해주세요.
            </h2>
            <!-- //tit -->
          </div>

          <div class="form-wrap">
            <div class="input-mark">
              <span class="mark mark--4" role="group" aria-label="카드 비밀번호 4자리">
                <i id="pwd_01"></i>
                <i id="pwd_02"></i>
                <i id="pwd_03"></i>
                <i id="pwd_04"></i>
              </span>
            </div>
          </div>

          <p class="pwd-guide">
            카드 비밀번호에 주민등록번호 일부, 전화번호, <br />
            연속 또는 반복된 번호는 사용 불가합니다.
          </p>
        </div>

        <!-- 보안키패드 -->
        <div class="nppfs-keypad-div">
          <div class="kpd-wrap kpd-image">
            <img
              src="../../../images/card/keypad-card-pwd.png"
              alt="보안키패드"
            />
          </div>
        </div>
        <!-- //보안키패드 -->
      </section>
      <!-- //section -->
    </div>
    <!-- //wrap -->

    <!-- common prompt -->
    <div id="commonPrompt" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 class="prompt-title"></h3>
            <p class="prompt-contents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-cancel"
            >
              아니오
            </button>
            <button
              type="button"
              onclick="modalClose();"
              id="promptOk"
              class="btn btn-confirm"
            >
              예
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common prompt -->

    <script>
      $(".btn-close.btn").click(function () {
        $.promptMessage(
          "",
          "선불충전서비스를 이용하기 위해서는<br>본인확인이 필요합니다.<br><br><b>본인확인을 계속 하시겠습니까?</b>",
          $("#commonPrompt"),
        );
      });

      (function () {
        var dots = document.querySelectorAll(".input-mark .mark i");
        var filled = 0;
        var keypad = document.querySelector(".nppfs-keypad-div .kpd-wrap");

        if (!keypad) return;

        keypad.addEventListener("click", function () {
          if (filled < dots.length) {
            dots[filled].classList.add("on");
            filled += 1;
          }

          if (filled >= dots.length) {
            setTimeout(function () {
              location.href = "step_04_pwd_verify.html";
            }, 300);
          }
        });
      })();
    </script>
  </body>
</html>
