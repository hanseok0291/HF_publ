<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>핫딜</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="../css/slick.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="https://code.jquery.com/jquery-2.2.0.min.js"></script>
	<script src="../js/slick.js"></script>
    <script src="../js/modal.js"></script>
</head>
<body>

<!-- form -->
<form class="apply-form">
    <!-- wrap -->
    <div id="wrap" class="detail-page apply-page">

        <!-- header -->
        <div id="header" class="detail-header bg-white">
            <div class="container">
                <h1 class="page-title-wrap">
                    <a href="#" class="page-title">
                        <span><i class="icon-arrow-left"></i></span>
                        <span class="page-title-name">핫딜 응모</span>
                    </a>
                </h1>
            </div>
        </div>
        <!-- //header -->

        <!-- top-bar -->
        <div class="top-bar">
            <div class="container">
                입력하신 정보를 <strong class="highlight">다시 한 번 꼭 확인하세요<i class="italic">!</i></strong>
            </div>
        </div>
        <!-- //top-bar -->

        <!-- content -->
        <div id="content" class="apply-content">
            <div class="container">
                <!-- apply-input-group -->
                <div class="apply-input-group">
                    <div class="apply-input-inner">
                        <!-- 정보 입력 -->
                        <div class="apply-input">
                            <div class="form-type">
                                <div class="type-box">
                                    <label for="custAddress" class="label">배송 주소</label>
                                    <div class="position-relative">
                                        <input type="text" name="custAddress" id="custAddress" maxlength="20"
                                            placeholder="건물,지번 또는 도로명 검색">
                                        <input type="text" name="custAddress" id="custAddressInput" maxlength="20"
                                            placeholder="상세주소 입력">
                                    </div>
                                    <p class="error">정확한 배송 주소를 입력하세요</p>
                                </div>
                                <div class="type-box">
                                    <label for="custTel" class="label">휴대폰 번호</label>
                                    <div class="position-relative">
                                        <input type="tel" name="custTel" id="custTel" maxlength="11"
                                            placeholder="휴대폰 번호 입력">
                                    </div>
                                    <p class="error">정확한 휴대폰 번호를 입력하세요</p>
                                </div>
                                <div class="type-box">
                                    <label for="custEmail" class="label">이메일</label>
                                    <div class="input input-myid">
                                        <input type="email" name="custEmail" id="custEmail" maxlength="20"
                                            placeholder="이메일 주소 입력">
                                    </div>
                                    <p class="error">정확한 이메일 주소를 입력하세요</p>
                                </div>
                            </div>
                        </div>
                        <!-- //정보 입력 -->
                        <!-- 약관 동의 -->
                        <div class="terms-agree">
                            <div class="join-agree">
                                <div class="agree-all">
                                    <span class="checkbox parents">
                                        <input type="checkbox" name="agreeAll" id="agreeAll_01">
                                        <label for="agreeAll_01">약관 전체 동의</label>
                                    </span>
                                </div>
                                <ul class="agree-list">
                                    <li>
                                        <span class="checkbox child">
                                            <input type="checkbox" name="agree_01" id="agree_01_01">
                                            <label for="agree_01_01">개인정보 수집 이용 동의(필수)</label>
                                            <a href="#" class="agree-btn"><i class="icon-arrow-right"></i></a>
                                        </span>
                                    </li>
                                    <li>
                                        <span class="checkbox child">
                                            <input type="checkbox" name="agree_01" id="agree_01_02">
                                            <label for="agree_01_02">개인정보 위탁에 관한 사항</label>
                                            <a href="#" class="agree-btn"><i class="icon-arrow-right"></i></a>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- //약관 동의 -->
                    </div>

                    <!-- btn-box -->
                    <div class="btn-box btn-detail bg-gray-gradient">
                        <button type="button" class="btn" disabled>응모하기</button>
                    </div>
                    <!-- //btn-box -->
                </div>
                <!-- //apply-input-group -->
            </div>
        </div>
        <!-- //content -->

    </div>
    <!-- //wrap -->
</form>
<!-- //form -->

</body>
</html>
