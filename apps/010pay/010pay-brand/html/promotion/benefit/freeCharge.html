<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<link rel="stylesheet" type="text/css" href="../../../resource/fonts/notosanskr-v13/notosanskr.min.css">
<link rel="stylesheet" type="text/css" href="../../../resource/css/promotion.css">
<script src="../../../resource/library/jquery-1.8.3.min.js"></script>
<style>
	.wrap-promotion .section { position: relative; }
	.wrap-promotion .section img { display: block; }
	.wrap-promotion .section .container { background: transparent; padding-bottom: 24px; }
	.wrap-promotion .section .container.bg-on { background: linear-gradient(180deg,rgba(102,102,102,0) 0,rgba(102,102,102,.1) 100%) }
	.wrap-promotion .section .img-end { display: none; position: absolute; top: 23.93%; left: 0; width: 38.8%; }
	.wrap-promotion .section .img-end.on { display: block; }
	.wrap-promotion .section .img-end1 { left: 8.4%; }
	.wrap-promotion .section .img-end2 { left: 52.8%; }
	.wrap-promotion .section .img-end3 { top: 53.31%; left: 8.4%; }
	.wrap-promotion .section .img-end4 { top: 53.31%; left: 52.8%; }
	.wrap-promotion .footer-btn .btn { background: #151515;} 
</style>
</head>

<body>
	<!-- wrap -->
	<div id="wrap" class="wrap-promotion free-charge animation-section">
		<!-- main content -->
		<div id="content">
			<!-- container -->
			<div class="container full">
			<!-- section - img -->			
				<div class="section section-1">
					<img class="ani-slide-1" src="../../../resource/images/promotion/benefit/freecharge-01.png" alt="무료충전소 더블 적립 혜택 이벤트 기간 2월 16일 오전 10시~ 2월 28일 오전 10시 대상 010PAY 회원 누구나">
					<img class="ani-slide-2" src="../../../resource/images/promotion/benefit/freecharge-02.png" alt="적립금액 10% up, 10% 추가 적립까지">
				</div>
				
				<div class="section section-2">
					<img class="ani-slide-1" src="../../../resource/images/promotion/benefit/freecharge-03.png" alt="무료 충전소가 4개로 늘었어요!">
					<img class="ani-slide-2" src="../../../resource/images/promotion/benefit/freecharge-04.png" alt="터치만 해도 계속 쌓여요, 미션 성공하면 쏟아져요">
					<img class="ani-slide-3" src="../../../resource/images/promotion/benefit/freecharge-05.png" alt="간단 참여로 팡팡 터져요, 클릭 몇 번으로 적립 받아요">
					<img class="ani-slide-4" src="../../../resource/images/promotion/benefit/freecharge-06.png" alt="다양해진 무료 충전소를 기념하며 풍성한 혜택 2개를 준비했어요.">
					<img class="ani-slide-5" src="../../../resource/images/promotion/benefit/freecharge-07.png" alt="화살표">
				</div>

				<div class="section section-3">
					<img class="ani-slide-1" src="../../../resource/images/promotion/benefit/freecharge-08.png" alt="혜택 1 무료 충전소 적립 금액 up">
					<img class="ani-slide-2" src="../../../resource/images/promotion/benefit/freecharge-09.png" alt="무료 충전소 적립 금의이 10% 늘었어요. 기존과 똑같이 참여하고 10% 더 적립 받으세요">
					<img class="ani-slide-3" src="../../../resource/images/promotion/benefit/freecharge-hr.png" alt="다음 혜택">
					<img class="ani-slide-4" src="../../../resource/images/promotion/benefit/freecharge-10.png" alt="혜택 2 무료 충전 금액의 10% 추가 적립!">
					<img class="ani-slide-5" src="../../../resource/images/promotion/benefit/freecharge-11.png" alt="이벤트 기간 동안 무료 충전소에서 적립받은 포인트의 10%를 추가로 적립해 드려요! *3월 6일 일괄 지급">
					<div class="inner-link ani-slide-6">
						<a href="#"></a><!-- 내통장결제 가맹점으로 이동 버튼 -->
						<img src="../../../resource/images/promotion/benefit/freecharge-12.png" alt="이벤트가 끝난 후에도 추가된 충전소는 계속 만나볼 수 있어요. 열심히 모은 포인트 어디서 쓸지 고민이라면? 지금 포인트 사용처를 확인해 보세요!">
					</div>
				</div>

				<div class="section section-4">
					<img class="ani-slide-1" src="../../../resource/images/promotion/benefit/freecharge-13.png" alt="유의사항">
					<!-- text(스크린 리더용) -->
					<div class="sr-only">
						<p>본 이벤트는 가장 최신 버전의 앱에서만 참여할 수 있습니다.</p>
						<p>본 이벤트는 사전 공지 없이 변경되거나 조기 종료될 수 있습니다.</p>
						<p>1원 적립 미션은 이벤트 대상에서 제외됩니다.</p>
						<p>무료 충전소 관련 문의는 각 충전소 고객 센터를 이용해 주세요.</p>
						<p>추가 적립 포인트의 유효기간은 90일입니다.</p>
						<p>3월 1일부터 머니&포인트 정책이 변경됩니다. 추가 적립 포인트 일괄 지급 시점(3월 6일)에 포인트 보유 한도 초과 시 초과분은 적립되지 않습니다.</p>
					</div>
					<!-- //text(스크린 리더용) -->
				</div>
				
				<div class="section">
					<div class="footer-btn bottom">
						<div class="container"><button type="button" class="btn">혜택 바로가기</button></div>
					</div>
				</div>
				<!-- //section - img -->
			</div>
			<!-- //container-->
		</div>
		<!-- //main content -->
	</div>
	<!-- //wrap -->
	<script>
		$(document).ready(function(){
			$(window).scroll(function(){
				var scrollT = $(this).scrollTop();
		
				// 스크롤 시 하단 버튼 토글
				if (scrollT > 10) {
					$(".footer-btn").css("margin-bottom", 0);
				} else {
					$(".footer-btn").css("margin-bottom", "-100%");
				}

				if($(window).scrollTop() + $(window).height() == $(document).height()) {
					$(".wrap-promotion .section .container").addClass('bg-on');
				} else {
					$(".wrap-promotion .section .container").removeClass('bg-on');
				}
		
				// 스크롤 최하단일 경우 하단 버튼 배경 제거
				var scrollMax = $("#content").innerHeight() - $(window).innerHeight() - 100;
				if (scrollT > scrollMax) {
					$(".footer-btn").addClass("bottom");
				} else {
					$(".footer-btn").removeClass("bottom");
				}
			});

			// 스크롤 시 애니메이션 활성화
			var winHeight = $(window).height();
			var scrollTop = $(window).scrollTop();
			
			function sectionActive(){
				// section active
				$(".section").each(function(){
					var sectionTop = $(this).offset().top;
					if (scrollTop > sectionTop - winHeight + winHeight/4) {
						$(this).addClass("active");
					}
				});
			}

			$(window).load(function(){
				setTimeout(function(){
					sectionActive();
				}, 100);
			});
			
			$(window).scroll(function(){
				sectionActive();
				scrollTop = $(window).scrollTop();
				if (scrollTop > 30) {
					$("body:not(.modal-open) .fixed-bottom").addClass("active");
				} else {
					$("body:not(.modal-open) .fixed-bottom").removeClass("active");
				}
			});
		});
		</script>
</body>
</html>
