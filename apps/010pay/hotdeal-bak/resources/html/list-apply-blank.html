<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>핫딜</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="../css/slick.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="https://code.jquery.com/jquery-2.2.0.min.js"></script>
	<script src="../js/slick.js"></script>
    <script src="../js/modal.js"></script>
</head>
<body>

<!-- wrap -->
<div id="wrap" class="detail-page list-page">

    <!-- header -->
    <div id="header" class="detail-header bg-white">
        <div class="container clearfix">
            <h1 class="page-title-wrap"><a href="#" class="page-title"><i class="icon-arrow-left"></i><strong
                        class="page-title-name">핫딜 목록</strong></a></h1>
            <div class="btn-guide-wrap"><a href="#" class="btn-guide">안내</a></div>
        </div>
    </div>
    <!-- //header -->

    <!-- content -->
    <div id="content" class="list-page-content">

        <!-- hotdeal-tab -->
        <div id="hotdeal-tab-wrap" class="hotdeal-tab-wrap">
            <div class="container">
                <ul class="hotdeal-tab clearfix">
                    <li><span class="tab-menu active">응모한</span></li>
                    <li><span class="tab-menu">진행&middot;예정</span></li>
                    <li><span class="tab-menu">관심있는</span></li>
                    <li><span class="tab-menu">종료된</span></li>
                </ul>
            </div>
        </div>
        <!-- //hotdeal-tab -->

        <!-- tab-blank-content -->
        <div class="tab-blank-content">
            <div class="container">
                <div id="hotdeal-tab-1" class="blank-box active">
                    <p class="blank-txt"><i class="icon-blank"></i> 아직 응모한 핫딜이 없어요</p>
                </div>

                <div id="hotdeal-tab-2" class="blank-box">
                    <p class="blank-txt"><i class="icon-blank-ready"></i> 엄청난 핫딜을 준비중이에요<i class="italic">!</i></p>
                </div>

                <div id="hotdeal-tab-3" class="blank-box">
                    <p class="blank-txt"><i class="icon-blank-pick"></i> 관심 핫딜이 없어요<br>관심 핫딜을 설정해 보세요<i
                            class="italic">!</i>
                    </p>
                </div>

                <div id="hotdeal-tab-4" class="blank-box">
                    <p class="blank-txt"><i class="icon-blank"></i> 종료된 핫딜이 없어요</p>
                </div>
            </div>
        </div>
        <!-- //tab-blank-content -->
    </div>
    <!-- //content -->

</div>
<!-- //wrap -->
    
</body>
</html>
