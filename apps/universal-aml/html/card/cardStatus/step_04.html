    <script>
      $(window).on("load", function () {
        formatPhoneNumber();
      });

      $(".btn-close.btn").click(function () {
        $.promptMessage(
          "",
          "선불충전서비스를 이용하기 위해서는<br>본인확인이 필요합니다.<br><br><b>본인확인을 계속 하시겠습니까?</b>",
          $("#commonPrompt"),
        );
      });

      var swiper = new Swiper(".mySwiper", {
        slidesPerView: "auto",
        centeredSlides: true,
        spaceBetween: 80,
        loop: true,
        pagination: {
          el: ".swiper-pagination",
        },
        on: {
          init: function () {
            updateCardInfo(this);
          },
          slideChange: function () {
            updateCardInfo(this);
            resetCardFlip();
          },
        },
        /*         navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        pagination: {
        el: ".swiper-pagination",
      }, */
      });

      function resetCardFlip() {
        document.querySelectorAll(".card-flip.is-flipped").forEach(function (flip) {
          flip.classList.remove("is-flipped");
        });
        document.querySelectorAll(".btn-card-flip").forEach(function (btn) {
          btn.setAttribute("aria-label", "카드 뒷면 보기");
          btn.setAttribute("aria-pressed", "false");
        });
      }

      document.querySelectorAll(".btn-card-flip").forEach(function (btn) {
        btn.addEventListener("click", function (event) {
          event.stopPropagation();
          var flip = this.closest(".card-flip-wrap").querySelector(".card-flip");
          var isFlipped = flip.classList.toggle("is-flipped");
          this.setAttribute(
            "aria-label",
            isFlipped ? "카드 앞면 보기" : "카드 뒷면 보기",
          );
          this.setAttribute("aria-pressed", isFlipped ? "true" : "false");
        });
      });

      function updateCardInfo(swiperInstance) {
        const cardInfo = document.querySelector(".card-info");
        if (!cardInfo) return;

        // loop 모드일 때는 realIndex 사용
        const index = swiperInstance.params.loop
          ? swiperInstance.realIndex
          : swiperInstance.activeIndex;
        const allSlides = document.querySelectorAll(".mySwiper .swiper-slide");
        const activeSlide = allSlides[index];

        if (activeSlide) {
          const cardInfoData = activeSlide.getAttribute("data-card-info");
          if (cardInfoData) {
            cardInfo.innerHTML = cardInfoData;
          }
        }
      }

    </script>
