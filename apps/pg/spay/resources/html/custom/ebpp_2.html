        <script>
            $(document).ready(function () {
                $("ul.select-group li input").click(function () {
                    var tab_id = $(this).attr("data-tab");

                    $("ul.select-group li").removeClass("current");
                    $(".select-content").removeClass("current");

                    $(this).addClass("current");
                    $("#" + tab_id).addClass("current");
                });

                $("ul.select-list li").click(function () {
                    $("ul.select-list li").removeClass("active");
                    $(this).addClass("active");
                });
            });

            // 카드사 선택시 할부선택 드롭박스 활성화
            // document.addEventListener('DOMContentLoaded', function () {
            // 	var selectItems = document.querySelectorAll('.select-list li');
            // 	var select = document.querySelector('.form-type select');
            // 	var checkAll = document.getElementById('check-all');
            // 	var send = document.getElementById('send');

            // 	selectItems.forEach(function (item) {
            // 		item.addEventListener('click', function () {
            // 			if (this.classList.contains('active')) {
            // 				select.disabled = false;
            // 			} else {
            // 				select.disabled = true;
            // 			}
            // 		});
            // 	});

            // 	checkAll.addEventListener('change', function () {
            // 		if (this.checked) {
            // 			send.disabled = false;
            // 		} else {
            // 			send.disabled = true;
            // 		}
            // 	});

            // });
            var selectItems = document.querySelectorAll(".select-list li");
            var select = document.querySelector(".form-type select");
            var checkAll = document.getElementById("check-all");
            var sendButton = document.getElementById("send");

            // select 요소의 변경 이벤트 감지
            select.addEventListener("change", function () {
                updateSendButton();
            });

            // checkAll 요소의 변경 이벤트 감지
            checkAll.addEventListener("change", function () {
                updateSendButton();
            });

            // select 요소의 변경 또는 checkAll 요소의 변경에 따라 sendButton의 disabled 속성을 업데이트
            function updateSendButton() {
                if (select.disabled === false && checkAll.checked === true) {
                    sendButton.disabled = false;
                } else {
                    sendButton.disabled = true;
                }
            }

            // 초기에도 한번은 실행
            updateSendButton();

            // 각 select-list 요소의 클릭 이벤트 감지
            document.querySelector(".select-list").addEventListener("click", function (event) {
                var target = event.target;
                if (target && target.tagName === "LI") {
                    if (target.classList.contains("active")) {
                        select.disabled = false;
                    } else {
                        select.disabled = true;
                    }
                    updateSendButton();
                }
            });
        </script>
