<!doctype html>
<html lang="ko">
<head>
<title>내통장결제</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/jquery-ui.css">
<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/common.css?ezauthver=5.0">

<link rel="stylesheet" href="../../css/common_one.css">
<link rel="stylesheet" href="../../css/layout_one.css">
<link rel="stylesheet" href="../../css/queries_one.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/jquery-ui.js"></script>
<script src="../../js/jquery.ui.touch-punch.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/design.js?ezauthver=5.0" defer="defer"></script>
<script src="../../js/commonmsg.js?ezauthver=5.0"></script>
<script src="../../js/commonutil.js?ezauthver=5.0"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<div class="layout-payment">
	<!-- wrap -->
	<div id="wrap" class="wrap oneStore">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back hidden"><i class="icon-angle-left">뒤로가기</i></button>
				<h1 class="brand-name hidden"><a href="#"><span class="my-logo"><img src="../../images/logo-myaccount.png" class="logo" alt="내통장결제"></span></a></h1>
				<h2 class="page-title">계좌 인증</h2>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- headline -->
				<div class="headline">
					<p><span class="medium">아래 계좌의 거래내역에서 <strong>입금된 1원</strong>의</span><br>
						<strong>입금자명을 입력</strong>하세요.</p>
				</div>
				<!-- //headline -->

				<!-- 거래내역 예시 -->
				<div class="section account-auth">
					<div class="account-box">
						<span class="account-number"><img src="../../images/bank/logo_090.png" alt="카카오뱅크"> 카카오뱅크 <em class="number"><i>****</i>123</em></span>
					</div>
					<div class="account-box detail">
						<div class="left">
							<p class="label">입금자명</p>
							<p class="value text-error">
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
								<span><i class="mark">*</i></span>
							</p>
						</div>
						<div class="right">
							<p class="label">입금금액</p>
							<p class="value">1<span>원</span></p>
						</div>
					</div>
				</div>
				<!-- //거래내역 예시 -->

				<!-- 정보 입력 -->
				<div class="section">
					<div class="input input-box">
						<label for="" class="label">입금자명</label>
						<input type="text" class="text-brand" placeholder="입금자명 4자리 입력">
					</div>
				</div>
				<!-- //정보 입력 -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<button type="button" id="send" class="btn" disabled>확인</button>
				</div>
				<!-- container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
	</div>
</form>
<!-- //form -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="loading">
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
					<div class="loading-bar"></div>
				</div>
				<span class="text">로딩 중</span>
			</div>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<p id="alertContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<p id="promptContents"></p>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->
</body>
</html>
