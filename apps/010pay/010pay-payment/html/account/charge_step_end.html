<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>내통장결제</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <h2 class="page-title"></h2>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content" class="h-full">
                <div id="passwordSet" class="h-full">
                    <div class="password-wrap">
                        <div>
                            <div class="content-wrap">
                                <h3 class="title">
                                    <i class="icon-round-big-orange"></i>
                                    <p>
                                        10,000원을<br />
                                        충전했어요
                                    </p>
                                </h3>
                            </div>
                        </div>
                    </div>
                    <div class="result-wrap">
                        <div class="container">
                            <ul class="result-list">
                                <li>
                                    <p>충전 후 머니</p>
                                    <p><strong>24.000원</strong></p>
                                </li>
                                <li>
                                    <p>충전 번호</p>
                                    <p>010 1234 1234</p>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <button type="button" id="send" class="btn">홈으로 가기</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->

        <!-- 충전 실패 -->
        <div id="balanceWarningModal" class="modal round-button-modal center">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3>계좌 잔액이 부족하여<br />충전을 못했어요.</h3>
                        <p>휴대폰 후불 충전을 이용해보세요.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="balanceLater" onclick="modalCloseAlert();" class="btn">다음에</button>
                        <button type="button" id="balanceRecharge" onclick="modalCloseAlert();" class="btn">휴대폰충전</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //충전 실패 -->

        <!-- 충전 실패 -->
        <div id="balanceWarningModal2" class="modal round-button-modal left" style="display: block">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3>충전이 안됐어요.</h3>
                        <p>통신사에 설정한 결제 한도를 확인해 주세요!</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="balanceLater" onclick="modalCloseAlert();" class="btn btn-full">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //충전 실패 -->
    </body>
    <script>
        $(document).ready(function () {});
    </script>
</html>
