<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>내통장결제</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/owl.carousel.min.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <!-- <link rel="stylesheet" href="../../css/common_renewal.css" /> -->
    <link rel="stylesheet" href="../../css/payment/pay_bridge.css" />
    
    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <!-- <script src="../../js/jquery-ui.js"></script> -->
    <!-- <script src="../../js/design_renewal.js" defer="defer"></script> -->
  </head>
  <body>
    <!-- wrap -->
    <div id="wrap" class="pay-bridge-wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <h1 class="brand-name">
            <a href="#">
              <span class="my-logo">
                <img
                  src="../../images/logo-hecto-myaccount.svg"
                  class="logo"
                  alt="내통장결제"
                />
              </span>
            </a>
          </h1>
          <button type="button" id="closeWindow" class="btn-close">
            <i class="icon-times">창닫기</i>
          </button>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <!-- section -->
          <div class="section">
            <!-- payment info -->
            <div class="payment-info-area">
              <div class="payment-info-text">
                <p class="merchant-name">
                  <strong>헥토헬스케어(또박배송)</strong>에서
                </p>
                <p class="payment-amount">
                  <strong class="amount-primary">84,000원</strong>을 결제합니다.
                </p>
              </div>
              <p class="product-name">[12개월 정기구독] 드시모네 4500</p>
            </div>
            <!-- //payment info -->
          </div>
          <!-- //section -->

          <!-- bottom area -->
          <div class="bottom-area">
            <!-- button area -->
            <div class="btn-area">
              <button type="button" class="btn btn-web-payment">
                현재 화면에서 결제
              </button>
              <button type="button" class="btn btn-app-payment">
                <img src="../../images/logo-hecto-myaccount-white.svg" class="logo" alt="내통장결제"> 앱으로 결제
              </button>
              <p>내통장결제 앱이 없는 경우 설치 페이지로 이동합니다.</p>
            </div>
            <!-- //button area -->

            <!-- complete guide -->
            <div class="complete-guide-area">
              <p class="complete-guide-text">
                결제가 완료되면 아래 버튼을 눌러주세요.
              </p>
              <button type="button" class="btn-complete-link">
                결제완료
              </button>
            </div>
            <!-- //complete guide -->
          </div>
          <!-- //bottom area -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <script>
      $(document).ready(function () {
        // 앱으로 결제하기 버튼 클릭
        $(".btn-app-payment").on("click", function () {
          // TODO: 앱 딥링크 또는 스킴 호출
          console.log("앱으로 결제하기");
        });

        // 웹으로 결제하기 버튼 클릭
        $(".btn-web-payment").on("click", function () {
          // TODO: 웹 결제 페이지로 이동
          console.log("웹으로 결제하기");
        });

        // 결제완료 버튼 클릭
        $(".btn-complete-link").on("click", function () {
          // TODO: 결제 완료 처리
          console.log("결제완료");
        });

        // 닫기 버튼 클릭
        $("#closeWindow").on("click", function () {
          // TODO: 창 닫기 처리
          if (window.close) {
            window.close();
          } else {
            history.back();
          }
        });
      });
    </script>
  </body>
</html>
