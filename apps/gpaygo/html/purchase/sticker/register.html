<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스티커 권종 등록</title>
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/purchase/sticker.css">
  <script src="../../../js/purchase/sticker.js" defer></script>
</head>
<body>
  <div class="sticker-page sticker-page-register">
    <header class="sticker-gnb-desktop">
      <div class="sticker-gnb-desktop-inner">
        <div class="sticker-gnb-desktop-left">
          <img src="../../../images/logo-white.svg" alt="그린원 로고" class="sticker-gnb-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="sticker-gnb-logo-placeholder">GREEN ONE</div>
          <span class="sticker-shop-chip">판매소명 노출</span>
        </div>
        <div class="sticker-gnb-desktop-right">
          <span class="sticker-gnb-user">홍길동님</span>
          <span class="sticker-gnb-divider" aria-hidden="true"></span>
          <button class="sticker-gnb-logout" type="button">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="sticker-layout">
      <nav class="sticker-sidebar" aria-label="주요 메뉴">
        <div class="sticker-sidebar-section" aria-expanded="true">
          <button class="sticker-sidebar-dropdown" type="button" aria-expanded="true">
            <span class="sticker-sidebar-icon" aria-hidden="true">🏷</span>
            <span class="sticker-sidebar-text">폐기물 스티커 구매 관리</span>
            <span class="sticker-sidebar-chevron" aria-hidden="true"></span>
          </button>
          <div class="sticker-sidebar-menu" role="menu">
            <a href="../sticker/index.html" role="menuitem">스티커 구매 신청</a>
            <a href="#" role="menuitem">스티커 구매 내역</a>
            <a class="active" href="./register.html" role="menuitem">스티커 권종 등록</a>
          </div>
        </div>
        <div class="sticker-sidebar-section" aria-expanded="false">
          <button class="sticker-sidebar-dropdown" type="button" aria-expanded="false">
            <span class="sticker-sidebar-icon" aria-hidden="true">👥</span>
            <span class="sticker-sidebar-text">직원 관리</span>
            <span class="sticker-sidebar-chevron" aria-hidden="true"></span>
          </button>
          <div class="sticker-sidebar-menu" role="menu">
            <a href="#" role="menuitem">직원 목록</a>
            <a href="#" role="menuitem">직원 등록</a>
          </div>
        </div>
        <div class="sticker-sidebar-section" aria-expanded="false">
          <button class="sticker-sidebar-dropdown" type="button" aria-expanded="false">
            <span class="sticker-sidebar-icon" aria-hidden="true">🧾</span>
            <span class="sticker-sidebar-text">종량제 봉투 구매 관리</span>
            <span class="sticker-sidebar-chevron" aria-hidden="true"></span>
          </button>
          <div class="sticker-sidebar-menu" role="menu">
            <a href="#" role="menuitem">봉투 구매 신청</a>
            <a href="#" role="menuitem">봉투 구매 내역</a>
          </div>
        </div>
      </nav>

      <div class="sticker-panel">
        <div class="sticker-status-bar" aria-hidden="true">
          <span class="sticker-status-time">9:41</span>
          <div class="sticker-status-icons">
            <span class="sticker-status-signal"></span>
            <span class="sticker-status-wifi"></span>
            <span class="sticker-status-battery"></span>
          </div>
        </div>

        <header class="sticker-gnb">
          <button class="sticker-back-button" type="button" aria-label="이전 화면">
            <span class="sticker-back-icon" aria-hidden="true"></span>
          </button>
          <h1 class="sticker-gnb-title">스티커 권종 등록</h1>
          <button class="sticker-close-button" type="button" aria-label="닫기"></button>
        </header>

        <div class="sticker-desktop-header">
          <div class="sticker-breadcrumb" aria-label="현재 위치">
            <span class="breadcrumb-item">폐기물 스티커 구매 관리</span>
            <span class="breadcrumb-separator" aria-hidden="true"></span>
            <span class="breadcrumb-item current">스티커 권종 등록</span>
          </div>
          <button class="sticker-toolbar-date" type="button">2025-11-19</button>
        </div>

        <div class="sticker-page-title">
          <h2>스티커 권종 등록</h2>
        </div>

        <main class="sticker-body">
          <section class="sticker-section">
            <div class="sticker-section-heading">
              <div class="sticker-section-title">
                <span>구매 신청일</span>
                <span class="sticker-required" aria-hidden="true">*</span>
              </div>
            </div>
            <input type="text" class="sticker-input readonly" value="2025-11-19" readonly aria-readonly="true">
          </section>

          <section class="sticker-section">
            <div class="sticker-section-heading">
              <div class="sticker-section-title">
                <span>구매 권종</span>
                <span class="sticker-required" aria-hidden="true">*</span>
              </div>
            </div>

            <form class="sticker-filter-form" action="#" method="post">
              <div class="sticker-select-field">
                <label for="categorySelect" class="sticker-filter-label">스티커 품목</label>
                <button id="categorySelect" type="button" class="sticker-select" aria-haspopup="listbox" aria-expanded="false">
                  <span class="sticker-select-text">스티커 품목 전체</span>
                  <span class="sticker-select-arrow" aria-hidden="true"></span>
                </button>
                <ul class="sticker-select-list" role="listbox" id="categorySelect-list">
                  <li class="sticker-select-item selected" role="option" data-value="">스티커 품목 전체</li>
                  <li class="sticker-select-item" role="option" data-value="electronics">전자기기</li>
                  <li class="sticker-select-item" role="option" data-value="furniture">가구</li>
                  <li class="sticker-select-item" role="option" data-value="household">생활용품</li>
                </ul>
              </div>

              <div class="sticker-select-field">
                <label for="subCategorySelect" class="sticker-filter-label">세부 품목</label>
                <button id="subCategorySelect" type="button" class="sticker-select" aria-haspopup="listbox" aria-expanded="false">
                  <span class="sticker-select-text">세부 품목 전체</span>
                  <span class="sticker-select-arrow" aria-hidden="true"></span>
                </button>
                <ul class="sticker-select-list" role="listbox" id="subCategorySelect-list">
                  <li class="sticker-select-item selected" role="option" data-value="">세부 품목 전체</li>
                  <li class="sticker-select-item" role="option" data-value="gas-range">가스레인지</li>
                  <li class="sticker-select-item" role="option" data-value="home-appliance">생활가전</li>
                </ul>
              </div>

              <div class="sticker-search-field">
                <label for="stickerSearch" class="sticker-filter-label">권종 검색</label>
                <div class="sticker-search-control">
                  <input type="search" id="stickerSearch" name="stickerSearch" placeholder="스티커 권종 이름을 검색해 주세요.">
                  <span class="sticker-search-icon" aria-hidden="true"></span>
                </div>
              </div>
            </form>

            <div class="sticker-table" role="region" aria-label="스티커 권종 목록">
              <div class="sticker-table-header">
                <label class="sticker-checkbox">
                  <input type="checkbox">
                  <span class="sticker-checkbox-text">품목 / 세부품목 / 규격</span>
                </label>
                <span class="sticker-fee-label">개당 수수료</span>
              </div>

              <article class="sticker-table-row" aria-label="전자기기">
                <div class="sticker-row-main">
                  <label class="sticker-checkbox">
                    <input type="checkbox">
                    <div class="sticker-row-text">
                      <p class="sticker-row-title">전자기기</p>
                      <p class="sticker-row-desc">최대 2줄까지 노출되며, 더 길어지면 자동으로 줄바꿈됩니다.</p>
                    </div>
                  </label>
                  <button class="sticker-fee-button" type="button">
                    <span>990,000원</span>
                    <span class="sticker-select-arrow" aria-hidden="true"></span>
                  </button>
                </div>

                <div class="sticker-row-children">
                  <label class="sticker-checkbox">
                    <input type="checkbox" checked>
                    <span class="sticker-checkbox-text">가스레인지</span>
                  </label>

                  <label class="sticker-checkbox sticker-child-card">
                    <input type="checkbox" checked>
                    <div class="sticker-child-info">
                      <p class="sticker-child-title">규격명 사이즈</p>
                      <p class="sticker-child-desc">양문형 냉장고 600L 이상 제품입니다. 텍스트가 길어지면 자동으로 줄바꿈됩니다.</p>
                    </div>
                    <span class="sticker-child-fee">9,999원</span>
                  </label>

                  <label class="sticker-checkbox">
                    <input type="checkbox">
                    <span class="sticker-checkbox-text">생활가전</span>
                  </label>
                </div>
              </article>

              <article class="sticker-table-row" aria-label="가구">
                <div class="sticker-row-main">
                  <label class="sticker-checkbox">
                    <input type="checkbox">
                    <div class="sticker-row-text">
                      <p class="sticker-row-title">가구</p>
                      <p class="sticker-row-desc">쇼파, 식탁 등 가구 전반</p>
                    </div>
                  </label>
                  <button class="sticker-fee-button" type="button">
                    <span>120,000원</span>
                    <span class="sticker-select-arrow" aria-hidden="true"></span>
                  </button>
                </div>
              </article>

              <article class="sticker-table-row" aria-label="생활용품">
                <div class="sticker-row-main">
                  <label class="sticker-checkbox">
                    <input type="checkbox">
                    <div class="sticker-row-text">
                      <p class="sticker-row-title">생활용품</p>
                      <p class="sticker-row-desc">일반 생활용품 전체</p>
                    </div>
                  </label>
                  <button class="sticker-fee-button" type="button">
                    <span>45,000원</span>
                    <span class="sticker-select-arrow" aria-hidden="true"></span>
                  </button>
                </div>
              </article>
            </div>
          </section>
        </main>

        <footer class="sticker-footer">
          <button class="btn btn-primary sticker-submit-btn" type="submit" disabled aria-disabled="true">
            다음
          </button>
        </footer>
      </div>

      <div class="sticker-visual" aria-hidden="true">
        <div class="sticker-visual-graphic">
          <img src="../../../images/logo-white.svg" alt="" class="sticker-visual-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="sticker-visual-placeholder">GREEN ONE</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
