<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>RROUND</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <link rel="stylesheet" href="../../css/jquery-ui.css" />
        <link rel="stylesheet" href="../../css/common_renewal.css" />
        <script src="../../js/jquery.3.4.1.min.js"></script>
        <script src="../../js/jquery-ui.js"></script>
        <script src="../../js/design_renewal.js" defer="defer"></script>
        <script src="../../js/owl.carousel.min.js"></script>
        <script src="../../js/lottie.min.js"></script>
    </head>

    <body>
        <!-- wrap -->
        <div id="wrap">
            <!-- header -->
            <div id="header">
                <div class="container">
                    <div class="header-box">
                        <button type="button" class="btn-prev" onclick="window.location.href='./registerCard_step1.html'"><i class="icon-arrow-left"></i></button>
                        <h2 class="page-title">카드 등록</h2>
                        <button
                            type="button"
                            class="btn-close js-change-btn"
                            data-message="한 번만 등록하면 빠르고 안전한 결제가 가능해요! 등록을 중단하고 일반 카드 결제를 할까요?"
                            data-cancel="일반 카드 결제"
                            data-confirm="계속하기"
                            data-show-cancel="true"
                        >
                            <i class="icon-close"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- //header -->

            <!-- content -->
            <div id="content">
                <!-- container -->
                <div class="container">
                    <!-- section -->
                    <div class="section">
                        <ul class="form-type">
                            <li>
                                <div class="input-container col">
                                    <label class="label" for="text_04">카드번호</label>
                                    <div class="col-box">
                                        <input type="text" class="custom-input" id="text_04" />
                                        <input type="text" class="custom-input" />
                                        <input type="text" class="custom-input" />
                                        <input type="text" class="custom-input" />
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="input-container label-y">
                                    <label class="label" for="text_03">유효기간</label>
                                    <input type="text" class="custom-input" placeholder="" id="text_03" />
                                    <button type="button" class="icon icon-del js-text-del"></button>
                                </div>
                            </li>
                            <li>
                                <div class="input-container label-y">
                                    <label class="label" for="text_05">CVC</label>
                                    <input type="text" class="custom-input" placeholder="" id="text_05" />
                                    <button type="button" class="icon icon-del js-text-del"></button>
                                </div>
                            </li>
                            <li>
                                <div class="input-container label-y">
                                    <label class="label" for="text_06">비밀번호</label>
                                    <input type="text" class="custom-input" placeholder="" id="text_06" />
                                    <button type="button" class="icon icon-del js-text-del"></button>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <!-- //section -->
                </div>
                <!-- //container -->
                <!-- bottom area -->
                <div class="bottom-area">
                    <!-- container -->
                    <div class="container">
                        <button id="send" class="btn" onclick="window.location.href='./registerCard_step3.html'">확인</button>
                    </div>
                    <!-- //container -->
                </div>
                <!-- //bottom area -->
            </div>
            <!-- //content -->
        </div>
        <!-- //wrap -->

        <!-- common prompt -->
        <div id="commonPrompt" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <h3 id="promptTitle"></h3>
                        <p id="promptContents"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="promptNo" onclick="modalCloseAlert();" class="btn btn-cancel">취소</button>
                        <button type="button" id="promptOk" onclick="modalCloseAlert();" class="btn btn-confirm">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- //common prompt -->
    </body>
    <script></script>
</html>
