<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>RROUND - 캐릭터 만들기 중</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common_renewal.css" />
    <link rel="stylesheet" href="../../css/dedicatedSavings/creatingCharacter.css" />
    <script src="../../js/jquery.3.4.1.min.js"></script>
    <script src="../../js/jquery-ui.js"></script>
    <script src="../../js/design_renewal.js" defer="defer"></script>
  </head>

  <body>
    <!-- wrap -->
    <div id="wrap" class="creating-character-wrap">
      <!-- header -->
      <div id="header">
        <div class="container">
          <div class="header-box">
            <h2 class="page-title">내 캐릭터 만들기</h2>
            <button type="button" class="btn-close">
              <i class="icon-close"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container">
          <!-- section -->
          <div class="section">
            <!-- Creating Status Section -->
            <div class="creating-status-section">
              <!-- Text Area (3초마다 변경) -->
              <div class="status-text-area">
                <p class="status-text" id="statusText">
                  한 땀 한 땀<br />
                  바느질하고 있어요...
                </p>
              </div>
              <!-- //Text Area -->

              <!-- Image Area (로티 이미지 placeholder) -->
              <div class="status-image-area">
                <div class="lottie-placeholder" id="lottieContainer">
                  <!-- 로티 이미지가 여기에 들어갈 예정 -->
                </div>
              </div>
              <!-- //Image Area -->

              <!-- Bottom Message -->
              <div class="status-message">
                <p class="message-text">다 만들면 알림으로 알려드려요!</p>
              </div>
              <!-- //Bottom Message -->
            </div>
            <!-- //Creating Status Section -->
          </div>
          <!-- //section -->
        </div>
        <!-- //container -->
      </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <!-- common alert -->
    <div id="commonAlert" class="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              onclick="modalClose();"
              class="btn btn-confirm"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //common alert -->

    <script>
      // 텍스트 배열 (3초마다 변경될 텍스트들)
      const statusTexts = [
        "한 땀 한 땀<br />바느질하고 있어요...",
        "한 땀 한 땀<br />다듬고 있어요...",
      ];

      let currentTextIndex = 0;
      const statusTextElement = document.getElementById("statusText");

      // 텍스트 변경 함수
      function changeStatusText() {
        // 페이드 아웃
        statusTextElement.style.opacity = "0";
        statusTextElement.style.transform = "translateY(-10px)";

        setTimeout(() => {
          // 텍스트 변경
          currentTextIndex = (currentTextIndex + 1) % statusTexts.length;
          statusTextElement.innerHTML = statusTexts[currentTextIndex];

          // 페이드 인
          statusTextElement.style.opacity = "1";
          statusTextElement.style.transform = "translateY(0)";
        }, 300); // 300ms 후 텍스트 변경
      }

      // 초기 텍스트 설정
      statusTextElement.innerHTML = statusTexts[0];

      // 3초마다 텍스트 변경
      const textInterval = setInterval(changeStatusText, 3000);

      // 캐릭터 생성 완료 처리 함수
      // 나중에 API 응답을 받으면 이 함수를 호출하여 완성 페이지로 이동
      function handleCharacterComplete(characterData) {
        // 텍스트 변경 인터벌 정리
        clearInterval(textInterval);

        // 완성 페이지로 이동
        // characterData가 있으면 URL 파라미터로 전달하거나 sessionStorage에 저장
        if (characterData) {
          // 예: sessionStorage에 저장
          sessionStorage.setItem("characterData", JSON.stringify(characterData));
        }

        window.location.href = "characterComplete.html";
      }

      // 개발 단계: 일정 시간(5초) 후 자동으로 완성 페이지로 이동
      // 실제 개발 시에는 API 응답을 받으면 handleCharacterComplete()를 호출하도록 변경
      /*
      setTimeout(() => {
        handleCharacterComplete(null);
      }, 5000); 
      */
    </script>
  </body>
</html>
