<body>

<header id="header">

</header>

	<div id="ct">	
		<div class="bank_slide">
			<button type="button" onclick="" class="btn_bankadm">계좌관리<i class="ico_com ico_set"></i></button>
			<div class="swiper-container">
				<ul class="swiper-wrapper">
					<li class="swiper-slide">
						<span class="ticket"><span class="flex">
						<img src="../img/bank/fullname_002.png" alt="NH농협은행">
						<strong class="num">020 *********** 310</strong></span></span>
					</li>
				</ul>
			</div>
		</div>
	
	    <!-- //계좌(slide) -->
	    <fieldset class="ars_form mty">
			<legend>결제금액 입력폼</legend>		
			<ul class="brb0">

					<strong><b class="fc_reg">100,000</b>원</strong>
				</li>
				<li class="pw">
					<span class="stit">비밀번호</span>
					<span class="input input_help"><label for="pw" class="lbl" style="position: absolute; visibility: visible;">숫자 6자리</label>
						<input type="password" class="i_text nppfs-npv ls" style="ime-mode:disabled;" npkencrypt="on" data-keypad-type="num" data-keypad-theme="settle_keypad" maxlength="6" id="payPwd" name="payPwd" data-keypad-next="__hide__" size="6" value="" readonly="readonly" nppfs-keypad-uuid="nppfs-keypad-payPwd" data-input-useyn-type="toggle" data-keypad-useyn-input="__KU_ab3e57738117">

	<!-- //content -->

<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>

<div class="nppfs-elements" style="display:none;"></div>	
<div class="nppfs-keypad-div" style="display:none;"></div>

</body></html>
