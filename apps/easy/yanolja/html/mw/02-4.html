<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../resources/css/common.css">
<link rel="stylesheet" href="../../resources/css/site.css">
<link rel="stylesheet" href="../../resources/css/common/css/custom/yanolja/yanolja.css">
<script src="../../resources/js/jquery-1.8.3.min.js"></script>
<script src="../../resources/js/design.js" defer="defer"></script>
<title>간편결제</title>
</head>
<body>

<header id="header">
	<h1>신규/추가 등록</h1>
	<button type="button" class="btn_cls"><i class="ico_com ico_cls">창닫기</i></button>
</header>

<div id="ct">
	<h2 class="logo_fullname"><img src="../../resources/images/bank/fullname_01.png" alt="KB국민은행"></h2>
	<fieldset class="ars_form">
		<legend>계좌번호 입력폼</legend>
		<ul class="brb0">
			<li class="master">
				<span class="stit">예금주</span>
				<strong>홍길동</strong>
			</li>
			<li class="num">
				<span class="stit">계좌번호</span>
				<span class="input"><input type="tel" name="" id="" placeholder="‘-’없이 입력" tabindex="2"></span>
			</li>
		</ul>
	</fieldset>
	<div class="btn_area4 v1">
		<p class="txt_cm_cau">본인명의 계좌만 가능<br>가상계좌, 적금, 펀드계좌, 평생계좌등록 불가</p>
		<ul>
			<li class="bt1"><button type="button" onclick="" class="btn_xr btn_type2">취소</button></li>
			<li class="bt2"><button type="button" onclick="$(this).toggleClass('on');layer_open('ly_ars')" class="btn_xr btn_type">ARS인증하기</button></li>
		</ul>
	</div>
	<div class="arsInfoText">
		<p><strong>'ARS인증하기'</strong> 버튼을 누르면, <br>휴대폰으로 계좌등록을 위한 ARS전화가 수신됩니다.<br>
			전화를 받고 <strong class="fc_reg">주민번호 앞 6자리</strong>를 입력해주세요.</p>
	</div>
</div>
<!-- //content -->

<!-- ARS인증 -->
<div class="ly_pop ly_ars">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_ars" class="cont">
		<div class="ele">
			<section class="inner2">
				<h2>ARS 인증 전화를 요청합니다.</h2>
				<p>전화를 받은 후 안내에 따라<br><strong class="fc_reg">생년월일</strong>을 입력하세요</p>
			</section>
			<ul class="btn_area3">
				<li class="bt1"><button type="button" onclick="layer_close();" class="btn_xr btn_type3">취소</button></li>
				<li class="bt2"><button type="button" onclick="" class="btn_xr btn_type3 fc_reg">ARS 인증하기</button></li>
			</ul>
		</div>
	</div>
</div>
<!-- //ARS인증 -->

</body>
</html>
