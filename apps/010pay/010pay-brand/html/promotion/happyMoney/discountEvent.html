<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>해피머니 수수료 할인</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<link rel="stylesheet" type="text/css" href="../../../resource/fonts/notosanskr-v13/notosanskr.min.css">
<link rel="stylesheet" type="text/css" href="../../../resource/css/promotion.css">
<!-- script -->
<script src="../../../resource/library/jquery-1.8.3.min.js"></script>
</head>

<body>
	<!-- wrap -->
	<div id="wrap" class="happyMoney-wrap">
		<!-- main content -->
		<div id="content" class="content">
			<!-- container -->
      <div class="section section-1">
        <img class="img-01" src="../../../resource/images/promotion/happyMoney/happyMoney-title-01.png" alt="전환수수료 할인 혜택 !">
        <img class="img-02" src="../../../resource/images/promotion/happyMoney/happyMoney-title-02.png" alt="해피캐시 010PAY 머니로 전환 시,">
        <div class="visual-wrap">
          <span class="visual-03"></span>
          <span class="visual-02"></span>
          <span class="visual-01"></span>
        </div>
      </div>
      <div class="section section-2 fadeUp">
        <div class="content-wrap">
          <img class="img-01" src="../../../resource/images/promotion/happyMoney/happyMoney-text-01.png" alt="기간 2024년 6월 3일 ~ 2024년 6월 30일">
          <img class="img-02" src="../../../resource/images/promotion/happyMoney/happyMoney-text-02.png" alt="기간 2024년 6월 3일 ~ 2024년 6월 30일">
          <img class="img-03" src="../../../resource/images/promotion/happyMoney/happyMoney-text-03.png" alt="기간 2024년 6월 3일 ~ 2024년 6월 30일">
        </div>
      </div>
      <div class="section section-3 fadeUp">
        <div class="content-wrap">
          <img class="img-01" src="../../../resource/images/promotion/happyMoney/happyMoney-text-04.png" alt="010PAY로 전환 시">
          <img class="img-02" src="../../../resource/images/promotion/happyMoney/happyMoney-text-05.png" alt="기존 8% 전환수수료에 7.7%로 할인 적용">
          <div class="icon-text-wrap">
            <img src="../../../resource/images/promotion/happyMoney/happyMoney-text-06.png" alt="수수료 7.7%">
          </div>
          <span class="arrow-01"></span>
          <span class="arrow-02"></span>
          <span class="arrow-03"></span>
        </div>
      </div>
      <div class="btn-wrap">
        <button type="button">해피캐시 머니 전환하러 가기</button>
      </div>
			<!-- //container-->
		</div>
		<!-- //main content -->
	</div>
	<!-- //wrap -->
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      var targets = document.querySelectorAll('.fadeUp');
      $(".section").addClass("load");

      var options = {
        root: null, // viewport
        rootMargin: '0px',
        threshold: 0.2 // 50% of the target should be visible
      };

      var callback = (entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            $(entry.target).addClass("animation");
          }
        });
      };

      var observer = new IntersectionObserver(callback, options);

      targets.forEach(target => {
        observer.observe(target);
      });
    });
  </script>
</body>
</html>
