<body>

<header id="header">
	 
	  		
	  	
		    <h1>신규/추가 등록</h1>
	  		
	 
</header>
 	
<div id="ct">	
	<section class="ars_timer">
		<h2>본인확인 진행 중</h2>
		<p class="txt fc_reg">창을 닫으면 본인확인이 진행되지 않습니다.</p>
		<span class="circle"><i class="ico_com ico_pw"></i></span>
		<div class="btn_area v6">
			<p class="txt_cm_cau">각 통신사별 인증앱을 실행하여<br>비밀번호 / 지문을 입력하세요.</p>
			<p class="txt_cm_cau2">비밀번호 입력 후, <strong class="fc_reg">[확인]</strong> 버튼을 눌러주세요.</p>
			<ul class="btn_area2 v1">
				<li class="bt1"><button type="button" onclick="" class="btn_xr btn_type2">취소</button></li>
				<li class="bt2"><button type="button" id="confirmOk" name="confirmOk" class="btn_xr btn_type on">확인</button></li>
			</ul>
		</div>
		<!-- <div class="btn_cm_btm"><button type="button" onclick=""><u>인증 다시 시작</u></button></div> -->
	</section>
</div>


<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>

<!-- //content -->


</body></html>
