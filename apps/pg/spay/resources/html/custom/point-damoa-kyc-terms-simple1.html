        <script>
            $(document).ready(function () {
                // 전체약관동의 체크박스
                const allAgreeCheckbox = document.getElementById("check-all");
                // 나머지 체크박스들
                const otherCheckboxes = document.querySelectorAll(".checkSelect");
                // 확인 버튼
                const nextButton = document.getElementById("btnNext");

                // 필수 약관 모두 체크되었는지 확인
                function checkAllRequiredTerms() {
                    return Array.from(otherCheckboxes).every((cb) => cb.checked);
                }

                // 확인 버튼 활성화/비활성화
                function updateNextButton() {
                    const allChecked = checkAllRequiredTerms();
                    nextButton.disabled = !allChecked;
                }

                // 전체약관동의 체크박스 변경 이벤트
                allAgreeCheckbox.addEventListener("change", function () {
                    otherCheckboxes.forEach(function (checkbox) {
                        checkbox.checked = allAgreeCheckbox.checked;
                    });
                    updateNextButton();
                });

                // 개별 체크박스 변경 이벤트
                otherCheckboxes.forEach(function (checkbox) {
                    checkbox.addEventListener("change", function () {
                        // 모든 개별 약관이 체크되면 전체약관동의도 체크
                        if (checkAllRequiredTerms()) {
                            allAgreeCheckbox.checked = true;
                        } else {
                            allAgreeCheckbox.checked = false;
                        }
                        updateNextButton();
                    });
                });

                // 약관 내용 정의
                const termsContent = {
                    term1: {
                        title: "포인트다모아(포인트허브) 약관",
                        content: "<h4>제1조 (목적)</h4><p>본 약관은 주식회사 케이티(이하 '회사')가 제공하는 포인트다모아(포인트허브) 서비스의 이용과 관련하여 회사와 이용자 간의 권리, 의무 및 책임사항, 기타 필요한 사항을 규정함을 목적으로 합니다.</p><h4>제2조 (정의)</h4><p>본 약관에서 사용하는 용어의 정의는 다음과 같습니다.</p><p>1. '서비스'란 회사가 제공하는 포인트 통합 관리 및 전환 서비스를 의미합니다.</p><p>2. '이용자'란 본 약관에 동의하고 회사가 제공하는 서비스를 이용하는 자를 의미합니다.</p><p>3. '포인트'란 각 카드사 및 제휴사에서 발행한 포인트를 의미합니다.</p><h4>제3조 (약관의 효력 및 변경)</h4><p>본 약관은 서비스를 이용하고자 하는 모든 이용자에 대하여 그 효력을 발생합니다. 회사는 필요한 경우 관련 법령을 위배하지 않는 범위에서 본 약관을 변경할 수 있습니다.</p><h4>제4조 (서비스의 제공 및 변경)</h4><p>회사는 다음과 같은 서비스를 제공합니다.</p><p>1. 포인트 통합 조회 서비스</p><p>2. 포인트 전환 서비스</p><p>3. 기타 회사가 추가 개발하거나 제휴계약 등을 통해 제공하는 일체의 서비스</p><h4>제5조 (서비스 이용의 제한)</h4><p>회사는 다음 각 호에 해당하는 경우 서비스 이용을 제한할 수 있습니다.</p><p>1. 이용자가 본 약관에 위배되는 행위를 한 경우</p><p>2. 서비스의 안정적 운영을 방해하는 경우</p><p>3. 기타 법령에 위반되는 행위를 한 경우</p>"
                    },
                    term2: {
                        title: "포인트다모아 개인정보 처리 방침",
                        content: "<h4>제1조 (개인정보의 처리 목적)</h4><p>주식회사 케이티(이하 '회사')는 다음의 목적을 위하여 개인정보를 처리합니다. 처리하고 있는 개인정보는 다음의 목적 이외의 용도로는 이용되지 않으며, 이용 목적이 변경되는 경우에는 개인정보 보호법 제18조에 따라 별도의 동의를 받는 등 필요한 조치를 이행할 예정입니다.</p><p>1. 서비스 제공에 관한 계약 이행 및 서비스 제공에 따른 요금정산</p><p>2. 회원 관리: 회원제 서비스 이용에 따른 본인확인, 개인 식별, 불량회원의 부정 이용 방지와 비인가 사용 방지, 가입 의사 확인, 연령확인, 불만처리 등 민원처리, 고지사항 전달</p><p>3. 마케팅 및 광고에의 활용: 신규 서비스(제품) 개발 및 맞춤 서비스 제공, 이벤트 및 광고성 정보 제공 및 참여기회 제공</p><h4>제2조 (개인정보의 처리 및 보유기간)</h4><p>회사는 법령에 따른 개인정보 보유·이용기간 또는 정보주체로부터 개인정보를 수집 시에 동의받은 개인정보 보유·이용기간 내에서 개인정보를 처리·보유합니다.</p><p>각각의 개인정보 처리 및 보유 기간은 다음과 같습니다.</p><p>1. 서비스 이용 기록: 3년</p><p>2. 계약 또는 청약철회 등에 관한 기록: 5년</p><p>3. 대금결제 및 재화 등의 공급에 관한 기록: 5년</p><h4>제3조 (개인정보의 제3자 제공)</h4><p>회사는 정보주체의 개인정보를 제1조(개인정보의 처리 목적)에서 명시한 범위 내에서만 처리하며, 정보주체의 동의, 법률의 특별한 규정 등 개인정보 보호법 제17조 및 제18조에 해당하는 경우에만 개인정보를 제3자에게 제공합니다.</p><h4>제4조 (개인정보처리의 위탁)</h4><p>회사는 원활한 개인정보 업무처리를 위하여 다음과 같이 개인정보 처리업무를 위탁하고 있습니다.</p><p>1. 위탁업체: (주)케이티</p><p>2. 위탁업무 내용: 서비스 운영 및 관리</p>"
                    },
                    term3: {
                        title: "개인정보 수집/이용 동의",
                        content: "<h4>제1조 (수집하는 개인정보의 항목)</h4><p>회사는 다음의 개인정보 항목을 처리하고 있습니다.</p><p><strong>필수항목:</strong></p><p>1. 이름, 생년월일, 성별</p><p>2. 휴대폰 번호</p><p>3. 본인인증 정보 (CI, DI)</p><p>4. 카드사 포인트 정보</p><p><strong>선택항목:</strong></p><p>1. 이메일 주소</p><p>2. 주소</p><p><strong>자동 수집 항목:</strong></p><p>1. IP주소, 쿠키, MAC주소, 서비스 이용 기록, 방문 기록, 불량 이용 기록 등</p><h4>제2조 (개인정보의 수집 및 이용 목적)</h4><p>회사는 수집한 개인정보를 다음의 목적을 위해 활용합니다.</p><p>1. 서비스 제공에 관한 계약 이행 및 서비스 제공에 따른 요금정산</p><p>2. 회원 관리: 회원제 서비스 이용에 따른 본인확인, 개인 식별, 불량회원의 부정 이용 방지와 비인가 사용 방지</p><p>3. 신규 서비스 개발 및 마케팅·광고 활용</p><h4>제3조 (개인정보의 보유 및 이용기간)</h4><p>원칙적으로, 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 단, 관계법령의 규정에 의하여 보존할 필요가 있는 경우 회사는 아래와 같이 관계법령에서 정한 일정한 기간 동안 회원정보를 보관합니다.</p><p>1. 계약 또는 청약철회 등에 관한 기록: 5년</p><p>2. 대금결제 및 재화 등의 공급에 관한 기록: 5년</p><p>3. 소비자의 불만 또는 분쟁처리에 관한 기록: 3년</p><h4>제4조 (개인정보 수집 동의 거부 권리)</h4><p>귀하는 개인정보 수집·이용에 대한 동의를 거부할 권리가 있습니다. 다만, 필수 항목에 대한 동의를 거부하실 경우 서비스 이용이 제한될 수 있습니다.</p>"
                    },
                    term4: {
                        title: "본인은 주식회사 케이티가 다음의 목적을 위하여 해당 정보를 제공함에 동의합니다.",

                // 약관 상세보기 모달 열기
                function openTermsModal(termId) {
                    const term = termsContent[termId];
                    if (!term) {
                        console.error("약관 내용을 찾을 수 없습니다:", termId);
                        return;
                    }

                    const $modal = $("#termsDetailModal");
                    const $content = $("#termsContent");
                    const $title = $("#termsModalTitle");
                    
                    // 약관 제목 설정
                    $title.text(term.title);
                    
                    // 약관 내용 삽입
                    $content.html(term.content);
                    
                    // 모달 표시
                    $modal.fadeIn(300);
                }

                // 약관 상세보기 모달 닫기
                function closeTermsModal() {
                    const $modal = $("#termsDetailModal");
                    
                    // 모달 숨기기
                    $modal.fadeOut(300);
                }

                // 보기 버튼 클릭 이벤트
                document.querySelectorAll(".btn-view").forEach(function (btn) {
                    btn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const termId = this.getAttribute("data-term");
                        openTermsModal(termId);
                    });
                });

                // 모달 닫기 버튼
                $("#closeTermsModal, #confirmTermsModal").on("click", function() {
                    closeTermsModal();
                });

                // 모달 오버레이 클릭 시 닫기
                $("#termsDetailModal").on("click", function(e) {
                    if ($(e.target).hasClass("modal")) {
                        closeTermsModal();
                    }
                });

                // 확인 버튼 클릭 이벤트
                nextButton.addEventListener("click", function () {
                    if (!this.disabled) {
                        // 약관 동의 완료 처리
                        const terms = {
                            checkAll: allAgreeCheckbox.checked,
                            chk1: document.getElementById("chk1").checked,
                            chk2: document.getElementById("chk2").checked,
                            chk3: document.getElementById("chk3").checked,
                        };
                        console.log("약관 동의 완료:", terms);
                        
                        // 부모 창에 약관 동의 완료 메시지 전송
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage(
                                {
                                    type: "kycTermsAgree",
                                    data: terms
                                },
                                "*"
                            );
                        }
                    }
                });

                // 닫기 버튼 클릭 - 확인 모달 표시
                $("#closeWindow").on("click", function () {
                    $("#closeConfirmModal").fadeIn(300);
                    $("#closeConfirmModal").attr("tabindex", "0").focus();
                });

                // 확인 모달 취소 버튼
                $("#closeConfirmCancel").on("click", function () {
                    $("#closeConfirmModal").fadeOut(300);
                });

                // 확인 모달 확인 버튼 - 창 닫기 또는 부모에 메시지 전송
                $("#closeConfirmOk").on("click", function () {
                    $("#closeConfirmModal").fadeOut(300, function () {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage("closeKycTermsSimple", "*");
                        } else {
                            window.close();
                        }
                    });
                });

                // 확인 모달 외부 클릭 시 닫기
                $(document).on("click", "#closeConfirmModal", function(e) {
                    if ($(e.target).is("#closeConfirmModal")) {
                        $("#closeConfirmModal").fadeOut(300);
                    }
                });

                // 모바일 테스트 새창 열기 버튼
                $("#openMobileWindow").on("click", function () {
                    const currentUrl = window.location.href;
                    const windowFeatures = "width=375,height=667,resizable=yes,scrollbars=yes,status=yes";
                    window.open(currentUrl, "mobileTest", windowFeatures);
                });

                // 초기 상태 설정
                updateNextButton();
            });
