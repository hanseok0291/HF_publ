<!doctype html>
<html lang="ko">
<head>
<title>헥토파이낸셜 지불서비스</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">

<link rel="apple-touch-icon" sizes="114x114" href="../../images/favicon/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="../../images/favicon/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="../../images/favicon/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="../../images/favicon/apple-icon-152x152.png">

<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../../images/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png">
<link rel="manifest" href="../../images/favicon/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="../../images/favicon/ms-icon-144x144.png">

<link rel="stylesheet" href="../../css/owl.carousel.min.css">
<link rel="stylesheet" href="../../css/slick.min.css">
<link rel="stylesheet" href="../../css/common.css">
<!--[if lt IE 9]>
<script type="text/javascript" src="../../js/html5shiv.js"></script>
<script type="text/javascript" src="../../js/respond.min.js"></script>
<![endif]-->
<script src="../../js/jquery-1.8.3.min.js"></script>
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/owl.carousel.min.js"></script>
<script src="../../js/slick.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</head>

<body>
<!-- wrap -->
<div id="wrap" class="wrap">
	<!-- form -->
	<form class="wrap" autocomplete="off">
		<!-- header -->
		<div id="header">
			<div class="container">
				<button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로 가기</i></button>
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo-hecto.png?ver=1.0" alt="헥토파이낸셜"></span></h1>
				<button type="button" class="btn-notice" data-toggle="modal" data-target="#noticeDetail"><i class="icon icon-bell">알림</i></button>
				<button type="button" id="closeWindow" class="btn-close" data-toggle="modal" data-target="#commonConfirm"><i class="icon-times">창 닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<h2 class="page-title pay-type">휴대폰 결제</h2>

				<!-- 주문정보 -->
				<div class="order-info">
					<p class="prd-goods">드시모네 키즈 세트 afghjlmoprqyz 12345678901234567890</p>
					<p class="prd-price"><strong class="price text-primary"><em class="value">287,000</em>원</strong> 결제합니다.</p>
					<div class="calc">
						<p class="total text-primary"><em>298,000</em>원</p>
						<p class="sub-area">
							<span class="sub"><span class="label">즉시할인</span> <em>-11,000</em>원</span>
						</p>
					</div>
					<p class="prd-period">제공일자 : 2021-01-01 (월 자동결제)</p>
				</div>
				<!-- //주문정보 -->

				<!-- 인증 수단 선택 -->
				<div class="section">
					<div class="select-auth">
						<div class="check-group">
							<input type="radio" name="authType" id="authTypeRegular" class="fixedFooterJS" checked>
							<label for="authTypeRegular">일반 인증</label>
							<!-- <input type="radio" name="authType" id="authTypePass" class="fixedFooterJS">
							<label for="authTypePass">PASS 인증</label> -->
							<input type="radio" name="authType" id="authTypeLg" class="fixedFooterJS">
							<label for="authTypeLg">U+멤버스 인증</label>
							<!-- <input type="radio" name="authType" id="authTypePassword" class="fixedFooterJS">
							<label for="authTypePassword">비밀번호 인증</label> -->
						</div>
					</div>
				</div>
				<!-- //인증 수단 선택 -->

				<!-- 정보 입력 -->
				<div class="section mgt25">
					<ul class="form-type">
						<li>
							<div class="input-btn">
								<input type="tel" maxlength="11" placeholder="휴대폰번호('-' 없이 입력)">
								<div class="switch">
									<input type="checkbox" id="remember" class="switch-checkbox">
									<label for="remember" class="switch-label">
										<span class="switch-inner"></span>
										<span class="switch-switch"></span>
										<span class="sr-only">저장</span>
									</label>
								</div>
								<div class="bubble remember-info">
									<div class="bubble-bg"></div>
									<div class="bubble-content">휴대폰번호 <span class="text-primary">저장</span>으로 더 간편하게!</div>
								</div>
							</div>
							<div class="text-error"></div>
						</li>
						<li>
							<div class="pull-type2 myid">
								<span class="pull-left"><input type="tel" id="" maxlength="6" placeholder="생년월일(6자리)"></span>
								-
								<span class="pull-right gender">
									<label class="sr-only">주민등록번호 뒤 첫째 자리</label>
									<input type="tel" id="" maxlength="1" placeholder="＊">
									<span class="masking"><i></i> <i></i> <i></i> <i></i> <i></i> <i></i></span>
								</span>
							</div>
						</li>
					</ul>
				</div>
				<!-- //정보 입력 -->

				<!-- 앱 설치 안내 -->
				<div class="section info-page">
					<h3><strong>PASS APP</strong>이 설치되지 않았나요?</h3>
					<p class="text-lighter">버튼을 눌러 설치 후 이용해 주세요.</p>
					<p class="mgt20"><button type="button" class="btn btn-md btn-round btn-secondary shadow w150"><span>APP 설치하기</span> <i class="icon-angle-right-sm white"></i></button></p>
				</div>
				<!-- //앱 설치 안내 -->
			</div>
			<!-- //container -->
		</div>
		<!-- //content -->

		<!-- footer -->
		<div id="footer">
			<!-- container -->
			<div class="container">
				<button type="button" id="send" class="btn btn-xl btn-primary" disabled>인증하기</button>
			</div>
			<!-- //container -->
		</div>
		<!-- //footer -->
	</form>
	<!-- //form -->
</div>
<!-- //wrap -->

<!-- modal - 공지사항 상세 -->
<div id="noticeDetail" class="modal modal-full" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<div class="container">
					<!-- 게시판 상세 -->
					<div class="board-detail">
						<h3 class="subject">공지사항 제목</h3>
						<div class="content">
							공지사항 내용
						</div>
					</div>
					<!-- //게시판 상세 -->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-xl btn-secondary" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - 공지사항 상세 -->

<!-- modal - common alert -->
<div id="commonAlert" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn" data-dismiss="modal">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common alert -->

<!-- modal - common confirm -->
<div id="commonConfirm" class="modal" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="confirmTitle"></h3>
				<div id="confirmContents"></div>
			</div>
			<div class="modal-footer type2">
				<button type="button" class="btn" data-dismiss="modal">취소</button>
				<button type="button" id="confirmOk" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //modal - common confirm -->

<!-- loading -->
<div class="loading hidden">로딩 중</div>
<!-- //loading -->

<script>
	$(document).ready(function(){
		// 휴대폰번호 저장 스위치, 말풍선
		if($("#remember").is(":checked")){
			$(".remember-info").hide();
		} else {
			$(".remember-info").fadeIn(100);
		}
		$("#remember").click(function(){
			if($("#remember").is(":checked")){
				$(".remember-info").fadeOut(200);
			} else {
				$(".remember-info").fadeIn(100);
			}
		});
	})

	// U+ 멤버스 인증용 모달
	function authLgu1(){
		$.confirmMessage('휴대폰 소액결제 이용 안내', '<p>휴대폰 소액결제 이용을 위해 이용 동의가 필요합니다.<br> 안내 문자 확인을 위해 SMS 수신에 동의해 주세요.</p><p class="mgt10 checkbox square"><input type="checkbox" name="agreeSms" id="agreeSms"><label for="agreeSms">SMS 수신 동의</label></p>', $('#confirmOk'), '');
	}
	function authLgu2(){
		$.alertMessage('휴대폰 소액결제 이용 안내', 'U&plus; 고객센터 앱에서<br> 휴대폰 소액결제 이용에 동의해 주세요.', '');
	}
	function authLgu3(){
		$.confirmMessage('U&plus; 멤버스 인증 안내', '<p>U&plus; 멤버스 간편결제 이용을 위해 앱 설치가 필요합니다.<br> 안내 문자 확인을 위해 SMS 수신에 동의해 주세요.</p><p class="mgt10 checkbox square"><input type="checkbox" name="agreeSms" id="agreeSms"><label for="agreeSms">SMS 수신 동의</label></p>', $('#confirmOk'), '');
	}
	function authLgu4(){
		$.alertMessage('U&plus; 멤버스 인증 안내', '간편결제 서비스 이용을 위해<br> U&plus; 멤버스 앱 설치 및 인증이 필요합니다.', '');
	}
</script>
</body>
</html>
