<!doctype html>
<html lang="ko">
<head>
<title>010PAY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/jquery-1.8.3.min.js"></script>
</head>

<body>
<!-- form -->
<form class="main_form" action="javascript: void(0);" autocomplete="off">
	<!-- wrap -->
	<div id="wrap" class="wrap">
		<!-- header -->
		<div id="header">
			<div class="container">
				<h1 class="brand-name"><span class="my-logo"><img src="../../images/logo/logo-010pay.png" class="logo" alt="010PAY"></span></h1>
				<button type="button" id="closeWindow" class="btn-close"><i class="icon icon-times">창닫기</i></button>
			</div>
		</div>
		<!-- //header -->

		<!-- content -->
		<div id="content">
			<!-- container -->
			<div class="container">
				<!-- button group -->
				<ul class="btn-group ui-switch mgt20">
					<li><button type="button" class="btn btn-md">PASS 인증서</button></li>
					<li class="active"><button type="button" class="btn btn-md" disabled>ARS 인증</button></li>
				</ul>
				<!-- //button group -->

				<!-- headline -->
				<div class="headline">
					<p><span class="medium">ARS 인증으로</span><br>
						<strong>출금동의</strong>를 진행합니다</p>
				</div>
				<!-- //headline -->

				<!-- ARS 인증 -->
				<div class="section auth-select">
					<p class="auth-number"><span>8</span> <span>4</span></p>
					<p class="info-text big">아래 확인 버튼을 눌러<br>
						<span class="text-danger">계좌 등록을 완료</span>해 주세요.</p>
					<p class="info-text mgt15">'자동이체' 알림 문자는 은행 시스템에<br>
						정상 반영되었다는 안내 문자입니다.</p>
				</div>
				<!-- //ARS 인증 -->
			</div>
			<!-- //container -->

			<!-- bottom area -->
			<div class="bottom-area">
				<!-- container -->
				<div class="container">
					<!-- button area -->
					<div class="btn-area">
						<button type="button" id="send" class="btn btn-submit">확인</button>
					</div>
					<!-- //button area -->
				</div>
				<!-- //container -->
			</div>
			<!-- //bottom area -->
		</div>
		<!-- //content -->
	</div>
	<!-- //wrap -->
</form>
<!-- //form -->

<!-- 자동이체 문자 안내 -->
<div id="modalInfo" class="modal modal-slide modal-info modal-info-img" onclick="$(this).off();">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body pdt40 pdb0">
				<p><strong>자동이체 등록 문자가 와도<br> 놀라지 마세요<i class="italic">!</i></strong></p>
				<p class="small">은행에서 발송되는 계좌 등록 안내 문자로<br> 고객님의 요청 없이 자동출금/이체가 되지 않습니다.</p>
				<p class="img"><img src="../../images/info-auth.png" alt="자동이체 등록 완료"></p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //자동이체 문자 안내 -->

<!-- loading -->
<div class="modal modal-loading">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="loading">
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
				<span class="loading-bar"></span>
			</div>
			<span class="sr-only">로딩</span>
		</div>
	</div>
</div>
<!-- //loading -->

<!-- common alert -->
<div id="commonAlert" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="alertTitle"></h3>
				<div id="alertContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common alert -->

<!-- common prompt -->
<div id="commonPrompt" class="modal modal-common">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<h3 id="promptTitle"></h3>
				<div id="promptContents"></div>
			</div>
			<div class="modal-footer">
				<button type="button" onclick="modalClose();" class="btn btn-cancel">취소</button>
				<button type="button" id="promptOk" class="btn btn-confirm">확인</button>
			</div>
		</div>
	</div>
</div>
<!-- //common prompt -->

<script>
$(document).ready(function(){
	$("#send").click(function(){
		modalOpenSlide('modalInfo');
	})
});
</script>

<!-- default script -->
<script src="../../js/jquery.placeholder.min.js"></script>
<script src="../../js/design.js" defer="defer"></script>
<script src="../../js/commonmsg.js"></script>
<script src="../../js/commonutil.js"></script>
</body>
</html>
