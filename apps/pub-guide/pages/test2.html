<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 폼 테스트 2 (Figma Mobile_Service) | 디자인 시스템</title>
  <!-- Figma Mobile_Service 40002139:1877 · 00-core: OS 상태바 미구현 · Contact 헤더~푸터 KR -->
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* test2: test.html 토큰·패턴 + 피그마 푸터 KR(00-core §7~8 · 10-a11y · 20-style · 30-design 토큰) */
    /* 폼 래퍼: 레이아웃은 자식 블록에 위임 */
    .test2-form {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
    }

    /* 본문으로 건너뛰기 (10-a11y) */
    .guide-skip {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .guide-skip:focus {
      position: fixed;
      top: var(--space-08);
      left: var(--space-08);
      z-index: 10000;
      width: auto;
      height: auto;
      margin: 0;
      padding: var(--space-08) var(--space-16);
      overflow: visible;
      clip-path: none;
      background: var(--color-background-01);
      color: var(--color-text-03);
      font-size: 14px;
      line-height: 1.6;
      text-decoration: underline;
      border-radius: var(--radius-08);
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    .test-mobile {
      /* Figma bg/1 — semantic background-02(#f6f6f9)와 구분(30-design-guide-color) */
      --test-agree-bg: #f5f5f7;

      width: 100%;
      max-width: 375px;
      margin: 0 auto;
      background: var(--color-background-01);
      border: 1px solid var(--color-line-03);
      border-radius: var(--radius-16);
      overflow: hidden;
    }

    .test-mobile__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      height: 56px;
      padding: 0 var(--space-16);
      border-bottom: 0.5px solid var(--color-line-03);
    }

    .test-mobile__header-spacer {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .test-mobile__title-wrap {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
    }

    .test-mobile__title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
    }

    .test-mobile__close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      margin: 0;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .test-mobile__close:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
      border-radius: var(--radius-08);
    }

    .test-mobile__body {
      padding: var(--space-24) var(--space-16) var(--space-24);
    }

    .test-heading {
      margin: 0 0 var(--space-40);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.03em;
      color: var(--color-text-03);
    }

    /* Textfield/Default label_area: Figma gap 8px · 20-style → margin */
    .test-field {
      display: flex;
      flex-direction: column;
    }

    .test-field .test-label {
      margin-bottom: var(--space-08);
    }

    /*
     * 피그마 y 기준: 제목 블록(1000)~내용(1098) 간 ≈22px · 내용 하단~동의(1312) 간 ≈22px
     * spacing 토큰 합: 16+4+2=22 (30-design Spacing 스케일 조합)
     */
    .test2-form > .test-field + .test-field,
    .test2-form > .test-field + .test2-agree-group {
      margin-top: calc(var(--space-16) + var(--space-04) + var(--space-02));
    }

    /* 신청 내용 → 제목: 피그마 간격 56px(40+16) — 반드시 일반 형제 규칙보다 구체적으로 둠 */
    .test2-form > .test-field--apply + .test-field {
      margin-top: calc(var(--space-40) + var(--space-16));
    }

    /* 상단 4필드 그룹: Figma column gap 20px */
    .test2-field-stack > .test-field + .test-field {
      margin-top: var(--space-20);
    }

    /* 4필드 블록 → 신청내용: Figma y간격 약 28px */
    .test2-form > .test2-field-stack + .test-field--apply {
      margin-top: calc(var(--space-24) + var(--space-04));
    }

    /* Body 2 / Medium 14 — Figma Textfield label (40002139:2330 등) */
    .test-label {
      margin: 0;
      display: block;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
    }

    .test-fieldset {
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .test-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--color-line-03);
      border-radius: var(--radius-12);
      padding: var(--space-08) var(--space-16);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      min-height: 48px;
      height: 48px;
      background: var(--color-background-01);
    }

    .test-input::placeholder,
    .test-textarea::placeholder {
      color: var(--color-text-06);
    }

    .test-input:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    .test-textarea-wrap {
      width: 100%;
      height: 160px;
      box-sizing: border-box;
      border: 1px solid var(--color-line-03);
      border-radius: var(--radius-12);
      background: var(--color-background-01);
      padding: var(--space-16) var(--space-16) var(--space-08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .test-textarea-wrap .test-count {
      margin-top: var(--space-04);
    }

    .test-textarea-wrap:focus-within {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    .test-textarea {
      width: 100%;
      min-height: 0;
      flex: 1 1 auto;
      border: 0;
      padding: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      resize: none;
      background: transparent;
    }

    .test-textarea:focus {
      outline: 0;
    }

    .test-count {
      align-self: flex-end;
      display: flex;
      align-items: baseline;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      white-space: nowrap;
    }

    .test-count__n,
    .test-count__m {
      color: var(--color-icon-05);
      letter-spacing: -0.02em;
    }

    .test-count__slash {
      color: var(--color-line-03);
      line-height: 1.5;
      letter-spacing: -0.04em;
    }

    .test-count > * + * {
      margin-left: var(--space-02);
    }

    .test-checks {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .test-fieldset .test-checks {
      margin-top: var(--space-12);
    }

    .test-checks li {
      margin: 0;
      padding: 0;
    }

    .test-checks .test-check {
      padding: 5px 0;
    }

    .test-checks li + li {
      margin-top: var(--space-08);
    }

    .test-check {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      cursor: pointer;
    }

    .test-check:has(input:disabled) {
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 시각 숨김 입력: 스크린 리더만 인식 (10-a11y) */
    .test-check input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .test-check__visual {
      position: relative;
      display: inline-block;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-right: var(--space-08);
    }

    .test-check--agree-icon .test-check__visual {
      margin-right: 0;
    }

    .test-check__visual .test-check__img--off,
    .test-check__visual .test-check__img--on {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .test-check__visual .test-check__img--off {
      display: block;
    }

    .test-check__visual .test-check__img--on {
      display: none;
    }

    .test-check input:checked + .test-check__visual .test-check__img--off {
      display: none;
    }

    .test-check input:checked + .test-check__visual .test-check__img--on {
      display: block;
    }

    .test-check:has(:focus-visible) .test-check__visual {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
      border-radius: 50%;
    }

    .test-check__text {
      margin: 0;
      white-space: nowrap;
    }

    /* 동의+안내: 상단 간격은 직전 .test-field + .test2-agree-group(22px)에만 둠 */
    .test2-agree-group {
      margin-top: 0;
    }

    .test2-agree-group .test-agree {
      margin-top: 0;
    }

    .test-agree {
      margin-top: 0;
    }

    .test-agree__box {
      box-sizing: border-box;
      min-height: 96px;
      padding: var(--space-20);
      border-radius: var(--radius-08);
      background: var(--test-agree-bg);
    }

    /* Figma checkbox/set: items-center · py 5 — 아이콘·제목 1행 */
    .test-agree__row {
      display: flex;
      align-items: center;
      padding: 5px 0;
    }

    .test-agree__row .test-check--agree-icon {
      flex-shrink: 0;
    }

    .test-agree__row .test-check--agree-icon .test-check__visual {
      margin-right: var(--space-08);
    }

    /* Body 1 Bold 14 — Figma (필수) 문구 */
    .test-agree__title {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
      cursor: pointer;
    }

    /* Figma Button/text left 52px = 패딩20 + 아이콘24 + gap8 → 제목 시작선 정렬 */
    .test-agree__more {
      display: block;
      margin: var(--space-04) 0 0 calc(var(--space-24) + var(--space-08));
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--color-text-05);
      background: transparent;
      color: var(--color-text-04);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      cursor: pointer;
      font-family: inherit;
    }

    .test-agree__more:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
      border-radius: var(--radius-04);
    }

    .test-mobile__close-icon {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .test-desc {
      margin: var(--space-12) 0 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-03);
    }

    /* 동의 박스 직후 안내: Figma agree 그룹 gap 12px · Text/main은 text-03에 근접 */
    .test2-agree-group .test-desc {
      margin-top: var(--space-12);
    }

    /* Figma 40002181:1954: agree 컬럼~primary gap 30px → 토큰 합 24+4+2 */
    .test-submit {
      margin-top: calc(var(--space-24) + var(--space-04) + var(--space-02));
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: var(--radius-12);
      background: var(--color-disabled);
      color: var(--color-text-01);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      cursor: not-allowed;
      font-family: inherit;
      padding: var(--space-12) var(--space-16);
    }

    .test-submit:focus-visible:not(:disabled) {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    /* [푸터] Figma Mobile-Footer-KR 40002140:2061 · 버튼~푸터 gap 50px */
    .test2-footer {
      box-sizing: border-box;
      min-height: 210px;
      margin-top: calc(var(--space-40) + var(--space-08) + var(--space-02));
      /* 상단 7px: 피그마 SNS 행 기준(토큰 8 미만) */
      padding: 7px var(--space-16) var(--space-24);
      border-top: 1px solid var(--color-line-03);
      background: var(--color-background-01);
    }

    /* SNS 행: 피그마 40002140:2065·2074·2077 — top 7 · 버튼 40×40 · 좌 16→62→108 = 간격 6px */
    .test2-footer__sns-row {
      display: flex;
      align-items: center;
    }

    .test2-footer__sns-row > .test2-footer__sns + .test2-footer__sns {
      margin-left: calc(var(--space-04) + var(--space-02));
    }

    /* 피그마 element/btn/sns 40×40 — foundation 아이콘 단독 터치 권장 48과 상이(시안 우선) */
    /* 데모: 이동 URL 없음 → 링크 대신 button (10-a11y: 빈 # 금지) */
    .test2-footer__sns {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--color-line-02);
      cursor: pointer;
      font-family: inherit;
    }

    .test2-footer__sns:focus-visible {
      outline: 2px solid var(--color-primary-01);
      outline-offset: 2px;
    }

    /* SNS 행 하단~구분선: 피그마 line top 55 · 버튼 top7+높이40=47 → 간격 8px */
    /* 푸터 좌우 패딩은 본문·SNS용 — 구분선만 피그마처럼 카드 전폭(40002140:2064 w 375) */
    .test2-footer__line {
      display: block;
      box-sizing: border-box;
      width: calc(100% + var(--space-16) * 2);
      max-width: none;
      height: 1px;
      margin: var(--space-08) calc(-1 * var(--space-16)) 0;
      border: 0;
      background: var(--color-line-03);
    }

    .test2-footer__addr {
      margin: var(--space-20) 0 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-04);
    }

    .test2-footer__copy {
      margin: var(--space-16) 0 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--color-text-05);
    }
  </style>
</head>
<body>
  <a class="guide-skip" href="#main">본문으로 건너뛰기</a>
  <header class="guide-header">
    <a href="../index.html" class="guide-back">← 디자인 시스템 가이드</a>
    <h1 class="page-title">문의 폼 테스트 2 (Figma Mobile_Service)</h1>
  </header>

  <main class="guide-main" id="main">
    <!-- [Mobile_Service 시안] -->
    <section class="test-mobile" aria-label="서비스 도입문의 시안">
      <!-- 00-core: OS 상태바는 웹 퍼블에 포함하지 않음 — 앱 헤더부터 -->
      <header class="test-mobile__header" id="app-header">
        <span class="test-mobile__header-spacer" aria-hidden="true"></span>
        <div class="test-mobile__title-wrap">
          <strong class="test-mobile__title">Contact us</strong>
        </div>
        <button type="button" class="test-mobile__close" aria-label="닫기">
          <img class="test-mobile__close-icon" src="../assets/icons/ico-close.svg" width="24" height="24" alt="" aria-hidden="true">
        </button>
      </header>

      <div class="test-mobile__body">
        <h2 class="test-heading">서비스 도입문의</h2>

        <!-- [문의 폼] 30-design-guide-textfield · 10-a11y 폼 시맨틱 -->
        <form id="t2-inquiry-form" class="test2-form" action="#" method="post" novalidate>
        <!-- [상단 4필드] Figma 40002139:2367 column gap 20 -->
        <div class="test2-field-stack">
          <div class="test-field">
            <label for="t2-company" class="test-label">회사명</label>
            <input id="t2-company" class="test-input" type="text" name="t2-company" autocomplete="organization" placeholder="회사명을 입력해 주세요.">
          </div>
          <div class="test-field">
            <label for="t2-phone" class="test-label">연락처</label>
            <input id="t2-phone" class="test-input" type="tel" name="t2-phone" autocomplete="tel" placeholder="연락처를 입력해 주세요">
          </div>
          <div class="test-field">
            <label for="t2-email" class="test-label">이메일</label>
            <input id="t2-email" class="test-input" type="email" name="t2-email" autocomplete="email" placeholder="이메일을 입력해 주세요">
          </div>
          <div class="test-field">
            <label for="t2-biz" class="test-label">사업자등록번호</label>
            <input id="t2-biz" class="test-input" type="text" name="t2-biz" inputmode="numeric" placeholder="사업자번호를 입력해 주세요">
          </div>
        </div>
        <!-- //상단 4필드 -->

        <div class="test-field test-field--apply">
          <fieldset class="test-fieldset" aria-labelledby="t2-apply-legend">
            <!-- 피그마 40002139:2389 문자는 사업자등록번호(위 필드와 중복) → 시맨틱·카피는 신청 내용 유지 -->
            <legend id="t2-apply-legend" class="test-label">신청 내용</legend>
            <ul class="test-checks">
              <li>
                <label class="test-check">
                  <input type="checkbox" name="t2-apply" value="card">
                  <span class="test-check__visual" aria-hidden="true">
                    <img class="test-check__img--off" src="../assets/icons/ico-check-circle-off.svg" width="24" height="24" alt="" aria-hidden="true">
                    <img class="test-check__img--on" src="../assets/icons/ico-check-circle-on.svg" width="24" height="24" alt="" aria-hidden="true">
                  </span>
                  <span class="test-check__text">신용카드</span>
                </label>
              </li>
              <li>
                <label class="test-check">
                  <input type="checkbox" name="t2-apply" value="vbank">
                  <span class="test-check__visual" aria-hidden="true">
                    <img class="test-check__img--off" src="../assets/icons/ico-check-circle-off.svg" width="24" height="24" alt="" aria-hidden="true">
                    <img class="test-check__img--on" src="../assets/icons/ico-check-circle-on.svg" width="24" height="24" alt="" aria-hidden="true">
                  </span>
                  <span class="test-check__text">가상계좌</span>
                </label>
              </li>
              <li>
                <label class="test-check">
                  <input type="checkbox" name="t2-apply" value="phone">
                  <span class="test-check__visual" aria-hidden="true">
                    <img class="test-check__img--off" src="../assets/icons/ico-check-circle-off.svg" width="24" height="24" alt="" aria-hidden="true">
                    <img class="test-check__img--on" src="../assets/icons/ico-check-circle-on.svg" width="24" height="24" alt="" aria-hidden="true">
                  </span>
                  <span class="test-check__text">휴대폰결제</span>
                </label>
              </li>
              <li>
                <label class="test-check">
                  <input type="checkbox" name="t2-apply" value="gift">
                  <span class="test-check__visual" aria-hidden="true">
                    <img class="test-check__img--off" src="../assets/icons/ico-check-circle-off.svg" width="24" height="24" alt="" aria-hidden="true">
                    <img class="test-check__img--on" src="../assets/icons/ico-check-circle-on.svg" width="24" height="24" alt="" aria-hidden="true">
                  </span>
                  <span class="test-check__text">모바일상품권</span>
                </label>
              </li>
              <li>
                <label class="test-check">
                  <input type="checkbox" name="t2-apply" value="account">
                  <span class="test-check__visual" aria-hidden="true">
