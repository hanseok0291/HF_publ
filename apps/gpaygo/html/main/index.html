<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그린원 판매소 메인</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/main/main.css">
</head>
<body>
  <div class="main-page">
    <!-- 모바일 GNB -->
    <header class="main-gnb">
      <div class="main-gnb-logo">
        <img src="../../images/logo.svg" alt="그린원 로고" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="main-gnb-logo-placeholder">GREEN ONE</div>
      </div>
      <button class="main-gnb-notify" type="button" aria-label="알림함">
        <span class="main-gnb-notify-icon" aria-hidden="true"></span>
      </button>
    </header>

    <!-- PC GNB -->
    <header class="gnb-desktop">
      <div class="gnb-desktop-container">
        <div class="gnb-desktop-left">
          <div class="gnb-desktop-logo">
            <img src="../../images/logo-white.svg" alt="그린원 로고" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="gnb-desktop-logo-placeholder">GREEN ONE</div>
          </div>
          <span class="gnb-desktop-shop-badge">판매소명 노출</span>
        </div>
        <div class="gnb-desktop-right">
          <div class="gnb-desktop-user">
            <span class="gnb-desktop-user-name">김헥토님</span>
            <span class="gnb-desktop-divider" aria-hidden="true"></span>
            <button class="gnb-desktop-logout" type="button">로그아웃</button>
          </div>
        </div>
      </div>
    </header>

    <div class="main-layout">
      <!-- PC 사이드바 -->
      <aside class="main-sidebar" aria-label="주요 메뉴">
        <div class="main-sidebar-section">
          <button class="main-sidebar-dropdown" type="button" aria-expanded="true">
            <span class="main-sidebar-icon" aria-hidden="true"></span>
            <span class="main-sidebar-text">폐기물 스티커 구매 관리</span>
            <span class="main-sidebar-chevron" aria-hidden="true"></span>
          </button>
          <nav class="main-sidebar-menu" role="menu">
            <a href="../purchase/sticker/index.html" role="menuitem">스티커 구매 신청</a>
            <a href="#" role="menuitem">스티커 구매 내역</a>
            <a href="#" role="menuitem">스티커 권종 등록</a>
          </nav>
        </div>
        <div class="main-sidebar-section">
          <button class="main-sidebar-dropdown" type="button" aria-expanded="false">
            <span class="main-sidebar-icon" aria-hidden="true"></span>
            <span class="main-sidebar-text">종량제 봉투 구매 관리</span>
            <span class="main-sidebar-chevron" aria-hidden="true"></span>
          </button>
        </div>
        <div class="main-sidebar-section">
          <button class="main-sidebar-dropdown" type="button" aria-expanded="false">
            <span class="main-sidebar-icon" aria-hidden="true"></span>
            <span class="main-sidebar-text">직원 관리</span>
            <span class="main-sidebar-chevron" aria-hidden="true"></span>
          </button>
        </div>
        <div class="main-sidebar-footer">
          <img src="../../images/logo.svg" alt="그린원 로고" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="main-sidebar-logo-placeholder">GREEN ONE</div>
        </div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <div class="main-panel">
        <main class="main-body">
          <!-- 사용자 이름 -->
          <h1 class="main-user-name">김헥토님</h1>

          <!-- 빠른 작업 카드들 -->
          <section class="main-quick">
            <div class="main-quick-row">
              <a href="../purchase/sticker/index.html" class="main-quick-card">
                <div class="main-quick-icon" aria-hidden="true"></div>
                <span class="main-quick-text">스티커 구매 신청</span>
              </a>
              <a href="#" class="main-quick-card">
                <div class="main-quick-icon" aria-hidden="true"></div>
                <span class="main-quick-text">스티커 구매 내역</span>
              </a>
            </div>
            <div class="main-quick-row">
              <a href="#" class="main-quick-card">
                <div class="main-quick-icon" aria-hidden="true"></div>
                <span class="main-quick-text">봉투 구매 신청</span>
              </a>
              <a href="#" class="main-quick-card">
                <div class="main-quick-icon" aria-hidden="true"></div>
                <span class="main-quick-text">봉투 구매 내역</span>
              </a>
            </div>
            <a href="#" class="main-quick-card main-quick-card-full">
              <span class="main-quick-text">공지사항</span>
            </a>
          </section>

          <!-- 로그아웃 -->
          <button class="main-logout" type="button">로그아웃</button>
        </main>
      </div>

      <!-- PC 비주얼 영역 -->
      <div class="main-visual" aria-hidden="true">
        <div class="main-visual-graphic">
          <img src="../../images/logo-white.svg" alt="" class="main-visual-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="main-visual-placeholder">GREEN ONE</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
