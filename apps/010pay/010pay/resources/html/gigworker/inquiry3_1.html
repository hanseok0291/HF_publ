<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>예상 종합 소득세 간편 계산</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="stylesheet" href="../../css/jquery-ui.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/gigworker.css" />

    <!--[if lt IE 9]>
      <script type="text/javascript" src="../../js/html5shiv.js"></script>
      <script type="text/javascript" src="../../js/respond.min.js"></script>
    <![endif]-->
    <script src="../../js/jquery-1.8.3.min.js"></script>
    <script src="../../js/jquery.placeholder.min.js"></script>
    <script src="../../js/owl.carousel.min.js"></script>
    <script src="../../js/design.js"></script>
  </head>

  <!-- 230310 검토 -->
  <body>
    <!-- wrap -->
    <div id="wrap" class="gigworker infoEnter">
      <!-- header -->
      <div id="header">
        <div class="container">
          <button type="button" id="btnBack" class="btn-back"><i class="icon-angle-left">뒤로가기</i></button>
          <!-- <button type="button" id="closeWindow" class="btn-close"><i class="icon-times">닫기</i></button> -->
        </div>
      </div>
      <!-- //header -->

      <!-- content -->
      <div id="content">
        <div class="container pdLR22 pdB100">
          <div class="titleWrap">
            <h3 class="mainTitle normal">
              <b>간편인증</b> <br>
              요청 알림을 보냈어요.
            </h3>
          </div>

          <div class="verificationTimer kakao">
            <p>
              카카오톡 앱에서 인증 후, <br>
              아래의 [인증 완료]를 눌러주세요.
            </p>

            <button class="timeWrap">
              <span class="warning">인증 재요청</span>
            </button>
          </div>
          
          <div class="botBtnWrap">
            <button type="button" class="bot-btn">인증 완료</button>
          </div>
        </div>
        </div>
      <!-- //content -->
    </div>
    <!-- //wrap -->

    <div id="commonAlert" class="modal" style="display: none;">
      <div class="modal-dialog" style="margin-top: -95px;">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">인증이 완료되지 않았습니다. <br>카카오톡 앱에서 인증 후에 다시 눌러주세요.</p>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="modalClose();" class="btn btn-confirm">확인</button>
          </div>
        </div>
      </div>
    </div>

    <div id="commonAlert" class="modal" style="display: block;">
      <div class="modal-dialog" style="margin-top: -95px;">
        <div class="modal-content">
          <div class="modal-body">
            <h3 id="alertTitle"></h3>
            <p id="alertContents">
              인증 요청 시간이 만료되었습니다. <br>
              재인증을 요청해주세요.
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="modalClose();" class="btn btn-confirm">재인증 요청하기</button>
          </div>
        </div>
      </div>
    </div>


    <script>

    </script>
  </body>
</html>
