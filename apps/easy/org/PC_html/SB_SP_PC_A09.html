<!-- loading -->
<div class="ly_pop ly_loading" style="display: none;">
	<div class="bg"><!-- shadow --></div>
	<div id="ly_loading" class="cont">
		<div class="ele">
			<div class="circle_motion"><div class="span"></div></div>
			<img src="../img/loading.gif" alt="로딩중" class="img_loading">
		</div>
	</div>
</div>
<script>

	$(document).ajaxStart(function(){
		openLoading();
	});
	
	$(document).ajaxComplete(function(){
		closeLoading();
	});

	function openLoading(){
		$('html').css('overflow-y','');
		var ver = 0; // Browser Version
		if(navigator.appName.charAt(0) == "M"){
			ver = getInternetVersion("MSIE");		
			if (ver < "10"){ // ie10 이하
				$('.ly_loading').addClass('ie9_after');
			}
		}
		layer_open('ly_loading');
	}

	function closeLoading(){
		$('html').css('overflow-y','scroll');
		layer_close();
	}
</script>
