<!DOCTYPE html>
<html lang="ko">

<head>
  <title>RROUND</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no, address=no, email=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <link rel="stylesheet" href="../../css/common_renewal.css" />
  <link rel="stylesheet" href="../../css/mass/aiEditor.css" />
  <script src="../../js/jquery.3.4.1.min.js"></script>
  <script src="../../js/jquery-ui.js"></script>
  <script src="../../js/design_renewal.js" defer="defer"></script>
</head>

<body>
  <!-- wrap -->
  <div id="wrap">
    <!-- header -->
    <div id="header">
      <div class="container">
        <div class="header-box">
          <button type="button" class="btn-back js-change-btn left-0">
            <i class="icon-back"></i>
          </button>
          <h2 class="page-title">Ai 에디터 추천</h2>
        </div>
      </div>
    </div>
    <!-- //header -->

    <!-- content -->
    <div id="content">
      <!-- container -->
      <div class="container ai-editor-container">
        <ul class="category-list">
          <li class="active">
            전체
          </li>
          <li>
            생활밀착
          </li>
          <li>
            목돈지출
          </li>
          <li>
            여행
          </li>
          <li>
            이달의 특집
          </li>
          <li>
            이달의 특집
          </li>
        </ul>
        <div class="tab-list">
          <button type="button">
            전체
          </button>
          <button type="button">
            가전
          </button>
          <button type="button">
            여행
          </button>
          <button type="button">
            자동차
          </button>
        </div>
        <div class="ai-editor-list-wrap">
          <div class="empty-list alert">
            <p class="empty-text">진행 중인 이벤트가 없어요</p>
          </div>
        </div>
      </div>
      <!-- //container -->
    </div>
    <!-- //content -->
  </div>
  <!-- //wrap -->
</body>
<script>
  $(function () {
    // 1. category-list: 클릭한 item만 active, 나머지 active 제거
    $('.category-list li').on('click', function () {
      $(this).addClass('active').siblings().removeClass('active');
    });

    // 2. tab-list: 클릭 시 토글, 중복 선택 가능
    $('.tab-list button').on('click', function () {
      $(this).toggleClass('active');
    });
  });
</script>

</html>
